name = "atlas-ai-proxy"
main = "atlas-ai-proxy-worker.js"
compatibility_date = "2024-01-01"

[ai]
binding = "AI"

[[r2_buckets]]
binding = "PDF_BUCKET"
bucket_name = "atlas-pdfs"

[[d1_databases]]
binding = "MULBOI_DB"
database_name = "atlas-mulboi-mcqs"
database_id = "699518e6-288c-4887-a763-84d941afe83e"

[[durable_objects.bindings]]
name = "SESSION_HUB"
class_name = "SessionHub"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["SessionHub"]

[vars]
D1_API_KEY = "mb_d1_9f2a7c6e1b4d8305"
VAPID_PUBLIC_KEY = "BFL06Cf7jFt5fQNITBDHxr88SIMgus-wtrmabfxZ95QgNlPbmkDH5CV7S5CgzgR99G3NqXFncBN8WpRaXmaOzkE"
VAPID_SUBJECT = "mailto:admin@atlasprep.app"

# Secrets (GEMINI_API_KEY, OPENROUTER_API_KEY, GROQ_API_KEY, CEREBRAS_API_KEY)
# are NOT set here — they stay in the Cloudflare dashboard as encrypted secrets
# and persist across deploys automatically. Do not add them as plain vars here.
# trigger: 2026-07-21 redeploy after CF token rotation

[triggers]
crons = ["* * * * *"]

