<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP · AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== FLUTTER-STYLE DESIGN SYSTEM ===== */
        :root {
            --ai-primary: #6C63FF;
            --ai-primary-light: rgba(108,99,255,0.12);
            --ai-secondary: #00D4AA;
            --ai-bg: #0F0F1A;
            --ai-surface: #16162A;
            --ai-card: #1E1E35;
            --ai-card2: #252540;
            --ai-border: rgba(108,99,255,0.18);
            --ai-text: #E8E8F5;
            --ai-text2: #9898BB;
            --ai-text3: #5A5A7A;
            --ai-user-bubble: linear-gradient(135deg, #6C63FF 0%, #5548CC 100%);
            --ai-bot-bubble: #1E1E38;
            --ai-success: #00D4AA;
            --ai-error: #FF5B7A;
            --ai-warn: #FFB347;
            --ai-glow: rgba(108,99,255,0.25);
            --ai-radius: 18px;
            --ai-radius-sm: 12px;
            --ai-radius-xs: 8px;
            --shadow-float: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
        }

        body.light-mode {
            --ai-bg: #F0F0FF;
            --ai-surface: #F8F8FF;
            --ai-card: #FFFFFF;
            --ai-card2: #F0F0FA;
            --ai-border: rgba(108,99,255,0.2);
            --ai-text: #1A1A35;
            --ai-text2: #5A5A8A;
            --ai-text3: #9898BB;
            --ai-bot-bubble: #EEEEFF;
            --ai-glow: rgba(108,99,255,0.15);
        }

        * { box-sizing: border-box; }

        /* ===== MAIN LAYOUT ===== */
        .ai-page {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px - 60px - 20px);
        }

        /* ===== HEADER CARD — Flutter AppBar Style ===== */
        .ai-appbar {
            background: linear-gradient(135deg, var(--ai-surface) 0%, var(--ai-card) 100%);
            border: 1.5px solid var(--ai-border);
            border-radius: var(--ai-radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-float), 0 0 24px var(--ai-glow);
            position: relative;
            overflow: hidden;
        }
        .ai-appbar::before {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 100px; height: 100px;
            background: radial-gradient(circle, var(--ai-primary) 0%, transparent 70%);
            opacity: 0.12;
        }
        .ai-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ai-primary), var(--ai-secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 4px 16px var(--ai-glow);
            animation: avatarPulse 3s ease-in-out infinite;
        }
        @keyframes avatarPulse {
            0%,100% { box-shadow: 0 4px 16px var(--ai-glow); }
            50% { box-shadow: 0 4px 28px rgba(108,99,255,0.5); }
        }
        .ai-appbar-info { flex: 1; }
        .ai-title { font-size: 16px; font-weight: 800; color: var(--ai-text); letter-spacing: 0.5px; }
        .ai-subtitle { font-size: 10px; color: var(--ai-text2); margin-top: 1px; }
        .ai-status-pill {
            display: flex; align-items: center; gap: 5px;
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--ai-success);
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--ai-success);
            animation: statusBlink 2s infinite;
        }
        @keyframes statusBlink {
            0%,100% { opacity: 1; } 50% { opacity: 0.3; }
        }
        .status-dot.busy { background: var(--ai-warn); animation: none; opacity: 1; }

        /* ===== SUGGESTED QUESTIONS ===== */
        .suggest-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
            margin-bottom: 4px;
        }
        .suggest-bar::-webkit-scrollbar { display: none; }
        .suggest-chip {
            flex-shrink: 0;
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 11px;
            color: var(--ai-text2);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        .suggest-chip:hover {
            background: var(--ai-primary-light);
            border-color: var(--ai-primary);
            color: var(--ai-text);
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            background: var(--ai-surface);
            border-radius: var(--ai-radius);
            padding: 14px;
            border: 1px solid var(--ai-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--ai-border); border-radius: 4px; }

        /* ===== EMPTY STATE ===== */
        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 180px;
            gap: 10px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .empty-icon { font-size: 48px; animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .empty-title { font-size: 15px; font-weight: 700; color: var(--ai-text); }
        .empty-sub { font-size: 11px; color: var(--ai-text2); line-height: 1.6; }

        /* ===== MESSAGES — Flutter Bubble Style ===== */
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            animation: msgSlide 0.25s ease-out;
        }
        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-wrapper.user { align-items: flex-end; }
        .msg-wrapper.ai { align-items: flex-start; }

        .msg-label {
            font-size: 9px;
            color: var(--ai-text3);
            margin-bottom: 3px;
            padding: 0 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .msg-row { display: flex; gap: 8px; align-items: flex-end; }
        .msg-wrapper.user .msg-row { flex-direction: row-reverse; }

        .msg-avatar-sm {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .msg-avatar-sm.ai-av { background: linear-gradient(135deg, var(--ai-primary), var(--ai-secondary)); }
        .msg-avatar-sm.user-av { background: rgba(108,99,255,0.25); }

        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.65;
            word-break: break-word;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .msg-wrapper.user .msg-bubble {
            background: var(--ai-user-bubble);
            color: #fff;
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 4px 16px rgba(108,99,255,0.3);
        }
        .msg-wrapper.ai .msg-bubble {
            background: var(--ai-bot-bubble);
            color: var(--ai-text);
            border-radius: 18px 18px 18px 4px;
            border-left: 3px solid var(--ai-primary);
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .msg-bubble.has-image { padding: 8px; }
        .msg-bubble img {
            max-width: 200px;
            border-radius: 12px;
            display: block;
            margin-bottom: 6px;
        }
        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            padding: 0 4px;
        }
        .msg-time { font-size: 9px; color: var(--ai-text3); }
        .copy-btn {
            background: none; border: none;
            color: var(--ai-text3);
            cursor: pointer;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: var(--ai-primary-light); color: var(--ai-primary); }

        /* ===== MCQ ANSWER STYLING ===== */
        .mcq-correct {
            display: inline-block;
            background: rgba(0,212,170,0.15);
            color: var(--ai-success);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0,212,170,0.3);
        }
        .mcq-wrong {
            color: var(--ai-error);
            opacity: 0.85;
        }

        /* ===== TYPING ANIMATION ===== */
        .typing-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .typing-bubble {
            background: var(--ai-bot-bubble);
            border: 1px solid var(--ai-border);
            border-radius: 18px 18px 18px 4px;
            padding: 12px 16px;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .typing-bubble span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--ai-primary);
            animation: typingBounce 1.3s ease-in-out infinite;
        }
        .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
        .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes typingBounce {
            0%,60%,100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        /* ===== INPUT AREA — Flutter TextField Style ===== */
        .input-panel {
            margin-top: 8px;
            background: var(--ai-surface);
            border: 1.5px solid var(--ai-border);
            border-radius: 20px;
            padding: 8px 10px 8px 14px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            box-shadow: var(--shadow-float);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-panel:focus-within {
            border-color: var(--ai-primary);
            box-shadow: 0 0 0 3px var(--ai-glow), var(--shadow-float);
        }
        .input-actions-left {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--ai-card2);
            color: var(--ai-text2);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--ai-primary-light); color: var(--ai-primary); }

        #chatInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--ai-text);
            font-size: 13px;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
            resize: none;
            min-height: 34px;
            max-height: 100px;
            padding: 6px 0;
            line-height: 1.5;
        }
        #chatInput::placeholder { color: var(--ai-text3); }

        .send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--ai-primary), #5548CC);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(108,99,255,0.4);
        }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(108,99,255,0.55); }
        .send-btn:disabled { opacity: 0.45; transform: none; cursor: not-allowed; }

        /* ===== CLEAR BUTTON ===== */
        .chat-tools {
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }
        .clear-btn {
            background: transparent;
            border: 1px solid var(--ai-border);
            color: var(--ai-text3);
            border-radius: 20px;
            padding: 5px 16px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        .clear-btn:hover { border-color: var(--ai-error); color: var(--ai-error); }

        /* ===== IMAGE PREVIEW BEFORE SEND ===== */
        .img-preview-bar {
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .img-preview-bar.show { display: flex; }
        .img-preview-bar img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .img-preview-info { flex: 1; }
        .img-preview-name { font-size: 11px; color: var(--ai-text); font-weight: 600; }
        .img-preview-size { font-size: 9px; color: var(--ai-text3); }
        .img-remove-btn { background: none; border: none; color: var(--ai-error); cursor: pointer; font-size: 18px; }

        /* ===== FILE PREVIEW ===== */
        .file-preview-bar {
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .file-preview-bar.show { display: flex; }
        .file-icon { font-size: 28px; }
        .file-preview-info { flex: 1; }
        .file-preview-name { font-size: 11px; color: var(--ai-text); font-weight: 600; }
        .file-preview-type { font-size: 9px; color: var(--ai-text3); }
        .file-remove-btn { background: none; border: none; color: var(--ai-error); cursor: pointer; font-size: 18px; }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ERROR POPUP ===== */
        .error-popup-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .error-popup {
            background: var(--ai-card);
            border: 1px solid var(--ai-border);
            border-radius: var(--ai-radius);
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }
        .error-popup-icon { font-size: 40px; margin-bottom: 10px; }
        .error-popup-title { font-size: 16px; font-weight: 800; color: var(--ai-text); margin-bottom: 8px; }
        .error-popup-message { font-size: 13px; color: var(--ai-text2); margin-bottom: 14px; }
        .error-popup-details { font-size: 10px; color: var(--ai-text3); margin-bottom: 14px; background: var(--ai-surface); padding: 8px; border-radius: 8px; }
        .error-popup-btn { background: var(--ai-primary); color: #fff; border: none; border-radius: 12px; padding: 10px 20px; cursor: pointer; font-weight: 700; font-size: 13px; }
        .error-popup-retry { background: var(--ai-card2); color: var(--ai-text); border: 1px solid var(--ai-border); border-radius: 12px; padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 13px; margin-right: 8px; }
    /* Global back button — always navigates exactly one step back in real browser history */
        .global-back-btn {
            background: none; border: none; color: var(--text);
            font-size: 20px; cursor: pointer; padding: 6px 4px 6px 2px; line-height:1;
        }
        .global-back-btn:active { opacity:0.6; }
    
        /* ── Icon tiles (shared with home page) ── */
        .si-tile{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.25)}
        .si-tile svg{width:16px;height:16px}
        .tile-indigo{background:linear-gradient(150deg,#7B7FFF 0%,#5A5FE0 45%,#322B96 100%)}
        .tile-amber{background:linear-gradient(150deg,#FFD166 0%,#F5A524 45%,#A8650A 100%)}
        .tile-violet{background:linear-gradient(150deg,#A78BFA 0%,#8B5CF6 45%,#4C1D95 100%)}
        .tile-rose{background:linear-gradient(150deg,#FB7AAE 0%,#F43F8E 45%,#9D174D 100%)}
        .tile-emerald{background:linear-gradient(150deg,#34D9A0 0%,#10B981 45%,#065F46 100%)}
        .tile-sky{background:linear-gradient(150deg,#7DD3FC 0%,#38BDF8 45%,#075985 100%)}
        .tile-orange{background:linear-gradient(150deg,#FDBA74 0%,#FB923C 45%,#9A3412 100%)}
        .tile-teal{background:linear-gradient(150deg,#5EEAD4 0%,#14B8A6 45%,#115E59 100%)}
        .tile-red{background:linear-gradient(150deg,#FCA5A5 0%,#F87171 45%,#991B1B 100%)}
        .tile-gold{background:linear-gradient(150deg,#FDE68A 0%,#FBBF24 45%,#92400E 100%)}
        .tile-plum{background:linear-gradient(150deg,#D8B4FE 0%,#A855F7 45%,#581C87 100%)}
        /* nav icon tile */
        .ni-tile{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 5px rgba(0,0,0,.2)}
        .ni-tile svg{width:14px;height:14px}

        </style>
</head>

<script>
// ===== AI PROXY CONFIG =====
// All API keys (Gemini, OpenRouter, Groq, Cerebras, Cloudflare AI) live ONLY as
// secrets inside this Worker — never in client-side code. The worker tries each
// provider in order and returns the first usable answer.
const AI_PROXY_URL = 'https://atlas-ai-proxy.YOUR_SUBDOMAIN.workers.dev/';

let isDarkMode = true;
let isSidebarOpen = false;
let chatHistory = [];
let currentImage = null;   // { base64, mimeType, name, size }
let currentFile = null;    // { text, name, type }
let isAIBusy = false;

// ===== SUBJECT DETECTION =====
function detectSubject(q) {
    q = q.toLowerCase();
    const rules = [
        { s: 'biology',   kw: ['dna','rna','কোষ','প্রাণী','উদ্ভিদ','সালোকসংশ্লেষণ','জীবাণু','হরমোন','এনজাইম','রক্ত','হৃদযন্ত্র','মস্তিষ্ক','প্রোটিন','জিন','ক্রোমোজোম','মাইটোসিস','মিয়োসিস','ফটোসিন্থেসিস','ডিএনএ'] },
        { s: 'chemistry', kw: ['রাসায়নিক','বন্ধন','মৌল','যৌগ','পর্যায়','অ্যাসিড','ক্ষার','লবণ','h₂o','co₂','nacl','ph','বিক্রিয়া','অক্সিজেন','হাইড্রোজেন','ইলেকট্রন','আয়ন','পারমাণবিক','অণু'] },
        { s: 'physics',   kw: ['বল','ভর','বেগ','ত্বরণ','তরঙ্গ','তাপ','আলো','শব্দ','চৌম্বক','বিদ্যুৎ','নিউটন','ওহম','ভোল্ট','শক্তি','কাজ','গতি','অভিকর্ষ','তড়িৎ'] },
        { s: 'math',      kw: ['ম্যাট্রিক্স','ভেক্টর','ক্যালকুলাস','যোগফল','গুণফল','সমীকরণ','sin','cos','tan','log','যোগ','গুণ','ভাগ','বিয়োগ','লগ','ত্রিকোণমিতি','সীমা'] },
        { s: 'bangla',    kw: ['বাংলা','ব্যাকরণ','রচনা','কবি','সাহিত্য','সমাস','সন্ধি','কারক','বিভক্তি','উপন্যাস','কবিতা','ছন্দ','অলংকার'] },
        { s: 'english',   kw: ['tense','preposition','verb','noun','grammar','voice','narration','paragraph','article','sentence','adjective','adverb'] }
    ];
    for (const r of rules) {
        if (r.kw.some(k => q.includes(k))) return r.s;
    }
    return 'general';
}

// ===== SYSTEM PROMPT =====
function getSystemPrompt(question) {
    const subj = detectSubject(question);
    const isMCQ = /\(ক\)|\(খ\)|\(গ\)|\(ঘ\)|ক\)|খ\)|গ\)|ঘ\)|A\)|B\)|C\)|D\)|[Aa][\.\)]|[Bb][\.\)]|[Cc][\.\)]|[Dd][\.\)]/.test(question);

    let prompt = `তুমি ATLAS AI — বাংলাদেশের সেরা HSC শিক্ষার্থীদের AI বন্ধু। নিচের নিয়ম কঠোরভাবে মানবে:

১। সব উত্তর সুন্দর বাংলায় দিবে। English technical word-এর পাশে বাংলা অর্থ দিবে।
২। গাণিতিক সূত্র সবসময় Unicode-এ লিখবে — LaTeX কখনো নয়।
   উদাহরণ: sin²θ + cos²θ = 1, x² + y² = r², H₂O, CO₂, NH₄⁺, SO₄²⁻
৩। রাসায়নিক সমীকরণ Unicode-এ: 2H₂ + O₂ → 2H₂O
৪। সহজ, বন্ধুত্বপূর্ণ ভাষায় কথা বলবে। কঠিন ভাষা পরিহার করবে।
৫। উত্তর সংক্ষিপ্ত কিন্তু সম্পূর্ণ রাখবে (২-৫ প্যারাগ্রাফ)।
৬। প্রয়োজনে সুন্দর উদাহরণ দিবে।
৭। শেষে একটি উৎসাহমূলক লাইন দিবে যদি প্রাসঙ্গিক হয়।`;

    if (isMCQ) {
        prompt += `

এটি একটি MCQ প্রশ্ন। এভাবে উত্তর দিবে:

✅ সঠিক উত্তর: [অপশন] — [সম্পূর্ণ উত্তর]

[সংক্ষিপ্ত ব্যাখ্যা — ২-৩ বাক্য]

ভুল অপশনগুলো:
❌ [অপশন] — [কেন ভুল]
❌ [অপশন] — [কেন ভুল]

💡 মনে রাখার টিপস: [যদি থাকে]`;
    }

    const subjectMap = {
        biology:   'তুমি বাংলাদেশ HSC জীববিজ্ঞান (Biology) বিশেষজ্ঞ। অধ্যাপক আবুল হাসানের বই অনুসরণ করবে।',
        chemistry: 'তুমি বাংলাদেশ HSC রসায়ন (Chemistry) বিশেষজ্ঞ। HSC রসায়ন বই অনুসরণ করবে।',
        physics:   'তুমি বাংলাদেশ HSC পদার্থবিজ্ঞান (Physics) বিশেষজ্ঞ। ড. শাহজাহান তপনের বই অনুসরণ করবে।',
        math:      'তুমি বাংলাদেশ HSC উচ্চতর গণিত (Higher Math) বিশেষজ্ঞ।',
        bangla:    'তুমি বাংলা ব্যাকরণ ও সাহিত্য বিশেষজ্ঞ। NCTB বাংলা বই অনুসরণ করবে।',
        english:   'তুমি English Grammar বিশেষজ্ঞ। NCTB English for Today অনুসরণ করবে।',
        general:   'তুমি সব বিষয়ে সাহায্য করতে পারো।'
    };
    prompt += '\n\n' + (subjectMap[subj] || subjectMap.general);

    return prompt;
}

// ===== MAIN AI FUNCTION — calls the proxy worker, no keys/models exposed client-side =====
async function askAI(question, imageData) {
    const systemPrompt = getSystemPrompt(question || 'ছবি বিশ্লেষণ করো');
    try {
        const res = await fetch(AI_PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                question: question || '',
                image: imageData ? { base64: imageData.base64, mimeType: imageData.mimeType } : null,
                systemPrompt
            })
        });
        const data = await res.json();
        if (data.success && data.answer && data.answer.trim().length > 5) {
            return { answer: data.answer.trim() };
        }
    } catch (e) {
        console.error('ATLAS AI proxy error:', e);
    }
    return { answer: '❌ দুঃখিত! ATLAS AI এখন একটু busy আছে। কিছুক্ষণ পর আবার চেষ্টা করো। 🙏' };
}


// ===== IMAGE HANDLING =====
function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('⚠️ ছবি ৫MB-এর কম হতে হবে'); return; }

    const reader = new FileReader();
    reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        currentImage = { base64, mimeType: file.type, name: file.name, size: file.size };
        currentFile = null;
        document.getElementById('filePreviewBar').classList.remove('show');

        document.getElementById('imgPreviewThumb').src = e.target.result;
        document.getElementById('imgPreviewName').textContent = file.name;
        document.getElementById('imgPreviewSize').textContent = (file.size / 1024).toFixed(0) + ' KB';
        document.getElementById('imgPreviewBar').classList.add('show');
        showToast('📸 ছবি যোগ হয়েছে!');
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function removeImage() {
    currentImage = null;
    document.getElementById('imgPreviewBar').classList.remove('show');
    document.getElementById('imgPreviewThumb').src = '';
}

// ===== FILE HANDLING =====
async function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('⚠️ ফাইল ৫MB-এর কম হতে হবে'); return; }

    const ext = file.name.split('.').pop().toLowerCase();
    const icons = { pdf: '📕', doc: '📘', docx: '📘', txt: '📄' };

    if (ext === 'txt') {
        const reader = new FileReader();
        reader.onload = (e) => {
            currentFile = { text: e.target.result.slice(0, 4000), name: file.name, type: 'TXT' };
            currentImage = null;
            showFilePreview(file.name, icons[ext] || '📄', 'Text ফাইল');
        };
        reader.readAsText(file);
    } else if (ext === 'pdf') {
        currentFile = { text: '[PDF ফাইল আপলোড করা হয়েছে — টেক্সট extraction সীমিত। সরাসরি প্রশ্ন করো।]', name: file.name, type: 'PDF' };
        currentImage = null;
        showFilePreview(file.name, '📕', 'PDF Document');
        showToast('📕 PDF যোগ হয়েছে! প্রশ্ন লিখে পাঠাও।');
    } else {
        currentFile = { text: `[${ext.toUpperCase()} ফাইল: ${file.name}]`, name: file.name, type: ext.toUpperCase() };
        currentImage = null;
        showFilePreview(file.name, icons[ext] || '📄', ext.toUpperCase() + ' ফাইল');
    }
    event.target.value = '';
}

function showFilePreview(name, icon, type) {
    document.getElementById('imgPreviewBar').classList.remove('show');
    document.getElementById('fileIcon').textContent = icon;
    document.getElementById('filePreviewName').textContent = name;
    document.getElementById('filePreviewType').textContent = type;
    document.getElementById('filePreviewBar').classList.add('show');
}

function removeFile() {
    currentFile = null;
    document.getElementById('filePreviewBar').classList.remove('show');
}

// ===== CHAT UI =====
function getTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function hideEmpty() {
    const el = document.getElementById('chatEmpty');
    if (el) el.style.display = 'none';
    document.getElementById('suggestBar').style.display = 'none';
}

function addUserMessage(text, imageObj) {
    hideEmpty();
    const area = document.getElementById('chatArea');
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper user';

    let bubbleContent = '';
    if (imageObj) {
        bubbleContent += `<img src="data:${imageObj.mimeType};base64,${imageObj.base64}" alt="ছবি">`;
    }
    if (text) bubbleContent += text.replace(/\n/g, '<br>');

    wrapper.innerHTML = `
        <div class="msg-label">তুমি</div>
        <div class="msg-row">
            <div class="msg-bubble${imageObj ? ' has-image' : ''}">${bubbleContent}</div>
            <div class="msg-avatar-sm user-av">👤</div>
        </div>
        <div class="msg-meta"><span class="msg-time">${getTime()}</span></div>
    `;
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;

    chatHistory.push({ type: 'user', text, image: imageObj ? `[ছবি: ${imageObj.name}]` : null, time: getTime() });
    saveChat();
}

function addAIMessage(text) {
    hideEmpty();
    const area = document.getElementById('chatArea');
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper ai';

    const formattedText = formatAIText(text);

    wrapper.innerHTML = `
        <div class="msg-label">ATLAS AI</div>
        <div class="msg-row">
            <div class="msg-avatar-sm ai-av">🤖</div>
            <div class="msg-bubble">
                <div class="ai-answer">${formattedText}</div>
                <div class="msg-meta">
                    <span class="msg-time">${getTime()}</span>
                    <button class="copy-btn" onclick="copyAnswer(this)">📋 কপি</button>
                </div>
            </div>
        </div>
    `;
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;

    chatHistory.push({ type: 'ai', text, time: getTime() });
    saveChat();
}

function formatAIText(text) {
    return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/✅([^\n]*)/g, '<span class="mcq-correct">✅$1</span>')
        .replace(/❌([^\n]*)/g, '<span class="mcq-wrong">❌$1</span>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code style="background:rgba(108,99,255,0.15);padding:1px 5px;border-radius:4px;font-family:monospace">$1</code>')
        .replace(/\n/g, '<br>');
}

function copyAnswer(btn) {
    const msgBubble = btn.closest('.msg-bubble');
    const text = msgBubble.querySelector('.ai-answer').innerText;
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ কপিড!';
        setTimeout(() => btn.textContent = '📋 কপি', 2000);
    });
}

function showTyping() {
    hideEmpty();
    const area = document.getElementById('chatArea');
    const div = document.createElement('div');
    div.id = 'typingIndicator';
    div.className = 'msg-wrapper ai';
    div.innerHTML = `
        <div class="msg-label">ATLAS AI</div>
        <div class="typing-wrapper">
            <div class="msg-avatar-sm ai-av">🤖</div>
            <div class="typing-bubble"><span></span><span></span><span></span></div>
        </div>
    `;
    area.appendChild(div);
    area.scrollTop = area.scrollHeight;
}

function hideTyping() {
    const el = document.getElementById('typingIndicator');
    if (el) el.remove();
}

function setStatus(state) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    const pill = document.getElementById('statusPill');
    if (state === 'ready') {
        dot.className = 'status-dot';
        txt.textContent = 'Ready';
        pill.style.color = 'var(--ai-success)';
    } else if (state === 'busy') {
        dot.className = 'status-dot busy';
        txt.textContent = 'Thinking...';
        pill.style.color = 'var(--ai-warn)';
    }
}

// ===== SEND MESSAGE =====
async function sendMessage() {
    if (isAIBusy) return;

    const input = document.getElementById('chatInput');
    const text = input.value.trim();

    if (!text && !currentImage && !currentFile) {
        showToast('⚠️ কিছু লিখো বা ছবি দাও');
        return;
    }

    let question = text;
    const imageData = currentImage;

    // If file attached, prepend file context
    if (currentFile) {
        question = `ফাইল: ${currentFile.name}\n\n${currentFile.text}\n\n${text ? 'প্রশ্ন: ' + text : 'এই ফাইলটি বিশ্লেষণ করো।'}`;
    }

    // Clear inputs
    input.value = '';
    removeImage();
    removeFile();
    autoResizeTextarea(input);

    // Add user message to UI
    addUserMessage(text || (imageData ? '📸 ছবি পাঠালাম' : '📄 ফাইল পাঠালাম'), imageData);

    // AI response
    isAIBusy = true;
    document.getElementById('sendBtn').disabled = true;
    setStatus('busy');
    showTyping();

  const result = await askAI(question, imageData);

// ✅ Greeting for first AI reply
let finalAnswer = result.answer;
const session = localStorage.getItem('atlas-session');
if (session) {
    try {
        const user = JSON.parse(session);
        const userName = user.name || 'শিক্ষার্থী';
        const aiReplies = chatHistory.filter(m => m.type === 'ai');
        if (aiReplies.length === 0) {
            finalAnswer = `Welcome to ATLAS Ai🙌, প্রিয় ${userName}! 😊\n\n${finalAnswer}`;
        }
    } catch(e) {}
}

hideTyping();
addAIMessage(finalAnswer);
    isAIBusy = false;
    document.getElementById('sendBtn').disabled = false;
    setStatus('ready');
    input.focus();
}

// ===== SUGGESTED QUESTIONS =====
function useSuggest(chip) {
    const text = chip.textContent.replace(/^[^\s]+\s/, ''); // remove emoji prefix
    document.getElementById('chatInput').value = text;
    document.getElementById('chatInput').focus();
}

// ===== TEXTAREA AUTO RESIZE =====
function autoResizeTextarea(el) {
    el.style.height = 'auto';
    el.style.height = Math.min(el.scrollHeight, 100) + 'px';
}

// ===== CHAT PERSISTENCE =====
function saveChat() {
    try {
        localStorage.setItem('atlas-chat-v2', JSON.stringify(chatHistory.slice(-50)));
    } catch(e) {}
}

function loadChat() {
    try {
        const saved = JSON.parse(localStorage.getItem('atlas-chat-v2') || '[]');
        chatHistory = saved;
        if (!saved.length) return;
        const area = document.getElementById('chatArea');
        document.getElementById('chatEmpty').style.display = 'none';
        document.getElementById('suggestBar').style.display = 'none';
        saved.forEach(m => {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper ' + m.type;
            if (m.type === 'user') {
                wrapper.innerHTML = `
                    <div class="msg-label">তুমি</div>
                    <div class="msg-row">
                        <div class="msg-bubble">${(m.text || m.image || '').replace(/\n/g,'<br>')}</div>
                        <div class="msg-avatar-sm user-av">👤</div>
                    </div>
                    <div class="msg-meta"><span class="msg-time">${m.time || ''}</span></div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="msg-label">ATLAS AI</div>
                    <div class="msg-row">
                        <div class="msg-avatar-sm ai-av">🤖</div>
                        <div class="msg-bubble">
                            <div class="ai-answer">${formatAIText(m.text || '')}</div>
                            <div class="msg-meta">
                                <span class="msg-time">${m.time || ''}</span>
                                <button class="copy-btn" onclick="copyAnswer(this)">📋 কপি</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            area.appendChild(wrapper);
        });
        area.scrollTop = area.scrollHeight;
    } catch(e) {}
}

function clearChat() {
    chatHistory = [];
    localStorage.removeItem('atlas-chat-v2');
    const area = document.getElementById('chatArea');
    area.innerHTML = `
        <div class="chat-empty" id="chatEmpty">
            <div class="empty-icon">🤖</div>
            <div class="empty-title">চ্যাট ক্লিয়ার হয়েছে!</div>
            <div class="empty-sub">নতুন প্রশ্ন করো — আমি সবসময় প্রস্তুত 😊</div>
        </div>
    `;
    document.getElementById('suggestBar').style.display = 'flex';
    showToast('🗑️ চ্যাট ক্লিয়ার!');
}

// ===== COMMON UTILS =====
function showToast(m, d = 2200) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), d);
}
function toggleTheme() {
    isDarkMode = !isDarkMode;
    document.body.classList.toggle('dark-mode', isDarkMode);
    document.body.classList.toggle('light-mode', !isDarkMode);
    document.getElementById('themeToggle').textContent = isDarkMode ? '☀️' : '🌙';
}
// Global back button — always goes exactly one step back in real browser history (never further, never to a different page)
function goBackGlobal() {
    if (window.history.length > 1) { history.back(); }
    else { location.href = 'index.html'; }
}
function toggleSidebar() {
    isSidebarOpen = !isSidebarOpen;
    document.getElementById('sidebarOverlay').classList.toggle('active', isSidebarOpen);
    document.getElementById('sidebar').classList.toggle('active', isSidebarOpen);
}
function closeSidebar() {
    isSidebarOpen = false;
    document.getElementById('sidebarOverlay').classList.remove('active');
    document.getElementById('sidebar').classList.remove('active');
}
function goTo(u) { location.href = u; }
function navigateTo(p) {
    const r = { home: 'index.html', profile: 'profile.html', class: 'class.html', exam: 'exam.html' };
    goTo(r[p] || 'index.html');
}
function logout() { localStorage.removeItem('atlas-session'); goTo('index.html'); }

// ===== EVENT LISTENERS =====
document.addEventListener('DOMContentLoaded', () => {
    loadChat();

    const textarea = document.getElementById('chatInput');
    textarea.addEventListener('input', () => autoResizeTextarea(textarea));
    textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
});

// ===== ERROR HANDLING =====
function showError(title, message, details, retryFn) {
    const existing = document.querySelector('.error-popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'error-popup-overlay';
    overlay.innerHTML = `
        <div class="error-popup" onclick="event.stopPropagation()">
            <div class="error-popup-icon">⚠️</div>
            <div class="error-popup-title">${title || 'কিছু সমস্যা হয়েছে'}</div>
            <div class="error-popup-message">${message || 'পরে আবার চেষ্টা করুন'}</div>
            ${details ? `<div class="error-popup-details">${details}</div>` : ''}
            <div style="display:flex;justify-content:center;gap:8px;" id="errorPopupBtnRow">
                <button class="error-popup-btn" id="errorPopupCloseBtn">✕ বন্ধ</button>
            </div>
        </div>
    `;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    overlay.querySelector('#errorPopupCloseBtn').addEventListener('click', () => overlay.remove());
    // Attach retry handler directly (preserves closure — toString()+onclick would lose it, causing "X is not defined" errors)
    if (retryFn) {
        const retryBtn = document.createElement('button');
        retryBtn.className = 'error-popup-retry';
        retryBtn.textContent = '🔄 আবার চেষ্টা';
        retryBtn.addEventListener('click', () => { overlay.remove(); retryFn(); });
        overlay.querySelector('#errorPopupBtnRow').prepend(retryBtn);
    }
}

window.addEventListener('error', (e) => {
    showError('💥 সমস্যা', 'পৃষ্ঠাটি রিলোড করুন', e.error?.message, () => location.reload());
});
window.addEventListener('unhandledrejection', (e) => {
    showError('⚠️ প্রসেসিং সমস্যা', 'অনুরোধ সম্পূর্ণ করা যায়নি', e.reason?.message, null);
});
</script>
