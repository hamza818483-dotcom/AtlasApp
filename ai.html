<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS EXAM · AI</title>
    <style>
        :root {
            --bg: #0A0E17; --card: #131822; --hover: #1A2130;
            --text: #ECEEF2; --text2: #8E94A0;
            --accent: #6C72FF; --accent-hover: #858AFF;
            --border: #252B38; --shadow: 0 2px 10px rgba(0,0,0,0.4);
            --radius: 14px; --radius-sm: 10px;
            --red: #FF5A5A; --green: #3ECF8E;
        }
        .light-mode {
            --bg: #F8F9FC; --card: #FFFFFF; --hover: #F1F3F8;
            --text: #1A1D28; --text2: #6B7180;
            --accent: #5B5FE8; --accent-hover: #4A4ED4;
            --border: #E4E7F0; --shadow: 0 2px 10px rgba(0,0,0,0.06);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 70px 0 70px;
            -webkit-font-smoothing: antialiased; transition: background 0.3s, color 0.3s;
        }
        .header { position:fixed;top:0;left:0;right:0;height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100; }
        .hamburger{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px;}
        .logo{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-1px;}
        .header-icon{background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;}
        .header-icon:hover{border-color:var(--accent);}
        
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;opacity:0;visibility:hidden;transition:0.2s;}
        .sidebar-overlay.active{opacity:1;visibility:visible;}
        .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:var(--card);z-index:201;overflow-y:auto;transition:0.2s;border-right:1px solid var(--border);}
        .sidebar.active{left:0;}
        .sidebar-header{background:var(--card);padding:20px 16px;text-align:center;border-bottom:1px solid var(--border);}
        .sidebar-logo{font-size:20px;font-weight:800;color:var(--accent);}
        .sidebar-item{display:flex;align-items:center;gap:10px;padding:12px 18px;color:var(--text2);border:none;background:none;width:100%;text-align:left;font-size:14px;cursor:pointer;transition:0.2s;font-family:inherit;}
        .sidebar-item:hover{background:var(--hover);color:var(--text);}
        .sidebar-divider{height:1px;background:var(--border);margin:8px 0;}
        
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text2);font-size:10px;cursor:pointer;padding:6px 10px;border-radius:8px;transition:0.2s;font-family:inherit;}
        .nav-item.active{color:var(--accent);}
        .nav-item .nav-icon{font-size:20px;}
        
        .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);border:1px solid var(--accent);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:0.2s;pointer-events:none;}
        .toast.show{opacity:1;}
        
        .ai-container { max-width: 600px; margin: 0 auto; padding: 12px 14px; display: flex; flex-direction: column; height: calc(100vh - 56px - 60px - 24px); }
        .ai-header-card { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 12px 16px; margin-bottom: 10px; text-align: center; box-shadow: var(--shadow); }
        .ai-header-title { color: var(--accent); font-size: 16px; font-weight: 700; }
        .ai-header-sub { color: var(--text2); font-size: 10px; margin-top: 2px; }
        
        .chat-area { flex: 1; overflow-y: auto; background: var(--card); border-radius: var(--radius); padding: 12px; margin-bottom: 8px; border: 1px solid var(--border); display: flex; flex-direction: column; gap: 8px; }
        .chat-empty { text-align: center; color: var(--text2); padding: 30px 20px; font-size: 13px; }
        .chat-empty .icon { font-size: 40px; display: block; margin-bottom: 10px; }
        
        .message { max-width: 85%; padding: 10px 14px; border-radius: 12px; font-size: 13px; line-height: 1.5; animation: fadeIn 0.2s; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(6px);} to{opacity:1;transform:translateY(0);} }
        .message.user { align-self: flex-end; background: var(--accent); color: #fff; border-bottom-right-radius: 4px; }
        .message.ai { align-self: flex-start; background: var(--hover); color: var(--text); border-bottom-left-radius: 4px; }
        .message .msg-time { font-size: 9px; opacity: 0.5; margin-top: 3px; text-align: right; }
        
        .typing-dots { display: flex; gap: 4px; padding: 8px 14px; }
        .typing-dots span { width: 7px; height: 7px; border-radius: 50%; background: var(--text2); animation: bounce 1.2s infinite; }
        .typing-dots span:nth-child(2){animation-delay:0.2s;} .typing-dots span:nth-child(3){animation-delay:0.4s;}
        @keyframes bounce { 0%,60%,100%{transform:translateY(0);} 30%{transform:translateY(-6px);} }
        
        .input-area { display: flex; gap: 6px; background: var(--card); border-radius: var(--radius-sm); padding: 6px; border: 1px solid var(--border); }
        .input-area input { flex: 1; padding: 10px 12px; border: 1px solid var(--border); border-radius: 8px; background: var(--bg); color: var(--text); font-size: 13px; font-family: inherit; transition: 0.2s; }
        .input-area input:focus { outline: none; border-color: var(--accent); }
        .send-btn { width: 44px; height: 44px; border-radius: 10px; border: none; background: var(--accent); color: #fff; font-size: 18px; cursor: pointer; transition: 0.2s; flex-shrink: 0; }
        .send-btn:hover { background: var(--accent-hover); }
        .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
        
        .clear-btn { display: block; margin: 6px auto 0; padding: 6px 16px; background: transparent; border: 1px solid var(--border); color: var(--text2); border-radius: 20px; font-size: 10px; cursor: pointer; font-family: inherit; transition: 0.2s; }
        .clear-btn:hover { border-color: var(--red); color: var(--red); }
    </style>
</head>
<body class="dark-mode">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">ATLAS EXAM</div></div>
    <button class="sidebar-item" onclick="navigateTo('profile');closeSidebar();">👤 প্রোফাইল</button>
    <button class="sidebar-item" onclick="goTo('index.html');closeSidebar();">🏠 হোম</button>
    <button class="sidebar-item" onclick="goTo('class.html');closeSidebar();">📚 ফ্রি ক্লাস</button>
    <button class="sidebar-item" onclick="goTo('exam.html');closeSidebar();">📝 ফ্রি এক্সাম</button>
    <button class="sidebar-item" onclick="goTo('mock-test.html');closeSidebar();">🎯 মক টেস্ট</button>
    <button class="sidebar-item" onclick="goTo('dashboard.html');closeSidebar();">⚠️ My Mistakes</button>
    <button class="sidebar-item" onclick="goTo('ai.html');closeSidebar();">🤖 ATLAS AI</button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="toggleTheme()">🌙 ডার্ক মোড</button>
    <button class="sidebar-item" onclick="openWA()">💬 WhatsApp</button>
    <button class="sidebar-item" onclick="openTG()">✈️ Telegram</button>
</aside>

<header class="header">
    <div style="display:flex;align-items:center;gap:10px;"><button class="hamburger" onclick="toggleSidebar()">☰</button><span class="logo">ATLAS EXAM</span></div>
    <div style="display:flex;gap:6px;"><button class="header-icon" onclick="toggleTheme()" id="themeToggle">🌙</button></div>
</header>

<main class="ai-container">
    <div class="ai-header-card">
        <div class="ai-header-title">🤖 ATLAS AI</div>
        <div class="ai-header-sub">Gemini 2.0 Flash · আপনার পড়াশোনার বন্ধু</div>
    </div>

    <div class="chat-area" id="chatArea">
        <div class="chat-empty" id="chatEmpty"><span class="icon">🤖</span>ATLAS AI-তে স্বাগতম!<br>আপনার পড়াশোনার প্রশ্ন করুন।</div>
    </div>

    <button class="clear-btn" onclick="clearChat()">🗑️ চ্যাট ক্লিয়ার</button>

    <div class="input-area">
        <input type="text" id="chatInput" placeholder="এখানে প্রশ্ন লিখুন..." maxlength="500">
        <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
    </div>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="goTo('index.html')"><span class="nav-icon">🏠</span>হোম</button>
    <button class="nav-item" onclick="goTo('class.html')"><span class="nav-icon">📚</span>ক্লাস</button>
    <button class="nav-item" onclick="goTo('exam.html')"><span class="nav-icon">📝</span>এক্সাম</button>
    <button class="nav-item" onclick="goTo('mock-test.html')"><span class="nav-icon">🎯</span>মক</button>
    <button class="nav-item active" onclick="goTo('dashboard.html')"><span class="nav-icon">👤</span>প্রোফাইল</button>
</nav>

<div class="toast" id="toast"></div>

<script>
const GEMINI_KEYS = ['AIzaSyBHfdZwqQkrBWF2pp1hLCGZKaXKrinP9ew'];
let isDarkMode = true, isSidebarOpen = false, chatHistory = [], currentKeyIdx = 0, keyUsage = {};

function showToast(m, d = 2000) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), d); }
function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode', isDarkMode); document.body.classList.toggle('light-mode', !isDarkMode); document.getElementById('themeToggle').textContent = isDarkMode ? '🌙' : '☀️'; showToast(isDarkMode ? '🌙 ডার্ক' : '☀️ লাইট'); }
function toggleSidebar() { isSidebarOpen = !isSidebarOpen; document.getElementById('sidebarOverlay').classList.toggle('active', isSidebarOpen); document.getElementById('sidebar').classList.toggle('active', isSidebarOpen); }
function closeSidebar() { isSidebarOpen = false; document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('sidebar').classList.remove('active'); }
function goTo(u) { location.href = u; }
function navigateTo(p) { const r = { home:'index.html', profile:'dashboard.html', class:'class.html', exam:'exam.html' }; goTo(r[p]||'index.html'); }
function openWA() { window.open('https://wa.me/8801999681290', '_blank'); }
function openTG() { window.open('https://t.me/rafi_somc', '_blank'); }

function getNextKey() {
    const today = new Date().toDateString();
    if (keyUsage._date !== today) keyUsage = { _date: today };
    let best = null, bestCnt = Infinity;
    GEMINI_KEYS.forEach(k => { const c = keyUsage[k]||0; if (c < 1450 && c < bestCnt) { best = k; bestCnt = c; } });
    if (best) { keyUsage[best] = (keyUsage[best]||0) + 1; return best; }
    return null;
}

async function callGemini(text, retry = 0) {
    if (retry > GEMINI_KEYS.length + 2) return '❌ সব API Key ব্যর্থ। পরে চেষ্টা করুন।';
    const key = getNextKey();
    if (!key) return '❌ আজকের API লিমিট শেষ।';
    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${key}`, {
            method: 'POST', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ contents: [{ parts: [{ text: 'তুমি একজন সহায়ক AI টিচার। বাংলা ও ইংরেজিতে উত্তর দাও। প্রশ্ন: ' + text }] }] })
        });
        if (res.status === 429 || res.status === 403) return await callGemini(text, retry + 1);
        const data = await res.json();
        return data.candidates ? data.candidates[0].content.parts[0].text : '❌ উত্তর পাওয়া যায়নি।';
    } catch(e) { return await callGemini(text, retry + 1); }
}

function getTime() { const d = new Date(); return `${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }

function addMessage(text, type) {
    const area = document.getElementById('chatArea'), empty = document.getElementById('chatEmpty');
    if (empty) empty.style.display = 'none';
    const div = document.createElement('div'); div.className = 'message ' + type;
    div.innerHTML = text.replace(/\n/g, '<br>') + `<div class="msg-time">${getTime()}</div>`;
    area.appendChild(div); area.scrollTop = area.scrollHeight;
    chatHistory.push({ text, type, time: getTime() });
    if (chatHistory.length > 50) chatHistory = chatHistory.slice(-50);
    localStorage.setItem('atlas-chat', JSON.stringify(chatHistory));
}

function loadChat() {
    try {
        const saved = JSON.parse(localStorage.getItem('atlas-chat')||'[]');
        chatHistory = saved;
        saved.forEach(m => { const area = document.getElementById('chatArea'), empty = document.getElementById('chatEmpty'); if (empty) empty.style.display = 'none'; const div = document.createElement('div'); div.className = 'message ' + m.type; div.innerHTML = m.text.replace(/\n/g,'<br>') + `<div class="msg-time">${m.time}</div>`; area.appendChild(div); });
        document.getElementById('chatArea').scrollTop = document.getElementById('chatArea').scrollHeight;
    } catch(e) {}
}

function clearChat() { chatHistory = []; localStorage.removeItem('atlas-chat'); document.getElementById('chatArea').innerHTML = '<div class="chat-empty"><span class="icon">🤖</span>চ্যাট ক্লিয়ার!<br>নতুন প্রশ্ন করুন।</div>'; showToast('🗑️ ক্লিয়ার'); }

async function sendMessage() {
    const input = document.getElementById('chatInput'), text = input.value.trim();
    if (!text) return;
    input.value = ''; addMessage(text, 'user');
    const btn = document.getElementById('sendBtn'); btn.disabled = true;
    const reply = await callGemini(text);
    addMessage(reply, 'ai'); btn.disabled = false;
}

document.addEventListener('keydown', e => { if (e.key === 'Enter' && document.activeElement === document.getElementById('chatInput')) sendMessage(); });
document.addEventListener('DOMContentLoaded', () => { loadChat(); });
</script>
</body>
</html>
