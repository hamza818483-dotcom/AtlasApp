<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP · AI</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ===== FLUTTER-STYLE DESIGN SYSTEM ===== */
        :root {
            --ai-primary: #6C63FF;
            --ai-primary-light: rgba(108,99,255,0.12);
            --ai-secondary: #00D4AA;
            --ai-bg: #0F0F1A;
            --ai-surface: #16162A;
            --ai-card: #1E1E35;
            --ai-card2: #252540;
            --ai-border: rgba(108,99,255,0.18);
            --ai-text: #E8E8F5;
            --ai-text2: #9898BB;
            --ai-text3: #5A5A7A;
            --ai-user-bubble: linear-gradient(135deg, #6C63FF 0%, #5548CC 100%);
            --ai-bot-bubble: #1E1E38;
            --ai-success: #00D4AA;
            --ai-error: #FF5B7A;
            --ai-warn: #FFB347;
            --ai-glow: rgba(108,99,255,0.25);
            --ai-radius: 18px;
            --ai-radius-sm: 12px;
            --ai-radius-xs: 8px;
            --shadow-float: 0 8px 32px rgba(0,0,0,0.35), 0 2px 8px rgba(0,0,0,0.2);
        }

        body.light-mode {
            --ai-bg: #F0F0FF;
            --ai-surface: #F8F8FF;
            --ai-card: #FFFFFF;
            --ai-card2: #F0F0FA;
            --ai-border: rgba(108,99,255,0.2);
            --ai-text: #1A1A35;
            --ai-text2: #5A5A8A;
            --ai-text3: #9898BB;
            --ai-bot-bubble: #EEEEFF;
            --ai-glow: rgba(108,99,255,0.15);
        }

        * { box-sizing: border-box; }

        /* ===== MAIN LAYOUT ===== */
        .ai-page {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 12px;
            display: flex;
            flex-direction: column;
            height: calc(100vh - 56px - 60px - 20px);
        }

        /* ===== HEADER CARD — Flutter AppBar Style ===== */
        .ai-appbar {
            background: linear-gradient(135deg, var(--ai-surface) 0%, var(--ai-card) 100%);
            border: 1.5px solid var(--ai-border);
            border-radius: var(--ai-radius);
            padding: 14px 16px;
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 10px;
            box-shadow: var(--shadow-float), 0 0 24px var(--ai-glow);
            position: relative;
            overflow: hidden;
        }
        .ai-appbar::before {
            content: '';
            position: absolute;
            top: -30px; right: -30px;
            width: 100px; height: 100px;
            background: radial-gradient(circle, var(--ai-primary) 0%, transparent 70%);
            opacity: 0.12;
        }
        .ai-avatar {
            width: 44px; height: 44px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--ai-primary), var(--ai-secondary));
            display: flex; align-items: center; justify-content: center;
            font-size: 22px;
            flex-shrink: 0;
            box-shadow: 0 4px 16px var(--ai-glow);
            animation: avatarPulse 3s ease-in-out infinite;
        }
        @keyframes avatarPulse {
            0%,100% { box-shadow: 0 4px 16px var(--ai-glow); }
            50% { box-shadow: 0 4px 28px rgba(108,99,255,0.5); }
        }
        .ai-appbar-info { flex: 1; }
        .ai-title { font-size: 16px; font-weight: 800; color: var(--ai-text); letter-spacing: 0.5px; }
        .ai-subtitle { font-size: 10px; color: var(--ai-text2); margin-top: 1px; }
        .ai-status-pill {
            display: flex; align-items: center; gap: 5px;
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 20px;
            padding: 4px 10px;
            font-size: 10px;
            font-weight: 700;
            color: var(--ai-success);
        }
        .status-dot {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--ai-success);
            animation: statusBlink 2s infinite;
        }
        @keyframes statusBlink {
            0%,100% { opacity: 1; } 50% { opacity: 0.3; }
        }
        .status-dot.busy { background: var(--ai-warn); animation: none; opacity: 1; }

        /* ===== SUGGESTED QUESTIONS ===== */
        .suggest-bar {
            display: flex;
            gap: 8px;
            overflow-x: auto;
            padding: 0 0 8px;
            scrollbar-width: none;
            margin-bottom: 4px;
        }
        .suggest-bar::-webkit-scrollbar { display: none; }
        .suggest-chip {
            flex-shrink: 0;
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 20px;
            padding: 6px 14px;
            font-size: 11px;
            color: var(--ai-text2);
            cursor: pointer;
            transition: all 0.2s;
            white-space: nowrap;
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        .suggest-chip:hover {
            background: var(--ai-primary-light);
            border-color: var(--ai-primary);
            color: var(--ai-text);
        }

        /* ===== CHAT AREA ===== */
        .chat-area {
            flex: 1;
            overflow-y: auto;
            background: var(--ai-surface);
            border-radius: var(--ai-radius);
            padding: 14px;
            border: 1px solid var(--ai-border);
            display: flex;
            flex-direction: column;
            gap: 10px;
            scroll-behavior: smooth;
        }
        .chat-area::-webkit-scrollbar { width: 4px; }
        .chat-area::-webkit-scrollbar-track { background: transparent; }
        .chat-area::-webkit-scrollbar-thumb { background: var(--ai-border); border-radius: 4px; }

        /* ===== EMPTY STATE ===== */
        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            min-height: 180px;
            gap: 10px;
            text-align: center;
            animation: fadeIn 0.5s ease;
        }
        .empty-icon { font-size: 48px; animation: floatIcon 3s ease-in-out infinite; }
        @keyframes floatIcon {
            0%,100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .empty-title { font-size: 15px; font-weight: 700; color: var(--ai-text); }
        .empty-sub { font-size: 11px; color: var(--ai-text2); line-height: 1.6; }

        /* ===== MESSAGES — Flutter Bubble Style ===== */
        .msg-wrapper {
            display: flex;
            flex-direction: column;
            animation: msgSlide 0.25s ease-out;
        }
        @keyframes msgSlide {
            from { opacity: 0; transform: translateY(12px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .msg-wrapper.user { align-items: flex-end; }
        .msg-wrapper.ai { align-items: flex-start; }

        .msg-label {
            font-size: 9px;
            color: var(--ai-text3);
            margin-bottom: 3px;
            padding: 0 4px;
            font-weight: 600;
            letter-spacing: 0.5px;
        }
        .msg-row { display: flex; gap: 8px; align-items: flex-end; }
        .msg-wrapper.user .msg-row { flex-direction: row-reverse; }

        .msg-avatar-sm {
            width: 28px; height: 28px;
            border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 13px;
            flex-shrink: 0;
        }
        .msg-avatar-sm.ai-av { background: linear-gradient(135deg, var(--ai-primary), var(--ai-secondary)); }
        .msg-avatar-sm.user-av { background: rgba(108,99,255,0.25); }

        .msg-bubble {
            max-width: 85%;
            padding: 10px 14px;
            font-size: 13px;
            line-height: 1.65;
            word-break: break-word;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .msg-wrapper.user .msg-bubble {
            background: var(--ai-user-bubble);
            color: #fff;
            border-radius: 18px 18px 4px 18px;
            box-shadow: 0 4px 16px rgba(108,99,255,0.3);
        }
        .msg-wrapper.ai .msg-bubble {
            background: var(--ai-bot-bubble);
            color: var(--ai-text);
            border-radius: 18px 18px 18px 4px;
            border-left: 3px solid var(--ai-primary);
            box-shadow: 0 2px 12px rgba(0,0,0,0.15);
        }
        .msg-bubble.has-image { padding: 8px; }
        .msg-bubble img {
            max-width: 200px;
            border-radius: 12px;
            display: block;
            margin-bottom: 6px;
        }
        .msg-meta {
            display: flex;
            align-items: center;
            gap: 8px;
            margin-top: 5px;
            padding: 0 4px;
        }
        .msg-time { font-size: 9px; color: var(--ai-text3); }
        .copy-btn {
            background: none; border: none;
            color: var(--ai-text3);
            cursor: pointer;
            font-size: 10px;
            padding: 2px 6px;
            border-radius: 6px;
            transition: all 0.2s;
        }
        .copy-btn:hover { background: var(--ai-primary-light); color: var(--ai-primary); }

        /* ===== MCQ ANSWER STYLING ===== */
        .mcq-correct {
            display: inline-block;
            background: rgba(0,212,170,0.15);
            color: var(--ai-success);
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 6px;
            border: 1px solid rgba(0,212,170,0.3);
        }
        .mcq-wrong {
            color: var(--ai-error);
            opacity: 0.85;
        }

        /* ===== TYPING ANIMATION ===== */
        .typing-wrapper {
            display: flex;
            align-items: flex-end;
            gap: 8px;
        }
        .typing-bubble {
            background: var(--ai-bot-bubble);
            border: 1px solid var(--ai-border);
            border-radius: 18px 18px 18px 4px;
            padding: 12px 16px;
            display: flex;
            gap: 5px;
            align-items: center;
        }
        .typing-bubble span {
            width: 7px; height: 7px;
            border-radius: 50%;
            background: var(--ai-primary);
            animation: typingBounce 1.3s ease-in-out infinite;
        }
        .typing-bubble span:nth-child(2) { animation-delay: 0.18s; }
        .typing-bubble span:nth-child(3) { animation-delay: 0.36s; }
        @keyframes typingBounce {
            0%,60%,100% { transform: translateY(0); opacity: 0.5; }
            30% { transform: translateY(-7px); opacity: 1; }
        }

        /* ===== INPUT AREA — Flutter TextField Style ===== */
        .input-panel {
            margin-top: 8px;
            background: var(--ai-surface);
            border: 1.5px solid var(--ai-border);
            border-radius: 20px;
            padding: 8px 10px 8px 14px;
            display: flex;
            align-items: flex-end;
            gap: 8px;
            box-shadow: var(--shadow-float);
            transition: border-color 0.2s, box-shadow 0.2s;
        }
        .input-panel:focus-within {
            border-color: var(--ai-primary);
            box-shadow: 0 0 0 3px var(--ai-glow), var(--shadow-float);
        }
        .input-actions-left {
            display: flex;
            gap: 4px;
            align-items: center;
            flex-shrink: 0;
        }
        .icon-btn {
            width: 34px; height: 34px;
            border-radius: 50%;
            border: none;
            background: var(--ai-card2);
            color: var(--ai-text2);
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
        }
        .icon-btn:hover { background: var(--ai-primary-light); color: var(--ai-primary); }

        #chatInput {
            flex: 1;
            background: transparent;
            border: none;
            outline: none;
            color: var(--ai-text);
            font-size: 13px;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
            resize: none;
            min-height: 34px;
            max-height: 100px;
            padding: 6px 0;
            line-height: 1.5;
        }
        #chatInput::placeholder { color: var(--ai-text3); }

        .send-btn {
            width: 40px; height: 40px;
            border-radius: 50%;
            border: none;
            background: linear-gradient(135deg, var(--ai-primary), #5548CC);
            color: #fff;
            font-size: 16px;
            cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
            flex-shrink: 0;
            box-shadow: 0 4px 16px rgba(108,99,255,0.4);
        }
        .send-btn:hover { transform: scale(1.08); box-shadow: 0 6px 20px rgba(108,99,255,0.55); }
        .send-btn:disabled { opacity: 0.45; transform: none; cursor: not-allowed; }

        /* ===== CLEAR BUTTON ===== */
        .chat-tools {
            display: flex;
            justify-content: center;
            margin-top: 6px;
        }
        .clear-btn {
            background: transparent;
            border: 1px solid var(--ai-border);
            color: var(--ai-text3);
            border-radius: 20px;
            padding: 5px 16px;
            font-size: 10px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s;
            font-family: 'Noto Sans Bengali', sans-serif;
        }
        .clear-btn:hover { border-color: var(--ai-error); color: var(--ai-error); }

        /* ===== IMAGE PREVIEW BEFORE SEND ===== */
        .img-preview-bar {
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .img-preview-bar.show { display: flex; }
        .img-preview-bar img { width: 48px; height: 48px; border-radius: 8px; object-fit: cover; }
        .img-preview-info { flex: 1; }
        .img-preview-name { font-size: 11px; color: var(--ai-text); font-weight: 600; }
        .img-preview-size { font-size: 9px; color: var(--ai-text3); }
        .img-remove-btn { background: none; border: none; color: var(--ai-error); cursor: pointer; font-size: 18px; }

        /* ===== FILE PREVIEW ===== */
        .file-preview-bar {
            background: var(--ai-card2);
            border: 1px solid var(--ai-border);
            border-radius: 12px;
            padding: 8px 12px;
            margin-bottom: 6px;
            display: none;
            align-items: center;
            gap: 10px;
        }
        .file-preview-bar.show { display: flex; }
        .file-icon { font-size: 28px; }
        .file-preview-info { flex: 1; }
        .file-preview-name { font-size: 11px; color: var(--ai-text); font-weight: 600; }
        .file-preview-type { font-size: 9px; color: var(--ai-text3); }
        .file-remove-btn { background: none; border: none; color: var(--ai-error); cursor: pointer; font-size: 18px; }

        /* ===== ANIMATIONS ===== */
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* ===== ERROR POPUP ===== */
        .error-popup-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,0.6);
            z-index: 9999;
            display: flex; align-items: center; justify-content: center;
            padding: 20px;
        }
        .error-popup {
            background: var(--ai-card);
            border: 1px solid var(--ai-border);
            border-radius: var(--ai-radius);
            padding: 24px;
            max-width: 340px;
            width: 100%;
            text-align: center;
        }
        .error-popup-icon { font-size: 40px; margin-bottom: 10px; }
        .error-popup-title { font-size: 16px; font-weight: 800; color: var(--ai-text); margin-bottom: 8px; }
        .error-popup-message { font-size: 13px; color: var(--ai-text2); margin-bottom: 14px; }
        .error-popup-details { font-size: 10px; color: var(--ai-text3); margin-bottom: 14px; background: var(--ai-surface); padding: 8px; border-radius: 8px; }
        .error-popup-btn { background: var(--ai-primary); color: #fff; border: none; border-radius: 12px; padding: 10px 20px; cursor: pointer; font-weight: 700; font-size: 13px; }
        .error-popup-retry { background: var(--ai-card2); color: var(--ai-text); border: 1px solid var(--ai-border); border-radius: 12px; padding: 10px 20px; cursor: pointer; font-weight: 600; font-size: 13px; margin-right: 8px; }
    </style>
</head>

<script>

// ===== GEMINI KEY ROTATION =====
function getNextGeminiKey() {
    const today = new Date().toDateString();
    if (keyUsage._date !== today) keyUsage = { _date: today };
    let best = null, bestCnt = Infinity;
    GEMINI_KEYS.forEach(k => {
        const c = keyUsage[k] || 0;
        if (c < 1450 && c < bestCnt) { best = k; bestCnt = c; }
    });
    if (best) { keyUsage[best] = (keyUsage[best] || 0) + 1; return best; }
    return GEMINI_KEYS[GEMINI_KEYS.length - 1];
}

        { s: 'chemistry', kw: ['রাসায়নিক','বন্ধন','মৌল','যৌগ','পর্যায়','অ্যাসিড','ক্ষার','লবণ','h₂o','co₂','nacl','ph','বিক্রিয়া','অক্সিজেন','হাইড্রোজেন','ইলেকট্রন','আয়ন','পারমাণবিক','অণু'] },
        { s: 'physics',   kw: ['বল','ভর','বেগ','ত্বরণ','তরঙ্গ','তাপ','আলো','শব্দ','চৌম্বক','বিদ্যুৎ','নিউটন','ওহম','ভোল্ট','শক্তি','কাজ','গতি','অভিকর্ষ','তড়িৎ'] },
        { s: 'math',      kw: ['ম্যাট্রিক্স','ভেক্টর','ক্যালকুলাস','যোগফল','গুণফল','সমীকরণ','sin','cos','tan','log','যোগ','গুণ','ভাগ','বিয়োগ','লগ','ত্রিকোণমিতি','সীমা'] },
        { s: 'bangla',    kw: ['বাংলা','ব্যাকরণ','রচনা','কবি','সাহিত্য','সমাস','সন্ধি','কারক','বিভক্তি','উপন্যাস','কবিতা','ছন্দ','অলংকার'] },
        { s: 'english',   kw: ['tense','preposition','verb','noun','grammar','voice','narration','paragraph','article','sentence','adjective','adverb'] }
    ];
    for (const r of rules) {
        if (r.kw.some(k => q.includes(k))) return r.s;
    }
    return 'general';
}

// ===== API CALLS =====
async function callGroq(model, question, systemPrompt, imageData) {
    let messages;
    if (imageData && model.vision) {
        messages = [
            { role: 'system', content: systemPrompt },
            {
                role: 'user',
                content: [
                    { type: 'image_url', image_url: { url: `data:${imageData.mimeType};base64,${imageData.base64}` } },
                    { type: 'text', text: question || 'এই ছবিটি বিশ্লেষণ করো এবং বাংলায় ব্যাখ্যা দাও।' }
                ]
            }
        ];
    } else {
        messages = [
            { role: 'system', content: systemPrompt },
            { role: 'user', content: question }
        ];
    }
    const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
        method: 'POST',
        headers: { 'Authorization': 'Bearer ' + model.key(), 'Content-Type': 'application/json' },
        body: JSON.stringify({
            model: model.model,
            messages,
            temperature: 0.7,
            max_tokens: 1200
        })
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.choices?.[0]?.message?.content || null;
}

async function callGoogle(model, question, systemPrompt, imageData) {
    const key = model.key();
    let parts = [];
    if (imageData) {
        parts.push({ inline_data: { mime_type: imageData.mimeType, data: imageData.base64 } });
    }
    parts.push({ text: systemPrompt + '\n\nপ্রশ্ন: ' + (question || 'এই ছবিটি বিশ্লেষণ করো।') });

    const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model.model}:generateContent?key=${key}`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ contents: [{ parts }] })
    });
    if (!res.ok) return null;
    const data = await res.json();
    return data.candidates?.[0]?.content?.parts?.[0]?.text || null;
}

async function callModel(model, question, systemPrompt, imageData) {
    try {
        if (imageData && !model.vision) return null; // skip non-vision models for images
        if (model.provider === 'groq') return await callGroq(model, question, systemPrompt, imageData);
        if (model.provider === 'google') return await callGoogle(model, question, systemPrompt, imageData);
        return null;
    } catch (e) { return null; }
}

// ===== MAIN AI FUNCTION =====
async function askAI(question, imageData) {
    const systemPrompt = getSystemPrompt(question || 'ছবি বিশ্লেষণ করো');
    const needsVision = !!imageData;

    // For vision tasks, prioritize vision-capable models first
    let modelOrder = needsVision
        ? [...ALL_MODELS.filter(m => m.vision), ...ALL_MODELS.filter(m => !m.vision)]
        : ALL_MODELS;

    for (const model of modelOrder) {
        const answer = await callModel(model, question, systemPrompt, imageData);
        if (answer && answer.trim().length > 10) {
            return { answer: answer.trim() };
        }
    }
    return { answer: '❌ দুঃখিত! ATLAS AI এখন একটু busy আছে। কিছুক্ষণ পর আবার চেষ্টা করো। 🙏' };
}

// ===== IMAGE HANDLING =====
function handleImageSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('⚠️ ছবি ৫MB-এর কম হতে হবে'); return; }

    const reader = new FileReader();
    reader.onload = (e) => {
        const base64 = e.target.result.split(',')[1];
        currentImage = { base64, mimeType: file.type, name: file.name, size: file.size };
        currentFile = null;
        document.getElementById('filePreviewBar').classList.remove('show');

        document.getElementById('imgPreviewThumb').src = e.target.result;
        document.getElementById('imgPreviewName').textContent = file.name;
        document.getElementById('imgPreviewSize').textContent = (file.size / 1024).toFixed(0) + ' KB';
        document.getElementById('imgPreviewBar').classList.add('show');
        showToast('📸 ছবি যোগ হয়েছে!');
    };
    reader.readAsDataURL(file);
    event.target.value = '';
}

function removeImage() {
    currentImage = null;
    document.getElementById('imgPreviewBar').classList.remove('show');
    document.getElementById('imgPreviewThumb').src = '';
}

// ===== FILE HANDLING =====
async function handleFileSelect(event) {
    const file = event.target.files[0];
    if (!file) return;
    if (file.size > 5 * 1024 * 1024) { showToast('⚠️ ফাইল ৫MB-এর কম হতে হবে'); return; }

    const ext = file.name.split('.').pop().toLowerCase();
    const icons = { pdf: '📕', doc: '📘', docx: '📘', txt: '📄' };

    if (ext === 'txt') {
        const reader = new FileReader();
        reader.onload = (e) => {
            currentFile = { text: e.target.result.slice(0, 4000), name: file.name, type: 'TXT' };
            currentImage = null;
            showFilePreview(file.name, icons[ext] || '📄', 'Text ফাইল');
        };
        reader.readAsText(file);
    } else if (ext === 'pdf') {
        currentFile = { text: '[PDF ফাইল আপলোড করা হয়েছে — টেক্সট extraction সীমিত। সরাসরি প্রশ্ন করো।]', name: file.name, type: 'PDF' };
        currentImage = null;
        showFilePreview(file.name, '📕', 'PDF Document');
        showToast('📕 PDF যোগ হয়েছে! প্রশ্ন লিখে পাঠাও।');
    } else {
        currentFile = { text: `[${ext.toUpperCase()} ফাইল: ${file.name}]`, name: file.name, type: ext.toUpperCase() };
        currentImage = null;
        showFilePreview(file.name, icons[ext] || '📄', ext.toUpperCase() + ' ফাইল');
    }
    event.target.value = '';
}

function showFilePreview(name, icon, type) {
    document.getElementById('imgPreviewBar').classList.remove('show');
    document.getElementById('fileIcon').textContent = icon;
    document.getElementById('filePreviewName').textContent = name;
    document.getElementById('filePreviewType').textContent = type;
    document.getElementById('filePreviewBar').classList.add('show');
}

function removeFile() {
    currentFile = null;
    document.getElementById('filePreviewBar').classList.remove('show');
}

function getTime() {
    const d = new Date();
    return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
}

function hideEmpty() {
    const el = document.getElementById('chatEmpty');
    if (el) el.style.display = 'none';
    document.getElementById('suggestBar').style.display = 'none';
}

function addUserMessage(text, imageObj) {
    hideEmpty();
    const area = document.getElementById('chatArea');
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper user';

    let bubbleContent = '';
    if (imageObj) {
        bubbleContent += `<img src="data:${imageObj.mimeType};base64,${imageObj.base64}" alt="ছবি">`;
    }
    if (text) bubbleContent += text.replace(/\n/g, '<br>');

    wrapper.innerHTML = `
        <div class="msg-label">তুমি</div>
        <div class="msg-row">
            <div class="msg-bubble${imageObj ? ' has-image' : ''}">${bubbleContent}</div>
            <div class="msg-avatar-sm user-av">👤</div>
        </div>
        <div class="msg-meta"><span class="msg-time">${getTime()}</span></div>
    `;
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;

    chatHistory.push({ type: 'user', text, image: imageObj ? `[ছবি: ${imageObj.name}]` : null, time: getTime() });
    saveChat();
}

function addAIMessage(text) {
    hideEmpty();
    const area = document.getElementById('chatArea');
    const wrapper = document.createElement('div');
    wrapper.className = 'msg-wrapper ai';

    const formattedText = formatAIText(text);

    wrapper.innerHTML = `
        <div class="msg-label">ATLAS AI</div>
        <div class="msg-row">
            <div class="msg-avatar-sm ai-av">🤖</div>
            <div class="msg-bubble">
                <div class="ai-answer">${formattedText}</div>
                <div class="msg-meta">
                    <span class="msg-time">${getTime()}</span>
                    <button class="copy-btn" onclick="copyAnswer(this)">📋 কপি</button>
                </div>
            </div>
        </div>
    `;
    area.appendChild(wrapper);
    area.scrollTop = area.scrollHeight;

    chatHistory.push({ type: 'ai', text, time: getTime() });
    saveChat();
}

function formatAIText(text) {
    return text
        .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
        .replace(/✅([^\n]*)/g, '<span class="mcq-correct">✅$1</span>')
        .replace(/❌([^\n]*)/g, '<span class="mcq-wrong">❌$1</span>')
        .replace(/\*\*([^*]+)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code style="background:rgba(108,99,255,0.15);padding:1px 5px;border-radius:4px;font-family:monospace">$1</code>')
        .replace(/\n/g, '<br>');
}

function copyAnswer(btn) {
    const msgBubble = btn.closest('.msg-bubble');
    const text = msgBubble.querySelector('.ai-answer').innerText;
    navigator.clipboard.writeText(text).then(() => {
        btn.textContent = '✅ কপিড!';
        setTimeout(() => btn.textContent = '📋 কপি', 2000);
    });
}

function hideTyping() {

function setStatus(state) {
    const dot = document.getElementById('statusDot');
    const txt = document.getElementById('statusText');
    const pill = document.getElementById('statusPill');
    if (state === 'ready') {
        dot.className = 'status-dot';
        txt.textContent = 'Ready';
        pill.style.color = 'var(--ai-success)';
    } else if (state === 'busy') {
        dot.className = 'status-dot busy';
        txt.textContent = 'Thinking...';
        pill.style.color = 'var(--ai-warn)';
    }
}

function loadChat() {
    try {
        const saved = JSON.parse(localStorage.getItem('atlas-chat-v2') || '[]');
        chatHistory = saved;
        if (!saved.length) return;
        const area = document.getElementById('chatArea');
        document.getElementById('chatEmpty').style.display = 'none';
        document.getElementById('suggestBar').style.display = 'none';
        saved.forEach(m => {
            const wrapper = document.createElement('div');
            wrapper.className = 'msg-wrapper ' + m.type;
            if (m.type === 'user') {
                wrapper.innerHTML = `
                    <div class="msg-label">তুমি</div>
                    <div class="msg-row">
                        <div class="msg-bubble">${(m.text || m.image || '').replace(/\n/g,'<br>')}</div>
                        <div class="msg-avatar-sm user-av">👤</div>
                    </div>
                    <div class="msg-meta"><span class="msg-time">${m.time || ''}</span></div>
                `;
            } else {
                wrapper.innerHTML = `
                    <div class="msg-label">ATLAS AI</div>
                    <div class="msg-row">
                        <div class="msg-avatar-sm ai-av">🤖</div>
                        <div class="msg-bubble">
                            <div class="ai-answer">${formatAIText(m.text || '')}</div>
                            <div class="msg-meta">
                                <span class="msg-time">${m.time || ''}</span>
                                <button class="copy-btn" onclick="copyAnswer(this)">📋 কপি</button>
                            </div>
                        </div>
                    </div>
                `;
            }
            area.appendChild(wrapper);
        });
        area.scrollTop = area.scrollHeight;
    } catch(e) {}
}

function clearChat() {
    chatHistory = [];
    localStorage.removeItem('atlas-chat-v2');
    const area = document.getElementById('chatArea');
    area.innerHTML = `
        <div class="chat-empty" id="chatEmpty">
            <div class="empty-icon">🤖</div>
            <div class="empty-title">চ্যাট ক্লিয়ার হয়েছে!</div>
            <div class="empty-sub">নতুন প্রশ্ন করো — আমি সবসময় প্রস্তুত 😊</div>
        </div>
    `;
    document.getElementById('suggestBar').style.display = 'flex';
    showToast('🗑️ চ্যাট ক্লিয়ার!');
}

// ===== COMMON UTILS =====
function showToast(m, d = 2200) {
    const t = document.getElementById('toast');
    t.textContent = m;
    t.classList.add('show');
    clearTimeout(t._t);
    t._t = setTimeout(() => t.classList.remove('show'), d);
}
function toggleTheme() {
    isDarkMode = !isDarkMode;
    document.body.classList.toggle('dark-mode', isDarkMode);
    document.body.classList.toggle('light-mode', !isDarkMode);
    document.getElementById('themeToggle').textContent = isDarkMode ? '☀️' : '🌙';
}
function toggleSidebar() {
    isSidebarOpen = !isSidebarOpen;
    document.getElementById('sidebarOverlay').classList.toggle('active', isSidebarOpen);
    document.getElementById('sidebar').classList.toggle('active', isSidebarOpen);
}
function closeSidebar() {
    isSidebarOpen = false;
    document.getElementById('sidebarOverlay').classList.remove('active');
    document.getElementById('sidebar').classList.remove('active');
}
function goTo(u) { location.href = u; }
function navigateTo(p) {
    const r = { home: 'index.html', profile: 'dashboard.html', class: 'class.html', exam: 'exam.html' };
    goTo(r[p] || 'index.html');
}
function logout() { localStorage.removeItem('atlas-session'); goTo('index.html'); }

// ===== EVENT LISTENERS =====
document.addEventListener('DOMContentLoaded', () => {
    loadChat();

    const textarea = document.getElementById('chatInput');
    textarea.addEventListener('input', () => autoResizeTextarea(textarea));
    textarea.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    });
});

// ===== ERROR HANDLING =====
function showError(title, message, details, retryFn) {
    const existing = document.querySelector('.error-popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'error-popup-overlay';
    let retryHTML = '';
    if (retryFn) {
        retryHTML = `<button class="error-popup-retry" onclick="this.closest('.error-popup-overlay').remove();(${retryFn.toString()})();">🔄 আবার চেষ্টা</button>`;
    }
    overlay.innerHTML = `
        <div class="error-popup" onclick="event.stopPropagation()">
            <div class="error-popup-icon">⚠️</div>
            <div class="error-popup-title">${title || 'কিছু সমস্যা হয়েছে'}</div>
            <div class="error-popup-message">${message || 'পরে আবার চেষ্টা করুন'}</div>
            ${details ? `<div class="error-popup-details">${details}</div>` : ''}
            <div style="display:flex;justify-content:center;gap:8px;">
                ${retryHTML}
                <button class="error-popup-btn" onclick="this.closest('.error-popup-overlay').remove()">✕ বন্ধ</button>
            </div>
        </div>
    `;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
}

window.addEventListener('error', (e) => {
    showError('💥 সমস্যা', 'পৃষ্ঠাটি রিলোড করুন', e.error?.message, () => location.reload());
});
window.addEventListener('unhandledrejection', (e) => {
    showError('⚠️ প্রসেসিং সমস্যা', 'অনুরোধ সম্পূর্ণ করা যায়নি', e.reason?.message, null);
});
</script>
