<style>
*{box-sizing:border-box}
.screen{display:none;min-height:calc(100vh - 60px);flex-direction:column}
.screen.active{display:flex}

.study-hdr{
  position:sticky;top:60px;z-index:90;
  background:var(--header-bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:10px;padding:12px 14px;min-height:52px;
}
.back-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--card-bg);border:1px solid var(--border);color:var(--text);
  font-size:18px;cursor:pointer;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.scr-title{font-size:14.5px;font-weight:700;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* Subjects */
.subj-banner{ background:linear-gradient(135deg,var(--accent),#3D35B0); margin:14px;border-radius:14px;padding:18px 16px;color:#fff; }
.subj-banner-t{font-size:16px;font-weight:900;margin-bottom:4px}
.subj-banner-s{font-size:12px;opacity:.85}
.subj-list{padding:0 14px 24px;display:flex;flex-direction:column;gap:10px}
	.subj-card{
	  border-radius:14px;padding:18px 16px;display:flex;align-items:center;gap:14px;
	  cursor:pointer;border:1px solid rgba(255,255,255,0.12);color:#fff;position:relative;overflow:hidden;
	  transition:transform .2s,box-shadow .2s;
	}
	.subj-card::before{
	  content:'';position:absolute;top:-50%;left:-50%;width:200%;height:200%;
	  background:linear-gradient(45deg,transparent 30%,rgba(255,255,255,0.08) 50%,transparent 70%);
	  animation:cardShimmer 3s ease-in-out infinite;pointer-events:none;
	}
	@keyframes cardShimmer{0%{transform:translateX(-100%) rotate(45deg)}100%{transform:translateX(100%) rotate(45deg)}}
	.subj-card:hover{transform:translateY(-2px);box-shadow:0 8px 24px rgba(0,0,0,.35)}
	.subj-icon{
	  font-size:22px;width:48px;height:48px;display:flex;align-items:center;justify-content:center;
	  background:rgba(255,255,255,0.2);backdrop-filter:blur(8px);border-radius:14px;flex-shrink:0;border:1px solid rgba(255,255,255,0.15);
	  font-weight:900;
	}
.subj-info{flex:1}
.subj-name{font-size:15px;font-weight:700}
.subj-desc{font-size:11px;opacity:.78;margin-top:2px}
.subj-arr{font-size:20px;opacity:.6}
.g0{background:linear-gradient(135deg,#6C63FF,#3D35B0)}
.g1{background:linear-gradient(135deg,#00D4AA,#00856F)}
.g2{background:linear-gradient(135deg,#FF6B6B,#B03535)}
.g3{background:linear-gradient(135deg,#FFBE0B,#B08500)}
.g4{background:linear-gradient(135deg,#3A86FF,#1A56CC)}
.g5{background:linear-gradient(135deg,#FF006E,#AA0048)}
.g6{background:linear-gradient(135deg,#8B5CF6,#5B21B6)}
.g7{background:linear-gradient(135deg,#EC4899,#9D174D)}

/* Lists (chapters/pdfs) */
.item-list{padding:10px 14px 24px;display:flex;flex-direction:column;gap:8px}
	.list-item{
	  background:var(--card-bg);border:1px solid var(--border);border-radius:10px;padding:14px 16px;
	  display:flex;align-items:center;gap:10px;cursor:pointer;transition:all .15s;
	}
	.list-item:hover{border-color:var(--accent);transform:translateX(3px)}
	.list-item:active{transform:scale(.98)}
.list-num{
  width:28px;height:28px;border-radius:8px;background:var(--accent-light);color:var(--accent);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;flex-shrink:0;
}
.list-info{flex:1;min-width:0}
.list-name{font-size:14px;font-weight:600}
.list-sub{font-size:11px;color:var(--text-secondary);margin-top:2px}
.list-arr{font-size:16px;color:var(--text-secondary)}
.premium-lock{font-size:10px;font-weight:800;color:#F59E0B;background:rgba(245,158,11,.12);padding:2px 7px;border-radius:6px;flex-shrink:0}

/* PDF viewer */
.pdf-toolbar{
  position:sticky;top:60px;z-index:80;background:var(--header-bg);border-bottom:1px solid var(--border);
  display:flex;align-items:center;gap:8px;padding:8px 12px;min-height:48px;
}
.zoom-wrap{display:flex;align-items:center;gap:4px;margin-left:auto;background:var(--card-bg);border-radius:8px;padding:4px 6px;border:1px solid var(--border)}
.z-btn{width:28px;height:28px;border-radius:6px;background:transparent;border:none;color:var(--text);font-size:18px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center}
.z-lbl{font-size:12px;font-weight:700;color:var(--text-secondary);min-width:38px;text-align:center}

.pages-wrap{padding:10px 8px 100px;display:flex;flex-direction:column;gap:14px}
.page-card{background:var(--card-bg);border-radius:12px;overflow:hidden;border:1.5px solid var(--border)}
.page-card.sel{border-color:var(--accent)}
.page-top-bar{display:flex;align-items:center;justify-content:space-between;padding:8px 12px;background:rgba(0,0,0,.15);border-bottom:1px solid var(--border)}
.cb-label{display:flex;align-items:center;gap:8px;cursor:pointer;user-select:none}
.cb-box{width:20px;height:20px;border-radius:6px;border:2px solid var(--border);background:var(--bg);display:flex;align-items:center;justify-content:center;font-size:11px}
.cb-txt{font-size:12px;color:var(--text-secondary)}
.p-badge{font-size:11px;font-weight:700;background:var(--accent-light);color:var(--accent);padding:3px 8px;border-radius:6px}
.canvas-wrap{position:relative;overflow:auto;background:#111120;display:flex;justify-content:center;min-height:200px;align-items:center}
.canvas-wrap canvas{display:block;max-width:100%}
.page-ph{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;flex-direction:column;gap:10px;color:var(--text-secondary);font-size:12px}
.sp{width:28px;height:28px;border-radius:50%;border:3px solid var(--border);border-top-color:var(--accent);animation:studySpin .8s linear infinite}
@keyframes studySpin{to{transform:rotate(360deg)}}
.page-footer{padding:10px 12px;background:rgba(255,255,255,.02);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.exam-btn{background:linear-gradient(135deg,#10B981,#059669);color:#fff;border:none;border-radius:10px;padding:10px 18px;font-size:13px;font-weight:700;cursor:pointer;font-family:inherit}
.p-num-lbl{font-size:11px;color:var(--text-secondary)}

.multi-float{position:fixed;right:12px;top:50%;transform:translateY(-50%);z-index:200;display:none}
.multi-float-btn{
  background:linear-gradient(135deg,var(--accent),#3D35B0);color:#fff;border:none;border-radius:24px;
  padding:10px 14px;font-size:12px;font-weight:900;cursor:pointer;font-family:inherit;
  box-shadow:0 6px 24px rgba(108,99,255,.5);display:flex;align-items:center;gap:6px;white-space:nowrap;
}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);display:flex;align-items:flex-end;justify-content:center;z-index:300}
.type-sheet{background:var(--header-bg);border-radius:20px 20px 0 0;padding:20px 16px 32px;width:100%;max-width:480px}
.sheet-handle{width:36px;height:4px;background:var(--border);border-radius:2px;margin:0 auto 16px}
.sheet-title{font-size:15px;font-weight:700;text-align:center;margin-bottom:16px}
.type-btns{display:flex;flex-direction:column;gap:10px}
.type-btn{
  border-radius:12px;padding:14px 16px;border:1.5px solid var(--border);background:var(--card-bg);
  color:var(--text);font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-align:left;
  display:flex;align-items:center;gap:10px;
}
.type-icon{font-size:22px}
.type-info{flex:1}
.type-name{font-size:14px;font-weight:700}
.type-desc{font-size:11px;color:var(--text-secondary);margin-top:2px}
.perpage-btn{background:var(--card-bg);border:1.5px solid var(--border);border-radius:10px;padding:10px 16px;color:var(--text);font-family:inherit;font-size:13px;font-weight:700;cursor:pointer;min-width:56px;text-align:center}

.ctr{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:60px 20px;color:var(--text-secondary);text-align:center;font-size:13px}
.ctr .sp{margin:0 auto}

/* AI generation overlay */
.gen-overlay{position:fixed;inset:0;background:rgba(0,0,0,.85);z-index:400;display:none;align-items:center;justify-content:center;padding:20px}
.gen-overlay.show{display:flex}
.gen-box{background:var(--card-bg);border:1px solid var(--border);border-radius:16px;padding:28px 20px;text-align:center;max-width:280px}
.gen-spin{width:42px;height:42px;border-radius:50%;border:4px solid var(--border);border-top-color:var(--accent);animation:studySpin .8s linear infinite;margin:0 auto 14px}
.gen-text{font-size:13px;font-weight:700;color:var(--text)}
.gen-sub{font-size:11px;color:var(--text-secondary);margin-top:4px}

        /* ── Icon tiles (shared with home page) ── */
        .si-tile{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 6px rgba(0,0,0,.25)}
        .si-tile svg{width:16px;height:16px}
        .tile-indigo{background:linear-gradient(150deg,#7B7FFF 0%,#5A5FE0 45%,#322B96 100%)}
        .tile-amber{background:linear-gradient(150deg,#FFD166 0%,#F5A524 45%,#A8650A 100%)}
        .tile-violet{background:linear-gradient(150deg,#A78BFA 0%,#8B5CF6 45%,#4C1D95 100%)}
        .tile-rose{background:linear-gradient(150deg,#FB7AAE 0%,#F43F8E 45%,#9D174D 100%)}
        .tile-emerald{background:linear-gradient(150deg,#34D9A0 0%,#10B981 45%,#065F46 100%)}
        .tile-sky{background:linear-gradient(150deg,#7DD3FC 0%,#38BDF8 45%,#075985 100%)}
        .tile-orange{background:linear-gradient(150deg,#FDBA74 0%,#FB923C 45%,#9A3412 100%)}
        .tile-teal{background:linear-gradient(150deg,#5EEAD4 0%,#14B8A6 45%,#115E59 100%)}
        .tile-red{background:linear-gradient(150deg,#FCA5A5 0%,#F87171 45%,#991B1B 100%)}
        .tile-gold{background:linear-gradient(150deg,#FDE68A 0%,#FBBF24 45%,#92400E 100%)}
        .tile-plum{background:linear-gradient(150deg,#D8B4FE 0%,#A855F7 45%,#581C87 100%)}
        /* nav icon tile */
        .ni-tile{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;margin-bottom:2px;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 5px rgba(0,0,0,.2)}
        .ni-tile svg{width:14px;height:14px}

        </style>

async function safeFetch(url, opts = {}) {
    opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, opts.headers || {});
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE') opts.headers['Content-Type'] = 'application/json';
    // Don't clobber an explicitly-set Prefer header (e.g. 'resolution=merge-duplicates' for upserts) —
    // only default it when the caller didn't specify one.
    if ((opts.method === 'POST' || opts.method === 'PATCH') && !opts.headers['Prefer']) opts.headers['Prefer'] = 'return=representation';
    try {
        const res = await fetch(url, opts);
        const text = await res.text();
        if (!text?.trim()) return [];
        const data = JSON.parse(text);
        if (!res.ok) throw new Error(data.message || 'API Error');
        return data;
    } catch (e) { console.error('❌', e.message); return []; }
}

async function openChapter(id, name) {

    c.innerHTML = '<div class="ctr"><div class="sp"></div><div>লোড হচ্ছে...</div></div>';
    try {
        // Security note: file_url is deliberately excluded here for premium
        // PDFs so a free-tier user can't read it straight from this network

        // premium-access check passes.
        const pdfs = await safeFetch(`${SUPABASE_URL}/rest/v1/book_pdfs?chapter_id=eq.${id}&select=id,title,page_count,is_premium,sort_order&order=sort_order.asc`);

/* ── PDF Viewer ── */
async function openPdf(id, title, isPremium) {
    if (isPremium && !(currentUser?.is_premium)) {
        showToast('⭐ এটি Premium কন্টেন্ট — আপগ্রেড করো');
        return;
    }
    curPdfId = id; curPdfTitle = title; curPdfPremium = !!isPremium; selPages.clear();
    document.getElementById('view-title').textContent = title;
    go('s-view');
    updateMultiBtn();
    const wrap = document.getElementById('pages-wrap');
    wrap.innerHTML = '<div class="ctr"><div class="sp"></div><div>PDF লোড হচ্ছে...</div></div>';
    try {
        const rows = await safeFetch(`${SUPABASE_URL}/rest/v1/book_pdfs?id=eq.${id}&select=file_url`);
        let fileUrl = rows?.[0]?.file_url;
        if (!fileUrl) throw new Error('URL পাওয়া যায়নি');
        
        // Handle potential invalid structure or CORS issues by ensuring proper loading
        pdfDoc = await pdfjsLib.getDocument({
            url: fileUrl,
            cMapUrl: 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/cmaps/',
            cMapPacked: true,
            disableAutoFetch: true,
            disableStream: true
        }).promise;
        const n = pdfDoc.numPages;
        wrap.innerHTML = '';
        for (let i = 1; i <= n; i++) wrap.appendChild(makePage(i, n));
        setupObs();
    } catch (e) { wrap.innerHTML = `<div class="ctr" style="color:var(--error)">PDF লোড হয়নি: ${esc(e.message)}</div>`; }
}

function makePage(p, tot) {
    const d = document.createElement('div');
    d.className = 'page-card'; d.id = 'pc-'+p; d.dataset.page = p;
    d.innerHTML = `
        <div class="page-top-bar">
            <div class="cb-label" onclick="toggleSel(${p})">
                <div class="cb-box" id="cbv-${p}"></div>
                <span class="cb-txt">নির্বাচন</span>
            </div>
            <span class="p-badge">পেইজ ${p} / ${tot}</span>
        </div>
        <div class="canvas-wrap" id="cw-${p}">
            <div class="page-ph" id="ph-${p}"><div class="sp"></div><div>পেইজ ${p}...</div></div>
            <canvas id="cv-${p}" style="display:none"></canvas>
        </div>
        <div class="page-footer">
            <span class="p-num-lbl">পেইজ ${p}</span>
            <button class="exam-btn" onclick="openSheet(${p})">📝 এক্সাম দাও</button>
        </div>`;
    return d;
}

function setupObs() {
    const done = new Set();
    const obs = new IntersectionObserver(entries => {
        entries.forEach(e => {
            if (e.isIntersecting) {
                const p = parseInt(e.target.dataset.page);
                if (!done.has(p)) { done.add(p); renderPage(p); logPageView(p); }
            }
        });
    }, { rootMargin: '350px 0px' });
    document.querySelectorAll('.page-card').forEach(el => obs.observe(el));
}

async function logPageView(p) {
    if (!currentUser) return;
    try {
        await safeFetch(`${SUPABASE_URL}/rest/v1/book_page_views`, {
            method: 'POST',
            headers: { 'Prefer': 'resolution=ignore-duplicates,return=minimal' },
            body: JSON.stringify({ user_phone: currentUser.phone, pdf_id: curPdfId, page_number: p })
        });
    } catch (_) {}
}

async function renderPage(p) {
    if (!pdfDoc) return;
    const cv = document.getElementById('cv-'+p), ph = document.getElementById('ph-'+p);
    if (!cv) return;
    try {
        const page = await pdfDoc.getPage(p);
        const dpr = window.devicePixelRatio || 1;
        const vp = page.getViewport({ scale: scale * dpr });
        cv.width = vp.width; cv.height = vp.height;
        cv.style.width = (vp.width/dpr)+'px'; cv.style.height = (vp.height/dpr)+'px';
        await page.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise;
        if (ph) ph.style.display = 'none';
        cv.style.display = 'block';
    } catch (e) { if (ph) ph.innerHTML = '❌ লোড হয়নি'; }
}

function zoom(d) {
    scale = Math.max(.25, Math.min(3, scale+d));
    document.getElementById('zoom-lbl').textContent = Math.round(scale*100)+'%';
    document.querySelectorAll('.page-card').forEach(el => {
        const p = parseInt(el.dataset.page);
        const cv = document.getElementById('cv-'+p);
        if (cv && cv.style.display !== 'none') renderPage(p);
    });
}

function toggleSel(p) {
    const cbv = document.getElementById('cbv-'+p);
    if (selPages.has(p)) {
        selPages.delete(p);
        document.getElementById('pc-'+p)?.classList.remove('sel');
        if (cbv) { cbv.textContent=''; cbv.style.background=''; cbv.style.borderColor=''; }
    } else {
        selPages.add(p);
        document.getElementById('pc-'+p)?.classList.add('sel');
        if (cbv) { cbv.textContent='✓'; cbv.style.background='var(--accent)'; cbv.style.borderColor='var(--accent)'; cbv.style.color='#fff'; }
    }
    updateMultiBtn();
}

function updateMultiBtn() {
    const f = document.getElementById('multi-float');
    const cnt = selPages.size;
    document.getElementById('sel-cnt').textContent = cnt;
    f.style.display = cnt > 0 ? 'block' : 'none';
}

    } else {
        const sorted = [...selPages].sort((a,b)=>a-b);

            mainTitle.textContent = 'এক্সাম ধরন বেছে নাও';
            perpageBtns.innerHTML = sorted.map(p => `<button class="perpage-btn" onclick="pickSinglePage(${p})">পেইজ ${p}</button>`).join('');
        } else {
            perpageSection.style.display = 'none';
            mainTitle.textContent = 'MCQ ধরন বেছে নাও';
        }
    }
    document.getElementById('sheet').style.display = 'flex';

    document.getElementById('sheet-perpage').style.display = 'none';
    document.getElementById('sheet-main-title').textContent = 'পেইজ ' + p + ' — MCQ ধরন বেছে নাও';
}

function closeSheet(e) {

async function startExam(type) {
    document.getElementById('sheet').style.display = 'none';
    let pages;
    if (sheetSinglePage !== null) pages = [sheetSinglePage];
    else if (sheetTarget !== null) pages = [sheetTarget];
    else { pages = [...selPages].sort((a,b)=>a-b); if (!pages.length) { showToast('পেইজ নির্বাচন করো'); return; } }
    sheetSinglePage = null;

    if (!currentUser) { showToast('⚠️ লগইন করো'); goTo('auth.html'); return; }

    showGenOverlay(true);
    const pWrap = document.getElementById('genProgressWrap');
    const pLabel = document.getElementById('genProgressLabel');
    const pPct = document.getElementById('genProgressPct');
    const pFill = document.getElementById('genProgressFill');
    const genTextEl = document.getElementById('genText');
    if (pWrap) pWrap.style.display = pages.length > 1 ? 'block' : 'none';
    try {
        let allQuestions = [];
        for (let i = 0; i < pages.length; i++) {
            const pct = Math.round(((i) / pages.length) * 100);
            if (pLabel) pLabel.textContent = `পেইজ ${i+1}/${pages.length}`;
            if (pPct) pPct.textContent = pct + '%';
            if (pFill) pFill.style.width = pct + '%';
            const genSub = document.getElementById('genSub');
            if (genSub) genSub.textContent = `পেইজ ${pages[i]} প্রসেস হচ্ছে...`;
            const qs = await getOrGenerateMCQs(pages[i], type);
            const cached = qs._fromCache;
            if (genTextEl) genTextEl.textContent = cached ? 'সংরক্ষিত MCQ লোড হচ্ছে...' : 'AI দিয়ে MCQ তৈরি হচ্ছে...';
            allQuestions = allQuestions.concat(qs);
        }
        if (pLabel) pLabel.textContent = `পেইজ ${pages.length}/${pages.length}`;
        if (pPct) pPct.textContent = '100%';
        if (pFill) pFill.style.width = '100%';
        if (!allQuestions.length) { showToast('❌ প্রশ্ন তৈরি করা যায়নি। আবার চেষ্টা করো।'); showGenOverlay(false); return; }
        // Shuffle for random exam
        const shuffled = allQuestions.sort(() => Math.random() - 0.5);
        sessionStorage.setItem('practiceQuestions', JSON.stringify(shuffled));
        sessionStorage.setItem('practiceTitle', curPdfTitle + ' — পেইজ ' + pages.join(','));
        sessionStorage.setItem('practiceSource', 'study');
        sessionStorage.setItem('practiceTime', Math.ceil(shuffled.length/1.5));
        sessionStorage.setItem('practicePages', curPdfTitle + ' — পেইজ ' + pages.join(', '));
        // Collect page preview images (max 3 pages) for pre-exam display
        const previewImgs = [];
        for (const pg of pages.slice(0, 3)) {
            try {
                const imgData = await getPageImageBase64(pg);
                if (imgData?.base64) previewImgs.push({ page: pg, src: 'data:' + imgData.mimeType + ';base64,' + imgData.base64 });
            } catch (_) {}
        }
        if (previewImgs.length) sessionStorage.setItem('practicePageImages', JSON.stringify(previewImgs));
        else sessionStorage.removeItem('practicePageImages');
        showGenOverlay(false);
        goTo('exam.html?practice=mock');
    } catch (e) {
        showGenOverlay(false);
        showToast('❌ সমস্যা হয়েছে: ' + (e.message||'আবার চেষ্টা করো'));
    }
}

function showGenOverlay(show) { document.getElementById('genOverlay').classList.toggle('show', show); }

/* ── MCQ generation: cache-first, then Gemini → Groq fallback ── */
async function getOrGenerateMCQs(pageNum, type) {
    // 1️⃣ Admin-saved MCQ check first (mcq_type='admin')
    try {
        const adminCached = await safeFetch(`${SUPABASE_URL}/rest/v1/book_page_mcqs?pdf_id=eq.${curPdfId}&page_number=eq.${pageNum}&mcq_type=eq.admin&select=questions_json`);
        if (adminCached?.length) {
            const qs = (JSON.parse(adminCached[0].questions_json) || []).filter(q => q.is_active !== false);
            if (qs?.length) { const r = tagQuestions(qs, pageNum); r._fromCache = true; return r; }
        }
    } catch (_) {}

    // 2️⃣ Type-specific AI-generated cache check
    try {
        const cached = await safeFetch(`${SUPABASE_URL}/rest/v1/book_page_mcqs?pdf_id=eq.${curPdfId}&page_number=eq.${pageNum}&mcq_type=eq.${type}&select=questions_json`);
        if (cached?.length) {
            const qs = (JSON.parse(cached[0].questions_json) || []).filter(q => q.is_active !== false);
            if (qs?.length) { const r = tagQuestions(qs, pageNum); r._fromCache = true; return r; }
        }
    } catch (_) {}

    const imageData = await getPageImageBase64(pageNum);
    if (!imageData) throw new Error('পেইজের ছবি তৈরি করা যায়নি');

    const questions = await generateMCQsFromImage(imageData, type);
    if (!questions?.length) throw new Error('AI থেকে প্রশ্ন পাওয়া যায়নি');

    try {
        await safeFetch(`${SUPABASE_URL}/rest/v1/book_page_mcqs`, {
            method: 'POST',
            headers: { 'Prefer': 'resolution=merge-duplicates,return=minimal' },
            body: JSON.stringify({ pdf_id: curPdfId, page_number: pageNum, mcq_type: type, questions_json: JSON.stringify(questions) })
        });
    } catch (_) {}

    return tagQuestions(questions, pageNum);
}

function tagQuestions(qs, pageNum) {
    return qs.map((q,i) => {
        // Support all MCQ storage formats:
        // 1) AI format:     options:[], answer_index (0-based)
        // 2) Manual format: option_k/kh/g/gh, correct (1-based)
        // 3) CSV format:    option1/2/3/4, answer/correct (1-based)

        let o1='', o2='', o3='', o4='', o5=null;
        if (Array.isArray(q.options) && q.options.length) {
            o1=q.options[0]||''; o2=q.options[1]||'';
            o3=q.options[2]||''; o4=q.options[3]||'';
            o5=q.options[4]||null;
        } else if (q.option_k !== undefined) {
            // Manual admin format
            o1=q.option_k||''; o2=q.option_kh||'';
            o3=q.option_g||'';  o4=q.option_gh||'';
        } else {
            // CSV / flat format
            o1=q.option1||q.optionA||''; o2=q.option2||q.optionB||'';
            o3=q.option3||q.optionC||''; o4=q.option4||q.optionD||'';
            o5=q.option5||null;
        }

        // Normalise answer to 1-based integer
        let ans = 1;
        if (Array.isArray(q.options) && q.answer_index != null && q.answer_index !== '') {
            // AI format stores 0-based answer_index
            ans = parseInt(q.answer_index) + 1;
        } else if (q.correct != null && q.correct !== '') {
            // Manual & CSV store 1-based correct
            ans = parseInt(q.correct) || 1;
        } else if (q.answer != null && q.answer !== '') {
            ans = parseInt(q.answer) || 1;
        } else if (q.answer_index != null && q.answer_index !== '') {
            ans = parseInt(q.answer_index) || 1;
        }

        return {
            id: `p${pageNum}_${i}_${Date.now()}`,
            question_text: q.question_text || q.question || q.questions || '',
            option1: o1, option2: o2, option3: o3, option4: o4, option5: o5,
            answer_index: ans,
            explanation: q.explanation || '',
            image_url: q.image_url || null
        };
    });
}

async function getPageImageBase64(p) {
    const cv = document.getElementById('cv-'+p);
    if (cv && cv.style.display !== 'none' && cv.width) {
        return { base64: cv.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg' };
    }
    // Render at a safe scale if not already on-screen
    try {
        const page = await pdfDoc.getPage(p);
        const vp = page.getViewport({ scale: 1.5 });
        const tmp = document.createElement('canvas');
        tmp.width = vp.width; tmp.height = vp.height;
        await page.render({ canvasContext: tmp.getContext('2d'), viewport: vp }).promise;
        return { base64: tmp.toDataURL('image/jpeg', 0.85).split(',')[1], mimeType: 'image/jpeg' };
    } catch (e) { return null; }
}

/* ── AI fallback chain is now handled entirely by the atlas-ai-proxy worker — see generateMCQsFromImage() below ── */

function mcqPrompt(type) {
    const typeInstructions = {

        true_false: '৩-৫টি সত্য/মিথ্যা ধরনের প্রশ্ন তৈরি করো (অপশন: "সত্য", "মিথ্যা" — ২টি অপশন)।',

{"questions":[{"question":"...","options":["...","...","...","..."],"answer_index":0,"explanation":"..."}]}`;
}

// All AI MCQ generation now goes through the centralized proxy worker, which
// keeps every provider key (Gemini, OpenRouter, Groq, Cerebras, Cloudflare AI)
// as a server-side secret and runs its own fallback chain internally — this
// file no longer needs to know which provider actually answered.
async function generateMCQsFromImage(imageData, type) {
    try {
        const res = await fetch(AI_PROXY_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                question: '',
                image: { base64: imageData.base64, mimeType: imageData.mimeType },
                systemPrompt: mcqPrompt(type)
            })
        });
        if (!res.ok) return [];
        const data = await res.json();
        if (!data.success || !data.answer) return [];
        return parseQuestionsJSON(data.answer);
    } catch (e) {
        return [];
    }
}

// Quality filtering — mirrors parseMcqJson() from AtlasPro's workers/utils.js:
// rejects empty/placeholder/sample questions and anything with fewer than
// 2 filled options, so a flaky AI response can't slip a garbage MCQ into the exam.
function parseQuestionsJSON(raw) {
    try {
        let clean = raw.trim().replace(/^```json\s*/i,'').replace(/^```\s*/,'').replace(/```\s*$/,'');
        const parsed = JSON.parse(clean);
        const list = parsed.questions || [];
        return list.filter(q => {
            if (!q || typeof q !== 'object') return false;
            const qText = (q.question || '').trim();
            if (!qText || qText.length < 5) return false;
            if (/^(MCQ|প্রশ্ন)\s*\d+/i.test(qText) && qText.length < 30) return false;
            if (/প্রশ্নটি যোগ করুন|add.*question|your question here|sample question/i.test(qText)) return false;
            const opts = (q.options || []).map(o => (o || '').trim());
            const filledOpts = opts.filter(o => o.length > 0);
            if (filledOpts.length < 2) return false;
            return true;
        });
    } catch (e) { return []; }
}

    loadSubjects();
