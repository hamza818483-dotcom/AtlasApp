<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Exam Result - ATLAS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <style>
        .result-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 20px; margin: 20px 0; }
        .score-box { background: var(--card-bg); padding: 20px; border-radius: 12px; text-align: center; box-shadow: var(--shadow); border-top: 5px solid #3B82F6;}
        .score-box.gpa-box { border-top-color: #22C55E; }
        .score-box h1 { font-size: 2.5rem; margin: 10px 0; }
        
        .stat-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-bottom: 20px; text-align: center;}
        .stat-box { padding: 15px; border-radius: 8px; background: var(--option-bg); font-weight: bold;}
        .stat-box.correct { color: #22C55E; }
        .stat-box.wrong { color: #EF4444; }

        .solve-sheet { margin-top: 30px; }
        .solve-box { background: var(--card-bg); padding: 15px; border-radius: 8px; margin-bottom: 15px; border-left: 5px solid var(--option-border); }
        .solve-box.is-correct { border-left-color: #22C55E; }
        .solve-box.is-wrong { border-left-color: #EF4444; }
        .ans-explanation { margin-top: 10px; padding: 10px; background: var(--bg-color); border-radius: 6px; font-size: 0.9em; }
    </style>
</head>
<body>
    <div class="container" id="pdf-content">
        <h2 style="text-align: center; color: #3B82F6;">ATLAS Result Card</h2>
        
        <div class="stat-grid">
            <div class="stat-box">মোট প্রশ্ন<br><span id="r-total">0</span></div>
            <div class="stat-box correct">সঠিক<br><span id="r-correct">0</span></div>
            <div class="stat-box wrong">ভুল<br><span id="r-wrong">0</span></div>
            <div class="stat-box">স্কিপ<br><span id="r-skip">0</span></div>
        </div>

        <div class="result-grid">
            <div class="score-box">
                <h3>Without GPA</h3>
                <p>Main Mark (After Negative/Deduction)</p>
                <h1 id="score-main">0.00</h1>
            </div>
            <div class="score-box gpa-box">
                <h3>With GPA</h3>
                <p>Total + GPA (100)</p>
                <h1 id="score-gpa">0.00</h1>
            </div>
        </div>

        <button class="btn-primary" style="width: 100%; margin-bottom: 20px;" onclick="downloadPDF()">📥 Download Solve Sheet PDF</button>

        <div class="solve-sheet" id="solve-container">
            <h3>Solve Sheet</h3>
            <!-- Solves will load here -->
        </div>
    </div>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script src="result.js"></script>
</body>
</html>
