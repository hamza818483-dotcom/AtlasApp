<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <title>My Mistakes - ATLAS</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <style>
        .mistake-card { background: var(--card-bg); padding: 15px; border-radius: 12px; margin-bottom: 15px; box-shadow: var(--shadow); border-left: 5px solid #EF4444;}
        .mistake-actions { display: flex; gap: 10px; margin-top: 15px; flex-wrap: wrap;}
        .btn-sm { padding: 8px 12px; border: none; border-radius: 6px; cursor: pointer; font-weight: bold; font-size: 0.9rem; color: white;}
        .btn-view { background: #3B82F6; }
        .btn-p1 { background: #F59E0B; }
        .btn-p2 { background: #8B5CF6; }
    </style>
</head>
<body>
    <div class="container">
        <h2 style="text-align: center; color: #EF4444;">📍 My Mistakes Review</h2>
        <p style="text-align: center; margin-bottom: 20px;">আপনার দেওয়া পরীক্ষার ভুলগুলো পুনরায় প্র্যাকটিস করুন।</p>
        
        <div id="mistakes-container">লোডিং...</div>
    </div>

    <script src="supabase.js"></script>
    <script src="app.js"></script>
    <script src="mistakes.js"></script> <!-- আগের দেওয়া mistakes.js ফাইলটি এখানে লিঙ্ক করা হলো -->
    <script>
        // Mistakes page specific load logic
        async function loadMistakesExams() {
            const user = JSON.parse(localStorage.getItem('atlas_user'));
            if(!user) return window.location.href = "auth.html";

            const { data } = await _supabase.from('exam_results').select('*, exams(title, subject, chapter)').eq('user_id', user.id);
            const container = document.getElementById('mistakes-container');
            container.innerHTML = '';

            if(!data || data.length === 0) return container.innerHTML = "<p>কোনো ডেটা পাওয়া যায়নি!</p>";

            data.forEach(item => {
                if(item.wrong_count > 0 || item.skipped_count > 0) {
                    container.innerHTML += `
                        <div class="mistake-card">
                            <h3>${item.exams.title}</h3>
                            <p>${item.exams.subject} - ${item.exams.chapter}</p>
                            <p><strong>ভুল: ${item.wrong_count} | স্কিপ: ${item.skipped_count}</strong></p>
                            <div class="mistake-actions">
                                <button class="btn-sm btn-view" onclick="window.location.href='result.html?result_id=${item.id}'">বিস্তারিত দেখুন</button>
                                <button class="btn-sm btn-p1" onclick="startPractice('P1', '${item.exams.id}')">Practice-01 (Only Wrong)</button>
                                <button class="btn-sm btn-p2" onclick="startPractice('P2', '${item.exams.id}')">Practice-02 (Wrong+Skip)</button>
                            </div>
                        </div>
                    `;
                }
            });
        }
        loadMistakesExams();
    </script>
</body>
</html>
