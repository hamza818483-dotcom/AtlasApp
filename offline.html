<!DOCTYPE html>
<html lang="bn">
<head>
    <script src="page-transition.js"></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS - অফলাইন</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
            background: #0D1117;
            color: #E6EDF3;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 20px;
            -webkit-font-smoothing: antialiased;
        }
        .offline-card {
            text-align: center;
            background: #161B22;
            border: 1px solid #30363D;
            border-radius: 16px;
            padding: 40px 28px;
            max-width: 380px;
            width: 100%;
        }
        .offline-icon {
            font-size: 64px;
            margin-bottom: 16px;
            display: block;
            animation: float 2s ease-in-out infinite;
        }
        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-8px); }
        }
        .offline-title {
            font-size: 22px;
            font-weight: 800;
            color: #7C83FF;
            margin-bottom: 8px;
        }
        .offline-sub {
            font-size: 13px;
            color: #8B949E;
            line-height: 1.6;
            margin-bottom: 24px;
        }
        .offline-btn {
            display: block;
            width: 100%;
            padding: 12px 20px;
            background: #7C83FF;
            color: #fff;
            border: none;
            border-radius: 10px;
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
            font-family: inherit;
            transition: background 0.2s;
            margin-bottom: 8px;
        }
        .offline-btn:hover { background: #9499FF; }
        .offline-btn:active { transform: scale(0.98); }
        .offline-btn.outline {
            background: transparent;
            border: 1px solid #30363D;
            color: #8B949E;
        }
        .offline-btn.outline:hover {
            border-color: #7C83FF;
            color: #7C83FF;
        }
        .offline-footer {
            margin-top: 16px;
            font-size: 10px;
            color: #5D6570;
        }
    </style>
</head>
<body>
    <div class="offline-card">
        <span class="offline-icon"><svg class='emoji-icon' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='#64748B' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;vertical-align:-0.125em'><path d='M12 20h.01' /> <path d='M2 8.82a15 15 0 0 1 20 0' /> <path d='M5 12.859a10 10 0 0 1 14 0' /> <path d='M8.5 16.429a5 5 0 0 1 7 0' /></svg></span>
        <div class="offline-title">আপনি অফলাইনে আছেন</div>
        <div class="offline-sub">
            ইন্টারনেট সংযোগ নেই। তবে আপনি আগে দেখা কিছু পেজ অফলাইনেও দেখতে পারবেন।
        </div>
        <button class="offline-btn" onclick="location.reload()">
            <svg class='emoji-icon' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='#3B82F6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;vertical-align:-0.125em'><path d='M3 12a9 9 0 0 1 9-9 9.75 9.75 0 0 1 6.74 2.74L21 8' /> <path d='M21 3v5h-5' /> <path d='M21 12a9 9 0 0 1-9 9 9.75 9.75 0 0 1-6.74-2.74L3 16' /> <path d='M8 16H3v5' /></svg> আবার চেষ্টা করুন
        </button>
        <button class="offline-btn outline" onclick="goToHome()">
            <svg class='emoji-icon' viewBox='0 0 24 24' width='1em' height='1em' fill='none' stroke='#3B82F6' stroke-width='2' stroke-linecap='round' stroke-linejoin='round' style='display:inline;vertical-align:-0.125em'><path d='M15 21v-8a1 1 0 0 0-1-1h-4a1 1 0 0 0-1 1v8' /> <path d='M3 10a2 2 0 0 1 .709-1.528l7-6a2 2 0 0 1 2.582 0l7 6A2 2 0 0 1 21 10v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z' /></svg> হোম পেজে যান
        </button>
        <div class="offline-footer">ATLAS APP · v1.0</div>
    </div>

    <script>
        function goToHome() {
            location.href = '/index.html';
        }
        // Auto-refresh when online
        window.addEventListener('online', () => {
            location.reload();
        });
    </script>
</body>
</html>
