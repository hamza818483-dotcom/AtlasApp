<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS EXAM - ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash-container { max-width: 700px; margin: 0 auto; padding: 16px 16px 80px; }
        
        .profile-header { background: var(--atlas-bg); border: 2px solid var(--atlas-border); border-radius: 14px; padding: 20px; margin-bottom: 16px; text-align: center; box-shadow: 0 0 14px var(--atlas-glow); position: relative; }
        .profile-avatar-wrap { position: relative; width: 80px; height: 80px; margin: 0 auto 10px; cursor: pointer; }
        .profile-avatar { width: 80px; height: 80px; border-radius: 50%; border: 3px solid var(--atlas-border); object-fit: cover; background: var(--option-bg); display: flex; align-items: center; justify-content: center; font-size: 36px; color: var(--atlas-text); }
        .profile-avatar-upload { position: absolute; bottom: 0; right: 0; width: 28px; height: 28px; border-radius: 50%; background: var(--atlas-border); color: #FFF; font-size: 14px; display: flex; align-items: center; justify-content: center; cursor: pointer; border: 2px solid var(--card-bg); }
        .profile-avatar input { display: none; }
        .profile-name { font-size: 20px; font-weight: 800; color: var(--atlas-text); }
        .profile-meta { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        
        .dash-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 16px; }
        .dash-box { background: var(--card-bg); border: 1px solid var(--option-border); border-radius: 14px; padding: 20px; text-align: center; cursor: pointer; transition: all 0.3s; }
        .dash-box:hover { border-color: var(--atlas-border); box-shadow: 0 0 14px var(--atlas-glow); transform: translateY(-2px); }
        .dash-box-icon { font-size: 36px; display: block; margin-bottom: 8px; }
        .dash-box-title { font-size: 14px; font-weight: 700; color: var(--text-primary); }
        .dash-box-count { font-size: 11px; color: var(--text-secondary); margin-top: 4px; }
        
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
        
        .back-btn { background: none; border: 1px solid var(--option-border); color: var(--text-secondary); padding: 8px 16px; border-radius: 8px; cursor: pointer; font-size: 13px; margin-bottom: 12px; }
        .section-header { background: var(--atlas-bg); border: 2px solid var(--atlas-border); border-radius: 14px; padding: 14px; margin-bottom: 14px; text-align: center; box-shadow: 0 0 10px var(--atlas-glow); }
        .section-title { color: var(--atlas-text); font-size: 16px; font-weight: 700; }
        
        .card { background: var(--card-bg); border: 1px solid var(--option-border); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .card-row { display: flex; justify-content: space-between; padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
        .card-row:last-child { border-bottom: none; }
        
        .btn-sm { padding: 8px 16px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; }
        .btn-outline { background: transparent; border: 1px solid var(--atlas-border); color: var(--atlas-text); }
        .btn-outline:hover { background: var(--atlas-hover-bg); }
        .btn-danger-sm { background: #EF4444; color: #FFF; }
        .btn-success-sm { background: #22C55E; color: #FFF; }
        
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 3px; }
        .input-group input { width: 100%; padding: 10px 12px; border: 2px solid var(--option-border); border-radius: 8px; font-size: 14px; background: var(--body-bg); color: var(--text-primary); font-family: 'Noto Sans Bengali','Inter',sans-serif; }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        
        .notification-dot { width: 8px; height: 8px; border-radius: 50%; background: #EF4444; display: inline-block; margin-right: 6px; }
        .notification-read { opacity: 0.6; }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card-bg); border-radius: 14px; padding: 20px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; border: 1px solid var(--option-border); }
        .modal-title { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; text-align: center; }
    </style>
</head>
<body class="dark-mode">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">ATLAS EXAM</div></div>
    <nav class="sidebar-menu">

<header class="header">

<main class="main-content"><div class="dash-container">

<!-- প্রোফাইল -->
<div class="profile-header">
    <div class="profile-avatar-wrap" onclick="document.getElementById('avatarInput').click()">
        <img class="profile-avatar" id="profileAvatar" src="" onerror="this.style.display='none';this.nextElementSibling.style.display='flex';" alt="Photo">
        <div class="profile-avatar" id="profileAvatarFallback" style="display:flex;">👤</div>
        <div class="profile-avatar-upload">📷</div>
        <input type="file" id="avatarInput" accept="image/*" onchange="uploadAvatar(this)">
    </div>
    <div class="profile-name" id="profileName">লোড হচ্ছে...</div>
    <div class="profile-meta" id="profileMeta"></div>
</div>

<!-- ৪টা বক্স -->
<div class="dash-grid" id="mainGrid">
    <div class="dash-box" onclick="showTab('history')">
        <span class="dash-box-icon">📚</span>
        <div class="dash-box-title">Exam History</div>
        <div class="dash-box-count" id="countExams">০ এক্সাম</div>
    </div>
    <div class="dash-box" onclick="showTab('classhistory')">
        <span class="dash-box-icon">🎥</span>
        <div class="dash-box-title">Class History</div>
        <div class="dash-box-count" id="countClasses">০ ক্লাস</div>
    </div>
    <div class="dash-box" onclick="showTab('bookmarks')">
        <span class="dash-box-icon">🔖</span>
        <div class="dash-box-title">Bookmarks</div>
        <div class="dash-box-count" id="countBookmarks">০ বুকমার্ক</div>
    </div>
    <div class="dash-box" onclick="showTab('notifications')">
        <span class="dash-box-icon">🔔</span>
        <div class="dash-box-title">Notifications</div>
        <div class="dash-box-count" id="countNotifs">০ নতুন</div>
    </div>
</div>

<!-- ট্যাব কন্টেন্ট -->
<div id="tabContent">
    <div class="tab-content active" id="tabMain"></div>
    <div class="tab-content" id="tabHistoryContent"><button class="back-btn" onclick="showTab('main')">← ফিরে যান</button><div class="section-header"><div class="section-title">📚 Exam History</div></div><div id="historyList"></div></div>
    <div class="tab-content" id="tabClassHistoryContent"><button class="back-btn" onclick="showTab('main')">← ফিরে যান</button><div class="section-header"><div class="section-title">🎥 Class History</div></div><div id="classHistoryList"></div></div>
    <div class="tab-content" id="tabBookmarksContent"><button class="back-btn" onclick="showTab('main')">← ফিরে যান</button><div class="section-header"><div class="section-title">🔖 Bookmarks</div></div><div id="bookmarksList"></div></div>
    <div class="tab-content" id="tabNotificationsContent"><button class="back-btn" onclick="showTab('main')">← ফিরে যান</button><div class="section-header"><div class="section-title">🔔 Notifications</div></div><div id="notifList"></div></div>
    <div class="tab-content" id="tabProfileContent"><button class="back-btn" onclick="showTab('main')">← ফিরে যান</button><div class="section-header"><div class="section-title">👤 প্রোফাইল এডিট</div></div><div class="card"><div class="input-group"><label>নাম</label><input type="text" id="editName"></div><div class="input-group"><label>HSC Batch</label><input type="text" id="editBatch"></div><div class="input-group"><label>কলেজ</label><input type="text" id="editCollege"></div><div class="input-group"><label>পিতার নাম</label><input type="text" id="editFather"></div><div class="input-group"><label>মাতার নাম</label><input type="text" id="editMother"></div><div class="input-group"><label>পাসওয়ার্ড</label><input type="password" id="editPass" placeholder="নতুন পাসওয়ার্ড"></div><button class="btn-sm btn-outline" onclick="updateProfile()" style="width:100%;padding:12px;">💾 আপডেট</button></div></div>
</div>

</div></main>

<div class="modal-overlay" id="detailModal"><div class="modal" id="detailModalContent"></div></div>

    <button class="nav-item" onclick="goTo('index.html')"><span class="nav-icon">🏠</span><span>হোম</span></button>

    <button class="nav-item" onclick="goTo('exam.html')"><span class="nav-icon">📝</span><span>এক্সাম</span></button>
    <button class="nav-item" onclick="goTo('exam.html?mock=true')"><span class="nav-icon">🎯</span><span>মক</span></button>

</nav>

</div>

<script>
var SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
var isDarkMode = true, isSidebarOpen = false, currentUser = null;

async function safeFetch(url, opts) {
    opts = opts || {}; opts.headers = opts.headers || {}; opts.headers['apikey'] = SUPABASE_KEY; opts.headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE') opts.headers['Content-Type'] = 'application/json';
    try { var res = await fetch(url, opts); var text = await res.text(); if (!text || text.trim() === '') return []; var data = JSON.parse(text); if (!res.ok) throw new Error(data.message); return data; }
    catch(e) { console.error(e); return []; }
}

function checkAuth() { var sess = localStorage.getItem('atlas-session'); if (!sess) { goTo('auth.html'); return false; } try { currentUser = JSON.parse(sess); return true; } catch(e) { goTo('auth.html'); return false; } }

function loadTheme() { var s = localStorage.getItem('atlas-theme'); isDarkMode = s !== 'light'; document.body.classList.toggle('dark-mode', isDarkMode); updateThemeIcon(); }
function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode', isDarkMode); localStorage.setItem('atlas-theme', isDarkMode ? 'dark' : 'light'); updateThemeIcon(); showToast(isDarkMode ? '🌙 ডার্ক' : '☀️ লাইট'); }
function updateThemeIcon() { var b = document.getElementById('themeToggle'), si = document.getElementById('sidebarThemeIcon'), st = document.getElementById('sidebarThemeText'); if (b) b.textContent = isDarkMode ? '🌙' : '☀️'; if (si) si.textContent = isDarkMode ? '🌙' : '☀️'; if (st) st.textContent = isDarkMode ? 'ডার্ক মোড' : 'লাইট মোড'; }
function toggleSidebar() { isSidebarOpen = !isSidebarOpen; document.getElementById('sidebarOverlay').classList.toggle('active', isSidebarOpen); document.getElementById('sidebar').classList.toggle('active', isSidebarOpen); }
function closeSidebar() { isSidebarOpen = false; document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('sidebar').classList.remove('active'); }
function goTo(u) { window.location.href = u; }
function navigateTo(p) { var r = { 'home':'index.html', 'profile':'dashboard.html', 'class':'class.html', 'exam':'exam.html' }; goTo(r[p] || 'index.html'); }
function openWhatsApp() { window.open('https://wa.me/8801999681290', '_blank'); }
function openTelegram() { window.open('https://t.me/rafi_somc', '_blank'); }
function logout() { localStorage.removeItem('atlas-session'); goTo('index.html'); }
function showToast(m, d) { d = d || 2500; var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, d); }

// ========== ছবি আপলোড ==========
function uploadAvatar(input) {
    var file = input.files[0]; if (!file) return;
    var reader = new FileReader();
    reader.onload = function(e) {
        var img = document.getElementById('profileAvatar'); img.src = e.target.result; img.style.display = 'block';
        document.getElementById('profileAvatarFallback').style.display = 'none';
        localStorage.setItem('avatar_' + currentUser.phone, e.target.result);
        showToast('✅ ছবি আপলোড হয়েছে');
    };
    reader.readAsDataURL(file);
}

// ========== প্রোফাইল ==========
function loadProfile() {
    if (!currentUser) return;
    document.getElementById('profileName').textContent = currentUser.name || 'স্টুডেন্ট';
    document.getElementById('profileMeta').textContent = 'ব্যাচ: ' + (currentUser.batch||'—') + ' | SSC: ' + (currentUser.ssc_gpa||'—') + ' | HSC: ' + (currentUser.hsc_gpa||'—') + ' | ' + (currentUser.timer_type==='first'?'ফার্স্ট টাইমার':'সেকেন্ড টাইমার');
    var savedAvatar = localStorage.getItem('avatar_' + currentUser.phone);
    if (savedAvatar) { document.getElementById('profileAvatar').src = savedAvatar; document.getElementById('profileAvatar').style.display = 'block'; document.getElementById('profileAvatarFallback').style.display = 'none'; }
    document.getElementById('editName').value = currentUser.name || '';
    document.getElementById('editBatch').value = currentUser.batch || '';
    document.getElementById('editCollege').value = currentUser.college || '';
    document.getElementById('editFather').value = currentUser.father_name || '';
    document.getElementById('editMother').value = currentUser.mother_name || '';
}

async function updateProfile() {
    var data = { name: document.getElementById('editName').value.trim(), batch: document.getElementById('editBatch').value.trim(), college: document.getElementById('editCollege').value.trim(), father_name: document.getElementById('editFather').value.trim(), mother_name: document.getElementById('editMother').value.trim() };
    var pass = document.getElementById('editPass').value.trim(); if (pass.length >= 6) data.password_hash = pass;
    try { await safeFetch(SUPABASE_URL + '/rest/v1/users?phone=eq.' + currentUser.phone, 'PATCH', data); Object.assign(currentUser, data); localStorage.setItem('atlas-session', JSON.stringify(currentUser)); loadProfile(); showToast('✅ প্রোফাইল আপডেট হয়েছে'); showTab('main'); }
    catch(e) { alert('আপডেট এরর: ' + e.message); }
}

// ========== ট্যাব ==========
function showTab(tab) {
    document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
    if (tab === 'main') { document.getElementById('tabMain').classList.add('active'); return; }
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1) + 'Content').classList.add('active');
    if (tab === 'history') loadHistory();
    else if (tab === 'classhistory') loadClassHistory();
    else if (tab === 'bookmarks') loadBookmarks();
    else if (tab === 'notifications') loadNotifications();
    else if (tab === 'profile') {}
}

// ========== হিস্টোরি ==========
async function loadHistory() {
    try { var results = await safeFetch(SUPABASE_URL + '/rest/v1/exam_results?phone=eq.' + currentUser.phone + '&select=*&order=submitted_at.desc&limit=30'); if (!results || results.length === 0) { document.getElementById('historyList').innerHTML = '<div class="empty-state"><span class="icon">📝</span>কোনো এক্সাম নেই</div>'; return; } document.getElementById('countExams').textContent = results.length + ' এক্সাম'; var html = ''; results.forEach(function(r){ html += '<div class="card"><div class="card-title">📝 এক্সাম #' + r.exam_id + '</div><div class="card-row"><span>স্কোর</span><span style="font-weight:700;color:var(--atlas-text);">'+(r.final_score||0)+'</span></div><div class="card-row"><span>তারিখ</span><span>'+new Date(r.submitted_at).toLocaleDateString('bn-BD')+'</span></div><button class="btn-sm btn-outline" onclick="viewDetails('+r.exam_id+')">📋 বিস্তারিত</button></div>'; }); document.getElementById('historyList').innerHTML = html; }
    catch(e) { document.getElementById('historyList').innerHTML = '<div class="empty-state">লোড ব্যর্থ</div>'; }
}

// ========== ক্লাস হিস্টোরি ==========
function loadClassHistory() {
    var saved = localStorage.getItem('class_history_' + currentUser.phone); var history = saved ? JSON.parse(saved) : [];
    document.getElementById('countClasses').textContent = history.length + ' ক্লাস';
    if (history.length === 0) { document.getElementById('classHistoryList').innerHTML = '<div class="empty-state"><span class="icon">🎥</span>কোনো ক্লাস হিস্টোরি নেই</div>'; return; }
    var html = ''; history.reverse().forEach(function(h){ html += '<div class="card"><div class="card-title">📘 '+h.subject+'</div><div class="card-row"><span>চ্যাপ্টার</span><span>'+h.chapter+'</span></div><div class="card-row"><span>পার্ট</span><span>'+h.part+'</span></div><div class="card-row"><span>সময়</span><span>'+new Date(h.time).toLocaleString('bn-BD')+'</span></div></div>'; }); document.getElementById('classHistoryList').innerHTML = html;
}

// ========== বুকমার্ক ==========
function loadBookmarks() {
    var saved = localStorage.getItem('bookmarks_' + currentUser.phone); var bookmarks = saved ? JSON.parse(saved) : {}; var count = Object.keys(bookmarks).length;
    document.getElementById('countBookmarks').textContent = count + ' বুকমার্ক';
    if (count === 0) { document.getElementById('bookmarksList').innerHTML = '<div class="empty-state"><span class="icon">🔖</span>কোনো বুকমার্ক নেই</div>'; return; }
    var html = ''; Object.keys(bookmarks).forEach(function(qid){ html += '<div class="card"><div class="card-title">📝 প্রশ্ন #'+qid+'</div><button class="btn-sm btn-danger-sm" onclick="removeBookmark('+qid+')">🗑️ রিমুভ</button></div>'; }); document.getElementById('bookmarksList').innerHTML = html;
}
function removeBookmark(qid) { var saved = localStorage.getItem('bookmarks_' + currentUser.phone); var bookmarks = saved ? JSON.parse(saved) : {}; delete bookmarks[qid]; localStorage.setItem('bookmarks_' + currentUser.phone, JSON.stringify(bookmarks)); loadBookmarks(); showToast('🔖 রিমুভ হয়েছে'); }

// ========== নোটিফিকেশন ==========
async function loadNotifications() {
    try { var notifs = await safeFetch(SUPABASE_URL + '/rest/v1/notifications?user_phone=eq.' + currentUser.phone + '&select=*&order=created_at.desc&limit=20'); var unread = notifs ? notifs.filter(function(n){ return !n.is_read; }).length : 0; document.getElementById('countNotifs').textContent = unread + ' নতুন'; if (!notifs || notifs.length === 0) { document.getElementById('notifList').innerHTML = '<div class="empty-state"><span class="icon">🔔</span>কোনো নোটিফিকেশন নেই</div>'; return; } var html = ''; notifs.forEach(function(n){ html += '<div class="card'+(n.is_read?' notification-read':'')+'" onclick="markNotifRead(\''+n.id+'\')">'+(n.is_read?'':'<span class="notification-dot"></span>')+'<div class="card-title">'+(n.title||'নোটিফিকেশন')+'</div><div style="font-size:12px;color:var(--text-secondary);">'+(n.message||'')+'</div><div style="font-size:10px;margin-top:4px;">'+new Date(n.created_at).toLocaleDateString('bn-BD')+'</div></div>'; }); document.getElementById('notifList').innerHTML = html; }
    catch(e) {}
}
async function markNotifRead(id) { try { await safeFetch(SUPABASE_URL + '/rest/v1/notifications?id=eq.' + id, 'PATCH', { is_read: true }); loadNotifications(); } catch(e) {} }

function viewDetails(examId) {
    var html = '<div class="modal-title">📋 এক্সাম #'+examId+'</div><p style="text-align:center;color:var(--text-secondary);">বিস্তারিত শীঘ্রই আসছে</p><button class="btn-sm btn-outline" onclick="document.getElementById(\'detailModal\').classList.remove(\'active\')" style="width:100%;margin-top:12px;">✕ বন্ধ</button>';
    document.getElementById('detailModalContent').innerHTML = html; document.getElementById('detailModal').classList.add('active');
}

document.addEventListener('DOMContentLoaded', function() {
    loadTheme(); if (!checkAuth()) return; loadProfile(); loadHistory(); loadClassHistory(); loadBookmarks(); loadNotifications();
    document.getElementById('detailModal').addEventListener('click', function(e){ if (e.target === this) this.classList.remove('active'); });
});
</script>
</body>
