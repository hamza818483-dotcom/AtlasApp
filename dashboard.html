<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS EXAM - ড্যাশবোর্ড</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .dash-container { max-width: 700px; margin: 0 auto; padding: 16px 16px 80px; }
        .dash-header { background: var(--atlas-bg); border: 2px solid var(--atlas-border); border-radius: 14px; padding: 20px; margin-bottom: 16px; text-align: center; box-shadow: 0 0 14px var(--atlas-glow); }
        .dash-avatar { width: 70px; height: 70px; border-radius: 50%; background: var(--option-bg); border: 3px solid var(--atlas-border); display: flex; align-items: center; justify-content: center; font-size: 32px; margin: 0 auto 10px; color: var(--atlas-text); }
        .dash-name { font-size: 20px; font-weight: 800; color: var(--atlas-text); }
        .dash-info { font-size: 12px; color: var(--text-secondary); margin-top: 4px; }
        .dash-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-top: 12px; }
        .dash-stat { background: var(--option-bg); padding: 10px; border-radius: 10px; text-align: center; }
        .dash-stat-val { font-size: 20px; font-weight: 700; color: var(--atlas-text); }
        .dash-stat-label { font-size: 10px; color: var(--text-secondary); }
        
        .tab-bar { display: flex; gap: 4px; margin-bottom: 16px; background: var(--card-bg); border-radius: 12px; padding: 4px; border: 1px solid var(--option-border); overflow-x: auto; }
        .tab-btn { flex: 1; min-width: 70px; padding: 10px 6px; border: none; background: transparent; color: var(--text-secondary); font-size: 11px; font-weight: 600; cursor: pointer; border-radius: 10px; white-space: nowrap; font-family: 'Noto Sans Bengali','Inter',sans-serif; transition: all 0.3s; }
        .tab-btn.active { background: var(--atlas-bg); color: var(--atlas-text); border: 1px solid var(--atlas-border); box-shadow: 0 0 10px var(--atlas-glow); }
        .tab-btn:hover:not(.active) { color: var(--text-primary); background: var(--option-bg); }
        .tab-content { display: none; animation: fadeIn 0.3s; }
        .tab-content.active { display: block; }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
        
        .card { background: var(--card-bg); border: 1px solid var(--option-border); border-radius: 14px; padding: 16px; margin-bottom: 10px; }
        .card-title { font-size: 15px; font-weight: 700; color: var(--text-primary); margin-bottom: 8px; }
        .card-sub { font-size: 12px; color: var(--text-secondary); }
        .card-row { display: flex; justify-content: space-between; align-items: center; padding: 8px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
        .card-row:last-child { border-bottom: none; }
        
        .btn-sm { padding: 6px 14px; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; border: none; transition: all 0.3s; }
        .btn-outline { background: transparent; border: 1px solid var(--atlas-border); color: var(--atlas-text); }
        .btn-outline:hover { background: var(--atlas-hover-bg); }
        .btn-danger-sm { background: #EF4444; color: #FFF; }
        .btn-success-sm { background: #22C55E; color: #FFF; }
        
        .filter-row { display: flex; gap: 8px; margin-bottom: 12px; flex-wrap: wrap; }
        .filter-chip { padding: 6px 14px; border-radius: 20px; border: 1px solid var(--option-border); background: var(--card-bg); color: var(--text-secondary); font-size: 11px; cursor: pointer; transition: all 0.3s; }
        .filter-chip.active { background: var(--atlas-border); color: #FFF; border-color: var(--atlas-border); }
        
        .empty-state { text-align: center; padding: 40px 20px; color: var(--text-secondary); }
        .empty-state .icon { font-size: 48px; display: block; margin-bottom: 12px; }
        
        .input-group { margin-bottom: 10px; }
        .input-group label { display: block; font-size: 11px; font-weight: 600; color: var(--text-secondary); margin-bottom: 3px; }
        .input-group input { width: 100%; padding: 10px 12px; border: 2px solid var(--option-border); border-radius: 8px; font-size: 14px; background: var(--body-bg); color: var(--text-primary); font-family: 'Noto Sans Bengali','Inter',sans-serif; }
        .input-group input:focus { outline: none; border-color: var(--atlas-border); box-shadow: 0 0 8px var(--atlas-glow); }
        
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 3000; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card-bg); border-radius: 14px; padding: 20px; max-width: 500px; width: 90%; max-height: 85vh; overflow-y: auto; border: 1px solid var(--option-border); }
        .modal-title { font-size: 16px; font-weight: 700; color: var(--text-primary); margin-bottom: 16px; text-align: center; }
        
        .notification-dot { width: 8px; height: 8px; border-radius: 50%; background: #EF4444; display: inline-block; margin-right: 6px; }
        .notification-read { opacity: 0.5; }
    </style>
</head>

<script>
var SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
var SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
var GEMINI_KEY = 'AIzaSyBHfdZwqQkrBWF2pp1hLCGZKaXKrinP9ew';

var isDarkMode = true, isSidebarOpen = false, currentUser = null;

async function safeFetch(url, opts) {
    opts = opts || {}; opts.headers = opts.headers || {};
    opts.headers['apikey'] = SUPABASE_KEY;
    opts.headers['Authorization'] = 'Bearer ' + SUPABASE_KEY;
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE') opts.headers['Content-Type'] = 'application/json';
    try {
        var res = await fetch(url, opts);
        var text = await res.text();
        if (!text || text.trim() === '') return (opts.method==='DELETE'||opts.method==='PATCH') ? null : [];
        var data = JSON.parse(text);
        if (!res.ok) throw new Error(data.message || 'API Error');
        return data;
    } catch(e) { console.error('❌', e.message); throw e; }
}

function checkAuth() {
    var sess = localStorage.getItem('atlas-session');
    if (!sess) { showToast('⚠️ আগে লগইন করুন'); setTimeout(function(){ goTo('auth.html'); }, 1000); return false; }
    try { currentUser = JSON.parse(sess); return true; }
    catch(e) { goTo('auth.html'); return false; }
}

function loadTheme() { var s = localStorage.getItem('atlas-theme'); isDarkMode = s !== 'light'; document.body.classList.toggle('dark-mode', isDarkMode); updateThemeIcon(); }
function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode', isDarkMode); localStorage.setItem('atlas-theme', isDarkMode ? 'dark' : 'light'); updateThemeIcon(); showToast(isDarkMode ? '🌙 ডার্ক মোড' : '☀️ লাইট মোড'); }
function updateThemeIcon() { var b = document.getElementById('themeToggle'), si = document.getElementById('sidebarThemeIcon'), st = document.getElementById('sidebarThemeText'); if (b) b.textContent = isDarkMode ? '🌙' : '☀️'; if (si) si.textContent = isDarkMode ? '🌙' : '☀️'; if (st) st.textContent = isDarkMode ? 'ডার্ক মোড' : 'লাইট মোড'; }
function toggleSidebar() { isSidebarOpen = !isSidebarOpen; document.getElementById('sidebarOverlay').classList.toggle('active', isSidebarOpen); document.getElementById('sidebar').classList.toggle('active', isSidebarOpen); }
function closeSidebar() { isSidebarOpen = false; document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('sidebar').classList.remove('active'); }
function goTo(u) { window.location.href = u; }
function navigateTo(p) { var r = { 'home':'index.html', 'profile':'dashboard.html', 'class':'class.html', 'exam':'exam.html' }; goTo(r[p] || 'index.html'); }
function openWhatsApp() { window.open('https://wa.me/8801999681290', '_blank'); }
function openTelegram() { window.open('https://t.me/rafi_somc', '_blank'); }
function logout() { localStorage.removeItem('atlas-session'); goTo('index.html'); }
function showToast(m, d) { d = d || 2500; var t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(function(){ t.classList.remove('show'); }, d); }

// ========== প্রোফাইল লোড ==========
function loadProfile() {
    if (!currentUser) return;
    document.getElementById('dashName').textContent = currentUser.name || 'স্টুডেন্ট';
    document.getElementById('dashAvatar').textContent = (currentUser.name || 'S').charAt(0).toUpperCase();
    document.getElementById('dashInfo').textContent = 'ব্যাচ: ' + (currentUser.batch||'—') + ' | কলেজ: ' + (currentUser.college||'—') + ' | SSC: ' + (currentUser.ssc_gpa||'—') + ' | HSC: ' + (currentUser.hsc_gpa||'—');
    
    document.getElementById('editName').value = currentUser.name || '';
    document.getElementById('editBatch').value = currentUser.batch || '';
    document.getElementById('editCollege').value = currentUser.college || '';
    document.getElementById('editFather').value = currentUser.father_name || '';
    document.getElementById('editMother').value = currentUser.mother_name || '';
}

// ========== প্রোফাইল আপডেট ==========
async function updateProfile() {
    var data = {
        name: document.getElementById('editName').value.trim(),
        batch: document.getElementById('editBatch').value.trim(),
        college: document.getElementById('editCollege').value.trim(),
        father_name: document.getElementById('editFather').value.trim(),
        mother_name: document.getElementById('editMother').value.trim()
    };
    var pass = document.getElementById('editPass').value.trim();
    if (pass.length >= 6) data.password_hash = pass;
    
    try {
        await safeFetch(SUPABASE_URL + '/rest/v1/users?phone=eq.' + currentUser.phone, 'PATCH', data);
        Object.assign(currentUser, data);
        localStorage.setItem('atlas-session', JSON.stringify(currentUser));
        loadProfile();
        showToast('✅ প্রোফাইল আপডেট হয়েছে');
    } catch(e) { alert('আপডেট এরর: ' + e.message); }
}

// ========== ট্যাব সুইচ ==========
function switchTab(tab) {
    document.querySelectorAll('.tab-btn').forEach(function(b){ b.classList.remove('active'); });
    document.querySelectorAll('.tab-content').forEach(function(c){ c.classList.remove('active'); });
    event.target.classList.add('active');
    document.getElementById('tab' + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add('active');
    
    if (tab === 'history') loadHistory();
    else if (tab === 'mistakes') loadMistakes();
    else if (tab === 'bookmarks') loadBookmarks();
    else if (tab === 'notifications') loadNotifications();
}

// ========== এক্সাম হিস্টোরি ==========
async function loadHistory() {
    if (!currentUser) return;
    try {
        var results = await safeFetch(SUPABASE_URL + '/rest/v1/exam_results?phone=eq.' + currentUser.phone + '&select=*&order=submitted_at.desc&limit=20');
        if (!results || results.length === 0) {
            document.getElementById('historyList').innerHTML = '<div class="empty-state"><span class="icon">📝</span>কোনো এক্সাম হিস্টোরি নেই</div>';
            return;
        }
        
        var totalExams = results.length;
        var totalScore = 0;
        results.forEach(function(r){ totalScore += parseFloat(r.final_score) || 0; });
        var avgScore = Math.round(totalScore / totalExams);
        document.getElementById('statExams').textContent = totalExams;
        document.getElementById('statAvg').textContent = avgScore + '%';
        
        var html = '';
        results.forEach(function(r){
            html += '<div class="card"><div class="card-title">📝 এক্সাম #' + r.exam_id + '</div>';
            html += '<div class="card-row"><span>স্কোর</span><span style="font-weight:700;color:var(--atlas-text);">' + (r.final_score||0) + '</span></div>';
            html += '<div class="card-row"><span>সঠিক/ভুল/স্কিপ</span><span>✅' + (r.correct||0) + ' ❌' + (r.wrong||0) + ' ⏭️' + (r.skipped||0) + '</span></div>';
            html += '<div class="card-row"><span>তারিখ</span><span>' + new Date(r.submitted_at).toLocaleDateString('bn-BD') + '</span></div>';
            html += '<button class="btn-sm btn-outline" onclick="viewDetails(' + r.exam_id + ')" style="margin-top:8px;">📋 বিস্তারিত দেখো</button></div>';
        });
        document.getElementById('historyList').innerHTML = html;
    } catch(e) { document.getElementById('historyList').innerHTML = '<div class="empty-state"><span class="icon">⚠️</span>লোড ব্যর্থ</div>'; }
}

// ========== মাই মিসটেকস ==========
async function loadMistakes() {
    if (!currentUser) return;
    try {
        var results = await safeFetch(SUPABASE_URL + '/rest/v1/exam_results?phone=eq.' + currentUser.phone + '&select=*&order=submitted_at.desc&limit=20');
        if (!results || results.length === 0) {
            document.getElementById('mistakesList').innerHTML = '<div class="empty-state"><span class="icon">❌</span>কোনো ভুল উত্তর নেই</div>';
            return;
        }
        
        var html = '';
        results.forEach(function(r){
            if ((r.wrong || 0) > 0 || (r.skipped || 0) > 0) {
                html += '<div class="card"><div class="card-title">📝 এক্সাম #' + r.exam_id + '</div>';
                html += '<div class="card-row"><span>ভুল</span><span style="color:#EF4444;">❌ ' + (r.wrong||0) + '</span></div>';
                html += '<div class="card-row"><span>স্কিপ</span><span style="color:#F59E0B;">⏭️ ' + (r.skipped||0) + '</span></div>';
                html += '<button class="btn-sm btn-outline" onclick="viewDetails(' + r.exam_id + ')" style="margin-top:8px;">📋 বিস্তারিত দেখো</button>';
                html += '<button class="btn-sm btn-success-sm" onclick="practiceMode(' + r.exam_id + ',\'wrong\')" style="margin-left:4px;">🔁 Practice-01</button>';
                html += '<button class="btn-sm btn-outline" onclick="practiceMode(' + r.exam_id + ',\'all\')" style="margin-left:4px;">🔁 Practice-02</button></div>';
            }
        });
        document.getElementById('mistakesList').innerHTML = html || '<div class="empty-state"><span class="icon">✅</span>সব সঠিক!</div>';
    } catch(e) { document.getElementById('mistakesList').innerHTML = '<div class="empty-state"><span class="icon">⚠️</span>লোড ব্যর্থ</div>'; }
}

// ========== বুকমার্ক ==========
function loadBookmarks() {
    if (!currentUser) return;
    var saved = localStorage.getItem('bookmarks_' + currentUser.phone);
    var bookmarks = saved ? JSON.parse(saved) : {};
    var count = Object.keys(bookmarks).length;
    document.getElementById('statBookmarks').textContent = count;
    
    if (count === 0) {
        document.getElementById('bookmarksList').innerHTML = '<div class="empty-state"><span class="icon">🔖</span>কোনো বুকমার্ক নেই</div>';
        return;
    }
    
    var html = '<p style="color:var(--text-secondary);font-size:13px;margin-bottom:8px;">মোট ' + count + ' টি বুকমার্ক</p>';
    Object.keys(bookmarks).forEach(function(qid){
        html += '<div class="card"><div class="card-title">📝 প্রশ্ন #' + qid + '</div>';
        html += '<button class="btn-sm btn-outline" onclick="viewQuestionDetail(' + qid + ')">📋 দেখুন</button>';
        html += '<button class="btn-sm btn-danger-sm" onclick="removeBookmark(' + qid + ')" style="margin-left:4px;">🗑️ রিমুভ</button></div>';
    });
    document.getElementById('bookmarksList').innerHTML = html;
}

function removeBookmark(qid) {
    var saved = localStorage.getItem('bookmarks_' + currentUser.phone);
    var bookmarks = saved ? JSON.parse(saved) : {};
    delete bookmarks[qid];
    localStorage.setItem('bookmarks_' + currentUser.phone, JSON.stringify(bookmarks));
    loadBookmarks();
    showToast('🔖 বুকমার্ক রিমুভ হয়েছে');
}

// ========== নোটিফিকেশন ==========
async function loadNotifications() {
    if (!currentUser) return;
    try {
        var notifs = await safeFetch(SUPABASE_URL + '/rest/v1/notifications?user_phone=eq.' + currentUser.phone + '&select=*&order=created_at.desc&limit=20');
        if (!notifs || notifs.length === 0) {
            document.getElementById('notifList').innerHTML = '<div class="empty-state"><span class="icon">🔔</span>কোনো নোটিফিকেশন নেই</div>';
            return;
        }
        
        var unread = notifs.filter(function(n){ return !n.is_read; }).length;
        var badge = document.getElementById('notifBadge');
        if (unread > 0) { badge.textContent = unread; badge.style.display = 'flex'; }
        else { badge.style.display = 'none'; }
        
        var html = '';
        notifs.forEach(function(n){
            html += '<div class="card' + (n.is_read ? ' notification-read' : '') + '" onclick="markNotifRead(\'' + n.id + '\')">';
            if (!n.is_read) html += '<span class="notification-dot"></span>';
            html += '<div class="card-title">' + (n.title || 'নোটিফিকেশন') + '</div>';
            html += '<div class="card-sub">' + (n.message || '') + '</div>';
            html += '<div style="font-size:10px;color:var(--text-secondary);margin-top:4px;">' + new Date(n.created_at).toLocaleDateString('bn-BD') + '</div></div>';
        });
        document.getElementById('notifList').innerHTML = html;
    } catch(e) {}
}

async function markNotifRead(id) {
    try {
        await safeFetch(SUPABASE_URL + '/rest/v1/notifications?id=eq.' + id, 'PATCH', { is_read: true });
        loadNotifications();
    } catch(e) {}
}

// ========== বিস্তারিত দেখো ==========
async function viewDetails(examId) {
    try {
        var results = await safeFetch(SUPABASE_URL + '/rest/v1/exam_results?exam_id=eq.' + examId + '&phone=eq.' + currentUser.phone + '&select=*');
        if (!results || results.length === 0) { showToast('❌ ডাটা পাওয়া যায়নি'); return; }
        var r = results[0];
        var html = '<div class="modal-title">📋 এক্সাম #' + examId + '</div>';
        html += '<div class="card-row"><span>স্কোর</span><span style="font-weight:700;">' + (r.final_score||0) + '</span></div>';
        html += '<div class="card-row"><span>সঠিক</span><span style="color:#22C55E;">✅ ' + (r.correct||0) + '</span></div>';
        html += '<div class="card-row"><span>ভুল</span><span style="color:#EF4444;">❌ ' + (r.wrong||0) + '</span></div>';
        html += '<div class="card-row"><span>স্কিপ</span><span style="color:#F59E0B;">⏭️ ' + (r.skipped||0) + '</span></div>';
        html += '<div class="card-row"><span>GPA স্কোর</span><span>' + (r.with_gpa_total||'—') + '</span></div>';
        html += '<button class="btn-sm btn-outline" onclick="closeModal()" style="margin-top:12px;width:100%;">✕ বন্ধ করুন</button>';
        
        document.getElementById('detailModalContent').innerHTML = html;
        document.getElementById('detailModal').classList.add('active');
    } catch(e) { alert('এরর: ' + e.message); }
}

function viewQuestionDetail(qid) {
    showToast('🔜 এই ফিচার শীঘ্রই আসছে');
}

function practiceMode(examId, mode) {
    showToast('🔜 প্র্যাকটিস মোড শীঘ্রই আসছে');
}

function closeModal() { document.getElementById('detailModal').classList.remove('active'); }

// ========== পেজ লোড ==========
document.addEventListener('DOMContentLoaded', function() {
    console.log('📊 Dashboard Loaded');
    loadTheme();
    if (!checkAuth()) return;
    loadProfile();
    loadHistory();
    loadBookmarks();
    loadNotifications();
    
    document.getElementById('detailModal').addEventListener('click', function(e){ if (e.target === this) closeModal(); });
});
</script>
