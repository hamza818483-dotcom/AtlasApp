    <style>
        /* =============================================
           CSS VARIABLES — Flutter: ThemeData / ColorScheme

        :root {

            --card: #161B22;

        body.light-mode {

        /* ===== HEADER ===== */

        .profile-badge { display:inline-block;padding:2px 8px;border-radius:20px;font-size:10px;font-weight:700;margin:4px 2px;background:rgba(124,131,255,0.15);color:var(--accent);border:1px sol[...]
        .profile-badge.timer-first { background:rgba(63,185,80,0.12);color:var(--green);border-color:rgba(63,185,80,0.3); }

    <script>
    // ===== POMODORO PERSISTENT TIMER =====
    let pomoEndTimestamp = null;
    let pomoUpdateInterval = null;

    // Initialize on page load — restore timer if it was running
    function initPomoTimer() {
        const stored = localStorage.getItem('pomo_end_ts');
        if (stored) {
            pomoEndTimestamp = parseInt(stored, 10);
            if (pomoEndTimestamp > Date.now()) {
                startPomoUpdate();
            } else {
                localStorage.removeItem('pomo_end_ts');
            }
        }
    }

    // Start timer with given minutes — save to localStorage
    function startPomodoro(minutes) {
        pomoEndTimestamp = Date.now() + (minutes * 60 * 1000);
        localStorage.setItem('pomo_end_ts', String(pomoEndTimestamp));
        localStorage.setItem('pomo_running', 'true');
        startPomoUpdate();
    }

    // Stop/clear the timer
    function stopPomodoro() {
        pomoEndTimestamp = null;
        localStorage.removeItem('pomo_end_ts');
        localStorage.removeItem('pomo_running');
        if (pomoUpdateInterval) clearInterval(pomoUpdateInterval);
        updatePomoDisplay();
    }

    // Update timer display every 100ms
    function startPomoUpdate() {
        if (pomoUpdateInterval) clearInterval(pomoUpdateInterval);
        pomoUpdateInterval = setInterval(() => {
            if (pomoEndTimestamp) {
                const now = Date.now();
                if (now >= pomoEndTimestamp) {
                    stopPomodoro();
                } else {
                    updatePomoDisplay();
                }
            }
        }, 100);
    }

    // Update the pomo-digits display
    function updatePomoDisplay() {
        const digitsEl = document.querySelector('.pomo-digits');
        if (!digitsEl) return;
        
        if (!pomoEndTimestamp) {
            digitsEl.textContent = '--:--';
            return;
        }

        const now = Date.now();
        const remaining = Math.max(0, pomoEndTimestamp - now);
        const mins = Math.floor(remaining / 60000);
        const secs = Math.floor((remaining % 60000) / 1000);
        
        digitsEl.textContent = String(mins).padStart(2, '0') + ':' + String(secs).padStart(2, '0');
    }

    // Restore on page load
    if (document.readyState === 'loading') {
        document.addEventListener('DOMContentLoaded', initPomoTimer);
    } else {
        initPomoTimer();
    }
    </script>
