<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP · ফ্রি ক্লাস</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://www.youtube.com/iframe_api"></script>
    <style>
        .class-container{max-width:600px;margin:0 auto;padding:12px 14px 20px;}
        .subject-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px;margin-bottom:9px;cursor:pointer;transition:all 0.2s ease;display:flex;align-items:center;justify-content:space-between;box-shadow:var(--shadow-sm);}
        .subject-card:hover{border-color:var(--accent);box-shadow:var(--shadow-glow),var(--shadow-sm);transform:translateX(3px);}
        .subject-name{font-size:14px;font-weight:700;color:var(--text);font-family:'Noto Sans Bengali','Inter',sans-serif;}
        .subject-count{font-size:11px;color:var(--text-tertiary);margin-top:2px;}
        .chapter-item{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:13px;margin-bottom:8px;cursor:pointer;transition:all 0.2s ease;}
        .chapter-item:hover{border-color:var(--accent);}
        .chapter-name{font-size:13px;font-weight:700;color:var(--text);font-family:'Noto Sans Bengali','Inter',sans-serif;}
        .chapter-parts{font-size:11px;color:var(--text-tertiary);margin-top:3px;}
        .back-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;background:var(--btn-bg);border:1px solid var(--border);border-radius:var(--radius-full);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s ease;margin-bottom:12px;font-family:'Noto Sans Bengali','Inter',sans-serif;}
        .back-btn:hover{border-color:var(--accent);color:var(--accent);}
        .video-wrapper{position:relative;background:#000;border-radius:var(--radius-sm);overflow:hidden;margin-bottom:12px;}
        .video-container{position:relative;padding-top:56.25%;}
        .video-container iframe{position:absolute;inset:0;width:100%;height:100%;border:none;}
        .video-controls{display:flex;gap:6px;padding:8px;background:var(--card-bg);border:1px solid var(--border);border-radius:0 0 var(--radius-sm) var(--radius-sm);flex-wrap:wrap;}
        .ctrl-btn{padding:8px 16px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--btn-bg);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:all 0.2s ease;font-family:'Noto Sans Bengali','Inter',sans-serif;}
        .ctrl-btn:hover{border-color:var(--accent);color:var(--accent);}
        .settings-popup{position:absolute;top:40px;right:0;background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:10px;z-index:10;display:none;min-width:140px;box-shadow:var(--shadow-lg);}
        .settings-popup.show{display:block;}
        .settings-popup select{width:100%;padding:5px;border:1px solid var(--border);border-radius:4px;background:var(--bg);color:var(--text);font-size:11px;margin-bottom:4px;font-family:inherit;}
        .info-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:10px;}
        .info-row{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px solid var(--divider);font-size:12px;}
        .info-label{color:var(--text-secondary);}
        .info-value{font-weight:600;}
        .breadcrumb{font-size:11px;color:var(--text-tertiary);margin-bottom:10px;font-family:'Noto Sans Bengali','Inter',sans-serif;}
        .breadcrumb span{color:var(--accent);}
        .paper-label{font-size:12px;color:var(--accent);font-weight:700;margin:8px 0 4px;}
    </style>
</head>
<body class="dark-mode">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">ATLAS APP</div></div>

        <button class="sidebar-item" onclick="navigateTo('profile');closeSidebar();">👤 প্রোফাইল</button>

        <button class="sidebar-item" onclick="goTo('dashboard.html');closeSidebar();">⚠️ My Mistakes</button>

<header class="header">
    <div class="header-left">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="atlas-brand-box">
            <img src="https://cdn.phototourl.com/free/2026-05-15-b45df560-6dc8-4cb7-9040-238612c8a161.png" class="atlas-logo-img" alt="ATLAS">
            <span class="atlas-brand-text">ATLAS APP</span>
        </div>
    </div>

        <button class="header-icon" onclick="toggleTheme()" id="themeToggle">🌙</button>
        <button class="header-icon" onclick="navigateTo('profile')">👤</button>

</header>

<main class="class-container">

<div id="viewSubjects">
    <div class="section-header"><div class="section-title">📚 ফ্রি ক্লাস সেকশন</div></div>
    <input type="text" class="search-box" id="searchInput" placeholder="🔍 সাবজেক্ট বা চ্যাপ্টার খুঁজুন..." oninput="filterSubjects()">
    <div id="subjectList"><p style="text-align:center;color:var(--text-secondary);padding:20px;">লোড হচ্ছে...</p></div>
</div>

<div id="viewChapters" style="display:none;">
    <button class="back-btn" onclick="goToSubjects()">← ফিরে যান</button>
    <div class="section-header"><div class="section-title" id="chapterTitle">চ্যাপ্টার</div></div>
    <div id="chapterList"></div>
</div>

<div id="viewVideo" style="display:none;">
    <button class="back-btn" onclick="goToChapters()">← ফিরে যান</button>
    <div class="breadcrumb" id="videoBreadcrumb"></div>
    <div class="video-wrapper">
        <div class="video-controls">
            <button class="ctrl-btn" onclick="seekVideo(-10)">⏪ 10s</button>
            <button class="ctrl-btn" onclick="seekVideo(10)">⏩ 10s</button>
            <button class="ctrl-btn" onclick="togglePlayPause()">⏯️ Play/Pause</button>
            <button class="ctrl-btn" onclick="toggleSettings()">⚙️ Settings</button>
            <div class="settings-popup" id="settingsPopup">
                <label style="font-size:10px;color:var(--text-secondary);">Speed</label>
                <select onchange="changeSpeed(this.value)"><option value="0.5">0.5x</option><option value="0.75">0.75x</option><option value="1" selected>1x</option><option value="1.25">1.25x</option><option value="1.5">1.5x</option><option value="2">2x</option></select>
                <label style="font-size:10px;color:var(--text-secondary);">Quality</label>
                <select onchange="changeQuality(this.value)"><option value="auto">Auto</option><option value="small">360p</option><option value="medium">720p</option><option value="large">1080p</option></select>
            </div>
        </div>
        <div class="video-container" id="videoPlayer"></div>
    </div>
    <div class="info-card" id="videoInfo"></div>
    <div class="info-card" id="classNoteCard" style="display:none;"><div style="font-weight:700;color:var(--accent);margin-bottom:4px;">📋 ক্লাস নোট</div><div id="classNoteContent"></div></div>
    <div style="margin-top:10px;"><div style="font-size:13px;font-weight:700;color:var(--accent);margin-bottom:6px;">📋 অন্যান্য পার্ট</div><div id="otherParts"></div></div>
</div>

</main>

</nav>

<script>
const SUPABASE_URL='https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
let isDarkMode=true,isSidebarOpen=false,allClasses=[],currentSubject=null,currentChapter=null,ytPlayer=null;

function showToast(m,d=2000){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),d);}
function toggleTheme(){isDarkMode=!isDarkMode;document.body.classList.toggle('dark-mode',isDarkMode);document.body.classList.toggle('light-mode',!isDarkMode);document.getElementById('themeToggle').textContent=isDarkMode?'☀️':'🌙';}
function toggleSidebar(){isSidebarOpen=!isSidebarOpen;document.getElementById('sidebarOverlay').classList.toggle('active',isSidebarOpen);document.getElementById('sidebar').classList.toggle('active',isSidebarOpen);}
function closeSidebar(){isSidebarOpen=false;document.getElementById('sidebarOverlay').classList.remove('active');document.getElementById('sidebar').classList.remove('active');}
function goTo(u){location.href=u;}
function navigateTo(p){const r={home:'index.html',profile:'dashboard.html',class:'class.html',exam:'exam.html'};goTo(r[p]||'index.html');}
function openWA(){window.open('https://wa.me/8801999681290','_blank');}
function openTG(){window.open('https://t.me/rafi_somc','_blank');}
function logout(){localStorage.removeItem('atlas-session');goTo('index.html');}

async function safeFetch(url,opts={}){
    opts.headers=Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},opts.headers||{});
    if(!opts.headers['Content-Type']&&opts.method!=='DELETE')opts.headers['Content-Type']='application/json';
    try{const res=await fetch(url,opts);const text=await res.text();if(!text?.trim())return[];const data=JSON.parse(text);if(!res.ok)throw new Error(data.message);return data;}
    catch(e){console.error('❌',e.message);return[];}
}

async function loadClasses(){
    try{
        const url=SUPABASE_URL+'/rest/v1/classes?select=*&order=sort_order.asc,created_at.desc&limit=100';
        const res=await fetch(url,{headers:{'apikey':SUPABASE_KEY,'Authorization':'Bearer '+SUPABASE_KEY}});
        const text=await res.text();
        if(!text||text.trim()===''||text.trim()==='[]'){allClasses=[];document.getElementById('subjectList').innerHTML='<p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো ক্লাস নেই।</p>';return;}
        allClasses=JSON.parse(text);
        if(!allClasses.length){document.getElementById('subjectList').innerHTML='<p>কোনো ক্লাস নেই</p>';return;}
        renderSubjects();
    }catch(e){showToast('❌ ক্লাস লোড করতে সমস্যা');}
}

function renderSubjects(filter){
    filter=filter||'';
    const subjects={};
    allClasses.forEach(c=>{
        const s=c.subject||'সাধারণ';
        if(filter&&!s.toLowerCase().includes(filter)&&!(c.chapter||'').toLowerCase().includes(filter))return;
        if(!subjects[s])subjects[s]={papers:{},count:0};
        const p=c.paper||'সাধারণ';
        if(!subjects[s].papers[p])subjects[s].papers[p]={chapters:{},count:0};
        const ch=c.chapter||'সাধারণ';
        if(!subjects[s].papers[p].chapters[ch])subjects[s].papers[p].chapters[ch]=[];
        subjects[s].papers[p].chapters[ch].push(c);
        subjects[s].papers[p].count++;subjects[s].count++;
    });
    const keys=Object.keys(subjects);
    if(!keys.length){document.getElementById('subjectList').innerHTML='<p>কোনো ক্লাস পাওয়া যায়নি</p>';return;}
    let html='';
    keys.forEach(s=>{html+='<div class="subject-card" onclick="openSubject(\''+s.replace(/'/g,"\\'")+'\')"><div><div class="subject-name">📘 '+s+'</div><div class="subject-count">'+subjects[s].count+' টি ক্লাস</div></div><span style="color:var(--accent);">→</span></div>';});
    document.getElementById('subjectList').innerHTML=html;
}
function filterSubjects(){renderSubjects(document.getElementById('searchInput').value.trim().toLowerCase());}

function openSubject(subj){
    currentSubject=subj;
    const papers={};
    allClasses.forEach(c=>{if((c.subject||'সাধারণ')===subj){const p=c.paper||'সাধারণ',ch=c.chapter||'সাধারণ';if(!papers[p])papers[p]={};if(!papers[p][ch])papers[p][ch]=[];papers[p][ch].push(c);}});
    document.getElementById('chapterTitle').textContent='📘 '+subj;
    let html='';
    Object.keys(papers).forEach(p=>{
        html+='<div class="paper-label">📄 '+p+'</div>';
        Object.keys(papers[p]).forEach(ch=>{
            const pd=papers[p][ch];
            html+='<div class="chapter-item" onclick="currentChapter=\''+ch.replace(/'/g,"\\'")+'\';playVideo(\''+pd[0].youtube_link.replace(/'/g,"\\'")+'\',\''+ch.replace(/'/g,"\\'")+'\',\''+(pd[0].class_type||'website')+'\',\''+(pd[0].class_note||'').replace(/'/g,"\\'")+'\')"><div class="chapter-name">📖 '+ch+'</div><div class="chapter-parts">'+pd.length+' টি ক্লাস</div></div>';
        });
    });
    document.getElementById('chapterList').innerHTML=html||'<p>কোনো চ্যাপ্টার নেই</p>';
    document.getElementById('viewSubjects').style.display='none';
    document.getElementById('viewChapters').style.display='block';
    document.getElementById('viewVideo').style.display='none';
}

function playVideo(link,title,classType,classNote){
    const videoId=extractYouTubeID(link);
    document.getElementById('videoBreadcrumb').innerHTML='📘 <span>'+currentSubject+'</span> › 📖 <span>'+currentChapter+'</span> › 🎥 <span>'+title+'</span>';
    document.getElementById('videoInfo').innerHTML='<div class="info-row"><span class="info-label">সাবজেক্ট</span><span class="info-value">'+currentSubject+'</span></div><div class="info-row"><span class="info-label">চ্যাপ্টার</span><span class="info-value">'+currentChapter+'</span></div><div class="info-row"><span class="info-label">পার্ট</span><span class="info-value">'+title+'</span></div>';
    if(classType==='youtube'){
        document.getElementById('videoPlayer').innerHTML='<div style="padding:40px;text-align:center;"><p>▶️ YouTube-এ ওপেন হচ্ছে...</p><a href="'+link+'" target="_blank" class="btn btn-outline">YouTube-এ দেখুন</a></div>';
        window.open(link,'_blank');
    }else{
        if(videoId){
            document.getElementById('videoPlayer').innerHTML='<iframe src="https://www.youtube.com/embed/'+videoId+'?enablejsapi=1&rel=0" allow="autoplay;encrypted-media;picture-in-picture" allowfullscreen id="ytIframe"></iframe>';
        }else{
            document.getElementById('videoPlayer').innerHTML='<p style="text-align:center;padding:30px;">⚠️ ভিডিও লিংক সঠিক নয়</p>';
        }
    }
    if(classNote){document.getElementById('classNoteCard').style.display='block';document.getElementById('classNoteContent').innerHTML=classNote.startsWith('http')?'<a href="'+classNote+'" target="_blank" style="color:var(--accent);">'+classNote+'</a>':classNote;}
    else{document.getElementById('classNoteCard').style.display='none';}
    saveClassHistory(currentSubject,currentChapter,title);
    document.getElementById('viewSubjects').style.display='none';
    document.getElementById('viewChapters').style.display='none';
    document.getElementById('viewVideo').style.display='block';
}

function extractYouTubeID(url){if(!url)return null;const m=url.match(/(?:youtube\.com\/watch\?v=|youtu\.be\/|youtube\.com\/embed\/)([^&\s]+)/);return m?m[1]:null;}

function saveClassHistory(subject,chapter,part){
    try{const user=JSON.parse(localStorage.getItem('atlas-session'));if(!user)return;const h=JSON.parse(localStorage.getItem('class_history_'+user.phone)||'[]');h.push({subject,chapter,part,time:new Date().toISOString()});if(h.length>50)h.splice(0,h.length-50);localStorage.setItem('class_history_'+user.phone,JSON.stringify(h));}catch(e){}
}

function goToSubjects(){document.getElementById('viewSubjects').style.display='block';document.getElementById('viewChapters').style.display='none';document.getElementById('viewVideo').style.display='none';}
function goToChapters(){document.getElementById('viewSubjects').style.display='none';document.getElementById('viewChapters').style.display='block';document.getElementById('viewVideo').style.display='none';}

// Video Controls
function getPlayer(){
    if(ytPlayer)return ytPlayer;
    const iframe=document.getElementById('ytIframe');
    if(!iframe)return null;
    try{ytPlayer=new YT.Player(iframe);return ytPlayer;}catch(e){return null;}
}
function seekVideo(sec){
    const player=getPlayer();
    if(!player||!player.getCurrentTime){showToast('⚠️ প্রথমে ভিডিও চালু করুন');return;}
    player.seekTo(Math.max(0,player.getCurrentTime()+sec),true);
    showToast(sec>0?'⏩ ১০ সেকেন্ড':'⏪ ১০ সেকেন্ড');
}
function togglePlayPause(){
    const player=getPlayer();
    if(!player){showToast('⚠️ ভিডিও রেডি নয়');return;}
    try{if(player.getPlayerState()===1){player.pauseVideo();showToast('⏸️ Paused');}else{player.playVideo();showToast('▶️ Playing');}}catch(e){showToast('⚠️ ভিডিও নিয়ন্ত্রণ সম্ভব নয়');}
}
function toggleSettings(){document.getElementById('settingsPopup').classList.toggle('show');}
function changeSpeed(val){
    const player=getPlayer();
    if(!player||!player.setPlaybackRate)return;
    player.setPlaybackRate(parseFloat(val));
    showToast('⚡ স্পিড: '+val+'x');
    document.getElementById('settingsPopup').classList.remove('show');
}
function changeQuality(val){
    const player=getPlayer();
    if(!player)return;
    try{player.setPlaybackQuality(val);showToast('📺 কোয়ালিটি: '+val);}catch(e){showToast('⚠️ কোয়ালিটি পরিবর্তন সম্ভব নয়');}
    document.getElementById('settingsPopup').classList.remove('show');
}

function showError(title,message,details,retryFn){
    const existing=document.querySelector('.error-popup-overlay');if(existing)existing.remove();
    const overlay=document.createElement('div');overlay.className='error-popup-overlay';
    let retryHTML='';if(retryFn){retryHTML='<button class="error-popup-retry" onclick="this.closest(\'.error-popup-overlay\').remove();('+retryFn.toString()+')();">🔄 আবার চেষ্টা</button>';}
    overlay.innerHTML='<div class="error-popup" onclick="event.stopPropagation()"><div class="error-popup-icon">⚠️</div><div class="error-popup-title">'+(title||'কিছু সমস্যা হয়েছে')+'</div><div class="error-popup-message">'+(message||'পরে আবার চেষ্টা করুন')+'</div>'+(details?'<div class="error-popup-details">'+details+'</div>':'')+'<div style="display:flex;justify-content:center;gap:8px;">'+retryHTML+'<button class="error-popup-btn" onclick="this.closest(\'.error-popup-overlay\').remove()">✕ বন্ধ</button></div></div>';
    overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove();});document.body.appendChild(overlay);
}
window.addEventListener('error',function(e){showError('💥 সমস্যা','পৃষ্ঠাটি রিলোড করুন',e.error?.message,()=>location.reload());});
window.addEventListener('unhandledrejection',function(e){showError('⚠️ প্রসেসিং সমস্যা','অনুরোধ সম্পূর্ণ করা যায়নি',e.reason?.message,null);});

loadClasses();
</script>
</body>
</html>
