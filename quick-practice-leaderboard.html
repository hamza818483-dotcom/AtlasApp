<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Leaderboard — Quick Practice</title>
<style>
    :root {
        --bg: #F6F8FA; --card-bg: #FFFFFF; --card-hover: #F0F2F5;
        --text: #1C2129; --text-secondary: #57606A;
        --accent: #7C83FF; --accent-hover: #9499FF;
        --border: #D0D7DE;
        --radius: 14px; --radius-md: 10px; --radius-full: 999px;
        --gold: #F5C542;
    }
    * { margin:0; padding:0; box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
    body { background:var(--bg); color:var(--text); font-family:'Segoe UI',system-ui,sans-serif; min-height:100vh; padding-bottom:30px; }

    .lb-header { position:sticky; top:0; z-index:50; display:flex; align-items:center; gap:10px; padding:14px 16px; background:var(--card-bg); border-bottom:1px solid var(--border); }
    .lb-back { width:36px; height:36px; border-radius:var(--radius-full); border:1px solid var(--border); background:var(--bg); display:flex; align-items:center; justify-content:center; cursor:pointer; color:var(--text); }
    .lb-title { font-size:17px; font-weight:800; flex:1; }

    .lb-my-rank { margin:14px 16px 0; padding:12px 14px; border-radius:var(--radius-md); background:linear-gradient(135deg, rgba(124,131,255,.12), rgba(124,131,255,.04)); border:1px solid rgba(124,131,255,.3); display:none; align-items:center; gap:10px; font-size:12.5px; }
    .lb-my-rank.show { display:flex; }
    .lb-my-rank b { color:var(--accent); }

    /* TOP 3 — glass card style matching Focus Timer, still shown in list */
    .top3-section { display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px; margin:16px 16px 6px; align-items:end; }
    .top3-card { padding:14px 8px 12px; border-radius:14px; position:relative; overflow:hidden; text-align:center;
        background:rgba(0,0,0,.03); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid var(--border); box-shadow:0 2px 8px rgba(0,0,0,.08), inset 0 1px 0 rgba(255,255,255,.5); }
    .top3-card::after { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.5), transparent); pointer-events:none; }
    .top3-card.rank1 { order:2; padding-top:6px; border-color:rgba(245,197,66,.5); background:linear-gradient(160deg, rgba(245,197,66,.1), rgba(0,0,0,.03)); box-shadow:0 4px 14px rgba(245,197,66,.2), inset 0 1px 0 rgba(255,255,255,.6); transform:scale(1.06); z-index:2; }
    .top3-card.rank2 { order:1; border-color:rgba(156,163,175,.4); }
    .top3-card.rank3 { order:3; border-color:rgba(205,127,50,.35); }
    .top3-crown { font-size:20px; margin-bottom:2px; }
    .top3-avatar { width:52px; height:52px; border-radius:12px; background:linear-gradient(135deg, rgba(124,131,255,.2), rgba(124,131,255,.08)); margin:0 auto 6px; display:flex; align-items:center; justify-content:center; font-size:22px; border:1px solid rgba(124,131,255,.2); overflow:hidden; position:relative; }
    .top3-card.rank1 .top3-avatar { width:62px; height:62px; border-color:var(--gold); }
    .top3-avatar img { width:100%; height:100%; object-fit:cover; border-radius:11px; }
    .top3-medal { position:absolute; bottom:-2px; right:-2px; width:20px; height:20px; border-radius:50%; display:flex; align-items:center; justify-content:center; font-size:11px; font-weight:900; border:2px solid var(--card-bg); }
    .rank1 .top3-medal { background:var(--gold); color:#1C1300; }
    .rank2 .top3-medal { background:#B0B8C1; color:#fff; }
    .rank3 .top3-medal { background:#CD7F32; color:#fff; }
    .top3-name { font-size:11.5px; font-weight:900; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .top3-batch { font-size:9px; font-weight:700; color:#818CF8; margin-top:2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .top3-points { font-size:14px; font-weight:900; color:#10B981; margin-top:4px; font-family:'Courier New',monospace; }
    .top3-points .l { font-size:8px; font-weight:700; color:var(--text-secondary); display:block; font-family:'Segoe UI',sans-serif; }

    .lb-vs-strip { display:flex; align-items:center; justify-content:center; gap:6px; margin:2px 16px 14px; font-size:10px; color:var(--text-secondary); font-weight:700; }
    .lb-vs-strip::before, .lb-vs-strip::after { content:''; flex:1; height:1px; background:var(--border); }

    /* Regular list — Focus Timer glass card style */
    .lb-list { padding:0 16px; display:flex; flex-direction:column; gap:5px; }
    .lb-card { display:flex; align-items:center; gap:8px; position:relative; overflow:hidden;
        background:rgba(0,0,0,.03); backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
        border:1px solid var(--border); border-radius:10px; padding:6px 10px 6px 6px;
        box-shadow:0 2px 8px rgba(0,0,0,.06), inset 0 1px 0 rgba(255,255,255,.4); }
    .lb-card::after { content:''; position:absolute; top:0; left:0; right:0; height:1px; background:linear-gradient(90deg, transparent, rgba(255,255,255,.4), transparent); pointer-events:none; }
    .lb-card.is-me { border-color:rgba(124,131,255,.4); background:linear-gradient(135deg, rgba(124,131,255,.08), rgba(0,0,0,.03)); box-shadow:0 2px 10px rgba(124,131,255,.15), inset 0 1px 0 rgba(255,255,255,.5); }
    .lb-rank { font-size:16px; font-weight:900; width:34px; text-align:center; font-family:'Courier New',monospace; color:var(--text-secondary); flex-shrink:0; }
    .lb-photo { width:38px; height:38px; border-radius:8px; flex-shrink:0; background:linear-gradient(135deg, rgba(124,131,255,.2), rgba(124,131,255,.08)); display:flex; align-items:center; justify-content:center; overflow:hidden; border:1px solid rgba(124,131,255,.15); color:var(--accent); margin-left:-2px; }
    .lb-photo img { width:100%; height:100%; object-fit:cover; border-radius:7px; }
    .lb-info { flex:1; min-width:0; display:flex; flex-direction:column; gap:1px; }
    .lb-name { font-size:12px; font-weight:900; letter-spacing:.2px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .lb-batch { font-size:8.5px; font-weight:800; color:#818CF8; background:rgba(99,102,241,.15); border:1px solid rgba(99,102,241,.3); border-radius:8px; padding:1px 6px; width:fit-content; font-family:'Courier New',monospace; }
    .lb-points { font-size:12px; font-weight:900; color:#10B981; text-align:right; flex-shrink:0; font-family:'Courier New',monospace; }
    .lb-points .l { font-size:7.5px; font-weight:700; color:var(--text-secondary); display:block; text-align:right; font-family:'Segoe UI',sans-serif; }

    .lb-empty { padding:40px 20px; text-align:center; color:var(--text-secondary); font-size:13px; }
    .lb-loading { padding:40px 20px; text-align:center; color:var(--text-secondary); font-size:13px; }
</style>
</head>
<body>

<div class="lb-header">
    <div class="lb-back" onclick="goBackGlobal()">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none"><path d="M15 18l-6-6 6-6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>
    <div class="lb-title"><svg class="emoji-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#FFB800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-0.125em"><path d="M10 14.66v1.626a2 2 0 0 1-.976 1.696A5 5 0 0 0 7 21.978" />
  <path d="M14 14.66v1.626a2 2 0 0 0 .976 1.696A5 5 0 0 1 17 21.978" />
  <path d="M18 9h1.5a1 1 0 0 0 0-5H18" />
  <path d="M4 22h16" />
  <path d="M6 9a6 6 0 0 0 12 0V3a1 1 0 0 0-1-1H7a1 1 0 0 0-1 1z" />
  <path d="M6 9H4.5a1 1 0 0 1 0-5H6" /></svg> Leaderboard</div>
</div>

<div class="lb-my-rank" id="lbMyRank"></div>

<div id="lbContent">
    <div class="lb-loading">লোড হচ্ছে...</div>
</div>

<script src="offline-db.js"></script>
<script src="global-nav.js"></script>
<script>
const SUPABASE_URL = 'https://atlas-ai-proxy.hamza818483.workers.dev';
const SUPABASE_KEY = 'mb_d1_9f2a7c6e1b4d8305';

async function lbFetch(path) {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/${path}`, { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
    const text = await res.text();
    return text ? JSON.parse(text) : [];
}
function lbGetSession() { try { return JSON.parse(localStorage.getItem('atlas-session')); } catch (e) { return null; } }
function lbEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function lbAvatarSvg() { return '<svg width="18" height="18" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="4" fill="currentColor" opacity=".5"/><path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" fill="currentColor" opacity=".35"/></svg>'; }

async function lbInit() {
    let rows, users;
    try {
        rows = await lbFetch('qp_user_points?select=user_phone,total_points,total_correct,total_quizzes&order=total_points.desc&limit=100');
        const phones0 = rows.map(r => r.user_phone).filter(Boolean);
        users = await lbFetch(`users?phone=in.(${phones0.join(',')})&select=phone,name,batch,photo_url`);
        if (window.offlineDB) window.offlineDB.cacheQuestions('qp_leaderboard', { rows, users }).catch(() => {});
    } catch (netErr) {
        const cached = window.offlineDB ? await window.offlineDB.getCachedQuestions('qp_leaderboard') : null;
        if (!cached) { document.getElementById('lbContent').innerHTML = '<div class="lb-empty"><svg class="emoji-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#F59E0B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-0.125em"><path d="m21.73 18-8-14a2 2 0 0 0-3.48 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.73-3" />
  <path d="M12 9v4" />
  <path d="M12 17h.01" /></svg>️ অফলাইনে লিডারবোর্ড পাওয়া যায়নি</div>'; return; }
        rows = cached.rows; users = cached.users;
    }
    if (!rows.length) {
        document.getElementById('lbContent').innerHTML = '<div class="lb-empty">এখনো কেউ Quick Practice খেলেনি। প্রথম হও! <svg class="emoji-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#6366F1" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-0.125em"><path d="M12 15v5s3.03-.55 4-2c1.08-1.62 0-5 0-5" />
  <path d="M4.5 16.5c-1.5 1.26-2 5-2 5s3.74-.5 5-2c.71-.84.7-2.13-.09-2.91a2.18 2.18 0 0 0-2.91-.09" />
  <path d="M9 12a22 22 0 0 1 2-3.95A12.88 12.88 0 0 1 22 2c0 2.72-.78 7.5-6 11a22.4 22.4 0 0 1-4 2z" />
  <path d="M9 12H4s.55-3.03 2-4c1.62-1.08 5 .05 5 .05" /></svg></div>';
        return;
    }
    const phones = rows.map(r => r.user_phone).filter(Boolean);
    const userMap = Object.fromEntries(users.map(u => [u.phone, u]));

    const ranked = rows.map((r, i) => ({
        rank: i + 1,
        phone: r.user_phone,
        points: r.total_points || 0,
        name: (userMap[r.user_phone] && userMap[r.user_phone].name) || 'Student',
        batch: (userMap[r.user_phone] && userMap[r.user_phone].batch) || '',
        photo: (userMap[r.user_phone] && userMap[r.user_phone].photo_url) || null
    }));

    const session = lbGetSession();
    const myPhone = session && session.phone;
    const myEntry = ranked.find(r => r.phone === myPhone);
    if (myEntry) {
        const myRankEl = document.getElementById('lbMyRank');
        myRankEl.classList.add('show');
        myRankEl.style.cursor = 'pointer';
        myRankEl.onclick = () => lbScrollToMe();
        myRankEl.innerHTML = `<svg class="emoji-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#EF4444" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-0.125em"><circle cx="12" cy="12" r="10" />
  <circle cx="12" cy="12" r="6" />
  <circle cx="12" cy="12" r="2" /></svg> তোমার Rank: <b>#${myEntry.rank}</b> &nbsp;•&nbsp; <b>${myEntry.points}</b> পয়েন্ট <span style="margin-left:auto;font-size:11px;opacity:.7">দেখো <svg class="emoji-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#64748B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-0.125em"><path d="M12 5v14" />
  <path d="m19 12-7 7-7-7" /></svg></span>`;
    }

    const top3 = ranked.slice(0, 3);
    const rest = ranked; // top3 also shown again in the full list below

    let html = '';
    if (top3.length) {
        html += '<div class="top3-section">';
        const order = [1, 0, 2]; // render 2nd,1st,3rd for podium visual (CSS order also handles it)
        top3.forEach((p, idx) => {
            if (!p) return;
            const rc = idx + 1;
            const crown = rc === 1 ? '<svg class="emoji-icon" viewBox="0 0 24 24" width="1em" height="1em" fill="none" stroke="#FFB800" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:inline;vertical-align:-0.125em"><path d="M11.562 3.266a.5.5 0 0 1 .876 0L15.39 8.87a1 1 0 0 0 1.516.294L21.183 5.5a.5.5 0 0 1 .798.519l-2.834 10.246a1 1 0 0 1-.956.734H5.81a1 1 0 0 1-.957-.734L2.02 6.02a.5.5 0 0 1 .798-.519l4.276 3.664a1 1 0 0 0 1.516-.294z" />
  <path d="M5 21h14" /></svg>' : '';
            const photoHtml = p.photo ? `<img src="${lbEsc(p.photo)}">` : lbAvatarSvg();
            html += `
            <div class="top3-card rank${rc}" id="lbTop3_${p.phone}">
                <div class="top3-crown">${crown}</div>
                <div class="top3-avatar">${photoHtml}<div class="top3-medal">${rc}</div></div>
                <div class="top3-name">${lbEsc(p.name)}</div>
                <div class="top3-batch">${lbEsc(p.batch)}</div>
                <div class="top3-points">${p.points}<span class="l">পয়েন্ট</span></div>
            </div>`;
        });
        html += '</div><div class="lb-vs-strip">সেরা তিনজন</div>';
    }

    html += '<div class="lb-list">';
    rest.forEach(p => {
        const isMe = p.phone === myPhone;
        const photoHtml = p.photo ? `<img src="${lbEsc(p.photo)}">` : lbAvatarSvg();
        html += `
        <div class="lb-card ${isMe ? 'is-me' : ''}" id="lbCard_${p.phone}">
            <div class="lb-rank">#${p.rank}</div>
            <div class="lb-photo">${photoHtml}</div>
            <div class="lb-info">
                <div class="lb-name">${lbEsc(p.name)}${isMe ? ' (তুমি)' : ''}</div>
                <div class="lb-batch">${lbEsc(p.batch)}</div>
            </div>
            <div class="lb-points">${p.points}<span class="l">পয়েন্ট</span></div>
        </div>`;
    });
    html += '</div>';

    document.getElementById('lbContent').innerHTML = html;

    if (myEntry) setTimeout(() => lbScrollToMe(true), 400);
}

function lbScrollToMe(silent) {
    const session = lbGetSession();
    const myPhone = session && session.phone;
    if (!myPhone) return;
    const el = document.getElementById('lbCard_' + myPhone);
    if (!el) return;
    el.scrollIntoView({ behavior: silent ? 'auto' : 'smooth', block: 'center' });
    if (!silent) {
        el.style.transition = 'box-shadow .3s';
        el.style.boxShadow = '0 0 0 3px var(--accent)';
        setTimeout(() => { el.style.boxShadow = ''; }, 1200);
    }
}

lbInit();
</script>
</body>
</html>
