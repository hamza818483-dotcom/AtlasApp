<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>DEBUG — Subject Save Test</title>
<style>
  body { font-family: monospace; background:#0D1117; color:#E6EDF3; padding:16px; font-size:13px; }
  button { display:block; width:100%; padding:14px; margin:8px 0; font-size:15px; border-radius:8px; border:none; background:#7C83FF; color:#fff; }
  #log { background:#161B22; border:1px solid #30363D; border-radius:8px; padding:10px; margin-top:14px; white-space:pre-wrap; word-break:break-all; line-height:1.6; }
  .ok { color:#3FB950; }
  .err { color:#F85149; }
  .info { color:#8B949E; }
</style>
</head>
<body>
<h2>🔬 DEBUG: book_subjects save/load test</h2>
<p class="info">এই পেইজ সরাসরি Supabase-এ test request পাঠায়, admin.html UI বাইপাস করে — যাতে exact কোথায় আটকাচ্ছে দেখা যায়।</p>

<button onclick="testInsert()">1️⃣ Test INSERT (notun subject add)</button>
<button onclick="testSelect()">2️⃣ Test SELECT (sob subject dekhao)</button>
<button onclick="clearLog()">🗑️ Log Clear</button>

<div id="log">এখনো কিছু test করা হয়নি — উপরের বাটনে চাপ দিন।</div>

<script>
const SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';

function log(msg, cls) {
    const el = document.getElementById('log');
    const line = document.createElement('div');
    line.className = cls || '';
    line.textContent = new Date().toLocaleTimeString() + ' — ' + msg;
    el.appendChild(line);
    window.scrollTo(0, document.body.scrollHeight);
}
function clearLog() { document.getElementById('log').innerHTML = ''; }

async function testInsert() {
    log('INSERT শুরু হচ্ছে...', 'info');
    const testName = 'DEBUG-TEST-' + Date.now();
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/book_subjects`, {
            method: 'POST',
            headers: {
                apikey: SUPABASE_KEY,
                Authorization: 'Bearer ' + SUPABASE_KEY,
                'Content-Type': 'application/json',
                'Prefer': 'return=representation'
            },
            body: JSON.stringify({ name: testName, icon: '🧪', description: 'debug test row', color_idx: 0 })
        });
        log('HTTP Status: ' + res.status + ' ' + res.statusText, res.ok ? 'ok' : 'err');
        const text = await res.text();
        log('Raw response body: ' + (text || '(খালি)'), res.ok ? 'ok' : 'err');
        if (!res.ok) {
            log('❌ INSERT ব্যর্থ — Supabase ত্রুটি দিয়েছে (উপরে raw body দেখুন)', 'err');
            return;
        }
        let data;
        try { data = JSON.parse(text); } catch (e) { log('⚠️ Response JSON parse করা যায়নি: ' + e.message, 'err'); return; }
        log('Parsed: ' + JSON.stringify(data), 'ok');
        if (Array.isArray(data) && data.length > 0) {
            log('✅ INSERT সফল! নতুন row ID: ' + data[0].id, 'ok');
        } else {
            log('⚠️ INSERT request 200/201 দিলো কিন্তু কোনো row data ফেরত আসেনি — RLS policy বা trigger silently block করতে পারে', 'err');
        }
    } catch (e) {
        log('❌ Network/JS এরর: ' + e.message, 'err');
    }
}

async function testSelect() {
    log('SELECT শুরু হচ্ছে (সব book_subjects)...', 'info');
    try {
        const res = await fetch(`${SUPABASE_URL}/rest/v1/book_subjects?select=*&order=created_at.desc`, {
            headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }
        });
        log('HTTP Status: ' + res.status + ' ' + res.statusText, res.ok ? 'ok' : 'err');
        const text = await res.text();
        if (!res.ok) { log('❌ SELECT ব্যর্থ: ' + text, 'err'); return; }
        let data;
        try { data = JSON.parse(text); } catch (e) { log('⚠️ JSON parse ব্যর্থ: ' + e.message, 'err'); return; }
        log('✅ মোট ' + data.length + ' টি subject পাওয়া গেছে', 'ok');
        data.forEach(s => log('  • [id=' + s.id + '] ' + (s.icon||'') + ' ' + s.name, 'info'));
        if (data.length === 0) {
            log('⚠️ টেবিল খালি — INSERT কখনো সফল হয়নি, অথবা ভিন্ন টেবিলে/প্রজেক্টে গিয়েছে', 'err');
        }
    } catch (e) {
        log('❌ Network/JS এরর: ' + e.message, 'err');
    }
}
</script>
</body>
</html>
