<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS APP · Study Time History</title>
<link rel="stylesheet" href="style.css">
<style>
.sh-container { max-width: 560px; margin: 0 auto; padding: 14px 14px 24px; }

.sh-hero { text-align: center; padding: 4px 0 14px; }
.sh-hero-icon { font-size: 28px; margin-bottom: 4px; }
.sh-hero-title { font-size: 17px; font-weight: 900; color: var(--text); }
.sh-hero-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* Summary cards */
.sh-summary-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.sh-summary-card {
  flex: 1; min-width: calc(33% - 6px); padding: 10px 6px;
  background: var(--card-bg);
  border: 1px solid var(--border); border-radius: 12px; text-align: center;
}
.sh-summary-val { font-size: 15px; font-weight: 900; color: var(--accent); }
.sh-summary-lbl { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 2px; }

/* Period row */
.sh-period-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
.sh-period-row::-webkit-scrollbar { display: none; }
.sh-period-btn {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--card-bg);
  color: var(--text-secondary); font-size: 10px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: all .2s;
}
.sh-period-btn.active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

/* Session card detail rows */
.sh-session-detail { font-size: 10px; color: var(--text-secondary); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; }
.sh-detail-chip { display: inline-flex; align-items: center; gap: 3px; }

/* আজকের ৩ box — chart এর উপরে */
.sh-today-row { display: flex; gap: 6px; margin-bottom: 10px; }
.sh-today-box {
  flex: 1; padding: 10px 8px; border-radius: 12px;
  border: 1.5px solid var(--border); text-align: center;
  background: var(--card-bg);
}
.sh-today-study { border-color: rgba(16,185,129,.3); background: rgba(16,185,129,.05); }
.sh-today-break { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.05); }
.sh-today-sleep { border-color: rgba(129,140,248,.3); background: rgba(129,140,248,.05); }
.sh-today-val { font-size: 16px; font-weight: 900; }
.sh-today-study .sh-today-val { color: #10B981; }
.sh-today-break .sh-today-val { color: #F59E0B; }
.sh-today-sleep .sh-today-val { color: #818CF8; }
.sh-today-lbl { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 3px; }

/* Bar chart — last 7 days */
.sh-chart-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 12px; margin-bottom: 16px;
}
.sh-chart-title { font-size: 12px; font-weight: 800; color: var(--text); margin-bottom: 12px; }

.sh-advice-btn {
  display: flex; align-items: center; gap: 4px;
  padding: 4px 10px; border-radius: 8px; border: none;
  background: linear-gradient(135deg,#8B5CF6,#6366F1,#8B5CF6);
  background-size: 200% 200%;
  color: #fff; font-size: 10px; font-weight: 800; font-family: inherit;
  cursor: pointer; flex-shrink: 0;
  box-shadow: 0 0 8px rgba(139,92,246,.5), 0 0 16px rgba(99,102,241,.3);
  animation: shAdviceGlow 2.2s ease-in-out infinite;
}
@keyframes shAdviceGlow {
  0%,100% { background-position: 0% 50%; box-shadow: 0 0 8px rgba(139,92,246,.5), 0 0 16px rgba(99,102,241,.3); }
  50% { background-position: 100% 50%; box-shadow: 0 0 14px rgba(139,92,246,.8), 0 0 24px rgba(99,102,241,.5); }
}
.sh-chart-row { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
.sh-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.sh-bar { width: 100%; max-width: 26px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent), #4338CA); min-height: 4px; transition: height .5s ease; }
.sh-bar-today { background: linear-gradient(180deg, #10B981, #047857); }
.sh-bar-zero { background: var(--border); opacity: .5; }
.sh-bar-val { font-size: 7.5px; color: var(--text-secondary); font-weight: 800; text-align: center; white-space: nowrap; min-height: 12px; display: flex; align-items: flex-end; justify-content: center; }
.sh-bar-day { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 3px; }
.sh-bar-day-today { color: #10B981; font-weight: 900; }

/* Session list — premium glass */
.sh-list-title { font-size: 12.5px; font-weight: 900; color: var(--text); margin: 4px 0 8px; }
.sh-session-card {
  background: linear-gradient(135deg, rgba(99,102,241,.08) 0%, rgba(16,185,129,.06) 50%, rgba(245,158,11,.05) 100%);
  border: 1.5px solid rgba(99,102,241,.18);
  border-radius: 16px;
  padding: 11px 12px 10px;
  margin-bottom: 8px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s;
  position: relative; overflow: hidden;
  backdrop-filter: blur(8px);
  box-shadow: 0 2px 12px rgba(0,0,0,.15), inset 0 1px 0 rgba(255,255,255,.05);
}
.sh-session-card.ongoing {
  border-color: rgba(16,185,129,.3);
  background: linear-gradient(135deg, rgba(16,185,129,.1) 0%, rgba(16,185,129,.04) 100%);
}
.sh-session-card:active { transform: scale(.985); }
.sh-card-top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 8px; }
.sh-session-info { flex: 1; min-width: 0; }
.sh-session-date { font-size: 12.5px; font-weight: 900; color: var(--text); }
.sh-session-meta { font-size: 9px; color: var(--text-secondary); margin-top: 1px; }
.sh-card-right { text-align: right; flex-shrink: 0; }
.sh-session-time { font-size: 18px; font-weight: 900; color: #10B981; line-height: 1; }
.sh-session-breaks { font-size: 8.5px; color: var(--text-secondary); margin-top: 1px; }
/* Stat row */
.sh-stat-row {
  display: flex; gap: 0;
  border-top: 1px solid rgba(255,255,255,.06); padding-top: 8px;
}
.sh-stat-item { flex: 1; text-align: center; border-right: 1px solid rgba(255,255,255,.06); padding: 0 2px; }
.sh-stat-item:last-child { border-right: none; }
.sh-stat-val { font-size: 11px; font-weight: 900; }
.sh-stat-lbl { font-size: 7.5px; color: var(--text-secondary); font-weight: 700; margin-top: 1px; display:flex; align-items:center; justify-content:center; gap:2px; }

/* Popup overlay */
.sh-popup-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 999;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.sh-popup-bg.show { opacity: 1; pointer-events: all; }
.sh-popup {
  background: var(--card-bg); border-radius: 24px 24px 0 0;
  width: 100%; max-width: 560px; padding: 20px 18px 32px;
  border: 1.5px solid var(--border); border-bottom: none;
  transform: translateY(40px); transition: transform .28s;
}
.sh-popup-bg.show .sh-popup { transform: translateY(0); }
.sh-popup-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
.sh-popup-date { font-size: 11px; font-weight: 800; color: var(--text-secondary); text-align: center; margin-bottom: 4px; }
.sh-popup-headline { font-size: 15px; font-weight: 900; color: var(--text); text-align: center; margin-bottom: 16px; }
.sh-popup-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.sh-popup-stat {
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 10px; text-align: center;
}
.sh-popup-stat-val { font-size: 18px; font-weight: 900; }
.sh-popup-stat-lbl { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 3px; }
.sh-feedback-box {
  background: rgba(99,102,241,.07); border: 1.5px solid rgba(99,102,241,.25);
  border-radius: 14px; padding: 12px 14px; font-size: 11px;
  color: var(--text); line-height: 1.7; font-weight: 600;
}
.sh-feedback-box b { color: var(--accent); }

/* ═══ ADVICE PANEL ═══ */
.sh-adv-headline { font-size: 15px; font-weight: 900; text-align: center; margin-bottom: 16px; line-height: 1.5; }
.sh-adv-stats { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; margin-bottom: 16px; }
.sh-adv-stat { background: var(--bg); border: 1px solid var(--border); border-radius: 12px; padding: 10px 6px; text-align: center; }
.sh-adv-stat-val { font-size: 14px; font-weight: 900; color: var(--text); }
.sh-adv-stat-lbl { font-size: 8px; color: var(--text-secondary); font-weight: 700; margin-top: 2px; }
.sh-adv-tips-title { font-size: 11px; font-weight: 800; color: var(--text-secondary); margin-bottom: 8px; }
.sh-adv-tip {
  display: flex; align-items: flex-start; gap: 8px;
  background: rgba(139,92,246,.06); border: 1px solid rgba(139,92,246,.18);
  border-radius: 10px; padding: 9px 11px; margin-bottom: 6px;
  font-size: 12px; line-height: 1.5; color: var(--text);
}
.sh-adv-dot { width: 6px; height: 6px; border-radius: 50%; background: #8B5CF6; flex-shrink: 0; margin-top: 5px; }

.sh-empty { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 12.5px; }
.sh-loading { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 12px; }

.global-back-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 6px 4px 6px 2px; line-height:1; }
.global-back-btn:active { opacity:0.6; }

/* Premium enhancements */
.sh-hero { padding: 10px 0 18px; }
.sh-hero-icon { display: flex; justify-content: center; margin-bottom: 8px; }
.sh-chart-card { box-shadow: 0 2px 16px rgba(0,0,0,.15); }
.sh-session-card { box-shadow: 0 2px 12px rgba(0,0,0,.12); }
.sh-summary-card {
  border-radius: 14px;
  box-shadow: 0 1px 8px rgba(0,0,0,.1);
}
.sh-summary-val { font-size: 17px; }
.sh-today-box { box-shadow: 0 2px 10px rgba(0,0,0,.1); transition: transform .15s; }
.sh-today-box:active { transform: scale(.97); }
.global-back-btn { display: flex; align-items: center; }
</style>
</head>

<script>
const SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
let isDarkMode = true, currentUser = null;

function showToast(m,d=2500){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),d);}
function toggleTheme(){isDarkMode=!isDarkMode;document.body.classList.toggle('dark-mode',isDarkMode);document.body.classList.toggle('light-mode',!isDarkMode);document.getElementById('themeToggle').textContent=isDarkMode?'🌙':'☀️';localStorage.setItem('atlas-theme',isDarkMode?'dark':'light');}
function goTo(u){location.href=u;}
function goBackGlobal(){
    try {
        const stack = JSON.parse(sessionStorage.getItem('atlas_nav_stack') || '[]');
        if (stack.length > 1) { stack.pop(); location.href = stack[stack.length - 1]; return; }
    } catch (_) {}
    location.href = 'index.html';
}
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function safeFetch(url, opts={}) {
  opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY }, opts.headers||{});
  if(!opts.headers['Content-Type'] && opts.method!=='DELETE') opts.headers['Content-Type']='application/json';
  try {
    const res = await fetch(url, opts);
    const text = await res.text();
    if(!text?.trim()) return [];
    const data = JSON.parse(text);
    if(!res.ok) throw new Error(data.message||'API Error');
    return data;
  } catch(e){ console.error('❌', e.message); return []; }
}

function fmtCompact(s) {
  s=Math.min(s,86400); // cap at 24h max per day
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtDisplay(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `0:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

const BN_DAYS = ['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
const BN_MONTHS = ['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্ট','অক্টো','নভে','ডিসে'];

function fmtDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return `${d.getDate()} ${BN_MONTHS[d.getMonth()]}`;
}

/* ═══ ALL DATA ═══ */
let allSessions=[], allDaily=[];

async function loadAllData(){
  if(!currentUser) return;
  const ph = encodeURIComponent(currentUser.phone);
  [allSessions, allDaily] = await Promise.all([
    safeFetch(`${SUPABASE_URL}/rest/v1/focus_sessions?user_phone=eq.${ph}&select=*&order=updated_at.desc&limit=500`),
    safeFetch(`${SUPABASE_URL}/rest/v1/study_tracker_daily?user_phone=eq.${ph}&select=*&order=study_date.desc&limit=200`),
  ]);
  renderChart();
  updateTodayBoxes();
  updatePeriodSummary(currentPeriodDays);
  renderSessionList(allSessions, allDaily);
  scheduleAutoRefresh();
}

/* ═══ PERIOD SUMMARY ═══ */
function setPeriod(days, btn){
  currentPeriodDays = days;

function updatePeriodSummary(days){
  const today = new Date().toISOString().slice(0,10);
  let since = null;
  if(days===1) since = today;
  else if(days>1) since = new Date(Date.now()-(days-1)*86400000).toISOString().slice(0,10);
  const filteredSess = allSessions.filter(s=>{
    if(!since) return true;
    const dt = s.updated_at||s.started_at;
    return dt && dt.slice(0,10) >= since;
  });
  // today boxes update
  const study = filteredSess.reduce((a,s)=>a+(s.study_seconds||0),0);
  const brk   = filteredSess.reduce((a,s)=>a+(s.break_seconds||0),0);
  const slp   = filteredSess.reduce((a,s)=>a+(s.sleep_seconds||0),0);
  document.getElementById('todayStudyBox').textContent = fmtHM(study)||'0m';
  document.getElementById('todayBreakBox').textContent = fmtHM(brk)||'0m';
  document.getElementById('todaySleepBox').textContent = fmtHM(slp)||'0m';
  // Label update
  const lbl = days===1?'আজকে':days===0?'সবসময়':`বিগত ${days} দিন`;
  document.getElementById('todayStudyBox').nextElementSibling.textContent = `📚 ${lbl}`;
}

/* ═══ CHART TOP BOXES — আজকের live update ═══ */
function updateTodayBoxes(){
  const today = new Date().toISOString().slice(0,10);
  const todaySess = allSessions.filter(s=>{
    const dt = s.updated_at||s.started_at; return dt&&dt.slice(0,10)===today;
  });
  const study = todaySess.reduce((a,s)=>a+(s.study_seconds||0),0);
  const brk   = todaySess.reduce((a,s)=>a+(s.break_seconds||0),0);
  const slp   = todaySess.reduce((a,s)=>a+(s.sleep_seconds||0),0);
  document.getElementById('todayStudyBox').textContent = fmtHM(study)||'0m';
  document.getElementById('todayBreakBox').textContent = fmtHM(brk)||'0m';
  document.getElementById('todaySleepBox').textContent = fmtHM(slp)||'0m';
}

/* ═══ CHART — last 7 days (max 24h per bar) ═══ */
function renderChart(){
  const today = new Date().toISOString().slice(0,10);
  const MAX_DAY = 86400; // ২৪ ঘন্টা = 86400 সেকেন্ড
  const days = [];

  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);

    // study_tracker_daily — backfill aggregated data
    const dailyRow = allDaily.find(r=>r.study_date===d);
    const dailySecs = Math.min(dailyRow?.total_seconds||0, MAX_DAY);

    // focus_sessions — started_at দিয়ে সেই দিনের sessions নাও
    const daySessions = allSessions.filter(s=>{
      const dt = s.started_at||s.updated_at;
      return dt && dt.slice(0,10)===d;
    });
    const seen = new Set();
    const sessSecs = Math.min(
      daySessions
        .filter(s=>{ if(seen.has(s.id)) return false; seen.add(s.id); return true; })
        .reduce((a,s)=>a+(s.study_seconds||0), 0),
      MAX_DAY
    );

    // daily backfill আর sessions — সর্বোচ্চ নাও, তবে ২৪h cap
    const secs = Math.min(Math.max(dailySecs, sessSecs), MAX_DAY);
    days.push({ date:d, secs, isToday:d===today });
  }

  const maxSecs = Math.max(...days.map(d=>d.secs), 1);
  document.getElementById('shChartRow').innerHTML = days.map(d=>{
    const heightPct = d.secs>0 ? Math.max(8, Math.round((d.secs/maxSecs)*90)) : 4;
    const dow = BN_DAYS[new Date(d.date+'T00:00:00').getDay()];
    const label = d.secs>=60 ? fmtHM(d.secs) : (d.secs>0?`${d.secs}s`:'—');
    return `<div class="sh-bar-wrap">
      <div class="sh-bar-val">${label}</div>
      <div class="sh-bar ${d.isToday?'sh-bar-today':''} ${d.secs===0?'sh-bar-zero':''}" style="height:${heightPct}%"></div>
      <div class="sh-bar-day ${d.isToday?'sh-bar-day-today':''}">${dow}</div>
    </div>`;
  }).join('');
}

/* ═══ RENDER SESSION LIST — একদিনে একটাই card ═══ */
function renderSessionList(sessions, daily){
  const list = document.getElementById('shSessionList');
  if(!sessions?.length && !daily?.length){
    list.innerHTML = `<div class="sh-empty">এখনো কোনো সেশন রেকর্ড নেই।<br><br>Focus Timer শুরু করো! 🚀</div>`;
    return;
  }

  // started_at দিয়ে group করো — session যেদিন শুরু সেটাই সেদিনের
  const byDate = {};
  (sessions||[]).forEach(s=>{
    const dt = s.started_at||s.updated_at;
    if(!dt) return;
    const dateKey = dt.slice(0,10);
    if(!byDate[dateKey]) byDate[dateKey]={
      dateKey, studySecs:0, breakSecs:0, sleepSecs:0, breaksUsed:0,
      sessionCount:0, latestStatus:'ended', latestUpdated:''
    };
    const g = byDate[dateKey];
    g.studySecs  += s.study_seconds||0;
    g.breakSecs  += s.break_seconds||0;
    g.sleepSecs  += s.sleep_seconds||0;
    g.breaksUsed += s.breaks_used||0;
    g.sessionCount++;
    // latest updated_at track করো — সবচেয়ে নতুন session এর status নাও
    const upd = s.updated_at||'';
    if(upd > g.latestUpdated){
      g.latestUpdated = upd;
      if(s.status && s.status!=='ended') g.latestStatus = s.status;
      else if(s.status==='ended') g.latestStatus = 'ended';
    }
  });

  // daily backfill
  (daily||[]).forEach(d=>{
    if(!byDate[d.study_date]){
      byDate[d.study_date]={
        dateKey:d.study_date,
        studySecs:d.total_seconds||0,
        breakSecs:0, sleepSecs:0, breaksUsed:0,
        sessionCount:1, latestStatus:'ended', latestUpdated:''
      };
    }
  });

  const sorted = Object.values(byDate).sort((a,b)=>b.dateKey.localeCompare(a.dateKey));

  list.innerHTML = sorted.map(g=>{
    const d = new Date(g.dateKey+'T00:00:00');
    const dateLabel = `${d.getDate()} ${BN_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    const dayLabel  = BN_DAYS[d.getDay()];
    const isOngoing = g.latestStatus!=='ended';
    return buildSessionCard({dateLabel, dayLabel, ...g, isOngoing});
  }).join('');
}

// Ongoing session থাকলে 30s এ auto-refresh
let autoRefreshTimer = null;
function scheduleAutoRefresh(){
  if(autoRefreshTimer) clearInterval(autoRefreshTimer);
  const hasOngoing = (allSessions||[]).some(s=>s.status && s.status!=='ended');
  if(hasOngoing){
    autoRefreshTimer = setInterval(async()=>{
      await loadAllData();
    }, 30000);
  }
}

        <div class="sh-stat-lbl"><svg width="8" height="8" viewBox="0 0 24 24" fill="none"><path d="M2 3h6a4 4 0 014 4v14a3 3 0 00-3-3H2z" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/><path d="M22 3h-6a4 4 0 00-4 4v14a3 3 0 013-3h7z" stroke="#10B981" stroke-width="2.5" stroke-linejoin="round"/></svg> পড়া</div>

/* ═══ CARD POPUP ═══ */
function openCardPopup(raw){
  let data;
  try { data = typeof raw==='string' ? JSON.parse(raw) : raw; } catch(e){ return; }
  const {dateLabel,dayLabel,studySecs,breakSecs,sleepSecs,breaksUsed,sessionCount,restSecs,isOngoing} = data;
  const totalActive = studySecs+breakSecs+sleepSecs;
  // Real data only — implied calculation সরানো হয়েছে
  const effectiveBreak = breakSecs;
  const effectiveSleep = sleepSecs;

  // Feedback generation
  const studyH = studySecs/3600;
  let feedback = '';
  if(studyH >= 8) feedback = `অসাধারণ! <b>${fmtHM(studySecs)}</b> পড়েছো — এটা একটা অবিশ্বাস্য দিন! 🏆`;
  else if(studyH >= 5) feedback = `দারুণ পারফরম্যান্স! <b>${fmtHM(studySecs)}</b> পড়েছো। ধারাবাহিকতা ধরে রাখো। 💪`;
  else if(studyH >= 3) feedback = `ভালো দিন! <b>${fmtHM(studySecs)}</b> পড়েছো। আরো একটু বাড়ালে আরো ভালো হবে। 📚`;
  else if(studyH >= 1) feedback = `<b>${fmtHM(studySecs)}</b> পড়েছো। ছোট শুরু থেকেই বড় লক্ষ্য — আরো সময় দেওয়ার চেষ্টা করো। 🌱`;
  else feedback = `এই দিন পড়াশোনা কম হয়েছে। আগামীকাল আরো মনোযোগ দিতে পারবে! 💡`;

  if(breaksUsed>0) feedback += ` ${breaksUsed}টি বিরতি নিয়েছো।`;

  document.getElementById('shPopupDate').textContent = `${dateLabel}, ${dayLabel}`;
  document.getElementById('shPopupHeadline').textContent = isOngoing ? '⏳ চলছে...' : '📊 দিনের সারসংক্ষেপ';
  document.getElementById('shPopupStudy').textContent = fmtHM(studySecs);
  document.getElementById('shPopupBreak').textContent = fmtHM(effectiveBreak);
  document.getElementById('shPopupSleep').textContent = fmtHM(effectiveSleep);
  document.getElementById('shPopupRest').textContent  = fmtHM(restSecs);
  document.getElementById('shPopupFeedback').innerHTML = feedback;
  document.getElementById('shPopupBg').classList.add('show');
}
function closeCardPopup(){ document.getElementById('shPopupBg').classList.remove('show'); }

function fmtHM(s){
  s = Math.max(0, Math.round(s));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m`;
  return `${s}s`;
}

function buildAdvice(){
  // গত ৭ দিনের raw data (allSessions থেকে started_at দিয়ে গ্রুপ করা — chart-এর মতই সঠিক হিসাব)
  const today = new Date().toISOString().slice(0,10);
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    const daySessions = (allSessions||[]).filter(s=>{
      const dt = s.started_at||s.updated_at;
      return dt && dt.slice(0,10)===d;
    });
    const studySecs = Math.min(daySessions.reduce((a,s)=>a+(s.study_seconds||0),0), 86400);
    const breakSecs = daySessions.reduce((a,s)=>a+(s.break_seconds||0),0);
    const sleepSecs = daySessions.reduce((a,s)=>a+(s.sleep_seconds||0),0);
    const breaksUsed = daySessions.reduce((a,s)=>a+(s.breaks_used||0),0);
    days.push({date:d, studySecs, breakSecs, sleepSecs, breaksUsed, isToday:d===today});
  }

  const totalStudy = days.reduce((a,d)=>a+d.studySecs,0);
  const avgStudy = totalStudy/7;
  const activeDays = days.filter(d=>d.studySecs>0).length;
  const totalBreaks = days.reduce((a,d)=>a+d.breaksUsed,0);
  const totalBreakSecs = days.reduce((a,d)=>a+d.breakSecs,0);
  const totalSleepSecs = days.reduce((a,d)=>a+d.sleepSecs,0);

  // consistency: কতগুলো দিন ০ পড়াশোনা
  const zeroDays = 7-activeDays;
  // trend: প্রথম ৩ দিন vs শেষ ৩ দিন (আজ বাদ দিয়ে)
  const firstHalf = days.slice(0,3).reduce((a,d)=>a+d.studySecs,0)/3;
  const lastHalf = days.slice(3,6).reduce((a,d)=>a+d.studySecs,0)/3;
  const trendUp = lastHalf > firstHalf*1.15;
  const trendDown = lastHalf < firstHalf*0.7;

  // সর্বোচ্চ ও সর্বনিম্ন দিন
  const sorted = [...days].sort((a,b)=>b.studySecs-a.studySecs);
  const bestDay = sorted[0];
  const BN_DAYS=['রবি','সোম','মঙ্গল','বুধ','বৃহঃ','শুক্র','শনি'];
  const bestDayName = bestDay.studySecs>0 ? BN_DAYS[new Date(bestDay.date+'T12:00:00Z').getUTCDay()] : null;

  let headline, tips=[], statusColor, statusIcon;

  // ═══ Condition-based variety advice ═══
  if(totalStudy===0){
    statusColor='#EF4444'; statusIcon='😴';
    headline='গত ৭ দিনে কোনো পড়াশোনার রেকর্ড নেই';
    tips.push('আজই Focus Timer চালু করে একটা ছোট ২৫ মিনিটের session দিয়ে শুরু করো।');
    tips.push('বড় লক্ষ্য না ভেবে প্রতিদিন মাত্র ৩০ মিনিট দিয়ে অভ্যাস তৈরি করো।');
  } else if(zeroDays>=4){
    statusColor='#F59E0B'; statusIcon='⚠️';
    headline='ধারাবাহিকতা অনেক কম — সপ্তাহে মাত্র ' + activeDays + ' দিন পড়েছো';
    tips.push('প্রতিদিন অল্প হলেও পড়ার অভ্যাস গড়ে তোলো — ধারাবাহিকতাই বড় ফলাফলের চাবিকাঠি।');
    tips.push('একটানা বেশি পড়ার চেয়ে প্রতিদিন নিয়মিত ১ ঘণ্টা পড়া বেশি কার্যকর।');
    if(bestDayName) tips.push(`${bestDayName}বার তুমি সবচেয়ে ভালো পড়েছিলে (${fmtHM(bestDay.studySecs)}) — সেই রুটিন বাকি দিনগুলোতেও রাখার চেষ্টা করো।`);
  } else if(trendDown){
    statusColor='#F59E0B'; statusIcon='📉';
    headline='পড়াশোনার সময় কমে আসছে — মনোযোগ ধরে রাখতে হবে';
    tips.push(`সপ্তাহের শুরুর দিকে গড়ে ${fmtHM(firstHalf)} পড়তে, এখন তা কমে ${fmtHM(lastHalf)} হয়েছে।`);
    tips.push('Break Mode ব্যবহার করে ছোট ছোট বিরতি নিয়ে ক্লান্তি কমাও, যাতে দীর্ঘ সময় মনোযোগ ধরে রাখতে পারো।');

    tips.push('বিরতির সময় ফোন থেকে দূরে থেকো, যাতে দ্রুত আবার মনোযোগ ফিরে আসে।');
  } else if(avgStudy >= 14400){ // 4h+ avg
    statusColor='#10B981'; statusIcon='🏆';
    headline='চমৎকার পারফরম্যান্স! গড়ে দৈনিক ' + fmtHM(avgStudy) + ' পড়ছো';
    tips.push('এই ধারাবাহিকতা বজায় রাখো — তুমি দারুণ পথে আছো!');
    if(totalSleepSecs/7 < 18000) tips.push('তবে ঘুমের প্রতি একটু বেশি যত্ন নাও — পর্যাপ্ত বিশ্রাম দীর্ঘমেয়াদে পড়াশোনার মান বাড়ায়।');
    else tips.push('ঘুম ও পড়াশোনার ভারসাম্য ভালো আছে — এভাবেই চালিয়ে যাও।');
  } else if(trendUp){
    statusColor='#10B981'; statusIcon='📈';
    headline='দারুণ! পড়াশোনার সময় বাড়ছে প্রতিদিন';
    tips.push(`সপ্তাহের শুরুতে গড়ে ${fmtHM(firstHalf)} ছিল, এখন ${fmtHM(lastHalf)} হয়েছে — চমৎকার উন্নতি!`);
    tips.push('এই গতি ধরে রাখলে সামনের সপ্তাহে আরও ভালো ফলাফল আসবে।');
  } else {
    statusColor='#6366F1'; statusIcon='💡';
    headline='মোটামুটি ভালো চলছে — আরেকটু ধারাবাহিক হলে আরও ভালো হবে';
    tips.push(`গত ৭ দিনে গড়ে দৈনিক ${fmtHM(avgStudy)} পড়েছো, মোট ${activeDays} দিন সক্রিয় ছিলে।`);
    tips.push('প্রতিদিন একটা নির্দিষ্ট সময়ে পড়তে বসার অভ্যাস করো — এতে মস্তিষ্ক স্বয়ংক্রিয়ভাবে প্রস্তুত হয়ে যাবে।');
    if(bestDayName) tips.push(`${bestDayName}বার তোমার সেরা দিন ছিল (${fmtHM(bestDay.studySecs)}) — কী আলাদা করেছিলে সেদিন, মনে করার চেষ্টা করো।`);
  }

  const tipsHtml = tips.map(t=>`<div class="sh-adv-tip"><span class="sh-adv-dot"></span>${t}</div>`).join('');

  return `
    <div class="sh-adv-headline" style="color:${statusColor}">
      <span style="font-size:20px">${statusIcon}</span> ${headline}
    </div>
    <div class="sh-adv-stats">
      <div class="sh-adv-stat"><div class="sh-adv-stat-val">${fmtHM(totalStudy)}</div><div class="sh-adv-stat-lbl">মোট পড়াশোনা</div></div>
      <div class="sh-adv-stat"><div class="sh-adv-stat-val">${activeDays}/৭</div><div class="sh-adv-stat-lbl">সক্রিয় দিন</div></div>
      <div class="sh-adv-stat"><div class="sh-adv-stat-val">${fmtHM(avgStudy)}</div><div class="sh-adv-stat-lbl">দৈনিক গড়</div></div>
    </div>
    <div class="sh-adv-tips-title">পরামর্শ</div>
    ${tipsHtml}
  `;
}

document.addEventListener('DOMContentLoaded', async () => {
    const saved = localStorage.getItem('atlas-theme');
    if (saved === 'light') { isDarkMode = false; document.body.classList.add('light-mode'); document.body.classList.remove('dark-mode'); document.getElementById('themeToggle').textContent = '☀️'; }
    try{ currentUser = JSON.parse(localStorage.getItem('atlas-session')); }catch(_){ currentUser=null; }
    if(!currentUser){ location.replace('auth.html'); return; }
    await loadAllData();
});

</script>

<script src="global-nav.js"></script>
<script src="atlas-ui.js"></script>
</body>
</html>
