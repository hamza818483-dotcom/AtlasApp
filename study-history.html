<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS APP · Study Time History</title>
<link rel="stylesheet" href="style.css">
<style>
.sh-container { max-width: 560px; margin: 0 auto; padding: 14px 14px 24px; }

.sh-hero { text-align: center; padding: 4px 0 14px; }
.sh-hero-icon { font-size: 28px; margin-bottom: 4px; }
.sh-hero-title { font-size: 17px; font-weight: 900; color: var(--text); }
.sh-hero-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* Summary cards */
.sh-summary-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.sh-summary-card {
  flex: 1; min-width: calc(33% - 6px); padding: 10px 6px;
  background: var(--card-bg);
  border: 1px solid var(--border); border-radius: 12px; text-align: center;
}
.sh-summary-val { font-size: 15px; font-weight: 900; color: var(--accent); }
.sh-summary-lbl { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 2px; }

/* Period row */
.sh-period-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
.sh-period-row::-webkit-scrollbar { display: none; }
.sh-period-btn {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--card-bg);
  color: var(--text-secondary); font-size: 10px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: all .2s;
}
.sh-period-btn.active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

/* Session card detail rows */
.sh-session-detail { font-size: 10px; color: var(--text-secondary); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; }
.sh-detail-chip { display: inline-flex; align-items: center; gap: 3px; }

/* Bar chart — last 7 days */
.sh-chart-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 12px; margin-bottom: 16px;
}
.sh-chart-title { font-size: 12px; font-weight: 800; color: var(--text); margin-bottom: 12px; }
.sh-chart-row { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
.sh-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.sh-bar { width: 100%; max-width: 26px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent), #4338CA); min-height: 3px; transition: height .4s ease; }
.sh-bar-today { background: linear-gradient(180deg, #10B981, #047857); }
.sh-bar-val { font-size: 8px; color: var(--text-secondary); font-weight: 700; }
.sh-bar-day { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 2px; }

/* Session list */
.sh-list-title { font-size: 12.5px; font-weight: 900; color: var(--text); margin: 4px 0 8px; }
.sh-session-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 11px 12px; margin-bottom: 8px; display: flex; align-items: center; gap: 10px;
}
.sh-session-icon { font-size: 18px; flex-shrink: 0; }
.sh-session-info { flex: 1; min-width: 0; }
.sh-session-date { font-size: 12px; font-weight: 800; color: var(--text); }
.sh-session-meta { font-size: 10px; color: var(--text-secondary); margin-top: 1px; }
.sh-session-time { font-size: 14px; font-weight: 900; color: var(--accent); text-align: right; flex-shrink: 0; }
.sh-session-breaks { font-size: 9px; color: var(--text-secondary); text-align: right; }

.sh-empty { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 12.5px; }
.sh-loading { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 12px; }

.global-back-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 6px 4px 6px 2px; line-height:1; }
.global-back-btn:active { opacity:0.6; }
</style>
</head>
<body class="dark-mode">

<header class="header">
    <div class="header-left">
        <button class="global-back-btn" onclick="goBackGlobal()" title="ফিরে যান" aria-label="ফিরে যান">←</button>
        <div class="atlas-brand-box" onclick="goTo('index.html')">
            <span class="atlas-brand-text">ATLAS APP</span>
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon" onclick="toggleTheme()" id="themeToggle">🌙</button>
    </div>
</header>

<main class="sh-container">

    <div class="sh-hero">
        <div class="sh-hero-icon">📊</div>
        <div class="sh-hero-title">Study Time History</div>
        <div class="sh-hero-sub">তোমার পড়াশোনার সম্পূর্ণ ইতিহাস</div>
    </div>

    <!-- Period buttons -->
    <div class="sh-period-row">
      <button class="sh-period-btn active" onclick="setPeriod(1,this)">আজকে</button>
      <button class="sh-period-btn" onclick="setPeriod(3,this)">বিগত ৩ দিন</button>
      <button class="sh-period-btn" onclick="setPeriod(7,this)">বিগত ৭ দিন</button>
      <button class="sh-period-btn" onclick="setPeriod(15,this)">বিগত ১৫ দিন</button>
      <button class="sh-period-btn" onclick="setPeriod(30,this)">বিগত ৩০ দিন</button>
      <button class="sh-period-btn" onclick="setPeriod(0,this)">সবসময়</button>
    </div>
    <!-- Summary cards — filled by JS -->
    <div class="sh-summary-row" id="shSummaryRow">
      <div class="sh-summary-card"><div class="sh-summary-val" id="shS1">—</div><div class="sh-summary-lbl" id="shL1">পড়েছে</div></div>
      <div class="sh-summary-card"><div class="sh-summary-val" id="shS2">—</div><div class="sh-summary-lbl" id="shL2">Break</div></div>
      <div class="sh-summary-card"><div class="sh-summary-val" id="shS3">—</div><div class="sh-summary-lbl" id="shL3">Sleep</div></div>
    </div>

    <div class="sh-chart-card">
        <div class="sh-chart-title">📈 গত ৭ দিনের পড়াশোনা</div>
        <div class="sh-chart-row" id="shChartRow"><div class="sh-loading">লোড হচ্ছে...</div></div>
    </div>

    <div class="sh-list-title">🗓️ সেশন তালিকা</div>
    <div id="shSessionList"><div class="sh-loading">লোড হচ্ছে...</div></div>

</main>

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
let isDarkMode = true, currentUser = null;

function showToast(m,d=2500){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),d);}
function toggleTheme(){isDarkMode=!isDarkMode;document.body.classList.toggle('dark-mode',isDarkMode);document.body.classList.toggle('light-mode',!isDarkMode);document.getElementById('themeToggle').textContent=isDarkMode?'🌙':'☀️';localStorage.setItem('atlas-theme',isDarkMode?'dark':'light');}
function goTo(u){location.href=u;}
function goBackGlobal(){ if(window.history.length>1){history.back();} else {location.href='study-aid.html';} }
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function safeFetch(url, opts={}) {
  opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY }, opts.headers||{});
  if(!opts.headers['Content-Type'] && opts.method!=='DELETE') opts.headers['Content-Type']='application/json';
  try {
    const res = await fetch(url, opts);
    const text = await res.text();
    if(!text?.trim()) return [];
    const data = JSON.parse(text);
    if(!res.ok) throw new Error(data.message||'API Error');
    return data;
  } catch(e){ console.error('❌', e.message); return []; }
}

function fmtCompact(s) {
  s=Math.min(s,86400); // cap at 24h max per day
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtDisplay(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `0:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

const BN_DAYS = ['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
const BN_MONTHS = ['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্ট','অক্টো','নভে','ডিসে'];

function fmtDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return `${d.getDate()} ${BN_MONTHS[d.getMonth()]}`;
}

/* ═══ ALL DATA ═══ */
let allSessions=[], allDaily=[];

async function loadAllData(){
  if(!currentUser) return;
  const ph = encodeURIComponent(currentUser.phone);
  [allSessions, allDaily] = await Promise.all([
    safeFetch(`${SUPABASE_URL}/rest/v1/focus_sessions?user_phone=eq.${ph}&select=*&order=updated_at.desc&limit=200`),
    safeFetch(`${SUPABASE_URL}/rest/v1/study_tracker_daily?user_phone=eq.${ph}&select=*&order=study_date.desc&limit=200`),
  ]);
  renderChart();
  setPeriod(1, document.querySelector('.sh-period-btn.active'));
  renderSessionList(allSessions, allDaily);
}

/* ═══ PERIOD SUMMARY ═══ */
function setPeriod(days, btn){
  document.querySelectorAll('.sh-period-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');

  const today = new Date().toISOString().slice(0,10);
  let since = null;
  if(days===1) since = today;
  else if(days>1) since = new Date(Date.now()-(days-1)*86400000).toISOString().slice(0,10);
  // days===0 → all time, since=null

  // Sum from focus_sessions (study_seconds is accurate)
  const filtered = allSessions.filter(s=>{
    if(!since) return true;
    const dt = s.started_at||s.created_at||s.updated_at;
    if(!dt) return false;
    return dt.slice(0,10) >= since;
  });

  const studyTotal = filtered.reduce((a,s)=>a+(s.study_seconds||0),0);
  const breakTotal = filtered.reduce((a,s)=>a+(s.break_seconds||0),0);
  const sleepTotal = filtered.reduce((a,s)=>a+(s.sleep_seconds||0),0);

  document.getElementById('shS1').textContent = fmtHM(studyTotal)||'0m';
  document.getElementById('shL1').textContent = 'পড়েছে';
  document.getElementById('shS2').textContent = fmtHM(breakTotal)||'0m';
  document.getElementById('shL2').textContent = 'Break';
  document.getElementById('shS3').textContent = fmtHM(sleepTotal)||'0m';
  document.getElementById('shL3').textContent = 'Sleep';
}

/* ═══ CHART — last 7 days from daily table ═══ */
function renderChart(){
  const today = new Date().toISOString().slice(0,10);
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);
    // Use focus_sessions study_seconds sum for this date (accurate)
    const dayStudy = allSessions
      .filter(s=>{ const dt=s.started_at||s.created_at||s.updated_at; return dt&&dt.slice(0,10)===d; })
      .reduce((a,s)=>a+(s.study_seconds||0),0);
    days.push({ date:d, secs:dayStudy, isToday:d===today });
  }
  const maxSecs = Math.max(...days.map(d=>d.secs), 300);
  document.getElementById('shChartRow').innerHTML = days.map(d=>{
    const heightPct = Math.max(3, Math.round((d.secs/maxSecs)*100));
    const dow = BN_DAYS[new Date(d.date+'T00:00:00').getDay()];
    return `<div class="sh-bar-wrap">
      <div class="sh-bar-val">${d.secs>60?fmtHM(d.secs):''}</div>
      <div class="sh-bar ${d.isToday?'sh-bar-today':''}" style="height:${heightPct}%"></div>
      <div class="sh-bar-day">${dow}</div>
    </div>`;
  }).join('');
}

/* ═══ RENDER SESSION LIST ═══ */
function renderSessionList(sessions, daily){
  const list = document.getElementById('shSessionList');

  if(sessions?.length){
    list.innerHTML = sessions.map(s=>{
      const rawTime = s.started_at||s.created_at||s.updated_at;
      const dt = rawTime ? new Date(rawTime) : null;
      const dateLabel = dt
        ? `${dt.getDate()} ${BN_MONTHS[dt.getMonth()]} ${dt.getFullYear()}`
        : '—';
      const studySecs = s.study_seconds||0;
      const breakSecs = s.break_seconds||0;
      const sleepSecs = s.sleep_seconds||0;
      const usedSecs  = studySecs+breakSecs+sleepSecs;
      const restSecs  = Math.max(0, 86400-usedSecs);
      return buildSessionCard({
        dateLabel, studySecs, breakSecs, sleepSecs,
        breaksUsed: s.breaks_used||0,
        restSecs, status: s.status||'ended'
      });
    }).join('');
    return;
  }

  // Fallback: daily table (no break/sleep data available)
  if(daily?.length){
    list.innerHTML = daily.map(s=>{
      const studySecs = s.study_seconds||0; // use study_seconds, NOT total_seconds
      const d = new Date(s.study_date+'T00:00:00');
      const dateLabel = `${d.getDate()} ${BN_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
      const restSecs = Math.max(0, 86400-studySecs);
      return buildSessionCard({ dateLabel, studySecs, breakSecs:0, sleepSecs:0, breaksUsed:0, restSecs, status:'ended' });
    }).join('');
    return;
  }

  list.innerHTML = `<div class="sh-empty">এখনো কোনো সেশন রেকর্ড নেই।<br><br>Focus Timer শুরু করো! 🚀</div>`;
}

function buildSessionCard({dateLabel, studySecs, breakSecs, sleepSecs, breaksUsed, restSecs, status}){
  const isOngoing = status && status!=='ended' && status!=='completed';
  const statusLabel = isOngoing
    ? (status==='break'?'☕ বিরতিতে' : status==='sleep'?'😴 ঘুমে' : '🟢 চলছে')
    : '✅ সেশন সম্পন্ন';

  const studyFmt = fmtHM(studySecs);
  const breakFmt = breakSecs>0 ? fmtHM(breakSecs) : null;
  const sleepFmt = sleepSecs>0 ? fmtHM(sleepSecs) : null;
  const restFmt  = restSecs>0  ? fmtHM(restSecs)  : null;

  const metaLines = [
    breakFmt  ? `☕ Break: ${breakFmt}` : null,
    sleepFmt  ? `😴 Sleep: ${sleepFmt}` : null,
    breaksUsed>0 ? `🔁 ${breaksUsed}টি বিরতি` : null,
    restFmt   ? `⏳ বাকি সময়: ${restFmt}` : null,
  ].filter(Boolean);

  return `<div class="sh-session-card">
    <div class="sh-session-icon">${isOngoing?'⏳':'📘'}</div>
    <div class="sh-session-info">
      <div class="sh-session-date">${escHtml(dateLabel)}</div>
      <div class="sh-session-meta">${statusLabel}</div>
      ${metaLines.map(l=>`<div class="sh-session-meta" style="margin-top:2px">${escHtml(l)}</div>`).join('')}
    </div>
    <div style="text-align:right;flex-shrink:0">
      <div class="sh-session-time">${studyFmt}</div>
      <div class="sh-session-breaks">পড়েছে</div>
    </div>
  </div>`;
}

function fmtHM(s){
  s = Math.max(0, Math.round(s));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m`;
  return `${s}s`;
}

document.addEventListener('DOMContentLoaded', async () => {
    const saved = localStorage.getItem('atlas-theme');
    if (saved === 'light') { isDarkMode = false; document.body.classList.add('light-mode'); document.body.classList.remove('dark-mode'); document.getElementById('themeToggle').textContent = '☀️'; }
    try{ currentUser = JSON.parse(localStorage.getItem('atlas-session')); }catch(_){ currentUser=null; }
    if(!currentUser){ location.replace('auth.html'); return; }
    await loadAllData();
});
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => history.back());
</script>

<script src="global-nav.js"></script>
<script src="atlas-ui.js"></script>
</body>
</html>
