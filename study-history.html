<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ATLAS APP · Study Time History</title>
<link rel="stylesheet" href="style.css">
<style>
.sh-container { max-width: 560px; margin: 0 auto; padding: 14px 14px 24px; }

.sh-hero { text-align: center; padding: 4px 0 14px; }
.sh-hero-icon { font-size: 28px; margin-bottom: 4px; }
.sh-hero-title { font-size: 17px; font-weight: 900; color: var(--text); }
.sh-hero-sub { font-size: 11px; color: var(--text-secondary); margin-top: 2px; }

/* Summary cards */
.sh-summary-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
.sh-summary-card {
  flex: 1; min-width: calc(33% - 6px); padding: 10px 6px;
  background: var(--card-bg);
  border: 1px solid var(--border); border-radius: 12px; text-align: center;
}
.sh-summary-val { font-size: 15px; font-weight: 900; color: var(--accent); }
.sh-summary-lbl { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 2px; }

/* Period row */
.sh-period-row { display: flex; gap: 6px; margin-bottom: 14px; overflow-x: auto; }
.sh-period-row::-webkit-scrollbar { display: none; }
.sh-period-btn {
  flex-shrink: 0; padding: 5px 12px; border-radius: 20px;
  border: 1px solid var(--border); background: var(--card-bg);
  color: var(--text-secondary); font-size: 10px; font-weight: 800;
  cursor: pointer; font-family: inherit; transition: all .2s;
}
.sh-period-btn.active {
  background: var(--accent); border-color: var(--accent); color: #fff;
}

/* Session card detail rows */
.sh-session-detail { font-size: 10px; color: var(--text-secondary); margin-top: 3px; display: flex; flex-wrap: wrap; gap: 6px; }
.sh-detail-chip { display: inline-flex; align-items: center; gap: 3px; }

/* আজকের ৩ box — chart এর উপরে */
.sh-today-row { display: flex; gap: 6px; margin-bottom: 10px; }
.sh-today-box {
  flex: 1; padding: 10px 8px; border-radius: 12px;
  border: 1.5px solid var(--border); text-align: center;
  background: var(--card-bg);
}
.sh-today-study { border-color: rgba(16,185,129,.3); background: rgba(16,185,129,.05); }
.sh-today-break { border-color: rgba(245,158,11,.3); background: rgba(245,158,11,.05); }
.sh-today-sleep { border-color: rgba(129,140,248,.3); background: rgba(129,140,248,.05); }
.sh-today-val { font-size: 16px; font-weight: 900; }
.sh-today-study .sh-today-val { color: #10B981; }
.sh-today-break .sh-today-val { color: #F59E0B; }
.sh-today-sleep .sh-today-val { color: #818CF8; }
.sh-today-lbl { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 3px; }

/* Bar chart — last 7 days */
.sh-chart-card {
  background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
  padding: 14px 12px; margin-bottom: 16px;
}
.sh-chart-title { font-size: 12px; font-weight: 800; color: var(--text); margin-bottom: 12px; }
.sh-chart-row { display: flex; align-items: flex-end; gap: 6px; height: 110px; }
.sh-bar-wrap { flex: 1; display: flex; flex-direction: column; align-items: center; height: 100%; justify-content: flex-end; gap: 4px; }
.sh-bar { width: 100%; max-width: 26px; border-radius: 6px 6px 2px 2px; background: linear-gradient(180deg, var(--accent), #4338CA); min-height: 4px; transition: height .5s ease; }
.sh-bar-today { background: linear-gradient(180deg, #10B981, #047857); }
.sh-bar-zero { background: var(--border); opacity: .5; }
.sh-bar-val { font-size: 7.5px; color: var(--text-secondary); font-weight: 800; text-align: center; white-space: nowrap; min-height: 12px; display: flex; align-items: flex-end; justify-content: center; }
.sh-bar-day { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 3px; }
.sh-bar-day-today { color: #10B981; font-weight: 900; }

/* Session list — premium */
.sh-list-title { font-size: 12.5px; font-weight: 900; color: var(--text); margin: 4px 0 8px; }
.sh-session-card {
  background: var(--card-bg);
  border: 1.5px solid var(--border);
  border-radius: 16px;
  padding: 14px 14px 12px;
  margin-bottom: 10px;
  cursor: pointer;
  transition: transform .15s, box-shadow .15s, border-color .15s;
  position: relative; overflow: hidden;
}
.sh-session-card::before {
  content: ''; position: absolute; left: 0; top: 0; bottom: 0;
  width: 3px; background: var(--accent); border-radius: 3px 0 0 3px;
}
.sh-session-card.ongoing::before { background: #10B981; }
.sh-session-card:active { transform: scale(.98); }
.sh-card-top { display: flex; align-items: flex-start; justify-content: space-between; margin-bottom: 10px; padding-left: 8px; }
.sh-session-icon { font-size: 16px; flex-shrink: 0; }
.sh-session-info { flex: 1; min-width: 0; padding-left: 8px; }
.sh-session-date { font-size: 13px; font-weight: 900; color: var(--text); }
.sh-session-meta { font-size: 9.5px; color: var(--text-secondary); margin-top: 2px; }
.sh-session-time { font-size: 20px; font-weight: 900; color: var(--accent); text-align: right; flex-shrink: 0; line-height: 1; }
.sh-session-breaks { font-size: 9px; color: var(--text-secondary); text-align: right; margin-top: 1px; }
/* Stat row inside card */
.sh-stat-row {
  display: flex; gap: 0; padding-left: 8px;
  border-top: 1px solid var(--border); padding-top: 9px; margin-top: 0;
}
.sh-stat-item {
  flex: 1; text-align: center;
  border-right: 1px solid var(--border);
  padding: 0 4px;
}
.sh-stat-item:last-child { border-right: none; }
.sh-stat-val { font-size: 12px; font-weight: 900; }
.sh-stat-lbl { font-size: 8px; color: var(--text-secondary); font-weight: 700; margin-top: 1px; }

/* Popup overlay */
.sh-popup-bg {
  position: fixed; inset: 0; background: rgba(0,0,0,.7); z-index: 999;
  display: flex; align-items: flex-end; justify-content: center;
  opacity: 0; pointer-events: none; transition: opacity .25s;
}
.sh-popup-bg.show { opacity: 1; pointer-events: all; }
.sh-popup {
  background: var(--card-bg); border-radius: 24px 24px 0 0;
  width: 100%; max-width: 560px; padding: 20px 18px 32px;
  border: 1.5px solid var(--border); border-bottom: none;
  transform: translateY(40px); transition: transform .28s;
}
.sh-popup-bg.show .sh-popup { transform: translateY(0); }
.sh-popup-handle { width: 36px; height: 4px; background: var(--border); border-radius: 4px; margin: 0 auto 16px; }
.sh-popup-date { font-size: 11px; font-weight: 800; color: var(--text-secondary); text-align: center; margin-bottom: 4px; }
.sh-popup-headline { font-size: 15px; font-weight: 900; color: var(--text); text-align: center; margin-bottom: 16px; }
.sh-popup-stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
.sh-popup-stat {
  background: var(--bg); border: 1px solid var(--border); border-radius: 12px;
  padding: 12px 10px; text-align: center;
}
.sh-popup-stat-val { font-size: 18px; font-weight: 900; }
.sh-popup-stat-lbl { font-size: 9px; color: var(--text-secondary); font-weight: 700; margin-top: 3px; }
.sh-feedback-box {
  background: rgba(99,102,241,.07); border: 1.5px solid rgba(99,102,241,.25);
  border-radius: 14px; padding: 12px 14px; font-size: 11px;
  color: var(--text); line-height: 1.7; font-weight: 600;
}
.sh-feedback-box b { color: var(--accent); }

.sh-empty { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 12.5px; }
.sh-loading { text-align: center; padding: 30px 10px; color: var(--text-secondary); font-size: 12px; }

.global-back-btn { background: none; border: none; color: var(--text); font-size: 20px; cursor: pointer; padding: 6px 4px 6px 2px; line-height:1; }
.global-back-btn:active { opacity:0.6; }
</style>
</head>

<main class="sh-container">

    <div class="sh-hero">

    <!-- Period buttons -->
    <div class="sh-period-row">
      <button class="sh-period-btn active" onclick="setPeriod(1,this)">আজকে</button>

      <button class="sh-period-btn" onclick="setPeriod(15,this)">বিগত ১৫ দিন</button>
      <button class="sh-period-btn" onclick="setPeriod(30,this)">বিগত ৩০ দিন</button>

</main>

<!-- Card Popup -->
<div class="sh-popup-bg" id="shPopupBg" onclick="closeCardPopup()">

<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
let isDarkMode = true, currentUser = null;

function showToast(m,d=2500){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),d);}
function toggleTheme(){isDarkMode=!isDarkMode;document.body.classList.toggle('dark-mode',isDarkMode);document.body.classList.toggle('light-mode',!isDarkMode);document.getElementById('themeToggle').textContent=isDarkMode?'🌙':'☀️';localStorage.setItem('atlas-theme',isDarkMode?'dark':'light');}
function goTo(u){location.href=u;}
function goBackGlobal(){ if(window.history.length>1){history.back();} else {location.href='study-aid.html';} }
function escHtml(s){return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}

async function safeFetch(url, opts={}) {
  opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer '+SUPABASE_KEY }, opts.headers||{});
  if(!opts.headers['Content-Type'] && opts.method!=='DELETE') opts.headers['Content-Type']='application/json';
  try {
    const res = await fetch(url, opts);
    const text = await res.text();
    if(!text?.trim()) return [];
    const data = JSON.parse(text);
    if(!res.ok) throw new Error(data.message||'API Error');
    return data;
  } catch(e){ console.error('❌', e.message); return []; }
}

function fmtCompact(s) {
  s=Math.min(s,86400); // cap at 24h max per day
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  return `${m}m`;
}
function fmtDisplay(s){
  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60),sec=s%60;
  if(h>0) return `${h}:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
  return `0:${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`;
}

const BN_DAYS = ['রবি','সোম','মঙ্গল','বুধ','বৃহ','শুক্র','শনি'];
const BN_MONTHS = ['জানু','ফেব্রু','মার্চ','এপ্রিল','মে','জুন','জুলাই','আগস্ট','সেপ্ট','অক্টো','নভে','ডিসে'];

function fmtDateLabel(dateStr){
  const d = new Date(dateStr+'T00:00:00');
  return `${d.getDate()} ${BN_MONTHS[d.getMonth()]}`;
}

/* ═══ ALL DATA ═══ */
let allSessions=[], allDaily=[];

async function loadAllData(){
  if(!currentUser) return;
  const ph = encodeURIComponent(currentUser.phone);
  [allSessions, allDaily] = await Promise.all([
    safeFetch(`${SUPABASE_URL}/rest/v1/focus_sessions?user_phone=eq.${ph}&select=*&order=updated_at.desc&limit=500`),
    safeFetch(`${SUPABASE_URL}/rest/v1/study_tracker_daily?user_phone=eq.${ph}&select=*&order=study_date.desc&limit=200`),
  ]);
  renderChart();
  updateTodayBoxes();
  setPeriod(currentPeriodDays, document.querySelector('.sh-period-btn.active'));
}

let currentPeriodDays = 1;

/* ═══ PERIOD SUMMARY ═══ */
function setPeriod(days, btn){
  currentPeriodDays = days;
  document.querySelectorAll('.sh-period-btn').forEach(b=>b.classList.remove('active'));
  if(btn) btn.classList.add('active');

  const today = new Date().toISOString().slice(0,10);
  let since = null;
  if(days===1) since = today;
  else if(days>1) since = new Date(Date.now()-(days-1)*86400000).toISOString().slice(0,10);

  // Session filter for this period
  const filteredSess = allSessions.filter(s=>{
    if(!since) return true;
    const dt = s.updated_at||s.started_at;
    return dt && dt.slice(0,10) >= since;
  });
  const filteredDaily = allDaily.filter(d=>{
    if(!since) return true;
    return d.study_date >= since;
  });

  // Summary cards
  const studyTotal = filteredSess.reduce((a,s)=>a+(s.study_seconds||0),0);
  const breakTotal = filteredSess.reduce((a,s)=>a+(s.break_seconds||0),0);
  const sleepTotal = filteredSess.reduce((a,s)=>a+(s.sleep_seconds||0),0);

  document.getElementById('shS1').textContent = fmtHM(studyTotal)||'0m';
  document.getElementById('shL1').textContent = days===1?'আজকে পড়েছে':`${days===0?'সব':'বিগত '+days+' দিন'}`;
  document.getElementById('shS2').textContent = fmtHM(breakTotal)||'0m';
  document.getElementById('shL2').textContent = 'Break';
  document.getElementById('shS3').textContent = fmtHM(sleepTotal)||'0m';
  document.getElementById('shL3').textContent = 'Sleep';

  // Session list — period অনুযায়ী filter
  renderSessionList(filteredSess, filteredDaily);
}

/* ═══ CHART TOP BOXES — আজকের live update ═══ */
function updateTodayBoxes(){
  const today = new Date().toISOString().slice(0,10);
  const todaySess = allSessions.filter(s=>{
    const dt = s.updated_at||s.started_at; return dt&&dt.slice(0,10)===today;
  });
  const study = todaySess.reduce((a,s)=>a+(s.study_seconds||0),0);
  const brk   = todaySess.reduce((a,s)=>a+(s.break_seconds||0),0);
  const slp   = todaySess.reduce((a,s)=>a+(s.sleep_seconds||0),0);
  document.getElementById('todayStudyBox').textContent = fmtHM(study)||'0m';
  document.getElementById('todayBreakBox').textContent = fmtHM(brk)||'0m';
  document.getElementById('todaySleepBox').textContent = fmtHM(slp)||'0m';
}

/* ═══ CHART — last 7 days ═══ */
function renderChart(){
  const today = new Date().toISOString().slice(0,10);
  const days = [];
  for(let i=6;i>=0;i--){
    const d = new Date(Date.now()-i*86400000).toISOString().slice(0,10);

    // study_tracker_daily থেকে আগের দিনের data
    const dailyRow = allDaily.find(r=>r.study_date===d);

    // focus_sessions থেকে সেদিনের sessions (updated_at দিয়ে group করলে ভুল হয়,
    // তাই session এর date হিসেবে updated_at এর date ব্যবহার করি — backfill এর সাথে মিলবে)
    const sessSecs = allSessions
      .filter(s=>{ const dt=s.updated_at||s.started_at; return dt&&dt.slice(0,10)===d; })
      .reduce((a,s)=>a+(s.study_seconds||0),0);

    // daily আর sessions — যেটা বেশি সেটা নাও (daily=aggregated, sessions=raw)
    const secs = Math.max(dailyRow?.total_seconds||0, sessSecs);
    days.push({ date:d, secs, isToday:d===today });
  }

  const maxSecs = Math.max(...days.map(d=>d.secs), 1);
  document.getElementById('shChartRow').innerHTML = days.map(d=>{
    const heightPct = d.secs>0 ? Math.max(8, Math.round((d.secs/maxSecs)*92)) : 4;
    const dow = BN_DAYS[new Date(d.date+'T00:00:00').getDay()];
    const label = d.secs>0 ? fmtHM(d.secs) : '—'; // সব bar এ label দেখাবে
    return `<div class="sh-bar-wrap">
      <div class="sh-bar-val">${label}</div>
      <div class="sh-bar ${d.isToday?'sh-bar-today':''} ${d.secs===0?'sh-bar-zero':''}" style="height:${heightPct}%"></div>
      <div class="sh-bar-day ${d.isToday?'sh-bar-day-today':''}">${dow}</div>
    </div>`;
  }).join('');
}

/* ═══ RENDER SESSION LIST — একদিনে একটাই card ═══ */
function renderSessionList(sessions, daily){
  const list = document.getElementById('shSessionList');
  if(!sessions?.length && !daily?.length){
    list.innerHTML = `<div class="sh-empty">এখনো কোনো সেশন রেকর্ড নেই।<br><br>Focus Timer শুরু করো! 🚀</div>`;
    return;
  }

  // sessions গুলোকে date অনুযায়ী group করো
  const byDate = {};
  (sessions||[]).forEach(s=>{
    const dt = s.updated_at||s.started_at;
    if(!dt) return;
    const dateKey = dt.slice(0,10);
    if(!byDate[dateKey]) byDate[dateKey]={
      dateKey, studySecs:0, breakSecs:0, sleepSecs:0, breaksUsed:0,
      sessionCount:0, latestStatus:'ended'
    };
    const g = byDate[dateKey];
    g.studySecs  += s.study_seconds||0;
    g.breakSecs  += s.break_seconds||0;
    g.sleepSecs  += s.sleep_seconds||0;
    g.breaksUsed += s.breaks_used||0;
    g.sessionCount++;
    // latest status — ongoing থাকলে সেটাই দেখাও
    if(s.status && s.status!=='ended') g.latestStatus = s.status;
  });

  // daily থেকে যে date নেই সেটা add করো (backfill data)
  (daily||[]).forEach(d=>{
    if(!byDate[d.study_date]){
      byDate[d.study_date]={
        dateKey:d.study_date,
        studySecs:d.total_seconds||0,
        breakSecs:0, sleepSecs:0, breaksUsed:0,
        sessionCount:1, latestStatus:'ended'
      };
    }
  });

  // date descending sort
  const sorted = Object.values(byDate).sort((a,b)=>b.dateKey.localeCompare(a.dateKey));

  list.innerHTML = sorted.map(g=>{
    const d = new Date(g.dateKey+'T00:00:00');
    const dateLabel = `${d.getDate()} ${BN_MONTHS[d.getMonth()]} ${d.getFullYear()}`;
    const dayLabel  = BN_DAYS[d.getDay()];
    const isOngoing = g.latestStatus!=='ended';
    return buildSessionCard({dateLabel, dayLabel, ...g, isOngoing});
  }).join('');
}

function buildSessionCard({dateLabel, dayLabel, dateKey, studySecs, breakSecs, sleepSecs, breaksUsed, sessionCount, isOngoing}){
  const statusLabel = isOngoing ? '🟢 চলছে' : '✅ সম্পন্ন';
  const studyFmt = fmtHM(studySecs);
  const breakFmt = fmtHM(breakSecs);
  const sleepFmt = fmtHM(sleepSecs);
  const totalUsed = studySecs+breakSecs+sleepSecs;
  const restSecs  = Math.max(0, 86400-totalUsed);
  const restFmt   = fmtHM(restSecs);
  const dataJson  = escHtml(JSON.stringify({dateLabel,dayLabel,studySecs,breakSecs,sleepSecs,breaksUsed,sessionCount,restSecs,isOngoing}));

  return `<div class="sh-session-card ${isOngoing?'ongoing':''}" onclick="openCardPopup(${dataJson})">
    <div class="sh-card-top">
      <div>
        <div class="sh-session-date">${escHtml(dateLabel)} <span style="font-size:9px;color:var(--text-secondary);font-weight:700">${escHtml(dayLabel)}</span></div>
        <div class="sh-session-meta">${statusLabel} · ${sessionCount}টি সেশন</div>
      </div>
      <div>
        <div class="sh-session-time">${studyFmt}</div>
        <div class="sh-session-breaks">পড়েছে</div>
      </div>
    </div>
    <div class="sh-stat-row">
      <div class="sh-stat-item">
        <div class="sh-stat-val" style="color:#10B981">${studyFmt}</div>
        <div class="sh-stat-lbl">📚 পড়া</div>
      </div>
      <div class="sh-stat-item">
        <div class="sh-stat-val" style="color:#F59E0B">${breakFmt}</div>
        <div class="sh-stat-lbl">☕ Break</div>
      </div>
      <div class="sh-stat-item">
        <div class="sh-stat-val" style="color:#818CF8">${sleepFmt}</div>
        <div class="sh-stat-lbl">😴 Sleep</div>
      </div>
      <div class="sh-stat-item">
        <div class="sh-stat-val" style="color:var(--text-secondary)">${restFmt}</div>
        <div class="sh-stat-lbl">⏳ বাকি</div>
      </div>
    </div>
  </div>`;
}

/* ═══ CARD POPUP ═══ */
function openCardPopup(data){
  const {dateLabel,dayLabel,studySecs,breakSecs,sleepSecs,breaksUsed,sessionCount,restSecs,isOngoing} = data;
  const totalActive = studySecs+breakSecs+sleepSecs;
  // Break/Sleep on না করলে যে সময় কাটিয়েছে সেটা break+sleep এ count হবে
  const impliedRest = Math.max(0, 86400-studySecs-breakSecs-sleepSecs);
  const effectiveBreak = breakSecs + Math.round(impliedRest*0.6); // 60% implied rest = break
  const effectiveSleep = sleepSecs + Math.round(impliedRest*0.4); // 40% implied rest = sleep

  // Feedback generation
  const studyH = studySecs/3600;
  let feedback = '';
  if(studyH >= 8) feedback = `অসাধারণ! <b>${fmtHM(studySecs)}</b> পড়েছো — এটা একটা অবিশ্বাস্য দিন! 🏆`;
  else if(studyH >= 5) feedback = `দারুণ পারফরম্যান্স! <b>${fmtHM(studySecs)}</b> পড়েছো। ধারাবাহিকতা ধরে রাখো। 💪`;
  else if(studyH >= 3) feedback = `ভালো দিন! <b>${fmtHM(studySecs)}</b> পড়েছো। আরো একটু বাড়ালে আরো ভালো হবে। 📚`;
  else if(studyH >= 1) feedback = `<b>${fmtHM(studySecs)}</b> পড়েছো। ছোট শুরু থেকেই বড় লক্ষ্য — আরো সময় দেওয়ার চেষ্টা করো। 🌱`;
  else feedback = `এই দিন পড়াশোনা কম হয়েছে। আগামীকাল আরো মনোযোগ দিতে পারবে! 💡`;

  if(breaksUsed>0) feedback += ` ${breaksUsed}টি বিরতি নিয়েছো।`;

  document.getElementById('shPopupDate').textContent = `${dateLabel}, ${dayLabel}`;
  document.getElementById('shPopupHeadline').textContent = isOngoing ? '⏳ চলছে...' : '📊 দিনের সারসংক্ষেপ';
  document.getElementById('shPopupStudy').textContent = fmtHM(studySecs);
  document.getElementById('shPopupBreak').textContent = fmtHM(effectiveBreak);
  document.getElementById('shPopupSleep').textContent = fmtHM(effectiveSleep);
  document.getElementById('shPopupRest').textContent  = fmtHM(restSecs);
  document.getElementById('shPopupFeedback').innerHTML = feedback;
  document.getElementById('shPopupBg').classList.add('show');
}
function closeCardPopup(){ document.getElementById('shPopupBg').classList.remove('show'); }

function fmtHM(s){
  s = Math.max(0, Math.round(s));
  const h=Math.floor(s/3600), m=Math.floor((s%3600)/60);
  if(h>0) return `${h}h ${m}m`;
  if(m>0) return `${m}m`;
  return `${s}s`;
}

});
