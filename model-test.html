<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP · মডেল টেস্ট</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .mt-container{max-width:560px;margin:0 auto;padding:12px 14px 80px;}
        .type-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
        .type-card{background:var(--card-bg);border:2px solid var(--border);border-radius:12px;padding:18px 12px;text-align:center;cursor:pointer;transition:all .2s;}
        .type-card:active{border-color:var(--accent);background:var(--accent-light);}
        .type-card-icon{font-size:28px;margin-bottom:6px;}
        .type-card-label{font-size:13px;font-weight:800;color:var(--text);}
        .type-card-sub{font-size:10px;color:var(--text-secondary);margin-top:2px;}
        .exam-card{background:var(--card-bg);border:1.5px solid var(--border);border-radius:12px;padding:14px;margin-bottom:10px;cursor:pointer;display:flex;align-items:center;gap:12px;transition:all .2s;}
        .exam-card:active{border-color:var(--accent);background:var(--accent-light);}
        .exam-card-icon{font-size:26px;flex-shrink:0;}
        .exam-card-info{flex:1;min-width:0;}
        .exam-card-title{font-size:14px;font-weight:800;color:var(--text);font-family:'Noto Sans Bengali',sans-serif;}
        .exam-card-sub{font-size:11px;color:var(--text-secondary);margin-top:2px;}
        .exam-card-badge{font-size:10px;font-weight:700;padding:3px 8px;border-radius:8px;background:var(--accent-light);color:var(--accent);flex-shrink:0;}
        .exam-card-arrow{color:var(--text-secondary);font-size:16px;flex-shrink:0;}
        .mt-section{font-size:12px;font-weight:800;color:var(--text-secondary);text-transform:uppercase;letter-spacing:.5px;margin:14px 0 8px;}
        .mt-back{display:flex;align-items:center;gap:6px;background:none;border:none;color:var(--text-secondary);font-size:13px;font-weight:700;cursor:pointer;padding:0;margin-bottom:14px;}
        .mt-back:active{opacity:.6;}
        .mt-empty{text-align:center;padding:40px 20px;color:var(--text-secondary);}
        .mt-empty-icon{font-size:40px;margin-bottom:10px;}
        .mt-empty-text{font-size:14px;font-weight:700;}
        .mt-loading{text-align:center;padding:30px;color:var(--text-secondary);font-size:13px;}
        .chip-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px;}
        .chip{padding:7px 14px;border-radius:20px;border:1.5px solid var(--border);cursor:pointer;font-size:12px;font-weight:600;color:var(--text-secondary);background:var(--option-bg);transition:.2s;}
        .chip.active{background:var(--accent-light);border-color:var(--accent);color:var(--accent);}
        .btn-start{width:100%;padding:14px;border:none;border-radius:12px;background:var(--accent);color:#fff;font-size:15px;font-weight:800;cursor:pointer;font-family:inherit;margin-top:10px;}
        .btn-start:active{opacity:.85;}
        .global-back-btn{background:none;border:none;color:var(--text);font-size:20px;cursor:pointer;padding:6px 4px 6px 2px;line-height:1;}
        .global-back-btn:active{opacity:.6;}
    </style>
</head>
<body class="dark-mode">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">ATLAS APP</div></div>
    <div class="sidebar-menu">
        <button class="sidebar-item" onclick="navigateTo('profile');closeSidebar();">👤 প্রোফাইল</button>
        <button class="sidebar-item" onclick="goTo('index.html');closeSidebar();">🏠 হোম</button>
        <button class="sidebar-item" onclick="goTo('class.html');closeSidebar();">📚 ফ্রি ক্লাস</button>
        <button class="sidebar-item" onclick="goTo('exam.html');closeSidebar();">📝 ফ্রি এক্সাম</button>
        <button class="sidebar-item" onclick="goTo('mock-test.html');closeSidebar();">🎯 মক টেস্ট</button>
        <button class="sidebar-item" onclick="goTo('profile.html#mistakes');closeSidebar();">⚠️ My Mistakes</button>
        <button class="sidebar-item" onclick="goTo('ai.html');closeSidebar();">🤖 ATLAS AI</button>
        <div class="sidebar-divider"></div>
        <button class="sidebar-item" onclick="toggleTheme()">🌙 ডার্ক মোড</button>
    </div>
    <div class="sidebar-footer">
        <button class="sidebar-item logout-btn" onclick="logout()">🚪 লগআউট</button>
    </div>
</aside>

<header class="header">
    <div class="header-left">
        <button class="global-back-btn" onclick="goBackGlobal()" title="ফিরে যান"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg></button>
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="atlas-brand-box" onclick="goTo('index.html')" style="display:flex;align-items:center;gap:6px;background:#0c191e;border:1px solid var(--border);border-radius:8px;padding:2px 6px;height:52px;box-sizing:border-box;cursor:pointer;">
            <img src="logo-icon.png" alt="ATLAS icon" style="height:100%;width:auto;display:block;image-rendering:-webkit-optimize-contrast;" onerror="this.style.display='none'">
            <img src="logo-text.png" alt="ATLAS APP" style="height:68%;width:auto;display:block;image-rendering:-webkit-optimize-contrast;" onerror="this.style.display='none'">
        </div>
    </div>
    <div class="header-right">
        <button class="header-icon" onclick="toggleTheme()" id="themeToggle">🌙</button>
        <button class="header-icon" onclick="navigateTo('profile')">👤</button>
    </div>
</header>

<main class="mt-container" id="mainContent">
    <div class="mt-loading">⏳ লোড হচ্ছে...</div>
</main>

<nav class="bottom-nav">
    <button class="nav-item" onclick="goTo('index.html')"><span class="nav-icon">🏠</span>হোম</button>
    <button class="nav-item" onclick="goTo('class.html')"><span class="nav-icon">📚</span>ক্লাস</button>
    <button class="nav-item" onclick="goTo('exam.html')"><span class="nav-icon">📝</span>এক্সাম</button>
    <button class="nav-item" onclick="goTo('mock-test.html')"><span class="nav-icon">🎯</span>মক</button>
    <button class="nav-item" onclick="goTo('study-aid.html')"><span class="nav-icon">🧩</span>Study Aid</button>
    <button class="nav-item" onclick="navigateTo('profile')"><span class="nav-icon">👤</span>প্রোফাইল</button>
</nav>

    <button class="fab fab-wa" onclick="openWA()"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347"/></svg></button>
    <button class="fab fab-tg" onclick="openTG()"><svg width="20" height="20" viewBox="0 0 24 24" fill="white"><path d="M12 0C5.373 0 0 5.373 0 12s5.373 12 12 12 12-5.373 12-12S18.627 0 12 0zm5.894 8.221l-1.97 9.28c-.145.658-.537.818-1.084.508l-3-2.21-1.446 1.394c-.14.18-.357.223-.548.082l.183-2.852 5.19-4.688c.226-.198-.05-.308-.348-.11l-6.415 4.04-2.762-.862c-.6-.186-.61-.6.127-.892l10.79-4.155c.497-.185.93.12.773.862z"/></svg></button>
</div>
<div class="toast" id="toast"></div>

<script>
const SUPABASE_URL='https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
let isDarkMode=true,isSidebarOpen=false;
let allTests=[],selectedExam=null,selectedCount=50;

const TYPE_INFO={
    board:     {icon:'📋',label:'বোর্ড মডেল',   sub:'Board questions'},
    medical:   {icon:'🏥',label:'Medical',        sub:'MBBS admission'},
    dental:    {icon:'🦷',label:'Dental',         sub:'BDS admission'},
    afmc:      {icon:'🎖️',label:'AFMC',           sub:'Armed Forces'},
    varsity:   {icon:'🎓',label:'Varsity',        sub:'University admission'},
    onushiloni:{icon:'🟠',label:'অনুশীলনী',      sub:'Practice tests'},
    model:     {icon:'📖',label:'Full Model',     sub:'Complete model test'},
};
const SUB_TYPE_LABEL={
    medical_subject:'Subject Final',medical_paper:'Paper Final',
    full:'Full Test',varsitywise:'Varsity-wise',chapter:'চ্যাপ্টারভিত্তিক',
};

function showToast(m,d=2000){const t=document.getElementById('toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),d);}
function toggleTheme(){isDarkMode=!isDarkMode;document.body.classList.toggle('dark-mode',isDarkMode);document.body.classList.toggle('light-mode',!isDarkMode);document.getElementById('themeToggle').textContent=isDarkMode?'☀️':'🌙';}
function goBackGlobal(){
    try {
        const stack = JSON.parse(sessionStorage.getItem('atlas_nav_stack') || '[]');
        if (stack.length > 1) { stack.pop(); location.href = stack[stack.length - 1]; return; }
    } catch (_) {}
    location.href = 'index.html';
}
function toggleSidebar(){isSidebarOpen=!isSidebarOpen;document.getElementById('sidebarOverlay').classList.toggle('active',isSidebarOpen);document.getElementById('sidebar').classList.toggle('active',isSidebarOpen);}
function closeSidebar(){isSidebarOpen=false;document.getElementById('sidebarOverlay').classList.remove('active');document.getElementById('sidebar').classList.remove('active');}
function goTo(u){location.href=u;}
function navigateTo(p){const r={home:'index.html',profile:'profile.html'};goTo(r[p]||'index.html');}
function openWA(){window.open('https://wa.me/8801999681290','_blank');}
function openTG(){window.open('https://t.me/rafi_somc','_blank');}
function logout(){localStorage.removeItem('atlas-session');goTo('index.html');}
function escHtml(s){return(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');}

async function safeFetch(url,opts={}){
    opts.headers=Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},opts.headers||{});
    try{const res=await fetch(url,opts);const text=await res.text();if(!text?.trim())return[];return JSON.parse(text);}
    catch(e){return[];}
}

function render(html){document.getElementById('mainContent').innerHTML=html;}

function renderTypeStep(){
    const types=[...new Set(allTests.map(t=>t.type).filter(Boolean))];
    if(!types.length){render('<div class="mt-empty"><div class="mt-empty-icon">📭</div><div class="mt-empty-text">কোনো মডেল টেস্ট এখনো যোগ করা হয়নি</div></div>');return;}
    const cards=types.map(type=>{
        const info=TYPE_INFO[type]||{icon:'📋',label:type,sub:''};
        const count=allTests.filter(t=>t.type===type).length;
        return `<div class="type-card" onclick="renderExamStep('${type}')">
            <div class="type-card-icon">${info.icon}</div>
            <div class="type-card-label">${info.label}</div>
            <div class="type-card-sub">${count}টি টেস্ট</div>
        </div>`;
    }).join('');
    render(`
        <div class="section-header"><div class="section-title">🧪 মডেল টেস্ট</div></div>
        <div style="font-size:13px;color:var(--text-secondary);margin-bottom:14px;">ক্যাটাগরি বেছে নিন</div>
        <div class="type-grid">${cards}</div>
    `);
}

function renderExamStep(type){
    const info=TYPE_INFO[type]||{icon:'📋',label:type};
    const tests=allTests.filter(t=>t.type===type);
    if(!tests.length){render('<div class="mt-empty"><div class="mt-empty-icon">📭</div><div class="mt-empty-text">কোনো টেস্ট পাওয়া যায়নি</div></div>');return;}
    const groups={};
    tests.forEach(t=>{const grp=t.sub_type||t.varsity_sub_type||'অন্যান্য';if(!groups[grp])groups[grp]=[];groups[grp].push(t);});
    let html=`<button class="mt-back" onclick="renderTypeStep()">← ফিরে যান</button>
        <div class="section-header"><div class="section-title">${info.icon} ${info.label}</div></div>`;
    Object.entries(groups).forEach(([grp,items])=>{
        html+=`<div class="mt-section">${SUB_TYPE_LABEL[grp]||grp}</div>`;
        items.forEach(t=>{
            const title=t.subject||t.varsity_name||t.subject_name||'টেস্ট';
            const sub=[t.chapter,t.unit,t.year].filter(Boolean).join(' · ');
            const qCount=t.question_count||(t.questions_json?(()=>{try{return JSON.parse(t.questions_json).length;}catch(e){return 0;}})():0);
            html+=`<div class="exam-card" onclick="renderExamDetail(${t.id})">
                <div class="exam-card-icon">${info.icon}</div>
                <div class="exam-card-info">
                    <div class="exam-card-title">${escHtml(title)}</div>
                    ${sub?`<div class="exam-card-sub">${escHtml(sub)}</div>`:''}
                </div>
                ${qCount?`<div class="exam-card-badge">${qCount}টি প্রশ্ন</div>`:''}
                <div class="exam-card-arrow">›</div>
            </div>`;
        });
    });
    render(html);
}

function renderExamDetail(id){
    const t=allTests.find(x=>x.id==id);
    if(!t){return;}
    selectedExam=t;
    const info=TYPE_INFO[t.type]||{icon:'📋',label:t.type};
    const title=t.subject||t.varsity_name||t.subject_name||'টেস্ট';
    const sub=[t.chapter,t.unit,t.year,t.varsity_name].filter(Boolean).join(' · ');
    let questions=[];
    try{questions=JSON.parse(t.questions_json||'[]');}catch(e){}
    const qCount=questions.length||parseInt(t.question_count)||0;

    if(t.link&&!qCount){
        render(`
            <button class="mt-back" onclick="renderExamStep('${t.type}')">← ফিরে যান</button>
            <div style="background:var(--card-bg);border:1.5px solid var(--border);border-radius:14px;padding:20px;text-align:center;">
                <div style="font-size:36px;margin-bottom:10px;">${info.icon}</div>
                <div style="font-size:18px;font-weight:900;color:var(--text);font-family:'Noto Sans Bengali',sans-serif;">${escHtml(title)}</div>
                ${sub?`<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${escHtml(sub)}</div>`:''}
                <button class="btn-start" onclick="window.open('${t.link}','_blank')" style="margin-top:16px;">🔗 টেস্ট খুলুন</button>
            </div>`);
        return;
    }

    selectedCount=Math.min(50,qCount);
    render(`
        <button class="mt-back" onclick="renderExamStep('${t.type}')">← ফিরে যান</button>
        <div style="background:var(--card-bg);border:1.5px solid var(--border);border-radius:14px;padding:20px;text-align:center;margin-bottom:14px;">
            <div style="font-size:36px;margin-bottom:8px;">${info.icon}</div>
            <div style="font-size:18px;font-weight:900;color:var(--text);font-family:'Noto Sans Bengali',sans-serif;">${escHtml(title)}</div>
            ${sub?`<div style="font-size:12px;color:var(--text-secondary);margin-top:4px;">${escHtml(sub)}</div>`:''}
            <div style="font-size:13px;color:var(--accent);font-weight:700;margin-top:10px;">${qCount}টি প্রশ্ন আছে</div>
        </div>
        <div style="font-size:12px;font-weight:700;color:var(--text-secondary);margin-bottom:8px;">❓ কতটি প্রশ্ন দিতে চান?</div>
        <div class="chip-row" id="cntChips">
            ${[25,50,75,100].filter(n=>n<=qCount).map(n=>`<span class="chip${n==selectedCount?' active':''}" onclick="setCnt(${n},this)">${n}</span>`).join('')}
            ${qCount>0?`<span class="chip${qCount==selectedCount?' active':''}" onclick="setCnt(${qCount},this)">সব (${qCount})</span>`:''}
        </div>
        <button class="btn-start" onclick="startModelTest()">▶️ পরীক্ষা শুরু করুন</button>
    `);
}

function setCnt(n,el){selectedCount=n;document.querySelectorAll('#cntChips .chip').forEach(c=>c.classList.remove('active'));el.classList.add('active');}

async function startModelTest(){
    if(!selectedExam)return;
    let questions=[];
    try{questions=JSON.parse(selectedExam.questions_json||'[]');}catch(e){}
    if(!questions.length){showToast('⚠️ প্রশ্ন পাওয়া যায়নি');return;}
    questions.sort(()=>Math.random()-0.5);
    const selected=questions.slice(0,selectedCount).map((q,i)=>({
        id:q.id?String(q.id):`mt_${i}_${Date.now()}`,question_text:q.question_text||q.questions||'',
        option1:q.option1||'',option2:q.option2||'',option3:q.option3||'',
        option4:q.option4||'',option5:q.option5||null,
        answer_index:q.answer_index||q.answer||1,explanation:q.explanation||'',image_url:q.image_url||null,
    }));
    const title=selectedExam.subject||selectedExam.varsity_name||'মডেল টেস্ট';
    const time=Math.ceil(selectedCount/1.5);
    sessionStorage.setItem('practiceQuestions',JSON.stringify(selected));
    sessionStorage.setItem('practiceTitle',title+' (Model Test)');
    sessionStorage.setItem('practiceSource','modeltest');
    sessionStorage.setItem('practiceTime',time);
    sessionStorage.removeItem('practicePages');
    goTo('exam.html?practice=modeltest');
}

async function init(){
    render('<div class="mt-loading">⏳ লোড হচ্ছে...</div>');
    try{
        allTests=await safeFetch(`${SUPABASE_URL}/rest/v1/model_tests?select=*&order=sort_order.asc,created_at.desc`);
        if(allTests?.length && window.offlineDB) window.offlineDB.cacheQuestions('model_tests_list', allTests).catch(()=>{});
    }catch(netErr){
        allTests = window.offlineDB ? await window.offlineDB.getCachedQuestions('model_tests_list') : null;
    }
    if(!allTests||!allTests.length){render('<div class="mt-empty"><div class="mt-empty-icon">📭</div><div class="mt-empty-text">কোনো মডেল টেস্ট এখনো যোগ করা হয়নি</div></div>');return;}
    renderTypeStep();
}

document.addEventListener('DOMContentLoaded',init);

</script>
<script src="offline-db.js"></script>
<script src="global-nav.js"></script>
<script src="atlas-ui.js"></script>
</body>
</html>
