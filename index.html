<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS EXAM</title>
    <style>
        :root {
            --bg: #0D1117; --card: #161B22; --hover: #1C2129;
            --text: #E6EDF3; --text2: #8B949E;
            --accent: #7C83FF; --accent-hover: #9499FF;
            --border: #30363D; --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --glow: 0 0 0 2px rgba(124,131,255,0.12);
            --radius: 14px; --radius-sm: 10px;
            --red: #F85149; --green: #3FB950; --yellow: #D29922;
            --cd-bg: #1A0A1A; --cd-border: #F85149; --cd-text: #FCA5A5;
            --cd-glow: rgba(248,81,73,0.35);
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 70px 0 70px;
            -webkit-font-smoothing: antialiased;
        }
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            background: var(--card); border-bottom: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-between;
            padding: 0 16px; z-index: 100; backdrop-filter: blur(12px);
        }
        .hamburger { background: none; border: none; color: var(--text); font-size: 22px; cursor: pointer; padding: 6px; }
        .logo { font-size: 20px; font-weight: 800; color: var(--accent); letter-spacing: -1px; }
        .header-icon { background: var(--card); border: 1px solid var(--border); color: var(--text); width: 36px; height: 36px; border-radius: 50%; font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .header-icon:hover { border-color: var(--accent); box-shadow: var(--glow); }
        
        .sidebar-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.6); z-index: 200; opacity: 0; visibility: hidden; transition: 0.2s; }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }
        .sidebar { position: fixed; top: 0; left: -280px; width: 280px; height: 100%; background: var(--card); z-index: 201; overflow-y: auto; transition: 0.2s; border-right: 1px solid var(--border); }
        .sidebar.active { left: 0; }
        .sidebar-header { background: var(--card); padding: 20px 16px; text-align: center; border-bottom: 1px solid var(--border); }
        .sidebar-logo { font-size: 20px; font-weight: 800; color: var(--accent); }
        .sidebar-item { display: flex; align-items: center; gap: 10px; padding: 12px 18px; color: var(--text2); border: none; background: none; width: 100%; text-align: left; font-size: 14px; cursor: pointer; transition: 0.2s; font-family: inherit; }
        .sidebar-item:hover { background: var(--hover); color: var(--text); }
        .sidebar-divider { height: 1px; background: var(--border); margin: 8px 0; }
        
        .bottom-nav {
            position: fixed; bottom: 0; left: 0; right: 0; height: 60px;
            background: var(--card); border-top: 1px solid var(--border);
            display: flex; align-items: center; justify-content: space-around; z-index: 100;
        }
        .nav-item { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: none; color: var(--text2); font-size: 10px; cursor: pointer; padding: 6px 10px; border-radius: 8px; transition: 0.2s; font-family: inherit; }
        .nav-item.active { color: var(--accent); }
        .nav-item .nav-icon { font-size: 20px; }
        
        .floating-buttons { position: fixed; bottom: 80px; right: 16px; display: flex; flex-direction: column; gap: 8px; z-index: 99; }
        .fab { width: 42px; height: 42px; border-radius: 50%; border: none; font-size: 18px; cursor: pointer; color: #fff; display: flex; align-items: center; justify-content: center; transition: 0.2s; box-shadow: var(--shadow); }
        .fab-wa { background: #25D366; } .fab-wa:hover { transform: scale(1.08); }
        .fab-tg { background: #0088CC; } .fab-tg:hover { transform: scale(1.08); }
        
        .toast { position: fixed; top: 70px; left: 50%; transform: translateX(-50%); background: var(--card); color: var(--text); border: 1px solid var(--accent); padding: 10px 20px; border-radius: 20px; font-size: 13px; font-weight: 600; z-index: 999; opacity: 0; transition: 0.2s; pointer-events: none; }
        .toast.show { opacity: 1; }
        
        .main-container { max-width: 520px; margin: 0 auto; padding: 12px 14px 20px; }
        
        /* Timer */
        .countdown-card {
            background: var(--cd-bg); border: 1px solid var(--cd-border);
            border-radius: var(--radius); padding: 20px 18px; margin-bottom: 14px;
            text-align: center; box-shadow: 0 0 20px var(--cd-glow);
            animation: pulseRed 2.5s ease-in-out infinite;
        }
        @keyframes pulseRed { 0%,100%{box-shadow: 0 0 20px var(--cd-glow);} 50%{box-shadow: 0 0 32px rgba(248,81,73,0.45);} }
        .timer-label { font-size: 11px; font-weight: 700; color: var(--cd-text); opacity: 0.8; text-transform: uppercase; letter-spacing: 1.5px; margin-bottom: 8px; }
        .timer-topic { font-size: 20px; font-weight: 800; color: #fff; margin-bottom: 2px; }
        .timer-subtopic { font-size: 12px; color: var(--cd-text); opacity: 0.7; margin-bottom: 12px; }
        .timer-clock-row { display: flex; align-items: center; justify-content: center; gap: 8px; }
        .timer-clock { font-size: 28px; }
        .timer-time { font-size: 28px; font-weight: 800; color: var(--cd-text); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
        .timer-labels { display: flex; justify-content: center; gap: 20px; font-size: 10px; color: var(--cd-text); opacity: 0.5; margin-top: 4px; }
        
        /* Special Card */
        .special-card {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; margin-bottom: 14px;
            text-align: center; box-shadow: var(--shadow);
        }
        .special-card img { max-width: 100%; max-height: 160px; border-radius: 10px; object-fit: cover; margin-bottom: 8px; }
        .special-text { font-size: 13px; color: var(--text2); margin-bottom: 6px; }
        .special-link { display: inline-block; padding: 8px 18px; background: var(--accent); color: #fff; border-radius: 20px; font-size: 12px; font-weight: 700; text-decoration: none; transition: 0.2s; }
        .special-link:hover { background: var(--accent-hover); transform: translateY(-1px); }
        
        /* Buttons */
        .home-buttons { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .home-btn {
            background: var(--card); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 14px 10px;
            font-size: 13px; font-weight: 600; color: var(--text);
            text-align: center; cursor: pointer; transition: all 0.2s;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
        }
        .home-btn:hover { border-color: var(--accent); box-shadow: var(--glow); transform: translateY(-2px); }
        .home-btn-full { grid-column: 1/-1; }
        .home-btn .btn-icon { font-size: 24px; }
        .home-btn .btn-text { font-size: 11px; line-height: 1.2; }
        .home-btn.admin-btn { border-color: var(--red); color: var(--red); }
        .home-btn.admin-btn:hover { background: #1A0A0A; box-shadow: 0 0 16px rgba(248,81,73,0.25); }
        
        /* Social */
        .social-row { display: flex; justify-content: center; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .social-chip {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 6px 12px; border-radius: 20px; font-size: 11px; font-weight: 600;
            background: var(--card); border: 1px solid var(--border);
            color: var(--text2); text-decoration: none; transition: 0.2s;
        }
        .social-chip:hover { border-color: var(--accent); color: var(--text); }
        
        /* Owner */
        .owner-section { display: flex; flex-direction: column; align-items: center; margin: 20px 0 16px; }
        .owner-name-top { font-size: 15px; font-weight: 700; color: var(--accent); margin-bottom: 8px; }
        .flip-card-owner { width: 120px; height: 120px; perspective: 800px; cursor: pointer; }
        .flip-card-owner.flipped .flip-card-inner-owner { transform: rotateY(180deg); }
        .flip-card-inner-owner { position: relative; width: 100%; height: 100%; transition: 0.5s; transform-style: preserve-3d; }
        .flip-front-owner, .flip-back-owner { position: absolute; width: 100%; height: 100%; backface-visibility: hidden; border-radius: var(--radius-sm); }
        .flip-front-owner { background: var(--card); border: 1px solid var(--border); display: flex; align-items: center; justify-content: center; }
        .flip-back-owner { background: var(--card); border: 1px solid var(--accent); transform: rotateY(180deg); padding: 10px; text-align: center; font-size: 10px; color: var(--text2); display: flex; align-items: center; justify-content: center; }
        .owner-photo-wrapper { position: relative; width: 100px; height: 100px; }
        .owner-photo-box { width: 100px; height: 100px; border-radius: 10px; object-fit: cover; border: 2px solid var(--border); position: relative; z-index: 2; }
        .owner-glow-box { position: absolute; top: -6px; left: -6px; width: 112px; height: 112px; border-radius: 14px; border: 2px solid transparent; border-top-color: var(--accent); border-right-color: var(--accent); animation: rotateGlowBox 2s linear infinite; z-index: 1; pointer-events: none; }
        @keyframes rotateGlowBox { 0%{transform:rotate(0deg);box-shadow:0 0 8px rgba(124,131,255,0.15);} 50%{box-shadow:0 0 18px rgba(124,131,255,0.3);} 100%{transform:rotate(360deg);box-shadow:0 0 8px rgba(124,131,255,0.15);} }
        
        /* Modal */
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 300; display: none; align-items: center; justify-content: center; }
        .modal-overlay.active { display: flex; }
        .modal { background: var(--card); border: 1px solid var(--border); border-radius: var(--radius); padding: 18px; max-width: 480px; width: 94%; max-height: 85vh; overflow-y: auto; }
        .modal-title { font-size: 17px; font-weight: 700; color: var(--accent); margin-bottom: 14px; text-align: center; }
        .modal .btn { padding: 9px 14px; border-radius: var(--radius-sm); font-weight: 600; cursor: pointer; border: none; font-size: 12px; width: 100%; margin-top: 6px; font-family: inherit; transition: 0.2s; }
        .btn-outline { background: transparent; border: 1px solid var(--border); color: var(--text2); }
        .btn-outline:hover { border-color: var(--accent); color: var(--text); }
        .btn-primary { background: var(--accent); color: #fff; }
        .btn-success { background: var(--green); color: #fff; }
        .btn-danger { background: var(--red); color: #fff; }
        
        .card-row { display: flex; justify-content: space-between; padding: 6px 0; border-bottom: 1px solid var(--border); font-size: 12px; }
        .mistake-item { background: var(--hover); border: 1px solid var(--border); border-radius: var(--radius-sm); padding: 12px; margin-bottom: 8px; }
        .mistake-item summary { font-weight: 700; font-size: 13px; cursor: pointer; color: var(--text); }
        .mistake-item summary:hover { color: var(--accent); }
        .mistake-item .dropdown-actions { display: flex; flex-direction: column; gap: 4px; margin-top: 8px; }
        
        .filter-row { display: flex; gap: 6px; margin-bottom: 10px; flex-wrap: wrap; }
        .filter-row select { padding: 6px 10px; border: 1px solid var(--border); border-radius: 6px; background: var(--bg); color: var(--text); font-size: 11px; font-family: inherit; }
        
        @media(min-width: 600px) { .home-buttons { grid-template-columns: 1fr 1fr 1fr; } }
    </style>
</head>

<script>
const SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
let isDarkMode = true, isSidebarOpen = false;

function showToast(m, d = 2000) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), d); }
function toggleTheme() { isDarkMode = !isDarkMode; document.body.classList.toggle('dark-mode', isDarkMode); showToast(isDarkMode ? '🌙 ডার্ক' : '☀️ লাইট'); }
function toggleSidebar() { isSidebarOpen = !isSidebarOpen; document.getElementById('sidebarOverlay').classList.toggle('active', isSidebarOpen); document.getElementById('sidebar').classList.toggle('active', isSidebarOpen); }
function closeSidebar() { isSidebarOpen = false; document.getElementById('sidebarOverlay').classList.remove('active'); document.getElementById('sidebar').classList.remove('active'); }
function goTo(u) { location.href = u; }
function navigateTo(p) { const r = { home:'index.html', profile:'dashboard.html', class:'class.html', exam:'exam.html' }; goTo(r[p]||'index.html'); }
function openWA() { window.open('https://wa.me/8801999681290', '_blank'); }
function openTG() { window.open('https://t.me/rafi_somc', '_blank'); }

async function safeFetch(url, opts = {}) {
    opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, opts.headers || {});
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE') opts.headers['Content-Type'] = 'application/json';
    try { const res = await fetch(url, opts); const text = await res.text(); if (!text?.trim()) return []; const data = JSON.parse(text); if (!res.ok) throw new Error(data.message); return data; }
    catch(e) { console.error('❌', e.message); return []; }
}

// ========== TIMERS ==========
async function loadTimers() {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/countdowns?select=*&order=created_at.desc&limit=5`);
        if (!data?.length) return;
        const container = document.getElementById('timerContainer');
        let html = '';
        const colors = ['#FCA5A5','#60A5FA','#4ADE80','#F472B6','#FB923C'];
        data.forEach((cd, i) => {
            const color = colors[i % colors.length];
            html += `<div class="countdown-card" style="--cd-text:${color};--cd-glow:rgba(${i===0?'248,81,73':i===1?'96,165,250':i===2?'74,222,128':i===3?'244,114,182':'251,146,60'},0.35);border-color:${color};box-shadow:0 0 20px rgba(${i===0?'248,81,73':i===1?'96,165,250':i===2?'74,222,128':i===3?'244,114,182':'251,146,60'},0.3);animation:pulseRed 2.5s ease-in-out infinite;">
                <div class="timer-label">ATLAS Timer-${String(i+1).padStart(2,'0')}</div>
                <div class="timer-topic">${cd.main_topic}</div>
                ${cd.subtopic ? `<div class="timer-subtopic">${cd.subtopic}</div>` : ''}
                <div class="timer-clock-row"><span class="timer-clock">🕐</span><span class="timer-time countdown-timer-${i}">-- : -- : -- : --</span></div>
                <div class="timer-labels"><span>দিন</span><span>ঘণ্টা</span><span>মিনিট</span><span>সেকেন্ড</span></div>
            </div>`;
            setTimeout(() => startCountdown(cd.end_time, `.countdown-timer-${i}`), i * 100);
        });
        container.innerHTML = html;
    } catch(e) {}
}

function startCountdown(endTime, selector) {
    const target = new Date(endTime);
    const el = document.querySelector(selector);
    if (!el) return;
    function update() {
        const diff = target - new Date();
        if (diff <= 0) { el.textContent = '০০ : ০০ : ০০ : ০০'; return; }
        const d = Math.floor(diff/(1000*60*60*24));
        const h = Math.floor((diff%(1000*60*60*24))/(1000*60*60));
        const m = Math.floor((diff%(1000*60*60))/(1000*60));
        const s = Math.floor((diff%(1000*60))/1000);
        el.textContent = `${String(d).padStart(2,'0')} : ${String(h).padStart(2,'0')} : ${String(m).padStart(2,'0')} : ${String(s).padStart(2,'0')}`;
    }
    update(); setInterval(update, 1000);
}

// ========== SPECIAL CARD ==========
async function loadSpecialCards() {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/special_cards?select=*&order=created_at.desc&limit=1`);
        if (!data?.length) return;
        const s = data[0];
        let html = '<div class="special-card">';
        if (s.image_url) html += `<img src="${s.image_url}" alt="Special">`;
        if (s.description) html += `<div class="special-text">${s.description}</div>`;
        if (s.special_text && s.link) html += `<a href="${s.link}" target="_blank" class="special-link">${s.special_text}</a>`;
        else if (s.special_text) html += `<span class="special-link" style="cursor:default;">${s.special_text}</span>`;
        html += '</div>';
        document.getElementById('specialCardContainer').innerHTML = html;
    } catch(e) {}
}

// ========== SOCIAL ==========
async function loadSocialLinks() {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/social_links?select=*&order=created_at.desc&limit=20`);
        if (!data?.length) return;
        const icons = { facebook:'📘', youtube:'▶️', telegram:'✈️', whatsapp:'💬', other:'🔗' };
        document.getElementById('socialRow').innerHTML = data.map(s => `<a href="${s.link}" target="_blank" class="social-chip">${icons[s.type]||'🔗'} ${s.media_name}</a>`).join('');
    } catch(e) {}
}

// ========== OWNER ==========
function loadOwnerInfo() {
    const photo = localStorage.getItem('owner_photo');
    const name = localStorage.getItem('owner_name');
    const info = localStorage.getItem('owner_info');
    if (name) document.getElementById('ownerNameTop').textContent = name;
    if (info) document.getElementById('ownerInfoBack').innerHTML = info.replace(/\n/g, '<br>');
    if (photo) { const img = document.getElementById('ownerPhoto'); img.src = photo; img.style.display = 'block'; document.getElementById('ownerPhotoFallback').style.display = 'none'; }
}

// ========== ADMIN CHECK ==========
function checkAdmin() {
    try { const sess = JSON.parse(localStorage.getItem('atlas-session')); if (sess?.phone === '01754365403' || sess?.role === 'admin') document.getElementById('adminBtn').style.display = 'flex'; } catch(e) {}
}
// Mentors
async function loadMentors() {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/mentors?select=*&order=sort_order,created_at&limit=6`);
        if (!data?.length) return;
        let html = '<div style="text-align:center;margin:16px 0;"><div style="font-size:12px;color:var(--accent);font-weight:700;margin-bottom:8px;">👨‍🏫 Mentors</div><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">';
        data.forEach(m => {
            html += `<div style="text-align:center;width:80px;"><img src="${m.photo_url||''}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;border:2px solid var(--border);" onerror="this.style.display='none'"><div style="font-size:10px;font-weight:600;margin-top:3px;">${m.name}</div><div style="font-size:9px;color:var(--text2);">${m.role||''}</div></div>`;
        });
        html += '</div></div>';
        document.querySelector('.owner-section').insertAdjacentHTML('afterend', html);
    } catch(e) {}
}
// ========== MODAL ==========
function openModal(type) {
    const mc = document.getElementById('modalContent');
    let html = '';
    if (type === 'mistakes') {
        html = '<div class="modal-title">⚠️ My Mistakes</div>';
        const sess = localStorage.getItem('atlas-session');
        if (!sess) { html += '<p style="color:var(--text2);text-align:center;">লগইন করুন</p>'; }
        else {
            const user = JSON.parse(sess);
            safeFetch(`${SUPABASE_URL}/rest/v1/exam_results?phone=eq.${user.phone}&select=*&order=submitted_at.desc&limit=30`).then(data => {
                let h = '';
                if (!data?.length) h = '<p style="text-align:center;color:var(--text2);padding:20px;">কোনো ভুল উত্তর নেই</p>';
                else {
                    h += '<div class="filter-row"><select id="mistakeFilterCat" onchange="filterMistakes()"><option value="all">সব ক্যাটাগরি</option></select><select id="mistakeFilterSub" onchange="filterMistakes()"><option value="all">সব সাবজেক্ট</option></select></div>';
                    h += `<div id="mistakeList">`;
                    data.forEach((r, i) => {
                        if ((r.wrong||0) > 0 || (r.skipped||0) > 0) {
                            h += `<details class="mistake-item"><summary>📝 এক্সাম #${r.exam_id} — ❌${r.wrong||0} ⏭️${r.skipped||0} <span style="font-size:10px;color:var(--text2);">${new Date(r.submitted_at).toLocaleDateString('bn-BD')}</span></summary><div class="dropdown-actions"><button class="btn btn-outline" onclick="goTo('exam.html?id=${r.exam_id}')">📋 বিস্তারিত দেখো</button><button class="btn btn-success" onclick="practiceMode(${r.exam_id},'skip')">🔁 Practice-01 (শুধু স্কিপ)</button><button class="btn btn-primary" onclick="practiceMode(${r.exam_id},'all')">🔁 Practice-02 (ভুল+স্কিপ)</button></div></details>`;
                        }
                    });
                    h += `</div>`;
                    if (!h.includes('details')) h = '<p style="text-align:center;color:var(--text2);padding:20px;">সব সঠিক! 🎉</p>';
                }
                document.getElementById('modalContent').innerHTML = '<div class="modal-title">⚠️ My Mistakes</div>' + h + '<button class="btn btn-outline" onclick="closeModal()" style="margin-top:8px;">✕ বন্ধ</button>';
            });
        }
    } else if (type === 'modeltest') {
        html = '<div class="modal-title">📖 Model Test</div>';
        html += '<button class="btn btn-outline" onclick="closeModal();goTo(\'exam.html?cat=model&sub=medical_subject\')">◾ Medical (Subject Final)</button>';
        html += '<button class="btn btn-outline" onclick="closeModal();goTo(\'exam.html?cat=model&sub=medical_paper\')">◾ Medical (Paper Final)</button>';
        html += '<button class="btn btn-primary" onclick="closeModal();goTo(\'exam.html?cat=model&sub=full\')">◾ Full Model Test</button>';
        html += '<p style="font-size:10px;color:var(--text2);margin:6px 0;text-align:center;">Bio=30, Chem=25, Phy=15, GK=15, Eng=15</p>';
        html += '<button class="btn btn-outline" onclick="closeModal();goTo(\'exam.html?cat=model&sub=varsity\')">◾ Varsity</button>';
        html += '<button class="btn btn-outline" onclick="closeModal()" style="margin-top:6px;">✕ বন্ধ</button>';
    }
    mc.innerHTML = html; document.getElementById('mainModal').classList.add('active');
}
function closeModal() { document.getElementById('mainModal').classList.remove('active'); }
function filterMistakes() { showToast('🔜 ফিল্টার শীঘ্রই'); }
function practiceMode(id, mode) { showToast('🔜 Practice-0' + (mode==='skip'?'1':'2') + ' — শীঘ্রই'); }

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
    loadTimers();
    loadSpecialCards();
    loadSocialLinks();
    loadOwnerInfo();
    checkAdmin();
});
