<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>ATLAS APP</title>

    <!-- PWA Support (Flutter: flutter_pwa / manifest) -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#0D1117">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="ATLAS APP">

    <link rel="stylesheet" href="style.css">

    <style>
        /* =============================================
           FLUTTER-FRIENDLY CSS ARCHITECTURE
           Every section maps to a Flutter Widget/Screen
        ============================================= */

        /* ── Theme Variables (Flutter: ThemeData / ColorScheme) ── */
        :root {
            --bg: #0D1117;
            --card-bg: #161B22;
            --card-hover: #1C2129;
            --text: #E6EDF3;
            --text-secondary: #8B949E;
            --accent: #7C83FF;
            --accent-hover: #9499FF;
            --border: #30363D;
            --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --shadow-sm: 0 1px 4px rgba(0,0,0,0.2);
            --shadow-glow: 0 0 0 2px rgba(124,131,255,0.15);
            --radius: 14px;
            --radius-md: 10px;
            --radius-sm: 8px;
            --radius-full: 999px;
            --error: #F85149;
            --error-light: rgba(248,81,73,0.08);
            --error-glow: 0 0 0 2px rgba(248,81,73,0.2);
            --success: #3FB950;
            --yellow: #D29922;
            --blue: #58A6FF;
            /* Timer palette */
            --t1: #F85149; --t2: #3B82F6; --t3: #22C55E; --t4: #EC4899; --t5: #F97316;
        }

        body.light-mode {
            --bg: #F6F8FA;
            --card-bg: #FFFFFF;
            --card-hover: #F0F2F5;
            --text: #1C2129;
            --text-secondary: #57606A;
            --border: #D0D7DE;
            --shadow: 0 2px 8px rgba(0,0,0,0.08);
            --shadow-sm: 0 1px 3px rgba(0,0,0,0.06);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Noto Sans Bengali', 'Inter', system-ui, sans-serif;
            background: var(--bg);
            color: var(--text);
            min-height: 100vh;
            padding: 56px 0 64px;
            -webkit-font-smoothing: antialiased;
            transition: background 0.3s, color 0.3s;
        }
        body.dark-mode { /* kept for existing compatibility */ }

        /* ── Animations ── */
        @keyframes pulseGlow {
            0%,100% { box-shadow: 0 0 10px var(--timer-glow, rgba(124,131,255,.25)); }
            50%      { box-shadow: 0 0 22px var(--timer-glow, rgba(124,131,255,.5)); }
        }
        @keyframes specialGlow {
            0%,100% { box-shadow: 0 0 8px rgba(248,81,73,.3),0 0 16px rgba(248,81,73,.15); border-color: rgba(248,81,73,.6); }
            50%      { box-shadow: 0 0 18px rgba(248,81,73,.5),0 0 32px rgba(248,81,73,.25); border-color: rgba(248,81,73,1); }
        }
        @keyframes rotateGlowBox { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes brandPulse {
            0%,100% { filter: drop-shadow(0 0 4px rgba(124,131,255,.4)); }
            50%      { filter: drop-shadow(0 0 10px rgba(124,131,255,.75)); }
        }
        @keyframes notifPulse {
            0%,100% { box-shadow: 0 0 0 0 rgba(248,81,73,.5); }
            50%      { box-shadow: 0 0 0 5px rgba(248,81,73,0); }
        }
        @keyframes fadeUp { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
        @keyframes shimmer { from { background-position:200% 0; } to { background-position:-200% 0; } }

        /* ─────────────────────────────────────────────
           HEADER  (Flutter: AppBar)
        ───────────────────────────────────────────── */
        .header {
            position: fixed; top: 0; left: 0; right: 0; height: 56px;
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            display: flex; align-items: center;
            justify-content: space-between; padding: 0 12px; z-index: 100;
            transition: background .3s;
        }
        .header-left  { display:flex; align-items:center; gap:8px; }
        .header-right { display:flex; align-items:center; gap:6px; }

        .hamburger {
            background: none; border: none; color: var(--text);
            font-size: 22px; cursor: pointer; padding: 6px; line-height:1;
        }
        /* Global back button — always navigates exactly one step back in real browser history */
        .global-back-btn {
            background: none; border: none; color: var(--text);
            font-size: 20px; cursor: pointer; padding: 6px 4px 6px 2px; line-height:1;
        }
        .global-back-btn:active { opacity:0.6; }

        /* Brand box  (Flutter: AnimatedLogo widget) — clean, no hazy glow */
        .atlas-brand-box {
            display: flex; align-items: center; gap: 7px;
            background: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 8px; padding: 3px 8px; height: 46px; box-sizing: border-box;
            cursor: pointer; transition: border-color .2s ease;
        }
        .atlas-brand-box:active { border-color: var(--accent); }
        .atlas-logo-img { height: 100%; width: auto; display: block; }
        .atlas-logo-full { height: 100%; }
        .atlas-brand-text { font-size: 17px; font-weight: 800; color: var(--accent); letter-spacing: -.5px; }

        /* Header icon buttons */
        .header-icon {
            background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text); width: 34px; height: 34px; border-radius: 50%;
            font-size: 15px; cursor: pointer; display: flex;
            align-items: center; justify-content: center; transition: .2s;
            position: relative;
        }
        .header-icon:hover { border-color: var(--accent); box-shadow: var(--shadow-glow); }

        /* Notification badge on header  (Flutter: Badge widget) */
        .notif-header-badge {
            position: absolute; top: -3px; right: -3px;
            min-width: 16px; height: 16px; border-radius: 8px;
            background: var(--error); color: #fff;
            font-size: 8px; font-weight: 800;
            display: none; align-items: center; justify-content: center;
            border: 2px solid var(--card-bg); padding: 0 3px;
            animation: notifPulse 1.5s infinite;
        }
        .notif-header-badge.show { display: flex; }

        /* Notification dropdown  (Flutter: OverlayEntry / PopupMenu) */
        .notif-dropdown {
            position: absolute; top: 50px; right: 10px; width: 300px;
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); box-shadow: 0 8px 32px rgba(0,0,0,.4);
            z-index: 500; display: none; max-height: 360px; overflow-y: auto;
            animation: fadeUp .2s;
        }
        .notif-dropdown.open { display: block; }
        .notif-dropdown-header {
            padding: 4px 18px; font-size: 12px; font-weight: 700;
            color: var(--accent); border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
        }
        .notif-dropdown-item {
            padding: 4px 18px; border-bottom: 1px solid var(--border);
            cursor: pointer; transition: .15s;
        }
        .notif-dropdown-item:hover { background: var(--card-hover); }
        .notif-dropdown-item.unread { background: rgba(124,131,255,.04); }
        .notif-dropdown-item-title { font-size: 12px; font-weight: 700; color: var(--text); }
        .notif-dropdown-item-msg { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .notif-dropdown-item-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--accent); display: inline-block; margin-right: 4px;
        }
        .notif-dropdown-footer {
            padding: 4px 18px; text-align: center; font-size: 11px;
            color: var(--accent); cursor: pointer; font-weight: 600;
        }
        .notif-dropdown-footer:hover { opacity: .75; }
        .notif-dropdown-empty { padding: 20px; text-align: center; font-size: 12px; color: var(--text-secondary); }

        /* ─────────────────────────────────────────────
           SIDEBAR  (Flutter: Drawer)
        ───────────────────────────────────────────── */
        .sidebar-overlay {
            position: fixed; inset: 0;
            background: rgba(0,0,0,.6); backdrop-filter: blur(2px);
            z-index: 200; opacity: 0; visibility: hidden; transition: .25s;
        }
        .sidebar-overlay.active { opacity: 1; visibility: visible; }

        .sidebar {
            position: fixed; top: 0; left: -288px; width: 288px; height: 100%;
            background: var(--card-bg); z-index: 201; overflow-y: auto;
            transition: .25s cubic-bezier(.4,0,.2,1);
            border-right: 1px solid var(--border);
            display: flex; flex-direction: column;
            scrollbar-width: thin; scrollbar-color: var(--border) transparent;
        }
        .sidebar.active { left: 0; }
        .sidebar::-webkit-scrollbar { width: 4px; }
        .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }

        .sidebar-header {
            background: linear-gradient(135deg,rgba(124,131,255,.15),rgba(88,166,255,.06));
            padding: 4px 18px; border-bottom: 1px solid var(--border);
            text-align: center; flex-shrink: 0;
        }
        .sidebar-logo { font-size: 18px; font-weight: 800; color: var(--accent); }
        .sidebar-logo-sub { font-size: 9px; color: var(--text-secondary); margin-top: 2px; letter-spacing: .5px; }

        .sidebar-menu { flex: 1; padding: 6px 0; }

        .sidebar-item {
            display: flex; align-items: center; gap: 10px;
            padding: 4px 18px; color: var(--text-secondary);
            border: none; background: none; width: 100%;
            text-align: left; font-size: 13px; cursor: pointer;
            transition: .18s; font-family: inherit;
            border-left: 3px solid transparent;
        }
        .sidebar-item:hover { background: var(--card-hover); color: var(--text); border-left-color: var(--accent); }
        .sidebar-item .si-icon { font-size: 16px; min-width: 20px; }
        .sidebar-divider { height: 1px; background: var(--border); margin: 6px 0; }

        /* Social items with platform SVG logos */
        .sidebar-item.social-fb:hover { color: #1877F2; border-left-color: #1877F2; }
        .sidebar-item.social-yt:hover { color: #FF0000; border-left-color: #FF0000; }
        .sidebar-item.social-tg:hover { color: #0088CC; border-left-color: #0088CC; }
        .sidebar-item.social-wa:hover { color: #25D366; border-left-color: #25D366; }

        .sidebar-footer { flex-shrink: 0; padding: 8px 0; border-top: 1px solid var(--border); }
        .sidebar-item.logout-btn { color: var(--error); }
        .sidebar-item.logout-btn:hover { background: rgba(248,81,73,.08); border-left-color: var(--error); }
        .sidebar-item.admin-sidebar { color: #FFD700; }
        .sidebar-item.admin-sidebar:hover { background: rgba(255,215,0,.06); border-left-color: #FFD700; }

        /* ─────────────────────────────────────────────
           MAIN CONTAINER
        ───────────────────────────────────────────── */
        .main-container { max-width: 580px; margin: 0 auto; padding: 12px 14px 10px; }

        /* ─────────────────────────────────────────────
           SPECIAL CARD  (Flutter: SpecialCard widget)
        ───────────────────────────────────────────── */
        .special-card {
            background: var(--card-bg); border: 2px solid #F85149;
            border-radius: var(--radius); padding: 0 0 14px;
            margin-bottom: 14px; text-align: center;
            box-shadow: var(--shadow-sm);
            animation: specialGlow 2s ease-in-out infinite;
            overflow: hidden;
        }
        .special-card img {
            /* 100% width, auto height, no crop per spec */
            width: 100%; height: auto; display: block;
            object-fit: contain; margin-bottom: 10px;
        }
        .special-text {
            font-size: 12px; color: var(--text-secondary);
            margin: 0 14px 10px; font-family: 'Noto Sans Bengali','Inter',sans-serif;
            line-height: 1.7; text-align: left; white-space: pre-line;
        }
        /* Markdown / bullet style text */
        .special-text-body { padding: 0 14px; text-align: left; }
        .special-text-body p { font-size: 12px; color: var(--text-secondary); margin-bottom: 4px; line-height: 1.7; }

        /* Clickable link — center, animated  (Flutter: AnimatedButton) */
        .special-link-wrap { display: flex; justify-content: center; margin-top: 6px; }
        .special-link {
            display: inline-block; padding: 4px 18px;
            background: linear-gradient(135deg,var(--accent),var(--blue));
            color: #fff; border-radius: var(--radius-full);
            font-size: 12px; font-weight: 700; text-decoration: none;
            transition: all .25s; box-shadow: 0 2px 10px rgba(124,131,255,.3);
            animation: brandPulse 2.5s ease-in-out infinite;
        }
        .special-link:hover { transform: scale(1.05); box-shadow: 0 4px 18px rgba(124,131,255,.5); }

        /* ─────────────────────────────────────────────
           SLIDESHOW  (Flutter: AutoSlideCarousel widget)
           Header-এর ঠিক নিচে। Right-to-left auto-slide,
           প্রতি ২ সেকেন্ড পর পর। ছবি সাইজ অনুযায়ী auto-height।
        ───────────────────────────────────────────── */
        .slideshow-wrap {
            position: relative; width: 100%; overflow: hidden;
            border-radius: var(--radius); margin-bottom: 14px;
            box-shadow: var(--shadow-sm); background: var(--card-bg);
        }
        .slideshow-track {
            display: flex; width: 100%;
            transition: transform .6s ease-in-out;
            touch-action: pan-y; /* vertical scroll pass-through, horizontal handled by JS swipe */
            cursor: grab;
        }
        .slideshow-track:active { cursor: grabbing; }
        .slideshow-slide {
            flex: 0 0 100%; width: 100%; min-width: 100%;
        }
        .slideshow-slide img {
            width: 100%; height: auto; display: block; object-fit: contain;
        }
        .slideshow-dots {
            position: absolute; bottom: 8px; left: 0; right: 0;
            display: flex; justify-content: center; gap: 6px;
        }
        .slideshow-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: rgba(255,255,255,0.5); transition: all .25s;
        }
        .slideshow-dot.active { background: #fff; width: 16px; border-radius: 3px; }

        /* ── Compact mode — premium centered card, smaller, eye-catching shadow ── */
        .slideshow-wrap.compact-mode {
            background: transparent; box-shadow: none; border-radius: 0;
            display: block; padding: 6px 0 16px;
        }
        /* বাইরের viewport — এখানেই clip হয়, পাশের slide কখনো বের হয়ে আসবে না */
        .slideshow-wrap.compact-mode .slideshow-viewport {
            width: 62%; margin: 0 auto; overflow: hidden; border-radius: 16px;
            box-shadow: 0 8px 28px rgba(0,0,0,.35), 0 2px 8px rgba(108,99,255,.25);
        }
        .slideshow-wrap.compact-mode .slideshow-track {
            width: 100%;
        }
        .slideshow-wrap.compact-mode .slideshow-slide {
            /* সব ছবি ঠিক একই আকারের বক্সে বসবে — ছবির আসল সাইজ/অনুপাত যাই হোক না কেন */
            width: 100%; aspect-ratio: 1 / 1;
            background: linear-gradient(145deg, rgba(108,99,255,.10), rgba(108,99,255,.03));
            display: flex; align-items: center; justify-content: center;
            overflow: hidden;
        }
        .slideshow-wrap.compact-mode .slideshow-slide img {
            width: 100%; height: 100%;
            /* object-fit: contain — ছবি crop না করে ছোট করে পুরোটা বক্সের মধ্যে দেখাবে (zoom out), সব ছবির final সাইজ সমান */
            object-fit: contain;
            transition: transform .2s ease;
        }
        .slideshow-wrap.compact-mode .slideshow-slide img:active { transform: scale(.97); }
        .slideshow-wrap.compact-mode .slideshow-dots { bottom: -12px; }
        .slideshow-wrap.compact-mode .slideshow-dot { background: rgba(108,99,255,.35); }
        .slideshow-wrap.compact-mode .slideshow-dot.active { background: var(--accent, #6C63FF); }

        /* Fullscreen zoom overlay when tapping a compact-mode image */
        .slideshow-zoom-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,.85); z-index: 998;
            display: flex; align-items: center; justify-content: center;
            opacity: 0; pointer-events: none; transition: opacity .2s;
        }
        .slideshow-zoom-bg.show { opacity: 1; pointer-events: all; }
        .slideshow-zoom-bg img { max-width: 92%; max-height: 86%; border-radius: 12px; box-shadow: 0 10px 40px rgba(0,0,0,.6); }

        /* ── Review Section — home page একদম নিচে ── */
        .review-section { margin: 22px 0 10px; padding: 0 14px; }

        /* Title container — চারপাশে bg box, ২ পাশে ঘুরন্ত তারা */
        .review-title-box {
            display: flex; align-items: center; justify-content: center; gap: 8px;
            background: linear-gradient(135deg, rgba(108,99,255,.12), rgba(255,215,0,.05));
            border: 1px solid rgba(108,99,255,.25); border-radius: 14px;
            padding: 10px 14px; margin-bottom: 12px;
        }
        .review-star-spin {
            font-size: 16px; display: inline-block; animation: reviewStarSpin 2.5s linear infinite;
        }
        @keyframes reviewStarSpin { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }

        /* Animated title — shimmer effect, main "ATLAS All Courses" title-এর মতোই gradient shine */
        .review-section-title {
            font-size: 19px; font-weight: 900; letter-spacing: .3px;
            background: linear-gradient(90deg,
                #FFD700 0%, #FFF5A0 20%, #FFFFFF 40%, #6C63FF 60%, #FFE566 80%, #FFD700 100%);
            background-size: 250% auto;
            -webkit-background-clip: text; background-clip: text;
            -webkit-text-fill-color: transparent; color: transparent;
            animation: reviewTitleShimmer 3.5s linear infinite;
        }
        @keyframes reviewTitleShimmer { 0% { background-position: 0% center; } 100% { background-position: -250% center; } }

        /* Category cards — একটা বড় box-এর ভেতরে ৪টা ছোট card, এক row-তে পাশাপাশি */
        .review-cat-box {
            display: flex; gap: 6px; padding: 10px; margin-bottom: 16px;
            background: var(--card-bg); border: 1px solid var(--border); border-radius: 14px;
            box-shadow: 0 3px 14px rgba(0,0,0,.12);
        }
        .review-cat-tile {
            position: relative; border-radius: 10px; overflow: hidden; cursor: pointer;
            flex: 1; padding: 10px 4px; background: linear-gradient(145deg, rgba(108,99,255,.10), rgba(108,99,255,.02));
            border: 1px solid rgba(108,99,255,.2);
            transition: transform .15s;
            display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px;
        }
        .review-cat-tile:active { transform: scale(.93); }
        .review-cat-tile .rct-emoji { font-size: 17px; }
        .review-cat-tile .rct-label { color: var(--text); font-size: 10.5px; font-weight: 900; letter-spacing: .1px; text-align: center; }
        .review-cat-tile .rct-count { color: var(--text-secondary); font-size: 8.5px; font-weight: 600; }
        .review-cat-tile.empty { opacity: .4; cursor: default; }

        /* Category card গুলোর নিচে — সব ধরনের review image, smooth right-to-left auto-slide,
   সাথে touch/swipe ও arrow+dot দিয়ে manual navigation। শুধু ছবির চারপাশের ঘুরন্ত বর্ডার
   animation বাদ দেওয়া হয়েছে (rv-img-frame এখন plain static ফ্রেম, glow spin নেই)। */
        .review-all-slideshow-title { font-size: 12px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; }
        /* বাইরের ভিউপোর্ট — reference ছবির মতো peek-carousel: বড় center card, দুই পাশে ছোট peek */
        .review-all-slideshow-viewport { position: relative; width: 100%; overflow: hidden; padding: 6px 0 4px; }
        .review-all-slideshow-track { display: flex; align-items: center; transition: transform .45s ease; }
        /* প্রতিটা slide viewport-এর ৭৮% জায়গা নেয়, দুই পাশে ১১% করে ফাঁকা রেখে — সেই ফাঁকা থেকেই
           পাশের card-এর প্রান্ত (peek) সামান্য উঁকি দেয়, ঠিক reference ছবির মতো */
        .review-all-slideshow-slide { flex: 0 0 78%; padding: 0 3%; box-sizing: border-box; transition: opacity .35s, transform .35s; }
        .review-all-slideshow-slide:not(.rv-active) { opacity: .45; transform: scale(.92); }
        .review-all-slideshow-slide.rv-active { opacity: 1; transform: scale(1); }
        .rv-img-card {
            width: 100%; aspect-ratio: 16/10; border-radius: 16px; overflow: hidden;
            background: linear-gradient(145deg, #110E2A 0%, #1C1040 40%, #0F0C24 100%);
            box-shadow: 0 8px 26px rgba(0,0,0,.4), 0 2px 10px rgba(108,99,255,.25);
        }
        .rv-img-card img { width: 100%; height: 100%; object-fit: cover; cursor: zoom-in; display: block; }
        .review-all-slideshow-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
        .review-all-slideshow-dots span { width: 6px; height: 6px; border-radius: 50%; background: rgba(108,99,255,.3); transition: all .3s; }
        .review-all-slideshow-dots span.active { background: var(--accent, #6C63FF); width: 16px; border-radius: 3px; }
        /* নিচের row-এ থাকা left/right arrow বাটন — reference-এর গোলাকার semi-transparent arrow */
        .review-all-slideshow-nav {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
            width: 30px; height: 30px; border-radius: 50%; background: rgba(0,0,0,.35);
            display: flex; align-items: center; justify-content: center; color: #fff; font-size: 15px; cursor: pointer;
        }
        .review-all-slideshow-nav.rv-prev { left: 2%; }
        .review-all-slideshow-nav.rv-next { right: 2%; }

        /* Screenshot-এ দেখানো স্টাইলের মতো — দুই পাশে গোল arrow বাটন */
        .rv-slide-arrow {
            position: absolute; top: 50%; transform: translateY(-50%); z-index: 3;
            width: 28px; height: 28px; border-radius: 50%; border: none; cursor: pointer;
            background: rgba(20,20,30,.5); color: #fff; font-size: 15px; font-weight: 700;
            display: flex; align-items: center; justify-content: center;
        }
        .rv-slide-arrow:active { transform: translateY(-50%) scale(.9); }
        .rv-slide-arrow.prev { left: 6px; }
        .rv-slide-arrow.next { right: 6px; }

        /* নিচে dots — কোন slide এ আছি সেটা বোঝানোর জন্য */
        .rv-slide-dots { display: flex; justify-content: center; gap: 6px; margin-top: 10px; }
        .rv-slide-dot { width: 7px; height: 7px; border-radius: 50%; background: rgba(108,99,255,.25); border: none; padding: 0; cursor: pointer; }
        .rv-slide-dot.active { background: #6C63FF; width: 18px; border-radius: 4px; }

        /* Gallery overlay — device-gallery style grid, then fullscreen swipe viewer */
        .review-gallery-bg {
            position: fixed; inset: 0; background: var(--bg); z-index: 997;
            display: none; flex-direction: column; overflow-y: auto;
        }
        .review-gallery-bg.show { display: flex; }
        .review-gallery-header {
            position: sticky; top: 0; z-index: 2; background: var(--bg);
            display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid var(--border);
        }
        .review-gallery-back { font-size: 20px; cursor: pointer; color: var(--text); }
        .review-gallery-title { font-size: 15px; font-weight: 800; color: var(--text); }
        .review-gallery-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3px; padding: 3px; }
        .review-gallery-grid img { width: 100%; aspect-ratio: 1; object-fit: cover; cursor: pointer; }

        .review-swipe-bg {
            position: fixed; inset: 0; background: rgba(0,0,0,.92); z-index: 999;
            display: none; align-items: center; justify-content: center; touch-action: pan-y;
        }
        .review-swipe-bg.show { display: flex; }
        .review-swipe-bg img { max-width: 94%; max-height: 82%; border-radius: 8px; }
        .review-swipe-close { position: absolute; top: 16px; right: 16px; color: #fff; font-size: 26px; cursor: pointer; z-index: 2; }
        .review-swipe-counter { position: absolute; bottom: 20px; left: 0; right: 0; text-align: center; color: rgba(255,255,255,.7); font-size: 12px; }

        /* ─────────────────────────────────────────────
           TIMER CARDS  (Flutter: CountdownTimerCard widget)
        ───────────────────────────────────────────── */
        .countdown-card {
            background: linear-gradient(140deg,var(--bg) 0%,var(--card-bg) 100%);
            border: 1.5px solid var(--atlas-border, var(--border));
            border-radius: var(--radius); padding: 8px 40px !important;
            margin: 0 auto 14px; max-width: 98% !important;
            position: relative; animation: pulseGlow 3s ease-in-out infinite;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            overflow: hidden;
        }
        /* Color themes for each timer */
        .timer-1 { border-color: var(--t1) !important; --timer-glow: rgba(248,81,73,.35); }
        .timer-2 { border-color: var(--t2) !important; --timer-glow: rgba(59,130,246,.35); }
        .timer-3 { border-color: var(--t3) !important; --timer-glow: rgba(34,197,94,.35); }
        .timer-4 { border-color: var(--t4) !important; --timer-glow: rgba(236,72,153,.35); }
        .timer-5 { border-color: var(--t5) !important; --timer-glow: rgba(249,115,22,.35); }

        /* Serial box — per spec: thin box inside card, left corner */
        .timer-serial-box {
            position: absolute; top: 0; left: 0;
            padding: 4px 18px;
            border-radius: 0 0 8px 0;
            font-size: 9px; font-weight: 700; color: #fff; letter-spacing: .5px;
        }
        .timer-1 .timer-serial-box { background: var(--t1); }
        .timer-2 .timer-serial-box { background: var(--t2); }
        .timer-3 .timer-serial-box { background: var(--t3); }
        .timer-4 .timer-serial-box { background: var(--t4); }
        .timer-5 .timer-serial-box { background: var(--t5); }

        .timer-main-topic { font-size: 25px; font-weight: 900; color: var(--text); margin-top: 14px; margin-bottom: 0px; line-height: 1.25; }
        .timer-subtopic { font-size: 13px; font-weight: 700; color: var(--text-secondary); margin-bottom: 8px; margin-top: 1px; }

        /* Inner premium clock card */
        .timer-clock-card {
            width: 100%;
            background: linear-gradient(155deg, var(--card-bg) 0%, var(--card-hover) 100%);
            border: 1px solid var(--border); border-radius: 12px;
            padding: 4px 18px;
            box-shadow: inset 0 1px 0 rgba(255,255,255,.05), 0 2px 10px rgba(0,0,0,.15);
        }
        .timer-row { display: flex; align-items: center; justify-content: center; gap: 6px; }
        .timer-clock-icon { font-size: 32px; flex-shrink: 0; }
        .timer-values { display: flex; align-items: center; gap: 3px; }
        .timer-block { display: flex; flex-direction: column; align-items: center; min-width: 30px; }
        .timer-number { font-size: 26px; font-weight: 900; color: var(--text); letter-spacing: .5px; font-variant-numeric: tabular-nums; }
        .timer-separator { font-size: 16px; font-weight: 800; color: var(--text-secondary); margin-top: -6px; }
        .timer-label { font-size: 8px; color: var(--text-secondary); opacity: .7; margin-top: 1px; }

        /* ─────────────────────────────────────────────
           HOME BUTTONS — Premium Grid  (Flutter: GridView + InkWell)
           Each row is its own grid container so spacing/column-count
           is explicit per spec, instead of relying on auto-wrap.
        ───────────────────────────────────────────── */

        /* Outer coverage box — thin border around the entire button area */
        .btn-coverage-box {
            border: 1px solid var(--border); border-radius: 18px;
            padding: 14px 10px 10px; margin-bottom: 14px;
            background: rgba(255,255,255,.012);
        }

        /* Section separator — thin line with a small gradient label
           box centered on top of it. */
        .section-sep { position: relative; text-align: center; margin: 22px 0 16px; height: 1px; background: var(--border); }
        .section-sep:first-child { margin-top: 2px; }
        .section-sep-label {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%);
            background: linear-gradient(135deg, var(--accent), #3D35B0);
            color: #fff; font-size: 8.5px; font-weight: 800; letter-spacing: .2px;
            padding: 4px 18px; border-radius: 8px; white-space: nowrap;
            box-shadow: 0 2px 10px rgba(108,99,255,.35);
        }

        .home-row { display: grid; gap: 9px; margin-bottom: 9px; }
        .home-row:last-child { margin-bottom: 4px; }
        .home-row-2  { grid-template-columns: repeat(2,1fr); }   /* 50/50 hero pairs */
        .home-row-3  { grid-template-columns: repeat(3,1fr); }   /* HSC / Admission / অনুশীলনী */
        .home-row-4  { grid-template-columns: repeat(4,1fr); }   /* Focus/Tracker/Pomodoro/GPA */

        .home-btn {
            background: linear-gradient(155deg, var(--card-bg) 0%, var(--card-hover) 100%);
            color: var(--text);
            border: 1px solid var(--border); border-radius: 14px;
            padding: 4px 18px; font-family: 'Noto Sans Bengali','Inter',sans-serif;
            font-size: 11px; font-weight: 700; text-align: center; cursor: pointer;
            transition: all .2s ease; box-shadow: var(--shadow-sm);
            display: flex; flex-direction: column; align-items: center; gap: 7px;
            position: relative; overflow: hidden; width: 100%;
        }
        .home-btn:active { transform: scale(.96); }
        .home-btn:hover {
            border-color: var(--accent);
            box-shadow: var(--shadow-glow), var(--shadow);
            transform: translateY(-2px);
        }

        /* Premium icon tile — glossy gradient + soft top highlight + deep shadow */
        .btn-icon-tile {
            width: 38px; height: 38px; border-radius: 12px;
            display: flex; align-items: center; justify-content: center;
            font-size: 19px; flex-shrink: 0; position: relative;
            box-shadow:
                inset 0 1.5px 0 rgba(255,255,255,.35),
                inset 0 -6px 10px rgba(0,0,0,.18),
                0 4px 12px rgba(0,0,0,.28),
                0 0 0 1px rgba(255,255,255,.05);
        }
        .btn-icon-tile svg { width: 20px; height: 20px; flex-shrink: 0; }
        .home-btn-hero .btn-icon-tile svg { width: 24px; height: 24px; }
        .home-btn .btn-text { font-size: 10.5px; line-height: 1.25; font-weight: 700; margin-top: 1px; }

        /* Hero style — bigger tile, now column layout (icon top, text bottom) like small buttons */
        .home-btn-hero {
            flex-direction: column; align-items: center; justify-content: center;
            padding: 4px 18px; gap: 9px; text-align: center;
        }
        .home-btn-hero .btn-icon-tile { width: 46px; height: 46px; font-size: 23px; border-radius: 14px; }
        .home-btn-hero .btn-text { font-size: 12px; line-height: 1.3; margin-top: 0; }

        /* Premium icon-tile gradients — richer, deeper, glossier (3-stop, true jewel tones) */
        .tile-indigo  { background: linear-gradient(150deg,#7B7FFF 0%,#5A5FE0 45%,#322B96 100%); }
        .tile-amber   { background: linear-gradient(150deg,#FFD166 0%,#F5A524 45%,#A8650A 100%); }
        .tile-violet  { background: linear-gradient(150deg,#A78BFA 0%,#8B5CF6 45%,#4C1D95 100%); }
        .tile-rose    { background: linear-gradient(150deg,#FB7AAE 0%,#F43F8E 45%,#9D174D 100%); }
        .tile-emerald { background: linear-gradient(150deg,#34D9A0 0%,#10B981 45%,#065F46 100%); }
        .tile-sky     { background: linear-gradient(150deg,#7DD3FC 0%,#38BDF8 45%,#075985 100%); }
        .tile-orange  { background: linear-gradient(150deg,#FDBA74 0%,#FB923C 45%,#9A3412 100%); }
        .tile-teal    { background: linear-gradient(150deg,#5EEAD4 0%,#14B8A6 45%,#115E59 100%); }
        .tile-red     { background: linear-gradient(150deg,#FCA5A5 0%,#F87171 45%,#991B1B 100%); }
        .tile-gold    { background: linear-gradient(150deg,#FDE68A 0%,#FBBF24 45%,#92400E 100%); }
        .tile-plum    { background: linear-gradient(150deg,#D8B4FE 0%,#A855F7 45%,#581C87 100%); }

        /* Admin button — separate full-width button, lives OUTSIDE the coverage box */
        .admin-fullwidth-btn {
            display: none; width: 100%; align-items: center; justify-content: center; gap: 10px;
            background: linear-gradient(135deg, rgba(255,215,0,.14), rgba(255,180,0,.06));
            border: 1.5px solid #FFD700; border-radius: 14px; padding: 13px;
            color: #FFD700; font-family: 'Noto Sans Bengali','Inter',sans-serif;
            font-size: 13px; font-weight: 800; cursor: pointer; margin-bottom: 14px;
        }
        .admin-fullwidth-btn:hover { background: rgba(255,215,0,.1); box-shadow: 0 0 0 2px rgba(255,215,0,.2); }

        /* ATLAS All Courses banner — premium animated */
        @keyframes coursesBannerShift {
            0%   { background-position: 0% 50%; }
            50%  { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }
        @keyframes coursesBannerShine {
            0%   { transform: translateX(-100%) skewX(-15deg); }
            100% { transform: translateX(350%) skewX(-15deg); }
        }
        @keyframes coursesBorderSpin {
            from { transform: rotate(0deg); }
            to   { transform: rotate(360deg); }
        }
        @keyframes coursesTitleShimmer {
            0%   { background-position: 200% center; }
            100% { background-position: -200% center; }
        }

        .courses-banner {
            position: relative; width: 94%; margin: 0 auto 14px; padding: 2px;
            border-radius: 18px; cursor: pointer; overflow: hidden;
            /* Deep premium dark-purple BG — richer, not flat */
            background: linear-gradient(145deg, #0D0B1A 0%, #1A0F3A 30%, #0E0B22 60%, #160D35 100%);
            box-shadow: 0 6px 24px rgba(108,99,255,.40), 0 2px 8px rgba(0,0,0,.5);
            transition: transform .2s ease, box-shadow .2s ease;
        }

        /* Animated rotating border line — conic-gradient spin */
        .courses-banner::before {
            content: ''; position: absolute;
            width: 200%; height: 200%;
            top: -50%; left: -50%;
            transform-origin: center center;
            background: conic-gradient(
                from 0deg,
                rgba(255,210,0,0) 0deg,
                rgba(255,210,0,.9) 60deg,
                rgba(255,255,255,.8) 90deg,
                rgba(108,99,255,.7) 130deg,
                rgba(255,210,0,0) 180deg
            );
            animation: coursesBorderSpin 3s linear infinite;
            z-index: 0;
        }

        /* Inner card — solid dark BG sits on top of rotating border, leaving only the border visible */
        .courses-banner-inner {
            position: relative; z-index: 2;
            background: linear-gradient(145deg, #110E2A 0%, #1C1040 40%, #0F0C24 100%);
            border-radius: 16px; overflow: hidden;
            padding: 10px 18px; text-align: left;
            display: flex; flex-direction: row; align-items: center; justify-content: center; gap: 12px;
        }

        /* Sweep shine on inner card */
        .courses-banner-inner::after {
            content: ''; position: absolute; top: 0; left: -60%;
            width: 40%; height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255,255,255,.08), transparent);
            transform: skewX(-15deg);
            animation: coursesBannerShine 4s ease-in-out infinite;
            pointer-events: none;
        }

        .courses-banner:hover { transform: translateY(-2px); box-shadow: 0 10px 32px rgba(108,99,255,.55), 0 4px 12px rgba(0,0,0,.6); }
        .courses-banner:active { transform: scale(.97); }

        .courses-banner-icon { display: flex; align-items: center; justify-content: center; flex-shrink: 0; position: relative; z-index: 1; width: 30px; height: 30px; }
        .courses-banner-text { flex: 0 1 auto; min-width: 0; position: relative; z-index: 1; text-align: center; }

        /* Yellow-white gradient shimmer on title — eye-catching, distinct from all other text */
        .courses-banner-title {
            font-size: 15px; font-weight: 900; letter-spacing: .3px;
            background: linear-gradient(90deg,
                #FFD700 0%, #FFF5A0 25%, #FFFFFF 50%, #FFE566 75%, #FFD700 100%);
            background-size: 200% auto;
            -webkit-background-clip: text;
            background-clip: text;
            -webkit-text-fill-color: transparent;
            color: transparent;
            animation: coursesTitleShimmer 3s linear infinite;
        }
        .courses-banner-sub { font-size: 9.5px; color: rgba(255,255,255,.7); margin-top: 1px; }
        .courses-banner-arr { display: none; }

        @media(max-width:340px) {
            .home-row-4 { grid-template-columns: repeat(2,1fr); }
            .home-row-3 { grid-template-columns: repeat(1,1fr); }
        }

        /* Button icons — proper semantic icons not color circles */


        /* ─────────────────────────────────────────────
           SOCIAL CHIPS  (Flutter: SocialChipRow widget)
        ───────────────────────────────────────────── */
        .social-row {
            display: flex; justify-content: center; gap: 8px;
            flex-wrap: wrap; margin-bottom: 16px;
        }
        .social-chip {
            display: inline-flex; align-items: center; gap: 5px;
            padding: 4px 18px; border-radius: var(--radius-full);
            font-size: 11px; font-weight: 600;
            background: var(--card-bg); border: 1px solid var(--border);
            color: var(--text-secondary); text-decoration: none;
            cursor: pointer; transition: all .2s ease;
        }
        .social-chip:hover {
            border-color: var(--accent); color: var(--accent);
            box-shadow: var(--shadow-glow); transform: translateY(-1px);
        }
        .social-chip svg { flex-shrink: 0; }
        /* Platform-specific hover colors */
        .social-chip.plat-facebook:hover  { border-color:#1877F2; color:#1877F2; }
        .social-chip.plat-youtube:hover   { border-color:#FF0000; color:#FF0000; }
        .social-chip.plat-telegram:hover  { border-color:#0088CC; color:#0088CC; }
        .social-chip.plat-whatsapp:hover  { border-color:#25D366; color:#25D366; }

        /* ─────────────────────────────────────────────
           OWNER SECTION  (Flutter: OwnerCard widget)
        ───────────────────────────────────────────── */
        .owner-section { display:flex; flex-direction:column; align-items:center; margin:18px 0 14px; }
        .owner-name-top { font-size:14px; font-weight:700; color:var(--accent); margin-bottom:10px; }

        .flip-card-owner { width:140px; height:140px; perspective:800px; cursor:pointer; }
        .flip-card-owner.flipped .flip-card-inner-owner { transform: rotateY(180deg); }
        .flip-card-inner-owner {
            position:relative; width:100%; height:100%;
            transition: transform .5s ease; transform-style: preserve-3d;
        }
        .flip-front-owner, .flip-back-owner {
            position:absolute; width:100%; height:100%; backface-visibility:hidden;
            border-radius: var(--radius-sm);
        }
        .flip-front-owner {
            background: var(--card-bg); border:1px solid var(--border);
            display:flex; align-items:center; justify-content:center;
        }
        .flip-back-owner {
            background: var(--card-bg); border:1px solid var(--accent);
            transform: rotateY(180deg); padding:12px; text-align:center;
            font-size:10px; color:var(--text-secondary);
            display:flex; align-items:center; justify-content:center;
            line-height: 1.6;
        }

        /* Conic glow ring per spec — at image margin boundary */
        .owner-photo-wrapper { position:relative; width:140px; height:140px; }
        .owner-photo-box {
            width:140px; height:140px; border-radius:var(--radius-sm);
            object-fit:cover; border:2px solid var(--border); position:relative; z-index:2;
        }
        .-box {
            position:absolute; top:-6px; left:-6px;
            width:calc(140px + 12px); height:calc(140px + 12px);
            border-radius:calc(var(--radius-sm) + 6px);
            animation: rotateGlowBox 3s linear infinite; z-index:1; pointer-events:none;
        }
         .-box::before {
    content: ''; position: absolute; inset: -3px;
    border-radius: calc(var(--radius-sm) + 8px);  ← inherit না দিয়ে ফিক্সড
    background: conic-gradient(from 0deg, transparent 0deg, var(--accent) 90deg, transparent 180deg, transparent 270deg, var(--accent) 360deg);
    animation: rotateGlowBox 1.8s linear infinite;
    opacity: .35; filter: blur(6px);
}

        /* ─────────────────────────────────────────────
           MENTORS SECTION  (Flutter: MentorsGrid widget)
        ───────────────────────────────────────────── */
        .mentors-section { margin: 6px 0 14px; }
        .mentors-title {
            text-align:center; font-size:13px; font-weight:700;
            color:var(--accent); margin-bottom:10px;
        }
        .mentors-grid {
            display:flex; flex-wrap:wrap; gap:10px; justify-content:center;
        }
        .mentor-item { text-align:center; width:72px; }
        .mentor-photo {
            width:60px; height:60px; border-radius:10px;
            object-fit:cover; border:2px solid var(--border);
            display:block; margin:0 auto 4px;
        }
        .mentor-photo-fallback {
            width:60px; height:60px; border-radius:10px;
            background: var(--card-hover); border:2px solid var(--border);
            display:flex; align-items:center; justify-content:center;
            font-size:22px; margin:0 auto 4px;
        }
        .mentor-name { font-size:10px; font-weight:600; color:var(--text); line-height:1.3; }
        .mentor-role { font-size:9px; color:var(--text-secondary); }

        /* ─────────────────────────────────────────────
           BOTTOM NAV  (Flutter: BottomNavigationBar)
        ───────────────────────────────────────────── */
        .bottom-nav {
            position:fixed; bottom:0; left:0; right:0; height:60px;
            background:var(--card-bg); border-top:1px solid var(--border);
            display:flex; align-items:center; justify-content:space-around; z-index:100;
        }
        .nav-item {
            display:flex; flex-direction:column; align-items:center; gap:2px;
            background:none; border:none; color:var(--text-secondary);
            font-size:10px; cursor:pointer; padding:6px 10px;
            border-radius:8px; transition:.2s; font-family:inherit;
        }
        .nav-item.active { color:var(--accent); }
        .nav-icon { font-size:20px; }

        /* ─────────────────────────────────────────────
           FLOATING BUTTONS  (Flutter: SpeedDial FAB)
           Hidden on AI / Class / Exam pages via body class
        ───────────────────────────────────────────── */
        .floating-buttons {
            position:fixed; bottom:76px; right:16px;
            display:flex; flex-direction:column; gap:8px; z-index:99;
        }
        .fab {
            width:44px; height:44px; border-radius:50%; border:none;
            cursor:pointer; color:#fff;
            display:flex; align-items:center; justify-content:center;
            transition:.2s; box-shadow:0 2px 10px rgba(0,0,0,.3);
            position:relative; animation: fabFloat 2.6s ease-in-out infinite;
        }
        .fab::before{
            content:''; position:absolute; inset:0; border-radius:50%;
            box-shadow:0 0 0 0 rgba(255,255,255,.5);
            animation: fabPulse 2.6s ease-out infinite;
        }
        .fab-wa { background:#25D366; }
        .fab-wa::before{ box-shadow:0 0 0 0 rgba(37,211,102,.6); }
        .fab-tg { background:#0088CC; }
        .fab-tg::before{ box-shadow:0 0 0 0 rgba(0,136,204,.6); }
        .fab-tg { animation-delay:.4s; }
        .fab-tg::before{ animation-delay:.4s; }
        .fab:hover { transform:scale(1.1); animation-play-state:paused; }
        @keyframes fabFloat { 0%,100%{transform:translateY(0)} 50%{transform:translateY(-3px)} }
        @keyframes fabPulse {
            0%   { box-shadow:0 0 0 0 rgba(255,255,255,.45); }
            70%  { box-shadow:0 0 0 10px rgba(255,255,255,0); }
            100% { box-shadow:0 0 0 0 rgba(255,255,255,0); }
        }

        /* ─────────────────────────────────────────────
           TOAST  (Flutter: SnackBar)
        ───────────────────────────────────────────── */
        .toast {
            position:fixed; top:68px; left:50%; transform:translateX(-50%);
            background:var(--card-bg); color:var(--text);
            border:1px solid var(--accent); padding:9px 20px;
            border-radius:var(--radius-full); font-size:12px; font-weight:600;
            z-index:999; opacity:0; transition:.2s; pointer-events:none; white-space:nowrap;
        }
        .toast.show { opacity:1; }

        /* ─────────────────────────────────────────────
           MODAL  (Flutter: showDialog / showModalBottomSheet)
        ───────────────────────────────────────────── */
        .modal-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.75);
            z-index:300; display:none; align-items:center; justify-content:center; padding:14px;
        }
        .modal-overlay.active { display:flex; }
        .modal {
            background:var(--card-bg); border:1px solid var(--border);
            border-radius:var(--radius); padding:16px;
            max-width:500px; width:100%; max-height:88vh; overflow-y:auto;
            animation:fadeUp .2s;
        }
        .modal-title {
            font-size:16px; font-weight:800; color:var(--accent);
            margin-bottom:14px; text-align:center; padding-bottom:10px;
            border-bottom:1px solid var(--border);
        }
        .modal-close {
            position:sticky; bottom:0; background:var(--card-bg);
            padding-top:10px; margin-top:10px; border-top:1px solid var(--border);
        }

        /* ─────────────────────────────────────────────
           MY MISTAKES MODAL  (Flutter: MistakesScreen)
        ───────────────────────────────────────────── */
        .filter-row { display:flex; gap:6px; margin-bottom:10px; flex-wrap:wrap; }
        .filter-row select {
            padding:6px 10px; border:1px solid var(--border);
            border-radius:6px; background:var(--bg);
            color:var(--text); font-size:11px; font-family:inherit; flex:1;
        }
        .mistake-item {
            background:var(--card-hover); border:1px solid var(--border);
            border-radius:var(--radius-sm); padding:12px; margin-bottom:8px;
            animation:fadeUp .2s;
        }
        .mistake-item-header {
            display:flex; justify-content:space-between; align-items:flex-start;
            margin-bottom:6px;
        }
        .mistake-item-title { font-weight:700; font-size:13px; color:var(--text); flex:1; }
        .mistake-item-sub { font-size:10px; color:var(--text-secondary); margin-top:2px; }
        .mistake-item-stats { display:flex; gap:8px; margin:6px 0; flex-wrap:wrap; }
        .mistake-stat-chip {
            font-size:10px; padding:2px 8px; border-radius:10px; font-weight:600;
        }
        .chip-wrong { background:rgba(248,81,73,.12); color:var(--error); }
        .chip-skip  { background:rgba(210,153,34,.12); color:var(--yellow); }
        .mistake-item-date { font-size:10px; color:var(--text-secondary); }
        .mistake-btns { display:flex; gap:6px; margin-top:8px; flex-wrap:wrap; }

        /* Buttons */
        .btn {
            display:inline-block; padding:8px 14px; border-radius:var(--radius-md);
            font-weight:600; cursor:pointer; border:none;
            font-size:11px; transition:.2s; font-family:inherit; text-align:center;
        }
        .btn-outline { background:transparent; border:1px solid var(--border); color:var(--text-secondary); }
        .btn-outline:hover { border-color:var(--accent); color:var(--text); }
        .btn-primary { background:var(--accent); color:#fff; }
        .btn-primary:hover { opacity:.9; }
        .btn-success { background:var(--success); color:#fff; }
        .btn-warning { background:var(--yellow); color:#fff; }
        .btn-danger  { background:var(--error); color:#fff; }

        /* ─────────────────────────────────────────────
           MODEL TEST MODAL  (Flutter: ModelTestModal)
        ───────────────────────────────────────────── */
        .model-segment-label {
            font-size:11px; font-weight:800; color:var(--error);
            padding:4px 0 2px; margin-bottom:4px; letter-spacing:.5px;
        }
        .model-segment-label.varsity { color:var(--accent); }
        .model-btn {
            width:100%; padding:11px 14px; border-radius:var(--radius-sm);
            border:1px solid var(--border); background:none; color:var(--text);
            font-size:13px; font-weight:600; cursor:pointer; text-align:left;
            font-family:inherit; transition:.2s; margin-bottom:6px;
            display:flex; align-items:center; gap:8px;
        }
        .model-btn:hover { border-color:var(--accent); background:rgba(124,131,255,.05); }
        .model-sub-note {
            font-size:10px; color:var(--text-secondary); text-align:center;
            padding:4px 0 8px; margin-bottom:6px;
        }

        /* ─────────────────────────────────────────────
           TELEGRAM SUPPORT MODAL  (Flutter: TelegramSupportScreen)
           ৪টা সাব-অপশন: Poll/Quiz (subject list), PDF Support
           (সরাসরি লিংক), Practice Bot (description+লিংক),
           সকল গ্রুপ+চ্যানেল (সরাসরি লিংক)
        ───────────────────────────────────────────── */
        .tg-back-btn {
            display:inline-flex; align-items:center; gap:4px;
            padding:6px 12px; background:var(--btn-bg); border:1px solid var(--border);
            border-radius:var(--radius-full); color:var(--text-secondary);
            font-size:11px; font-weight:600; cursor:pointer; margin-bottom:10px;
            font-family:'Noto Sans Bengali','Inter',sans-serif;
        }
        .tg-back-btn:hover { border-color:var(--accent); color:var(--accent); }
        .tg-box {
            width:100%; padding:13px 14px; border-radius:var(--radius-sm);
            border:1px solid var(--border); background:var(--card-hover); color:var(--text);
            font-size:13px; font-weight:700; cursor:pointer; text-align:left;
            font-family:'Noto Sans Bengali','Inter',sans-serif; transition:.2s; margin-bottom:8px;
            display:flex; align-items:center; justify-content:space-between; gap:8px;
        }
        .tg-box:hover { border-color:var(--accent); background:rgba(124,131,255,.08); }
        .tg-box-sub { font-size:10.5px; color:var(--text-secondary); font-weight:500; margin-top:2px; }
        .tg-empty { text-align:center; color:var(--text-secondary); padding:20px 10px; font-size:13px; }
        .tg-desc-box {
            background:var(--card-hover); border:1px solid var(--border); border-radius:var(--radius-sm);
            padding:14px; margin-bottom:12px; font-size:12.5px; line-height:1.7; color:var(--text-secondary);
            white-space:pre-line;
        }
        .tg-join-btn {
            display:block; width:100%; padding:12px; border-radius:var(--radius-sm);
            background:linear-gradient(135deg,var(--accent),#3D35B0); color:#fff;
            font-size:13px; font-weight:800; text-align:center; cursor:pointer;
            border:none; font-family:'Noto Sans Bengali','Inter',sans-serif;
        }
        .tg-join-btn:hover { opacity:.92; }

        /* ─────────────────────────────────────────────
           QUESTION VIEWER  (Flutter: QuestionCard widget)
           (Used inside Mistakes detail modal)
        ───────────────────────────────────────────── */
        .q-filter-tabs { display:flex; gap:4px; margin-bottom:10px; }
        .q-filter-tab {
            padding:5px 10px; border-radius:6px; font-size:10px; font-weight:600;
            cursor:pointer; border:1px solid var(--border); background:none;
            color:var(--text-secondary); font-family:inherit; transition:.2s;
        }
        .q-filter-tab.active { background:var(--accent); color:#fff; border-color:var(--accent); }

        .question-card {
            background:var(--card-hover); border:1px solid var(--border);
            border-radius:var(--radius-sm); padding:12px; margin-bottom:10px;
        }
        .question-text { font-size:13px; color:var(--text); font-weight:600; line-height:1.6; margin-bottom:8px; }
        .question-img { width:100%; border-radius:6px; margin-bottom:8px; max-height:180px; object-fit:contain; }
        .options-list { list-style:none; display:flex; flex-direction:column; gap:5px; }
        .option-item {
            padding:8px 10px; border-radius:6px; font-size:12px;
            border:1px solid var(--border); color:var(--text-secondary);
            display:flex; align-items:flex-start; gap:6px;
        }
        .option-item.correct { background:rgba(63,185,80,.12); border-color:var(--success); color:var(--success); }
        .option-item.wrong   { background:rgba(248,81,73,.12); border-color:var(--error); color:var(--error); }
        .option-key { font-weight:800; min-width:16px; flex-shrink:0; }
        .explanation-box {
            background:rgba(88,166,255,.08); border:1px solid rgba(88,166,255,.2);
            border-radius:6px; padding:8px 10px; margin-top:8px;
            font-size:11px; color:var(--blue); line-height:1.6;
        }
        .q-status {
            display:inline-block; padding:2px 7px; border-radius:10px;
            font-size:9px; font-weight:700; margin-bottom:6px;
        }
        .q-status.correct { background:rgba(63,185,80,.15); color:var(--success); }
        .q-status.wrong   { background:rgba(248,81,73,.15); color:var(--error); }
        .q-status.skipped { background:rgba(210,153,34,.15); color:var(--yellow); }

        /* ─────────────────────────────────────────────
           SKELETON / LOADING  (Flutter: Shimmer package)
        ───────────────────────────────────────────── */
        .skeleton {
            background: linear-gradient(90deg,var(--card-hover) 25%,var(--card-bg) 50%,var(--card-hover) 75%);
            background-size:200% 100%;
            animation:shimmer 1.2s infinite;
            border-radius:6px;
        }
        .skeleton-block { height:80px; margin-bottom:8px; border-radius:var(--radius-sm); }
        .skeleton-line  { height:12px; margin-bottom:6px; }

        /* ─────────────────────────────────────────────
           ERROR POPUP  (Flutter: ErrorDialog widget)
        ───────────────────────────────────────────── */
        .error-popup-overlay {
            position:fixed; inset:0; background:rgba(0,0,0,.75);
            z-index:600; display:flex; align-items:center; justify-content:center; padding:20px;
        }
        .error-popup {
            background:var(--card-bg); border:1px solid var(--error);
            border-radius:var(--radius); padding:20px;
            max-width:320px; width:100%; text-align:center;
        }
        .error-popup-icon { font-size:36px; margin-bottom:8px; }
        .error-popup-title { font-size:15px; font-weight:800; color:var(--error); margin-bottom:6px; }
        .error-popup-message { font-size:12px; color:var(--text-secondary); margin-bottom:12px; line-height:1.6; }
        .error-popup-details { font-size:9px; color:var(--text-secondary); background:var(--card-hover); border-radius:6px; padding:6px 8px; margin-bottom:10px; word-break:break-all; }
        .error-popup-btn, .error-popup-retry {
            padding:8px 16px; border-radius:8px; font-size:12px; font-weight:700;
            cursor:pointer; border:none; font-family:inherit; margin:2px;
        }
        .error-popup-btn   { background:var(--card-hover); color:var(--text); border:1px solid var(--border); }
        .error-popup-retry { background:var(--accent); color:#fff; }

        /* ─────────────────────────────────────────────
           EMPTY STATE  (Flutter: EmptyState widget)
        ───────────────────────────────────────────── */
        .empty-state { text-align:center; padding:30px 20px; color:var(--text-secondary); }
        .empty-icon  { font-size:36px; margin-bottom:8px; display:block; }
    
        .ei{width:1em;height:1em;display:inline-block;vertical-align:-0.14em;flex-shrink:0}
        .si-tile{width:26px;height:26px;border-radius:7px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.3),0 2px 5px rgba(0,0,0,.2)}
        .si-tile svg{width:15px;height:15px}
        .ni-tile{width:24px;height:24px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:inset 0 1px 0 rgba(255,255,255,.25),0 2px 4px rgba(0,0,0,.2)}
        .ni-tile svg{width:13px;height:13px}
        .tile-indigo{background:linear-gradient(150deg,#7B7FFF 0%,#5A5FE0 45%,#322B96 100%)}
        .tile-amber{background:linear-gradient(150deg,#FFD166 0%,#F5A524 45%,#A8650A 100%)}
        .tile-violet{background:linear-gradient(150deg,#A78BFA 0%,#8B5CF6 45%,#4C1D95 100%)}
        .tile-rose{background:linear-gradient(150deg,#FB7AAE 0%,#F43F8E 45%,#9D174D 100%)}
        .tile-emerald{background:linear-gradient(150deg,#34D9A0 0%,#10B981 45%,#065F46 100%)}
        .tile-sky{background:linear-gradient(150deg,#7DD3FC 0%,#38BDF8 45%,#075985 100%)}
        .tile-orange{background:linear-gradient(150deg,#FDBA74 0%,#FB923C 45%,#9A3412 100%)}

        .tile-red{background:linear-gradient(150deg,#FCA5A5 0%,#F87171 45%,#991B1B 100%)}

async function safeFetch(url, opts = {}) {
    opts.headers = Object.assign(
        { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY },
        opts.headers || {}
    );
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE')
        opts.headers['Content-Type'] = 'application/json';
    try {
        const res = await fetch(url, opts);
        const text = await res.text();
        if (!text?.trim()) return [];
        const data = JSON.parse(text);
        if (!res.ok) throw new Error(data.message || 'Error');
        return data;
    } catch(e) {
        console.error('<svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> Fetch:', e.message);
        return [];
    }
}

function startCountdown(endTime, i) {
    const target = new Date(endTime);
    const dEl = document.querySelector(`.countdown-d-${i}`);
    const hEl = document.querySelector(`.countdown-h-${i}`);
    const mEl = document.querySelector(`.countdown-m-${i}`);
    const sEl = document.querySelector(`.countdown-s-${i}`);
    if (!dEl) return;
    function update() {
        const diff = target - new Date();
        if (diff <= 0) {
            dEl.textContent = hEl.textContent = mEl.textContent = sEl.textContent = '০০'; return;
        }
        dEl.textContent = String(Math.floor(diff/(1000*60*60*24))).padStart(2,'0');
        hEl.textContent = String(Math.floor((diff%(1000*60*60*24))/(1000*60*60))).padStart(2,'0');
        mEl.textContent = String(Math.floor((diff%(1000*60*60))/(1000*60))).padStart(2,'0');
        sEl.textContent = String(Math.floor((diff%(1000*60))/1000)).padStart(2,'0');
    }
    update(); setInterval(update, 1000);
}

                    <span class="review-star-spin" style="animation-direction:reverse"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M12 2.5l2.6 6.3 6.9.5-5.3 4.5 1.7 6.7L12 16.8 6.1 20.5l1.7-6.7-5.3-4.5 6.9-.5z" stroke="currentColor" stroke-width="1.3" stroke-linejoin="round"/></svg></span>
                </div>
                <div class="review-cat-box">${tilesHtml}</div>
                <div id="reviewAllSlideshowContainer"></div>
            </div>`;

        // Card-গুলোর নিচে — সব ক্যাটাগরির সব ছবি একসাথে, উপরের main slideshow-এর মতোই auto-sliding
        loadReviewAllSlideshow(data || []);
    } catch (e) { console.error('Review section load error:', e); }
}

/* Card-গুলোর নিচের "সব রিভিউ ছবি" স্লাইডশো — smooth right-to-left auto-slide (আগের মতো),
   সাথে touch/swipe এবং arrow+dot দিয়ে manual control। শুধু ছবির চারপাশের ঘুরন্ত বর্ডার
   বাদ দেওয়া হয়েছে (CSS-এ rv-img-frame এখন static)। */
let __rvAllTimer = null;
let __rvAllIdx = 0;      // "real" slide index (0-based, matches dots) — no clone offset
let __rvAllTotal = 0;
let __rvHasClones = false; // true if leading/trailing clone slides exist (needs >1 image)

// DOM position = real index + 1 যখন leading clone আছে (clone slide 0 তে বসে)
function __rvDomIdx(realIdx) {
    return __rvHasClones ? realIdx + 1 : realIdx;
}

function rvSetTrackPosition(withTransition) {
    const track = document.getElementById('reviewAllSlideshowTrack');
    if (!track) return;
    track.style.transition = withTransition ? 'transform .5s ease' : 'none';
    // Slide width 82% + (18%/2 = 9%) centering offset per step, যাতে active slide viewport-এর
    // ঠিক মাঝে থাকে এবং দুই পাশের slide আংশিকভাবে (peek) দেখা যায়
    const SLIDE_PCT = 78;
    const offset = (100 - SLIDE_PCT) / 2;
    const domIdx = __rvDomIdx(__rvAllIdx);
    track.style.transform = `translateX(calc(-${domIdx * SLIDE_PCT}% + ${offset}%))`;
    const slides = track.querySelectorAll('.review-all-slideshow-slide');
    slides.forEach((el, i) => el.classList.toggle('rv-active', i === domIdx));
    const dots = document.getElementById('rvAllDots');
    if (dots) dots.querySelectorAll('.rv-slide-dot').forEach((el, i) => el.classList.toggle('active', i === __rvAllIdx));
}

function rvStartAutoplay() {
    if (__rvAllTimer) clearInterval(__rvAllTimer);
    if (__rvAllTotal < 2) return;
    __rvAllTimer = setInterval(() => {
        const track = document.getElementById('reviewAllSlideshowTrack');
        if (!track) { clearInterval(__rvAllTimer); return; }
        rvNextSlide(true);
    }, 2200);
}

// Arrow/dot/swipe থেকে manually navigate করলে autoplay timer রিসেট হয় — যাতে ইউজার একটা ছবি
// দেখা শুরু করার সাথে সাথেই হঠাৎ আবার auto-advance হয়ে না যায়।
function rvNextSlide(fromAutoplay) {
    if (__rvAllTotal < 2) return;
    if (__rvAllIdx === __rvAllTotal - 1) {
        // শেষ real slide থেকে পরেরটায় — trailing clone (প্রথম ছবির কপি) এর দিকে smooth transition,
        // তারপর নিঃশব্দে (no-transition) আসল প্রথম slide-এর position এ ফিরিয়ে আনা হয়
        __rvAllIdx = __rvAllTotal; // clone position (dots handling ignores out-of-range safely below)
        const track = document.getElementById('reviewAllSlideshowTrack');
        const SLIDE_PCT = 78, offset = (100 - SLIDE_PCT) / 2;
        const domIdx = __rvDomIdx(__rvAllTotal); // trailing clone's DOM index
        if (track) {
            track.style.transition = 'transform .5s ease';
            track.style.transform = `translateX(calc(-${domIdx * SLIDE_PCT}% + ${offset}%))`;
        }
        setTimeout(() => { __rvAllIdx = 0; rvSetTrackPosition(false); }, 520);
    } else {
        __rvAllIdx++;
        rvSetTrackPosition(true);
    }
    if (!fromAutoplay) rvStartAutoplay();
}
function rvPrevSlide() {
    if (__rvAllTotal < 2) return;
    if (__rvAllIdx === 0) {
        // leading clone (শেষ ছবির কপি) এর দিকে smooth transition, তারপর নিঃশব্দে আসল শেষ slide-এ jump
        __rvAllIdx = -1; // leading clone position
        rvSetTrackPosition(true);
        setTimeout(() => { __rvAllIdx = __rvAllTotal - 1; rvSetTrackPosition(false); }, 520);
    } else {
        __rvAllIdx--;
        rvSetTrackPosition(true);
    }
    rvStartAutoplay();
}
function __rvDomIdxSafe(realIdx) {
    // rvSetTrackPosition already handles negative/over-range via __rvDomIdx; kept for clarity
    return __rvDomIdx(realIdx);
}
function rvGoToSlide(i) {
    if (i < 0 || i >= __rvAllTotal) return;
    __rvAllIdx = i;
    rvSetTrackPosition(true);
    rvStartAutoplay();
}

async function loadReviewAllSlideshow(allImages) {
    const wrap = document.getElementById('reviewAllSlideshowContainer');
    if (!wrap) return;
    if (__rvAllTimer) { clearInterval(__rvAllTimer); __rvAllTimer = null; }
    if (!allImages.length) { wrap.innerHTML = ''; return; }

    const rvUrls = allImages.map(img => img.image_url);
    const n = allImages.length;

    const slideImg = (img, realIdx) =>
        `<div class="review-all-slideshow-slide">
            <div class="rv-img-card">
                <img src="${escHtml(img.image_url)}" alt="Review" loading="lazy" onclick='openSlideshowZoom(${realIdx}, ${JSON.stringify(rvUrls)})' onerror="this.closest('.review-all-slideshow-slide').style.display='none'">
            </div>
        </div>`;

    // Peek-carousel — দুই পাশেই সবসময় প্রতিবেশী card-এর অংশ দেখানোর জন্য track-এর একদম শুরুতে
    // শেষ ছবির clone আর শেষে প্রথম ছবির clone জুড়ে দেওয়া হয়েছে। আগে শুধু শেষে clone ছিল, তাই
    // প্রথম ছবি দেখানোর সময় বাম পাশে দেখানোর মতো কিছুই ছিল না — এখন দুই দিকেই সবসময় কিছু না কিছু থাকবে।
    // __rvAllIdx=1 মানে বাস্তব প্রথম ছবি (index 0 = leading clone, N+1 = trailing clone)।
    const slidesHtml = n > 1
        ? slideImg(allImages[n - 1], n - 1) + allImages.map(slideImg).join('') + slideImg(allImages[0], 0)
        : slideImg(allImages[0], 0);
    const dotsHtml = n > 1
        ? `<div class="review-all-slideshow-dots">${allImages.map((_, i) => `<span class="${i === 0 ? 'active' : ''}"></span>`).join('')}</div>`
        : '';
    const navHtml = n > 1
        ? `<div class="review-all-slideshow-nav rv-prev" onclick="rvAllGo(-1)">‹</div>
           <div class="review-all-slideshow-nav rv-next" onclick="rvAllGo(1)">›</div>`
        : '';

    wrap.innerHTML = `
        <div class="review-all-slideshow-viewport" id="rvViewport">
            ${navHtml}
            <div class="review-all-slideshow-track" id="reviewAllSlideshowTrack">${slidesHtml}</div>
        </div>
        ${dotsHtml}`;

    __rvAllIdx = n > 1 ? 1 : 0;
    __rvAllTotal = n;
    rvAllPosition(false);
    if (n > 1) {
        __rvAllTimer = setInterval(() => rvAllGo(1), 2500);
        rvAttachSwipe();
    }
}

function rvAllPosition(animate) {
    const track = document.getElementById('reviewAllSlideshowTrack');
    if (!track) return;
    track.style.transition = animate ? 'transform .45s ease' : 'none';
    // প্রতিটা slide viewport-এর ৭৮% জায়গা নেয় (৩% padding প্রতি পাশে = ৮৪% স্টেপ)।
    // viewport-এর বাকি ২২% জায়গার অর্ধেক (১১%) বাম দিক থেকে বাদ দিলে active slide ঠিক মাঝখানে বসে।
    track.style.transform = `translateX(calc(-${__rvAllIdx * 84}% + 11%))`;
    const realActive = __rvAllTotal > 1 ? __rvAllIdx - 1 : 0; // clone বাদ দিয়ে বাস্তব index
    document.querySelectorAll('.review-all-slideshow-slide').forEach((el, i) => {
        el.classList.toggle('rv-active', i === __rvAllIdx);
    });
    document.querySelectorAll('.review-all-slideshow-dots span').forEach((dot, i) => {
        dot.classList.toggle('active', i === ((realActive % __rvAllTotal) + __rvAllTotal) % __rvAllTotal);
    });
}

function rvAllGo(dir) {
    __rvAllIdx += dir;
    rvAllPosition(true);
    // দুই প্রান্তেই clone দেখানো শেষ হলে চুপচাপ (transition ছাড়া) বাস্তব ছবির position-এ ফিরিয়ে আনা হচ্ছে —
    // তাই forward/backward দুই দিকেই কখনো visible jump/snap হবে না।
    if (__rvAllIdx === __rvAllTotal + 1) {
        setTimeout(() => { __rvAllIdx = 1; rvAllPosition(false); }, 460);
    } else if (__rvAllIdx === 0) {
        setTimeout(() => { __rvAllIdx = __rvAllTotal; rvAllPosition(false); }, 460);
    }
}

// আঙুল দিয়ে swipe করে slide পাল্টানো — বাম দিকে swipe করলে পরের ছবি, ডান দিকে করলে আগের ছবি
function rvAttachSwipe() {
    const vp = document.getElementById('rvViewport');
    if (!vp) return;
    let startX = null;
    vp.addEventListener('touchstart', e => { startX = e.touches[0].clientX; }, { passive: true });
    vp.addEventListener('touchend', e => {
        if (startX === null) return;
        const dx = e.changedTouches[0].clientX - startX;
        if (Math.abs(dx) > 40) {
            clearInterval(__rvAllTimer);
            rvAllGo(dx < 0 ? 1 : -1);
            __rvAllTimer = setInterval(() => rvAllGo(1), 2500); // swipe করার পর auto-slide আবার শুরু হবে
        }
        startX = null;
    }, { passive: true });
}

function openReviewGallery(catKey) {
    const imgs = __reviewCatData[catKey] || [];
    const catInfo = REVIEW_CATS.find(c => c.key === catKey);
    let bg = document.getElementById('reviewGalleryBg');
    if (!bg) {
        bg = document.createElement('div');
        bg.id = 'reviewGalleryBg';
        bg.className = 'review-gallery-bg';
        document.body.appendChild(bg);
    }
    const gridHtml = imgs.map((img, i) =>
        `<img src="${escHtml(img.image_url)}" loading="lazy" onclick="openReviewSwipe('${catKey}',${i})">`
    ).join('');
    bg.innerHTML = `
        <div class="review-gallery-header">
            <span class="review-gallery-back" onclick="closeReviewGallery()">←</span>
            <span class="review-gallery-title">${catInfo.emoji} ${catInfo.label} (${imgs.length})</span>
        </div>
        <div class="review-gallery-grid">${gridHtml}</div>`;
    bg.classList.add('show');
    document.body.style.overflow = 'hidden';
}
function closeReviewGallery() {
    const bg = document.getElementById('reviewGalleryBg');
    if (bg) bg.classList.remove('show');
    document.body.style.overflow = '';
}

// Fullscreen swipe viewer — device gallery-এর মতো ছবি থেকে ছবিতে swipe করে যাওয়া যায়
function openReviewSwipe(catKey, idx) {
    __reviewSwipeList = __reviewCatData[catKey] || [];
    __reviewSwipeIdx = idx;
    let bg = document.getElementById('reviewSwipeBg');
    if (!bg) {
        bg = document.createElement('div');
        bg.id = 'reviewSwipeBg';
        bg.className = 'review-swipe-bg';
        bg.innerHTML = `
            <span class="review-swipe-close" onclick="closeReviewSwipe()"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></span>
            <img id="reviewSwipeImg" src="">
            <div class="review-swipe-counter" id="reviewSwipeCounter"></div>`;
        document.body.appendChild(bg);
        let touchStartX = null;
        bg.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
        bg.addEventListener('touchend', e => {
            if (touchStartX === null) return;
            const delta = e.changedTouches[0].clientX - touchStartX;
            if (Math.abs(delta) > 50) {
                if (delta < 0 && __reviewSwipeIdx < __reviewSwipeList.length - 1) __reviewSwipeIdx++;
                else if (delta > 0 && __reviewSwipeIdx > 0) __reviewSwipeIdx--;
                renderReviewSwipe();
            }
            touchStartX = null;
        });
    }
    renderReviewSwipe();
    bg.classList.add('show');
}
function renderReviewSwipe() {
    const img = __reviewSwipeList[__reviewSwipeIdx];
    document.getElementById('reviewSwipeImg').src = img ? img.image_url : '';
    document.getElementById('reviewSwipeCounter').textContent = `${__reviewSwipeIdx + 1} / ${__reviewSwipeList.length}`;
}
function closeReviewSwipe() {
    const bg = document.getElementById('reviewSwipeBg');
    if (bg) bg.classList.remove('show');
}

async function loadSlideshow() {
    try {
        const container = document.getElementById('slideshowContainer');
        if (!container) return;

        // is_active=true ছবিই দেখানো হবে — অ্যাডমিন প্যানেলের on/off টগল
        // দিয়ে কোনো ছবি বন্ধ রাখলে সেটা এখানে বাদ পড়ে যাবে।
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/slideshow_images?select=*&order=sort_order.asc,created_at.asc&limit=20&is_active=eq.true`);

        if (__slideshowTimer) { clearInterval(__slideshowTimer); __slideshowTimer = null; }

        if (!data?.length) { container.innerHTML = ''; return; }

        // ছবিগুলো ব্রাউজার cache-এ আগেই preload করা হচ্ছে — base64 ছবি
        // সরাসরি innerHTML-এ বসালে প্রথমবার decode করতে সময় লাগে এবং
        // "loading দিলে চলে যায়" (flicker/disappear) সমস্যা হয়। preload
        // শেষ হওয়ার পরই DOM-এ বসানো হচ্ছে, যাতে স্মুথ ও instant দেখায়।
        await Promise.all(data.map(s => new Promise(resolve => {
            const img = new Image();
            img.onload = resolve;
            img.onerror = resolve; // ভাঙা ছবি থাকলেও বাকি স্লাইডের জন্য আটকাবে না
            img.src = s.image_url;
        })));

        const slidesHtml = data.map((s, i) => {
            const hasLink = !!s.link_url;
            const isCompact = s.display_mode === 'compact';
            // Compact মোডে ছবিতে ক্লিক করলে বড় হয়ে zoom দেখাবে (যদি link না থাকে),
            // link থাকলে সরাসরি সেই লিংকে যাবে — দুটো একসাথে না, link থাকলে link-ই priority পাবে।
            const clickAttr = hasLink
                ? `onclick="window.open('${escHtml(s.link_url)}','_blank')" style="cursor:pointer"`
                : (isCompact ? `onclick="openSlideshowZoom(${i})" style="cursor:zoom-in"` : '');
            return `<div class="slideshow-slide"><img src="${escHtml(s.image_url)}" alt="Slide" ${clickAttr} onerror="this.parentElement.style.display='none'"></div>`;
        }).join('');
        const dotsHtml = data.length > 1
            ? `<div class="slideshow-dots">${data.map((_, i) => `<span class="slideshow-dot${i === 0 ? ' active' : ''}" data-idx="${i}"></span>`).join('')}</div>`
            : '';

        // সব ছবি একই mode হওয়ার কথা (admin এক ব্যাচেই মোড সেট করে), প্রথম ছবির mode ব্যবহার করা হচ্ছে
        const wrapModeClass = data[0]?.display_mode === 'compact' ? 'compact-mode' : '';
        __slideshowImageUrls = data.map(s => s.image_url);

        container.innerHTML = `
            <div class="slideshow-wrap ${wrapModeClass}">
                <div class="slideshow-viewport">
                    <div class="slideshow-track" id="slideshowTrack">${slidesHtml}</div>
                </div>
                ${dotsHtml}
            </div>`;

        __slideshowIdx = 0;
        __slideshowTotal = data.length;
        attachSlideshowSwipe();
        if (data.length > 1) {
            startSlideshowAutoTimer();
        }
    } catch (e) { console.error('Slideshow load error:', e); }
}

function startSlideshowAutoTimer() {
    if (__slideshowTimer) clearInterval(__slideshowTimer);
    __slideshowTimer = setInterval(() => advanceSlideshow(__slideshowTotal), 2000);
}

function advanceSlideshow(total) {
    __slideshowIdx = (__slideshowIdx + 1) % total;
    renderSlideshowPosition();
}

function renderSlideshowPosition() {
    const track = document.getElementById('slideshowTrack');
    if (!track) return;
    track.style.transform = `translateX(-${__slideshowIdx * 100}%)`;
    document.querySelectorAll('.slideshow-dot').forEach((dot, i) => {
        dot.classList.toggle('active', i === __slideshowIdx);
    });
}

// ── ইউজার চাইলে ফিঙ্গার (টাচ) দিয়ে টেনে স্লাইড করতে পারবে ──
// সোয়াইপ করার সময় auto-timer সাময়িক বন্ধ থাকে, swipe শেষ হলে আবার চালু হয়,
// যাতে ইউজারের ম্যানুয়াল কন্ট্রোল আর অটো-স্লাইড একসাথে কনফ্লিক্ট না করে।
function attachSlideshowSwipe() {
    const track = document.getElementById('slideshowTrack');
    if (!track) return;

    track.addEventListener('touchstart', e => {
        __slideshowTouchStartX = e.touches[0].clientX;
        __slideshowTouchDeltaX = 0;
        if (__slideshowTimer) { clearInterval(__slideshowTimer); __slideshowTimer = null; }
    }, { passive: true });

    track.addEventListener('touchmove', e => {
        if (__slideshowTouchStartX === null) return;
        __slideshowTouchDeltaX = e.touches[0].clientX - __slideshowTouchStartX;
        track.style.transition = 'none';
        track.style.transform = `translateX(calc(-${__slideshowIdx * 100}% + ${__slideshowTouchDeltaX}px))`;
    }, { passive: true });

    track.addEventListener('touchend', () => {
        track.style.transition = '';
        const threshold = 40; // px — এর বেশি টানলে স্লাইড পরিবর্তন হবে
        if (__slideshowTouchDeltaX < -threshold && __slideshowIdx < __slideshowTotal - 1) {
            __slideshowIdx++;
        } else if (__slideshowTouchDeltaX > threshold && __slideshowIdx > 0) {
            __slideshowIdx--;
        }
        renderSlideshowPosition();
        __slideshowTouchStartX = null;
        __slideshowTouchDeltaX = 0;
        if (__slideshowTotal > 1) startSlideshowAutoTimer(); // সোয়াইপ শেষে অটো-সিস্টেম আবার চালু
    });
}

/* ══════════════════════════════════════════════
   SPECIAL CARDS  (Flutter: SpecialCardService)
   Max 2, 100% width image, no crop, auto https
══════════════════════════════════════════════ */
async function loadSpecialCards() {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/special_cards?select=*&order=sort_order.asc&limit=2`);
        if (!data?.length) return;

        const container = document.getElementById('specialCardContainer');
        let html = '';
        data.forEach(s => {
            const link = autoHttps(s.link);
            html += `<div class="special-card">`;
            if (s.image_url) html += `<img src="${escHtml(s.image_url)}" alt="Special Card" loading="lazy">`;
            if (s.description) {
                // Render description as markdown-style bullets
                const lines = s.description.split('\n').filter(l => l.trim());
                html += `<div class="special-text-body">`;
                lines.forEach(line => {
                    html += `<p>${escHtml(line)}</p>`;
                });
                html += `</div>`;
            }
            if (s.special_text) {
                if (s.link) {
                    html += `<div class="special-link-wrap">
                        <a href="${link}" target="_blank" class="special-link">${escHtml(s.special_text)}</a>
                    </div>`;
                } else {
                    html += `<div class="special-link-wrap">
                        <span class="special-link" style="cursor:default;">${escHtml(s.special_text)}</span>
