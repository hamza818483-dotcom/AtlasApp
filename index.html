<body class="dark-mode">

    <!-- ========== সাইডবার ওভারলে ========== -->

            <button class="sidebar-item" onclick="goTo('class.html'); closeSidebar();">

            <button class="sidebar-item" onclick="goTo('exam.html'); closeSidebar();">
                <span class="icon">📝</span> ফ্রি এক্সাম সেকশন

            <button class="sidebar-item" onclick="goToMockTest(); closeSidebar();">

            <button class="sidebar-item" onclick="goToMistakes(); closeSidebar();">

            <button class="sidebar-item" onclick="goTo('ai.html'); closeSidebar();">

            <div class="sidebar-divider"></div>

            </button>
            <button class="sidebar-item" onclick="openWhatsApp()">

            </button>
            <button class="sidebar-item" onclick="openTelegram()">

            </button>
            
            <div class="sidebar-divider"></div>
            
            <button class="sidebar-item" onclick="logout()" id="sidebarLogout" style="display:none;">

            <button class="sidebar-item" onclick="goTo('auth.html')" id="sidebarLogin">
                <span class="icon">🔐</span> লগইন / রেজিস্টার

        </nav>

    <!-- ========== হেডার ========== -->
    <header class="header">
        <div class="header-left">
            <button class="hamburger" id="hamburgerBtn" onclick="toggleSidebar()" aria-label="মেনু">☰</button>
            <div class="logo">ATLAS EXAM</div>
        </div>
        <div class="header-right">
            <button class="header-icon" id="themeToggle" onclick="toggleTheme()" aria-label="থিম টগল">🌙</button>
            <button class="header-icon" id="profileIcon" onclick="navigateTo('profile')" aria-label="প্রোফাইল">👤</button>
        </div>
    </header>

    <!-- ========== মেইন কন্টেন্ট ========== -->
    <main class="main-content">
        
        <!-- কাউন্টডাউন কার্ড -->
        <div class="countdown-card">
            <div class="countdown-topic" id="countdownTopic">এইচএসসি ২০২৬ বোর্ড</div>
            <div class="countdown-subtopic" id="countdownSubtopic">ঢাকা বোর্ড প্রস্তুতি</div>
            <div class="countdown-timer" id="countdownTimer">১২ : ০৮ : ৪৫ : ৩২</div>
            <div class="countdown-labels">
                <span>দিন</span>
                <span>ঘণ্টা</span>
                <span>মিনিট</span>
                <span>সেকেন্ড</span>
            </div>
        </div>

        <!-- বাটন গ্রিড -->
        <div class="home-buttons">
            
            <button class="home-btn" onclick="goTo('class.html')">
                <span class="btn-icon">📚</span>
                <span class="btn-text">ফ্রি ক্লাস<br>সেকশন</span>
            </button>
            
            <button class="home-btn" onclick="goTo('exam.html')">
                <span class="btn-icon">📝</span>
                <span class="btn-text">ফ্রি এক্সাম<br>সেকশন</span>
            </button>
            
            <button class="home-btn" onclick="goToMockTest()">
                <span class="btn-icon">🎯</span>
                <span class="btn-text">আনলিমিটেড<br>মক টেস্ট</span>
            </button>
            
            <button class="home-btn" onclick="goToMistakes()">
                <span class="btn-icon">❌</span>
                <span class="btn-text">মাই<br>মিসটেকস</span>
            </button>
            
            <button class="home-btn home-btn-full" onclick="goTo('ai.html')">
                <span class="btn-icon">🤖</span>
                <span class="btn-text">ATLAS AI</span>
            </button>
            <!-- Admin Control বাটন (শুধু অ্যাডমিন দেখবে) -->
<button class="home-btn home-btn-full" id="adminControlBtn" onclick="goTo('admin.html')" style="display:none; background-color: #1A0A0A; border-color: #EF4444; color: #FCA5A5;">
    <span class="btn-icon">👑</span>
    <span class="btn-text">Admin Control</span>
</button>
        </div>

        <!-- সোশ্যাল মিডিয়া রো -->
        <div class="social-row">
            <a href="https://facebook.com" target="_blank" class="social-btn" title="Facebook">📘</a>
            <a href="https://youtube.com/@atlasprep" target="_blank" class="social-btn" title="YouTube">▶️</a>
            <a href="https://t.me/rafi_somc" target="_blank" class="social-btn" title="Telegram">✈️</a>
            <a href="https://wa.me/8801999681290" target="_blank" class="social-btn" title="WhatsApp">💬</a>
        </div>

        <!-- অনার প্রোফাইল -->
        <div class="owner-section">
            <div class="owner-photo-wrapper" onclick="flipOwnerCard()">
                <div class="owner-glow-ring"></div>
                <div style="width:100%; height:100%; border-radius:50%; background-color:#03152F; border:3px solid #2F6BFF; display:flex; align-items:center; justify-content:center; font-size:40px; position:absolute; top:0; left:0; z-index:2;">
                    👤
                </div>
            </div>
        </div>

    </main>

    <!-- ========== নিচের নেভিগেশন বার ========== -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="home" onclick="navigateTo('home')">
            <span class="nav-icon">🏠</span>
            <span>হোম</span>
        </button>
        <button class="nav-item" data-page="class" onclick="goTo('class.html')">
            <span class="nav-icon">📚</span>
            <span>ক্লাস</span>
        </button>
        <button class="nav-item" data-page="exam" onclick="goTo('exam.html')">
            <span class="nav-icon">📝</span>
            <span>এক্সাম</span>
        </button>
        <button class="nav-item" data-page="mock" onclick="goToMockTest()">
            <span class="nav-icon">🎯</span>
            <span>মক</span>
        </button>
        <button class="nav-item" data-page="profile" onclick="navigateTo('profile')">
            <span class="nav-icon">👤</span>
            <span>প্রোফাইল</span>
        </button>
    </nav>

    <!-- ========== ফ্লোটিং WA/TG বাটন ========== -->
    <div class="floating-buttons">
        <button class="fab fab-whatsapp" onclick="openWhatsApp()" title="WhatsApp">💬</button>
        <button class="fab fab-telegram" onclick="openTelegram()" title="Telegram">✈️</button>
    </div>

    <!-- ========== টোস্ট ========== -->
    <div class="toast" id="toast"></div>

    <!-- ========== সব JavaScript এখানেই ========== -->
    <script>
        // ========== গ্লোবাল ভেরিয়েবল ==========
        let isDarkMode = true;
        let isSidebarOpen = false;
        let isLoggedIn = false;
        let currentUser = null;

        // ========== থিম ম্যানেজমেন্ট ==========
        function loadTheme() {
            const savedTheme = localStorage.getItem('atlas-theme');
            if (savedTheme === 'light') {
                isDarkMode = false;
                document.body.classList.remove('dark-mode');
            } else {
                isDarkMode = true;
                document.body.classList.add('dark-mode');
            }
            updateThemeIcon();
        }

        function toggleTheme() {
            console.log('টগল ক্লিক হয়েছে!');
            isDarkMode = !isDarkMode;
            if (isDarkMode) {
                document.body.classList.add('dark-mode');
                localStorage.setItem('atlas-theme', 'dark');
            } else {
                document.body.classList.remove('dark-mode');
                localStorage.setItem('atlas-theme', 'light');
            }
            updateThemeIcon();
            showToast(isDarkMode ? '🌙 ডার্ক মোড চালু' : '☀️ লাইট মোড চালু');
        }

        function updateThemeIcon() {
            const themeBtn = document.getElementById('themeToggle');
            const sidebarIcon = document.getElementById('sidebarThemeIcon');
            const sidebarText = document.getElementById('sidebarThemeText');
            
            if (isDarkMode) {
                if (themeBtn) themeBtn.textContent = '🌙';
                if (sidebarIcon) sidebarIcon.textContent = '🌙';
                if (sidebarText) sidebarText.textContent = 'ডার্ক মোড';
            } else {
                if (themeBtn) themeBtn.textContent = '☀️';
                if (sidebarIcon) sidebarIcon.textContent = '☀️';
                if (sidebarText) sidebarText.textContent = 'লাইট মোড';
            }
        }

        // ========== সাইডবার ==========
        function toggleSidebar() {
            console.log('সাইডবার টগল!');
            isSidebarOpen = !isSidebarOpen;
            const overlay = document.getElementById('sidebarOverlay');
            const sidebar = document.getElementById('sidebar');
            
            if (isSidebarOpen) {
                overlay.classList.add('active');
                sidebar.classList.add('active');
            } else {
                overlay.classList.remove('active');
                sidebar.classList.remove('active');
            }
        }

        function closeSidebar() {
            isSidebarOpen = false;
            document.getElementById('sidebarOverlay').classList.remove('active');
            document.getElementById('sidebar').classList.remove('active');
        }

        // ========== নেভিগেশন ==========
        function goTo(url) {
            console.log('Navigating to:', url);
            window.location.href = url;
        }

        function navigateTo(page) {
            const routes = {
                'home': 'index.html',
                'class': 'class.html',
                'exam': 'exam.html',
                'mock': 'exam.html?mock=true',
                'profile': 'dashboard.html',
                'ai': 'ai.html'
            };
            const url = routes[page] || 'index.html';
            window.location.href = url;
        }

        function goToMockTest() {
            console.log('Mock Test clicked');
            window.location.href = 'exam.html?mock=true';
        }

        function goToMistakes() {
            console.log('Mistakes clicked');
            if (!isLoggedIn) {
                showToast('⚠️ আগে লগইন করুন');
                setTimeout(function() { window.location.href = 'auth.html'; }, 1000);
                return;
            }
            window.location.href = 'dashboard.html#mistakes';
        }

        // ========== সোশ্যাল ==========
        function openWhatsApp() {
            window.open('https://wa.me/8801999681290', '_blank');
        }

        function openTelegram() {
            window.open('https://t.me/rafi_somc', '_blank');
        }

        // ========== টোস্ট ==========
        function showToast(message, duration) {
            duration = duration || 2000;
            var toast = document.getElementById('toast');
            if (!toast) {
                toast = document.createElement('div');
                toast.id = 'toast';
                toast.className = 'toast';
                document.body.appendChild(toast);
            }
            toast.textContent = message;
            toast.classList.add('show');
            clearTimeout(toast._hideTimeout);
            toast._hideTimeout = setTimeout(function() {
                toast.classList.remove('show');
            }, duration);
        }

        // ========== কাউন্টডাউন ==========
        function setupCountdown() {
            var countdownElement = document.getElementById('countdownTimer');
            if (!countdownElement) return;
            
            var targetDate = new Date();
            targetDate.setDate(targetDate.getDate() + 12);
            targetDate.setHours(8, 45, 32, 0);
            
            function updateCountdown() {
                var now = new Date();
                var diff = targetDate - now;
                
                if (diff <= 0) {
                    countdownElement.textContent = '০০ : ০০ : ০০ : ০০';
                    return;
                }
                
                var days = Math.floor(diff / (1000 * 60 * 60 * 24));
                var hours = Math.floor((diff % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
                var minutes = Math.floor((diff % (1000 * 60 * 60)) / (1000 * 60));
                var seconds = Math.floor((diff % (1000 * 60)) / 1000);
                
                countdownElement.textContent = 
                    String(days).padStart(2, '0') + ' : ' + 
                    String(hours).padStart(2, '0') + ' : ' + 
                    String(minutes).padStart(2, '0') + ' : ' + 
                    String(seconds).padStart(2, '0');
            }
            
            updateCountdown();
            setInterval(updateCountdown, 1000);
        }

        // ========== অনার কার্ড ==========
        function flipOwnerCard() {
            showToast('👤 মালিকের তথ্য শীঘ্রই আসছে...');
        }

        // ========== লগআউট ==========
        function logout() {
            localStorage.removeItem('atlas-session');
            isLoggedIn = false;
            currentUser = null;
            closeSidebar();
            showToast('সফলভাবে লগআউট হয়েছে');
            setTimeout(function() { window.location.href = 'index.html'; }, 800);
        }

        // ========== পেজ লোড ==========
        document.addEventListener('DOMContentLoaded', function() {
            console.log('ATLAS EXAM লোড হয়েছে!');
            loadTheme();
            setupCountdown();
            
            // সেশন চেক
            var session = localStorage.getItem('atlas-session');
            if (session) {
                try {
                    currentUser = JSON.parse(session);
                    isLoggedIn = true;
                    document.getElementById('sidebarLogout').style.display = 'flex';
                    document.getElementById('sidebarLogin').style.display = 'none';
                } catch(e) {
                    localStorage.removeItem('atlas-session');
                }
            }
        });
        // অ্যাডমিন চেক
const session = localStorage.getItem('atlas-session');
if (session) {
    try {
        const user = JSON.parse(session);
        if (user.phone === '01754365403' || user.role === 'admin') {
            document.getElementById('adminControlBtn').style.display = 'flex';
            console.log('👑 Admin Control Button Visible');
        }
    } catch(e) {}
}
    </script>

</body>
