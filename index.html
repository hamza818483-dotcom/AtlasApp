<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS EXAM</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🟥</text></svg>">
</head>
<body class="dark-mode">

    <!-- ========== সাইডবার ওভারলে ========== -->
    <div class="sidebar-overlay" id="sidebarOverlay"></div>

    <!-- ========== সাইডবার ========== -->
    <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <div class="sidebar-logo">ATLAS EXAM</div>
        </div>
        
        <nav class="sidebar-menu">
            <button class="sidebar-item" onclick="navigateTo('profile')">
                <span class="icon">👤</span> প্রোফাইল
            </button>
            <button class="sidebar-item" onclick="navigateTo('home')">
                <span class="icon">🏠</span> হোম
            </button>
            <button class="sidebar-item" onclick="navigateTo('class')">
                <span class="icon">📚</span> ফ্রি ক্লাস সেকশন
            </button>
            <button class="sidebar-item" onclick="navigateTo('exam')">
                <span class="icon">📝</span> ফ্রি এক্সাম সেকশন
            </button>
            <button class="sidebar-item" onclick="goToMockTest()">
                <span class="icon">🎯</span> আনলিমিটেড মক টেস্ট
            </button>
            <button class="sidebar-item" onclick="goToMistakes()">
                <span class="icon">❌</span> মাই মিসটেকস
            </button>
            <button class="sidebar-item" onclick="navigateTo('ai')">
                <span class="icon">🤖</span> ATLAS AI
            </button>
            
            <div class="sidebar-divider"></div>
            
            <button class="sidebar-item theme-toggle-btn" onclick="toggleTheme()">
                <span class="icon" id="sidebarThemeIcon">🌙</span> 
                <span id="sidebarThemeText">ডার্ক মোড</span>
            </button>
            <button class="sidebar-item" onclick="openWhatsApp()">
                <span class="icon">💬</span> WhatsApp
            </button>
            <button class="sidebar-item" onclick="openTelegram()">
                <span class="icon">✈️</span> Telegram
            </button>
            
            <div class="sidebar-divider"></div>
            
            <button class="sidebar-item" onclick="logout()" id="sidebarLogout" style="display:none;">
                <span class="icon">🚪</span> লগআউট
            </button>
            <button class="sidebar-item" onclick="goTo('auth.html')" id="sidebarLogin">
                <span class="icon">🔐</span> লগইন / রেজিস্টার
            </button>
        </nav>
    </aside>

    <!-- ========== হেডার ========== -->
    <header class="header">
        <div class="header-left">
            <button class="hamburger" id="hamburgerBtn" aria-label="মেনু">☰</button>
            <div class="logo">ATLAS EXAM</div>
        </div>
        <div class="header-right">
            <button class="header-icon" id="themeToggle" onclick="toggleTheme()" aria-label="থিম টগল">🌙</button>
            <button class="header-icon" id="profileIcon" onclick="navigateTo('profile')" aria-label="প্রোফাইল">👤</button>
        </div>
    </header>

    <!-- ========== মেইন কন্টেন্ট ========== -->
    <main class="main-content">
        
        <!-- কাউন্টডাউন কার্ড -->
        <div class="countdown-card">
            <div class="countdown-topic" id="countdownTopic">এইচএসসি ২০২৬ বোর্ড</div>
            <div class="countdown-subtopic" id="countdownSubtopic">ঢাকা বোর্ড প্রস্তুতি</div>
            <div class="countdown-timer" id="countdownTimer">১২ : ০৮ : ৪৫ : ৩২</div>
            <div class="countdown-labels">
                <span>দিন</span>
                <span>ঘণ্টা</span>
                <span>মিনিট</span>
                <span>সেকেন্ড</span>
            </div>
        </div>

        <!-- বাটন গ্রিড -->
        <div class="home-buttons">
            
            <button class="home-btn" onclick="goTo('class.html')">
                <span class="btn-icon">📚</span>
                <span class="btn-text">ফ্রি ক্লাস<br>সেকশন</span>
            </button>
            
            <button class="home-btn" onclick="goTo('exam.html')">
                <span class="btn-icon">📝</span>
                <span class="btn-text">ফ্রি এক্সাম<br>সেকশন</span>
            </button>
            
            <button class="home-btn" onclick="goToMockTest()">
                <span class="btn-icon">🎯</span>
                <span class="btn-text">আনলিমিটেড<br>মক টেস্ট</span>
            </button>
            
            <button class="home-btn" onclick="goToMistakes()">
                <span class="btn-icon">❌</span>
                <span class="btn-text">মাই<br>মিসটেকস</span>
            </button>
            
            <button class="home-btn home-btn-full" onclick="goTo('ai.html')">
                <span class="btn-icon">🤖</span>
                <span class="btn-text">ATLAS AI</span>
            </button>
            
        </div>

        <!-- সোশ্যাল মিডিয়া রো -->
        <div class="social-row">
            <a href="https://facebook.com" target="_blank" class="social-btn" title="Facebook">📘</a>
            <a href="https://youtube.com/@atlasprep" target="_blank" class="social-btn" title="YouTube">▶️</a>
            <a href="https://t.me/rafi_somc" target="_blank" class="social-btn" title="Telegram">✈️</a>
            <a href="https://wa.me/8801999681290" target="_blank" class="social-btn" title="WhatsApp">💬</a>
        </div>

        <!-- অনার প্রোফাইল -->
        <div class="owner-section">
            <div class="owner-photo-wrapper" onclick="flipOwnerCard()">
                <div class="owner-glow-ring"></div>
                <img src="assets/owner-photo.jpg" alt="Owner" class="owner-photo" 
                     onerror="this.style.display='none'; this.parentElement.querySelector('.owner-photo-fallback').style.display='flex';">
                <div class="owner-photo-fallback" style="display:none; width:100%; height:100%; border-radius:50%; background-color:var(--atlas-bg); border:3px solid var(--atlas-border); align-items:center; justify-content:center; font-size:40px; position:absolute; top:0; left:0; z-index:2;">
                    👤
                </div>
            </div>
        </div>

    </main>

    <!-- ========== নিচের নেভিগেশন বার ========== -->
    <nav class="bottom-nav">
        <button class="nav-item active" data-page="home">
            <span class="nav-icon">🏠</span>
            <span>হোম</span>
        </button>
        <button class="nav-item" data-page="class">
            <span class="nav-icon">📚</span>
            <span>ক্লাস</span>
        </button>
        <button class="nav-item" data-page="exam">
            <span class="nav-icon">📝</span>
            <span>এক্সাম</span>
        </button>
        <button class="nav-item" data-page="mock">
            <span class="nav-icon">🎯</span>
            <span>মক</span>
        </button>
        <button class="nav-item" data-page="profile">
            <span class="nav-icon">👤</span>
            <span>প্রোফাইল</span>
        </button>
    </nav>

    <!-- ========== ফ্লোটিং WA/TG বাটন ========== -->
    <div class="floating-buttons">
        <button class="fab fab-whatsapp" onclick="openWhatsApp()" title="WhatsApp">💬</button>
        <button class="fab fab-telegram" onclick="openTelegram()" title="Telegram">✈️</button>
    </div>

    <!-- ========== টোস্ট ========== -->
    <div class="toast" id="toast"></div>

    <!-- ========== JavaScript ========== -->
    <script src="app.js"></script>
    <script>
        // থিম আইকন সিঙ্ক
        document.addEventListener('DOMContentLoaded', function() {
            updateThemeIcon();
        });
    </script>

</body>
</html>
