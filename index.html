<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP</title>
    <link rel="stylesheet" href="style.css">
    <style>
        .home-buttons{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:14px;}
        @media(min-width:600px){.home-buttons{grid-template-columns:repeat(3,1fr);}}
        .home-btn{background-color:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-md);padding:16px 10px;font-family:'Noto Sans Bengali','Inter',sans-serif;font-size:13px;font-weight:600;text-align:center;cursor:pointer;transition:all 0.2s ease;box-shadow:var(--shadow-sm);display:flex;flex-direction:column;align-items:center;gap:6px;}
        .home-btn:hover{border-color:var(--accent);box-shadow:var(--shadow-glow),var(--shadow);transform:translateY(-2px);}
        .home-btn .btn-icon{font-size:24px;}
        .home-btn .btn-text{font-size:11px;line-height:1.3;}
        .home-btn-full{grid-column:1/-1;}
        .home-btn.admin-btn{border-color:var(--error);color:var(--error);display:none;}
        .home-btn.admin-btn:hover{background:var(--error-light);box-shadow:var(--error-glow);}
        
        .countdown-card{background:linear-gradient(140deg,var(--atlas-bg)0%,var(--atlas-card)100%);border:1.5px solid var(--atlas-border);border-radius:var(--radius);padding:20px 16px;margin-bottom:14px;text-align:center;position:relative;animation:pulseGlow 3s ease-in-out infinite;display:flex;flex-direction:column;align-items:center;justify-content:center;}
        .timer-serial-box{position:absolute;top:0;left:0;padding:4px 12px;border-radius:0 0 8px 0;font-size:10px;font-weight:700;color:#fff;letter-spacing:0.5px;}
        .timer-main-topic{font-size:20px;font-weight:800;color:#fff;margin-bottom:4px;}
        .timer-subtopic{font-size:12px;color:var(--atlas-text);opacity:0.75;margin-bottom:12px;}
        .timer-row{display:flex;align-items:center;justify-content:center;gap:8px;}
        .timer-clock-icon{font-size:24px;}
        .timer-values{display:flex;align-items:center;gap:4px;}
        .timer-block{display:flex;flex-direction:column;align-items:center;}
        .timer-number{font-size:16px;font-weight:700;color:var(--atlas-text);letter-spacing:1px;}
        .timer-separator{font-size:16px;font-weight:700;color:var(--atlas-text);margin-top:-8px;}
        .timer-label{font-size:9px;color:var(--atlas-text);opacity:0.6;}
        .timer-1{--timer-border-color:#F85149;--timer-accent:#F85149;--timer-glow:rgba(248,81,73,0.4);}
        .timer-2{--timer-border-color:#3B82F6;--timer-accent:#3B82F6;--timer-glow:rgba(59,130,246,0.4);}
        .timer-3{--timer-border-color:#22C55E;--timer-accent:#22C55E;--timer-glow:rgba(34,197,94,0.4);}
        .timer-4{--timer-border-color:#EC4899;--timer-accent:#EC4899;--timer-glow:rgba(236,72,153,0.4);}
        .timer-5{--timer-border-color:#F97316;--timer-accent:#F97316;--timer-glow:rgba(249,115,22,0.4);}
        
        .special-card{background:var(--card-bg);border:2px solid #F85149;border-radius:var(--radius);padding:16px;margin-bottom:14px;text-align:center;box-shadow:var(--shadow-sm);animation:specialGlow 2s ease-in-out infinite;}
        @keyframes specialGlow{0%,100%{box-shadow:0 0 8px rgba(248,81,73,0.3),0 0 16px rgba(248,81,73,0.15);border-color:rgba(248,81,73,0.6);}50%{box-shadow:0 0 18px rgba(248,81,73,0.5),0 0 32px rgba(248,81,73,0.25);border-color:rgba(248,81,73,1);}}
        .special-card img{max-width:100%;max-height:160px;border-radius:var(--radius-sm);object-fit:cover;margin-bottom:8px;}
        .special-text{font-size:12px;color:var(--text-secondary);margin-bottom:8px;font-family:'Noto Sans Bengali','Inter',sans-serif;}
        .special-link{display:inline-block;padding:8px 20px;background:var(--accent);color:#fff;border-radius:var(--radius-full);font-size:12px;font-weight:700;text-decoration:none;transition:all 0.2s ease;box-shadow:var(--shadow-sm);}
        
        .social-row{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin-bottom:16px;}
        .social-chip{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;border-radius:var(--radius-full);font-size:11px;font-weight:600;background:var(--card-bg);border:1px solid var(--border);color:var(--text-secondary);text-decoration:none;cursor:pointer;transition:all 0.2s ease;}
        .social-chip:hover{border-color:var(--accent);color:var(--accent);box-shadow:var(--shadow-glow);transform:translateY(-1px);}
        
        .owner-section{display:flex;flex-direction:column;align-items:center;margin:18px 0 14px;}
        .owner-name-top{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:10px;}
        .flip-card-owner{width:130px;height:130px;perspective:800px;cursor:pointer;}
        .flip-card-owner.flipped .flip-card-inner-owner{transform:rotateY(180deg);}
        .flip-card-inner-owner{position:relative;width:100%;height:100%;transition:transform 0.5s ease;transform-style:preserve-3d;}
        .flip-front-owner,.flip-back-owner{position:absolute;width:100%;height:100%;backface-visibility:hidden;border-radius:var(--radius-sm);}
        .flip-front-owner{background:var(--card-bg);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;}
        .flip-back-owner{background:var(--card-bg);border:1px solid var(--accent);transform:rotateY(180deg);padding:10px;text-align:center;font-size:10px;color:var(--text-secondary);display:flex;align-items:center;justify-content:center;}
        .owner-photo-wrapper{position:relative;width:130px;height:130px;}
        .owner-photo-box{width:130px;height:130px;border-radius:var(--radius-sm);object-fit:cover;border:2px solid var(--border);position:relative;z-index:2;}
        .owner-glow-box{position:absolute;top:-8px;left:-8px;width:calc(130px + 16px);height:calc(130px + 16px);border-radius:calc(var(--radius-sm) + 8px);background:transparent;animation:rotateGlowBox 3s linear infinite;z-index:1;pointer-events:none;}
        .owner-glow-box::before{content:'';position:absolute;top:-3px;left:-3px;width:calc(100% + 6px);height:calc(100% + 6px);border-radius:calc(var(--radius-sm) + 10px);background:conic-gradient(from 0deg,transparent 0deg,var(--accent) 90deg,transparent 180deg,transparent 270deg,var(--accent) 360deg);animation:rotateGlowBox 1.8s linear infinite;opacity:0.32;filter:blur(5px);}
        
        .filter-row{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
        .filter-row select{padding:6px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:11px;font-family:inherit;}
        .mistake-item{background:var(--card-hover);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px;margin-bottom:8px;}
        .mistake-item summary{font-weight:700;font-size:13px;cursor:pointer;color:var(--text);}
        .mistake-item summary:hover{color:var(--accent);}
        .mistake-item .dropdown-actions{display:flex;flex-direction:column;gap:4px;margin-top:8px;}
    </style>
</head>

async function safeFetch(url,opts={}){
    opts.headers=Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY},opts.headers||{});
    if(!opts.headers['Content-Type']&&opts.method!=='DELETE')opts.headers['Content-Type']='application/json';
    try{const res=await fetch(url,opts);const text=await res.text();if(!text?.trim())return[];const data=JSON.parse(text);if(!res.ok)throw new Error(data.message);return data;}
    catch(e){console.error('❌',e.message);return[];}
}

async function loadTimers(){
    try{
        const data=await safeFetch(`${SUPABASE_URL}/rest/v1/countdowns?select=*&order=sort_order.asc&limit=5`);
        if(!data?.length)return;
        const container=document.getElementById('timerContainer');
        let html='';
        data.forEach((cd,i)=>{
            html+=`<div class="countdown-card timer-${i+1}">
                <div class="timer-serial-box">ATLAS Timer-${String(i+1).padStart(2,'0')}</div>
                <div class="timer-main-topic">${cd.main_topic}</div>
                ${cd.subtopic?`<div class="timer-subtopic">${cd.subtopic}</div>`:''}
                <div class="timer-row">
                    <span class="timer-clock-icon">🕐</span>
                    <div class="timer-values">
                        <div class="timer-block"><span class="timer-number countdown-d-${i}">--</span><span class="timer-label">দিন</span></div>
                        <span class="timer-separator">:</span>
                        <div class="timer-block"><span class="timer-number countdown-h-${i}">--</span><span class="timer-label">ঘণ্টা</span></div>
                        <span class="timer-separator">:</span>
                        <div class="timer-block"><span class="timer-number countdown-m-${i}">--</span><span class="timer-label">মিনিট</span></div>
                        <span class="timer-separator">:</span>
                        <div class="timer-block"><span class="timer-number countdown-s-${i}">--</span><span class="timer-label">সেকেন্ড</span></div>
                    </div>
                </div>
            </div>`;
            setTimeout(()=>startCountdown(cd.end_time,i),i*100);
        });
        container.innerHTML=html;
    }catch(e){}
}

function startCountdown(endTime,i){
    const target=new Date(endTime);
    const dEl=document.querySelector(`.countdown-d-${i}`);
    const hEl=document.querySelector(`.countdown-h-${i}`);
    const mEl=document.querySelector(`.countdown-m-${i}`);
    const sEl=document.querySelector(`.countdown-s-${i}`);
    if(!dEl)return;
    function update(){
        const diff=target-new Date();
        if(diff<=0){dEl.textContent='০০';hEl.textContent='০০';mEl.textContent='০০';sEl.textContent='০০';return;}
        dEl.textContent=String(Math.floor(diff/(1000*60*60*24))).padStart(2,'0');
        hEl.textContent=String(Math.floor((diff%(1000*60*60*24))/(1000*60*60))).padStart(2,'0');
        mEl.textContent=String(Math.floor((diff%(1000*60*60))/(1000*60))).padStart(2,'0');
        sEl.textContent=String(Math.floor((diff%(1000*60))/1000)).padStart(2,'0');
    }
    update();setInterval(update,1000);
}

async function loadSpecialCards(){
    try{
        const data=await safeFetch(`${SUPABASE_URL}/rest/v1/special_cards?select=*&order=sort_order.asc&limit=1`);
        if(!data?.length)return;
        const s=data[0];
        let html='<div class="special-card">';
        if(s.image_url)html+=`<img src="${s.image_url}" alt="Special">`;
        if(s.description)html+=`<div class="special-text">${s.description}</div>`;
        if(s.special_text&&s.link)html+=`<a href="${s.link}" target="_blank" class="special-link">${s.special_text}</a>`;
        else if(s.special_text)html+=`<span class="special-link" style="cursor:default;">${s.special_text}</span>`;
        html+='</div>';
        document.getElementById('specialCardContainer').innerHTML=html;
    }catch(e){}
}

async function loadSocialLinks(){
    try{
        const data=await safeFetch(`${SUPABASE_URL}/rest/v1/social_links?select=*&order=sort_order.asc&limit=20`);
        if(!data?.length)return;
        const icons={facebook:'📘',youtube:'▶️',telegram:'✈️',whatsapp:'💬',other:'🔗'};
        document.getElementById('socialRow').innerHTML=data.map(s=>`<a href="${s.link}" target="_blank" class="social-chip">${icons[s.type]||'🔗'} ${s.media_name}</a>`).join('');
    }catch(e){}
}

function loadOwnerInfo(){

    const name=localStorage.getItem('owner_name');
    const info=localStorage.getItem('owner_info');
    if(name)document.getElementById('ownerNameTop').textContent=name;
    if(info)document.getElementById('ownerInfoBack').innerHTML=info.replace(/\n/g,'<br>');
    if(photo){const img=document.getElementById('ownerPhoto');img.src=photo;img.style.display='block';document.getElementById('ownerPhotoFallback').style.display='none';}
}

async function loadMentors(){
    try{
        const data=await safeFetch(`${SUPABASE_URL}/rest/v1/mentors?select=*&order=sort_order.asc&limit=6`);
        if(!data?.length)return;
        let html='<div style="text-align:center;margin:16px 0;"><div style="font-size:12px;color:var(--accent);font-weight:700;margin-bottom:8px;">👨‍🏫 Mentors</div><div style="display:flex;flex-wrap:wrap;gap:10px;justify-content:center;">';
        data.forEach(m=>{html+=`<div style="text-align:center;width:80px;"><img src="${m.photo_url||''}" style="width:60px;height:60px;border-radius:10px;object-fit:cover;border:2px solid var(--border);" onerror="this.style.display='none'"><div style="font-size:10px;font-weight:600;margin-top:3px;">${m.name}</div><div style="font-size:9px;color:var(--text-secondary);">${m.role||''}</div></div>`;});
        html+='</div></div>';
        document.getElementById('mentorsContainer').innerHTML=html;
    }catch(e){}
}

function checkAdmin(){
    try{const sess=JSON.parse(localStorage.getItem('atlas-session'));if(sess?.phone==='01754365403'||sess?.role==='admin'||sess?.role==='sub_admin'){document.getElementById('adminBtn').style.display='flex';document.getElementById('adminSidebarBtn').style.display='flex';}}catch(e){}
}

function openMistakesModal(){
    const sess=localStorage.getItem('atlas-session');
    if(!sess){document.getElementById('modalContent').innerHTML='<div class="modal-title">⚠️ My Mistakes</div><p style="color:var(--text-secondary);text-align:center;">লগইন করুন</p><button class="btn btn-outline" onclick="closeModal()" style="width:100%;margin-top:8px;">✕ বন্ধ</button>';document.getElementById('mainModal').classList.add('active');return;}
    goTo('dashboard.html');
}

function showError(title,message,details,retryFn){
    const existing=document.querySelector('.error-popup-overlay');if(existing)existing.remove();
    const overlay=document.createElement('div');overlay.className='error-popup-overlay';
    let retryHTML='';if(retryFn){retryHTML=`<button class="error-popup-retry" onclick="this.closest('.error-popup-overlay').remove();(${retryFn.toString()})();">🔄 আবার চেষ্টা</button>`;}
    overlay.innerHTML=`<div class="error-popup" onclick="event.stopPropagation()"><div class="error-popup-icon">⚠️</div><div class="error-popup-title">${title||'কিছু সমস্যা হয়েছে'}</div><div class="error-popup-message">${message||'পরে আবার চেষ্টা করুন'}</div>${details?`<div class="error-popup-details">${details}</div>`:''}<div style="display:flex;justify-content:center;gap:8px;">${retryHTML}<button class="error-popup-btn" onclick="this.closest('.error-popup-overlay').remove()">✕ বন্ধ</button></div></div>`;
    overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove();});document.body.appendChild(overlay);
}
window.addEventListener('error',function(e){showError('💥 সমস্যা','পৃষ্ঠাটি রিলোড করুন',e.error?.message,()=>location.reload());});
window.addEventListener('unhandledrejection',function(e){showError('⚠️ প্রসেসিং সমস্যা','অনুরোধ সম্পূর্ণ করা যায়নি',e.reason?.message,null);});

document.addEventListener('DOMContentLoaded',()=>{
    loadTimers();loadSpecialCards();loadSocialLinks();loadOwnerInfo();loadMentors();checkAdmin();
});
</script>
