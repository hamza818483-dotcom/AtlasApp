async function loadSocialLinks() {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/social_links?select=*&order=sort_order.asc&limit=20`);
        if (!data?.length) return;

        const platClass = { facebook:'plat-facebook', youtube:'plat-youtube', telegram:'plat-telegram', whatsapp:'plat-whatsapp' };

        document.getElementById('socialRow').innerHTML = data.map(s => {
            const svg = PLATFORM_SVGS[s.type] || PLATFORM_SVGS.other;
            const cls = platClass[s.type] || '';
            return `<a href="${escHtml(autoHttps(s.link))}" target="_blank" rel="noopener" class="social-chip ${cls}">
                ${svg} ${escHtml(s.media_name)}
            </a>`;
        }).join('');
    } catch(e) {}

function loadOwnerInfo() {
    const photo = localStorage.getItem('owner_photo');
    const name  = localStorage.getItem('owner_name');
    const info  = localStorage.getItem('owner_info');

    if (name) document.getElementById('ownerNameTop').textContent = name;
    if (info) document.getElementById('ownerInfoBack').innerHTML = escHtml(info).replace(/\n/g,'<br>');
    if (photo) {
        const img = document.getElementById('ownerPhoto');
        img.src = photo; img.style.display = 'block';
        document.getElementById('ownerPhotoFallback').style.display = 'none';
    }
}

// আলাদা কোনো সাব-পেজ/তালিকা নেই। key দিয়ে telegram_support_links
// টেবিল থেকে সঠিক row বের করা হয়।
async function __tgFetchLink(key) {
    const data = await safeFetch(`${SUPABASE_URL}/rest/v1/telegram_support_links?select=*&key=eq.${key}&limit=1`);
    return data?.[0] || null;
}

window.__tgOpenDirectLink = async function (key) {
    try {
        const row = await __tgFetchLink(key);
        if (!row?.link) { showToast('এখনো লিংক যোগ করা হয়নি।'); return; }
        closeModal();
        window.open(row.link, '_blank');
    } catch (e) {
        console.error('__tgOpenDirectLink error:', e);
        showToast('লোড করতে সমস্যা হয়েছে।');
    }
};

function renderMistakesModal() {
    const mc = document.getElementById('modalContent');

    // Check if any wrong/skip
    const hasMistakes = mistakesData.some(r => (r.wrong||0) > 0 || (r.skipped||0) > 0);
    if (!mistakesData.length || !hasMistakes) {
        mc.innerHTML = `<div class="modal-title"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.3 4L2 18h20L13.7 4a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.7"/><path d="M12 9v5M12 17h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> My Mistakes</div>
            <div class="empty-state">
                <span class="empty-icon"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 20l3.5-9.5L14 4l6 6-6.5 6.5z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="6" cy="18" r="1" fill="currentColor"/><circle cx="17" cy="8" r="1" fill="currentColor"/></svg></span>
                <div>সব সঠিক! কোনো ভুল নেই</div>
            </div>
            <div class="modal-close">
                <button class="btn btn-outline" onclick="closeModal()" style="width:100%;"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> বন্ধ</button>
            </div>`;
        return;
    }

    // Build filter options
    const cats = [...new Set(mistakesData.map(r => r.category).filter(Boolean))];
    const subs = [...new Set(mistakesData.map(r => r.subject).filter(Boolean))];

    // Filter data
    let filtered = mistakesData.filter(r => (r.wrong||0) > 0 || (r.skipped||0) > 0);
    if (currentMistakeFilter !== 'all') filtered = filtered.filter(r => r.category === currentMistakeFilter);
    if (currentSubjectFilter !== 'all') filtered = filtered.filter(r => r.subject === currentSubjectFilter);

    let html = `<div class="modal-title"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.3 4L2 18h20L13.7 4a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.7"/><path d="M12 9v5M12 17h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> My Mistakes</div>
        <div class="filter-row">
            <select onchange="currentMistakeFilter=this.value;renderMistakesModal();">
                <option value="all">সব ক্যাটাগরি</option>
                ${cats.map(c=>`<option value="${escHtml(c)}" ${currentMistakeFilter===c?'selected':''}>${escHtml(c)}</option>`).join('')}
            </select>
            <select onchange="currentSubjectFilter=this.value;renderMistakesModal();">
                <option value="all">সব সাবজেক্ট</option>
                ${subs.map(s=>`<option value="${escHtml(s)}" ${currentSubjectFilter===s?'selected':''}>${escHtml(s)}</option>`).join('')}
            </select>
        </div>`;

    if (!filtered.length) {
        html += `<div class="empty-state"><span class="empty-icon"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><circle cx="10.5" cy="10.5" r="6.5" stroke="currentColor" stroke-width="1.7"/><path d="M20 20l-5-5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg></span><div>এই ফিল্টারে কোনো ভুল নেই</div></div>`;
    } else {
        filtered.forEach(r => { html += buildMistakeCard(r); });
    }

    html += `<div class="modal-close">
        <button class="btn btn-outline" onclick="closeModal()" style="width:100%;"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> বন্ধ</button>
    </div>`;

    mc.innerHTML = html;
}

async function viewMistakeDetail(resultId, examId) {
    const mc = document.getElementById('modalContent');
    mc.innerHTML = `<div class="modal-title"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="8.5" y="2.5" width="7" height="3" rx="1" fill="currentColor"/><path d="M8 11h8M8 14.5h8M8 18h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> বিস্তারিত লোড হচ্ছে...</div>
        <div class="skeleton skeleton-block"></div>`;

    const result = mistakesData.find(r => String(r.id) === String(resultId));
    if (!result) { mc.innerHTML = `<div class="modal-title">এরর</div><button class="btn btn-outline" onclick="renderMistakesModal()">← ফিরে যান</button>`; return; }

    detailModalResult = result;
    detailModalAnswers = {};
    try { detailModalAnswers = typeof result.answers === 'string' ? JSON.parse(result.answers) : (result.answers||{}); } catch(e) {}

    // Load questions
    detailModalQuestions = await safeFetch(
        `${SUPABASE_URL}/rest/v1/questions?exam_id=eq.${examId}&select=*&order=id.asc`
    ) || [];

    currentQFilter = 'all';
    renderMistakeDetailModal();
}

function renderMistakeDetailModal() {
    const r = detailModalResult;
    const mc = document.getElementById('modalContent');
    const examName = r.exam_name || `এক্সাম #${r.exam_id}`;
    const score = parseFloat(r.final_score)||0;
    const total = r.total_questions||50;
    const pct = Math.round((score/total)*100);
    const badgeCls = pct>=80?'score-high':pct>=50?'score-mid':'score-low';

    let html = `<div class="modal-title"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="8.5" y="2.5" width="7" height="3" rx="1" fill="currentColor"/><path d="M8 11h8M8 14.5h8M8 18h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> ${escHtml(examName)}</div>
        <div style="text-align:center;margin-bottom:8px;">
            <span style="font-size:13px;padding:3px 12px;border-radius:12px;font-weight:700;"
                  class="${badgeCls}">${score.toFixed(1)}/${total}</span>
        </div>
        <div style="display:flex;justify-content:space-around;padding:8px;background:var(--card-hover);border-radius:8px;margin-bottom:10px;">

            <div style="text-align:center;"><div style="color:var(--error);font-size:15px;font-weight:800;"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> ${r.wrong||0}</div><div style="font-size:9px;color:var(--text-secondary);">ভুল</div></div>
            <div style="text-align:center;"><div style="color:var(--yellow);font-size:15px;font-weight:800;">⏭️ ${r.skipped||0}</div><div style="font-size:9px;color:var(--text-secondary);">স্কিপ</div></div>
        </div>`;

    if (detailModalQuestions.length) {
        html += `<div class="q-filter-tabs">
            <button class="q-filter-tab ${currentQFilter==='all'?'active':''}" onclick="currentQFilter='all';renderMistakeDetailModal();"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><rect x="5" y="4" width="14" height="17" rx="2" stroke="currentColor" stroke-width="1.7"/><rect x="8.5" y="2.5" width="7" height="3" rx="1" fill="currentColor"/><path d="M8 11h8M8 14.5h8M8 18h5" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg> সব</button>
            <button class="q-filter-tab ${currentQFilter==='correct'?'active':''}" onclick="currentQFilter='correct';renderMistakeDetailModal();"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> সঠিক</button>
            <button class="q-filter-tab ${currentQFilter==='wrong'?'active':''}" onclick="currentQFilter='wrong';renderMistakeDetailModal();"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> ভুল</button>

        </div>`;
        html += buildDetailQuestionsHtml(detailModalQuestions, detailModalAnswers, currentQFilter);

        html += `<p style="text-align:center;color:var(--text-secondary);padding:16px;">প্রশ্ন পাওয়া যায়নি</p>`;
    }

    html += `<div class="modal-close">

        </div>
        <button class="btn btn-outline" onclick="renderMistakesModal()" style="width:100%;margin-top:6px;">← ফিরে যান</button>
    </div>`;

    mc.innerHTML = html;
}

function buildDetailQuestionsHtml(questions, answers, filter) {
    const opts = ['ক','খ','গ','ঘ','ঙ'];
    let items = questions.map((q, idx) => {
        const userAns = answers[q.id] !== undefined ? answers[q.id] : (answers[idx] !== undefined ? answers[idx] : null);
        const correct = q.correct_option;
        let status = 'skipped';
        if (userAns !== null && userAns !== undefined && userAns !== '') {
            status = String(userAns) === String(correct) ? 'correct' : 'wrong';
        }
        return { q, userAns, status };
    });

    if (filter !== 'all') items = items.filter(i => i.status === filter);
    if (!items.length) return `<div class="empty-state" style="padding:20px;">
        <span class="empty-icon">${filter==='correct'?'<svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>':filter==='wrong'?'<svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>':'⏭️'}</span>
        <div>কোনো প্রশ্ন নেই</div></div>`;

    return items.map(({ q, userAns, status }) => {
        const statusLabel = status==='correct'?'<svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12.5l5 5L20 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg> সঠিক':status==='wrong'?'<svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> ভুল':'⏭️ স্কিপ';
        const allOpts = [q.option_a, q.option_b, q.option_c, q.option_d, q.option_e].filter(Boolean);
        const optHtml = allOpts.map((opt, i) => {
            const isC = String(i)===String(q.correct_option)||String(opts[i])===String(q.correct_option);
            const isW = !isC && (String(i)===String(userAns)||String(opts[i])===String(userAns));
            return `<li class="option-item ${isC?'correct':isW?'wrong':''}">
                <span class="option-key">${opts[i]}</span>${escHtml(opt)}
            </li>`;
        }).join('');

        return `<div class="question-card">
            <span class="q-status ${status}">${statusLabel}</span>
            ${q.image_url?`<img class="question-img" src="${escHtml(q.image_url)}" alt="" loading="lazy">`:''}
            <div class="question-text">${escHtml(q.question||'')}</div>
            <ul class="options-list">${optHtml}</ul>
            ${q.explanation?`<div class="explanation-box"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M9 18h6M10 21h4M12 3a6 6 0 00-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0012 3z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/></svg> ${escHtml(q.explanation)}</div>`:''}
        </div>`;
    }).join('');
}

/* ══════════════════════════════════════════════
   PRACTICE MODES  (Flutter: PracticeExamScreen)
   Practice-01: skipped only
   Practice-02: wrong + skipped
   NOT saved to exam history
══════════════════════════════════════════════ */
function startPractice(resultId, examId, mode) {
    // Collect question IDs based on mode
    const r = detailModalResult || mistakesData.find(x => String(x.id)===String(resultId));
    if (!r) { showToast('ডাটা পাওয়া যায়নি'); return; }

    let answers = {};
    try { answers = typeof r.answers==='string' ? JSON.parse(r.answers) : (r.answers||{}); } catch(e) {}

    // Filter question indices based on mode
    const qs = detailModalQuestions.length ? detailModalQuestions : [];
    let practiceQIds = [];

    qs.forEach((q, idx) => {
        const userAns = answers[q.id] !== undefined ? answers[q.id] : answers[idx];
        const correct = q.correct_option;
        const isSkipped = userAns === null || userAns === undefined || userAns === '';
        const isWrong = !isSkipped && String(userAns) !== String(correct);

        if (mode === 'skipped' && isSkipped) practiceQIds.push(q.id);
        if (mode === 'both' && (isSkipped || isWrong)) practiceQIds.push(q.id);
    });

    if (!practiceQIds.length) {
        showToast('কোনো প্রশ্ন নেই এই মোডে');
        return;
    }

    const label = mode==='skipped' ? 'Practice-01' : 'Practice-02';
    // Pass to exam.html in practice mode (no save)
    const params = new URLSearchParams({
        practice: '1',
        mode: mode,
        source_exam: examId,
        q_ids: practiceQIds.join(','),
        label: label
    });
    closeModal();
    goTo('exam.html?' + params.toString());
}

function toggleNotifDropdown() {
    isNotifDropdownOpen = !isNotifDropdownOpen;
    const dd = document.getElementById('notifDropdown');
    dd.classList.toggle('open', isNotifDropdownOpen);
    if (isNotifDropdownOpen) loadNotifDropdown();
}

// Close dropdown on outside click
document.addEventListener('click', e => {
    if (!document.getElementById('notifHeaderBtn').contains(e.target) &&
        !document.getElementById('notifDropdown').contains(e.target)) {
        document.getElementById('notifDropdown').classList.remove('open');
        isNotifDropdownOpen = false;
    }
});

async function loadNotifDropdown() {
    const sess = getSession();
    const body = document.getElementById('notifDropdownBody');
    if (!sess) {
        body.innerHTML = `<div class="notif-dropdown-empty">লগইন করুন</div>`;
        return;
    }

    body.innerHTML = `<div class="notif-dropdown-empty">লোড হচ্ছে...</div>`;
    const data = await safeFetch(
        `${SUPABASE_URL}/rest/v1/notifications?phone=eq.${sess.phone}&select=*&order=created_at.desc&limit=10`
    ) || [];

    if (!data.length) {
        body.innerHTML = `<div class="notif-dropdown-empty">কোনো নোটিফিকেশন নেই</div>`;
        return;
    }

    body.innerHTML = data.map(n => `
        <div class="notif-dropdown-item ${n.is_read?'':'unread'}" onclick="markNotifRead('${n.id}')">
            <div class="notif-dropdown-item-title">
                ${!n.is_read?'<span class="notif-dropdown-item-dot"></span>':''}
                ${escHtml(n.title||'নোটিফিকেশন')}
            </div>
            <div class="notif-dropdown-item-msg">${escHtml((n.message||'').substring(0,60))}${(n.message||'').length>60?'...':''}</div>
        </div>
    `).join('');
}

async function markNotifRead(id) {
    const sess = getSession(); if (!sess) return;
    await safeFetch(`${SUPABASE_URL}/rest/v1/notifications?id=eq.${id}`, {
        method:'PATCH', body:JSON.stringify({ is_read:true })
    });
    loadNotifDropdown();
    loadNotifBadge();
}

async function markAllNotifsRead() {
    const sess = getSession(); if (!sess) return;
    await safeFetch(`${SUPABASE_URL}/rest/v1/notifications?phone=eq.${sess.phone}&is_read=eq.false`, {
        method:'PATCH', body:JSON.stringify({ is_read:true })
    });
    document.getElementById('notifHeaderBadge').classList.remove('show');
    loadNotifDropdown();
}

async function loadNotifBadge() {
    const sess = getSession(); if (!sess) return;
    const data = await safeFetch(
        `${SUPABASE_URL}/rest/v1/notifications?phone=eq.${sess.phone}&is_read=eq.false&select=id&limit=20`
    ) || [];
    const badge = document.getElementById('notifHeaderBadge');
    const count = data.length;
    if (count > 0) {
        badge.textContent = count > 9 ? '9+' : count;
        badge.classList.add('show');
    } else {
        badge.classList.remove('show');
    }
}

/* ══════════════════════════════════════════════
   ERROR HANDLER  (Flutter: ErrorBoundary / FlutterError)
══════════════════════════════════════════════ */
function showError(title, message, details, retryFn) {
    const existing = document.querySelector('.error-popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'error-popup-overlay';
    overlay.innerHTML = `
        <div class="error-popup" onclick="event.stopPropagation()">
            <div class="error-popup-icon"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M10.3 4L2 18h20L13.7 4a2 2 0 00-3.4 0z" stroke="currentColor" stroke-width="1.7"/><path d="M12 9v5M12 17h.01" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg></div>
            <div class="error-popup-title">${title || 'কিছু সমস্যা হয়েছে'}</div>
            <div class="error-popup-message">${message || 'পরে আবার চেষ্টা করুন'}</div>
            ${details ? `<div class="error-popup-details">${details}</div>` : ''}
            <div style="display:flex;justify-content:center;gap:8px;" id="errorPopupBtnRow">
                <button class="error-popup-btn" id="errorPopupCloseBtn"><svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M5 5l14 14M19 5L5 19" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg> বন্ধ</button>
            </div>
        </div>
    `;
    overlay.addEventListener('click', (e) => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
    overlay.querySelector('#errorPopupCloseBtn').addEventListener('click', () => overlay.remove());
    // Attach retry handler directly (preserves closure — toString()+onclick would lose it, causing "X is not defined" errors)
    if (retryFn) {
        const retryBtn = document.createElement('button');
        retryBtn.className = 'error-popup-retry';
        retryBtn.innerHTML = '<svg class="ei" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg"><path d="M4 12a8 8 0 0113.6-5.7L19.5 8" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M19.5 4v4h-4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/><path d="M20 12a8 8 0 01-13.6 5.7L4.5 16" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/><path d="M4.5 20v-4h4" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg> আবার চেষ্টা';
        retryBtn.addEventListener('click', () => { overlay.remove(); retryFn(); });
        overlay.querySelector('#errorPopupBtnRow').prepend(retryBtn);
    }
}
