<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Migrate to D1</title></head>
<body style="font-family:monospace;background:#111;color:#0f0;padding:20px">
<h3>Step 1: Export from Supabase (JSON file)</h3>
<button onclick="exportData()">Export JSON</button>
<pre id="log1"></pre>
<h3>Step 2: Import JSON into D1</h3>
<input type="file" id="fileInput" accept=".json">
<button onclick="importData()">Import to D1</button>
<pre id="log2"></pre>
<script>
const SUPABASE_URL = 'https://btezborkuiqfogykrjrn.supabase.co';
const SUPABASE_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImJ0ZXpib3JrdWlxZm9neWtyanJuIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2NTIyNzUsImV4cCI6MjA5NDIyODI3NX0.G4C7YTmk-AEvhWXnx-phMjTh9pxbdhCiapYVDpSVsEw';
const WORKER_URL = 'https://atlas-ai-proxy.hamza818483.workers.dev/d1/book_page_mcqs';
const D1_API_KEY = 'mb_d1_9f2a7c6e1b4d8305';
const log1 = (s) => document.getElementById('log1').textContent += s + '\n';
const log2 = (s) => document.getElementById('log2').textContent += s + '\n';

async function exportData() {
  log1('Fetching all rows...');
  try {
    const res = await fetch(`${SUPABASE_URL}/rest/v1/book_page_mcqs?select=pdf_id,page_number,mcq_type,questions_json&order=id.asc`,
      { headers: { apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY } });
    if (!res.ok) { log1('Failed: ' + res.status + ' ' + await res.text()); return; }
    const rows = await res.json();
    log1(`Got ${rows.length} rows. Downloading file...`);
    const blob = new Blob([JSON.stringify(rows)], { type: 'application/json' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url; a.download = 'book_page_mcqs_export.json';
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    log1('Downloaded. Now upload it below and click Import.');
  } catch (e) {
    log1('Error: ' + e.message + ' — Supabase may still be unreachable. Try again later.');
  }
}

async function importData() {
  const f = document.getElementById('fileInput').files[0];
  if (!f) { log2('Select the exported JSON file first.'); return; }
  const rows = JSON.parse(await f.text());
  log2(`Importing ${rows.length} rows into D1...`);
  let ok = 0, fail = 0;
  for (const r of rows) {
    try {
      const res = await fetch(WORKER_URL + '?on_conflict=pdf_id,page_number,mcq_type', {
        method: 'POST',
        headers: { apikey: D1_API_KEY, 'Content-Type': 'application/json' },
        body: JSON.stringify(r)
      });
      if (res.ok) ok++; else { fail++; log2('Failed: pdf_id=' + r.pdf_id + ' page=' + r.page_number); }
    } catch (e) { fail++; }
  }
  log2(`Done. Success: ${ok}, Failed: ${fail}`);
}
</script>
</body></html>
