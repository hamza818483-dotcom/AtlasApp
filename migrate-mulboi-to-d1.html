<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>Migrate to D1</title></head>
<body style="font-family:monospace;background:#111;color:#0f0;padding:20px">
<h3>Server-side migration (recommended — Cloudflare calls Supabase directly)</h3>
<button onclick="serverMigrate()">Start Server Migration</button>
<button onclick="serverMigrate(true)">Resume from checkpoint</button>
<pre id="log0"></pre>
<script>
const WORKER_URL = 'https://atlas-ai-proxy.hamza818483.workers.dev/migrate-mulboi';
const D1_API_KEY = 'mb_d1_9f2a7c6e1b4d8305';
const CKPT_KEY = 'mulboi_migrate_checkpoint_v2';
const BATCH = 300;
const log0 = (s) => { const el=document.getElementById('log0'); el.textContent += s + '\n'; el.scrollTop = el.scrollHeight; };

async function serverMigrate(resume=false) {
  let offset = resume ? parseInt(localStorage.getItem(CKPT_KEY) || '0', 10) : 0;
  if (!resume) localStorage.removeItem(CKPT_KEY);
  log0(resume ? `Resuming from offset ${offset}...` : 'Starting server-side migration...');
  let totalOk = 0, totalFail = 0;
  while (true) {
    log0(`Requesting batch at offset ${offset}...`);
    let res, data;
    try {
      res = await fetch(`${WORKER_URL}?offset=${offset}&limit=${BATCH}&key=${D1_API_KEY}`);
      data = await res.json();
    } catch (e) {
      log0(`Network error talking to Worker: ${e.message}. Checkpoint saved at ${offset}. Wait a bit and click Resume.`);
      localStorage.setItem(CKPT_KEY, offset);
      return;
    }
    if (!res.ok) {
      log0(`Worker reported error: ${data.error || res.status}. Checkpoint saved at ${offset}. Click Resume to retry.`);
      localStorage.setItem(CKPT_KEY, offset);
      return;
    }
    totalOk += data.migrated || 0;
    totalFail += data.failed || 0;
    if (data.failList && data.failList.length) {
      data.failList.forEach(f => log0(`  failed: pdf_id=${f.pdf_id} page=${f.page_number} (${f.error})`));
    }
    log0(`Batch ok. migrated=${data.migrated}, failed=${data.failed}. Running total ok=${totalOk} fail=${totalFail}`);
    if (data.done) {
      log0(`MIGRATION COMPLETE. Total migrated: ${totalOk}, failed: ${totalFail}`);
      localStorage.removeItem(CKPT_KEY);
      return;
    }
    offset = data.nextOffset;
    localStorage.setItem(CKPT_KEY, offset);
  }
}
</script>
</body></html>
