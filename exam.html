<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS EXAM - এক্সাম</title>
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --atlas-bg: #03152F; --atlas-border: #2F6BFF; --atlas-text: #6FA8FF;
            --atlas-glow: rgba(47,107,255,0.35); --atlas-glow-strong: rgba(47,107,255,0.5);
            --atlas-hover-bg: #061F40; --atlas-hover-text: #8DBEFF;
        }
        .dark-mode { --body-bg:#0F0F0F; --text-primary:#F0F0F0; --text-secondary:#B0B0B0; --card-bg:#1C1C1E; --card-shadow:0 4px 16px rgba(0,0,0,0.4); --option-bg:#262626; --option-border:#3A3A3A; --selected-bg:#1F2A3E; --selected-border:#3B82F6; --correct-bg:#1A2E1A; --correct-border:#22C55E; --wrong-bg:#2E1A1A; --wrong-border:#EF4444; --btn-bg:#2D2D2D; --btn-hover:#3D3D3D; --btn-text:#F0F0F0; --divider:#2D2D2D; }
        body:not(.dark-mode) { --body-bg:#F5F7FA; --text-primary:#1E293B; --text-secondary:#475569; --card-bg:#FFFFFF; --card-shadow:0 4px 16px rgba(0,0,0,0.06); --option-bg:#F1F5F9; --option-border:#CBD5E1; --selected-bg:#EFF6FF; --selected-border:#3B82F6; --correct-bg:#F0FDF4; --correct-border:#22C55E; --wrong-bg:#FEF2F2; --wrong-border:#EF4444; --btn-bg:#E2E8F0; --btn-hover:#CBD5E1; --btn-text:#1E293B; --divider:#E2E8F0; }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family:'Inter','Noto Sans Bengali',sans-serif; background:var(--body-bg); color:var(--text-primary); min-height:100vh; transition:all 0.3s ease; padding-top:56px; padding-bottom:60px; overflow-x:hidden; }
        
        .header { position:fixed; top:0; left:0; right:0; height:56px; background:var(--atlas-bg); border-bottom:2px solid var(--atlas-border); display:flex; align-items:center; justify-content:space-between; padding:0 16px; z-index:1000; box-shadow:0 2px 12px rgba(0,0,0,0.3); }
        .header-left { display:flex; align-items:center; gap:12px; }
        .hamburger { background:none; border:none; color:var(--atlas-text); font-size:24px; cursor:pointer; padding:4px 8px; border-radius:8px; }
        .logo { font-size:20px; font-weight:800; color:var(--atlas-text); text-shadow:0 0 12px var(--atlas-glow); }
        .header-right { display:flex; align-items:center; gap:8px; }
        .header-icon { background:none; border:1px solid var(--atlas-border); color:var(--atlas-text); width:36px; height:36px; border-radius:50%; font-size:18px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        
        .sidebar-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.6); z-index:2000; opacity:0; visibility:hidden; transition:all 0.3s; }
        .sidebar-overlay.active { opacity:1; visibility:visible; }
        .sidebar { position:fixed; top:0; left:-280px; width:280px; height:100%; background:var(--card-bg); z-index:2001; overflow-y:auto; transition:left 0.3s; box-shadow:4px 0 20px rgba(0,0,0,0.3); }
        .sidebar.active { left:0; }
        .sidebar-header { background:var(--atlas-bg); padding:20px 16px; text-align:center; border-bottom:2px solid var(--atlas-border); }
        .sidebar-logo { font-size:20px; font-weight:800; color:var(--atlas-text); }
        .sidebar-menu { padding:8px 0; }
        .sidebar-item { display:flex; align-items:center; gap:12px; padding:14px 20px; color:var(--text-primary); border:none; background:none; width:100%; text-align:left; font-size:15px; font-weight:500; cursor:pointer; font-family:'Inter','Noto Sans Bengali',sans-serif; }
        .sidebar-item:hover { background:var(--option-bg); }
        .sidebar-item .icon { font-size:20px; width:28px; text-align:center; }
        .sidebar-divider { height:1px; background:var(--divider); margin:8px 0; }
        
        .bottom-nav { position:fixed; bottom:0; left:0; right:0; height:60px; background:var(--atlas-bg); border-top:2px solid var(--atlas-border); display:flex; align-items:center; justify-content:space-around; z-index:1000; box-shadow:0 -2px 12px rgba(0,0,0,0.3); }
        .nav-item { display:flex; flex-direction:column; align-items:center; gap:2px; background:none; border:none; color:var(--atlas-text); font-size:10px; font-weight:500; cursor:pointer; padding:6px 10px; border-radius:8px; opacity:0.7; font-family:'Noto Sans Bengali','Inter',sans-serif; }
        .nav-item.active { opacity:1; color:#FFF; background:rgba(47,107,255,0.3); }
        .nav-item .nav-icon { font-size:22px; }
        
        .floating-buttons { position:fixed; bottom:80px; right:16px; display:flex; flex-direction:column; gap:10px; z-index:999; }
        .fab { width:46px; height:46px; border-radius:50%; border:none; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; color:#FFF; box-shadow:0 4px 14px rgba(0,0,0,0.3); }
        .fab-whatsapp { background:#25D366; }
        .fab-telegram { background:#0088CC; }
        .hide-floating .floating-buttons { display:none !important; }
        
        .toast { position:fixed; top:70px; left:50%; transform:translateX(-50%); background:var(--atlas-bg); color:var(--atlas-text); border:2px solid var(--atlas-border); padding:12px 24px; border-radius:10px; font-size:14px; font-weight:600; z-index:3000; opacity:0; transition:opacity 0.3s; pointer-events:none; }
        .toast.show { opacity:1; }
        
        .mode-container { display:none; }
        .mode-container.active { display:block; }
        
        .exam-list-wrap, .pre-exam-wrap, .result-wrap { max-width:700px; margin:0 auto; padding:16px; }
        .section-header { background:var(--atlas-bg); border:2px solid var(--atlas-border); border-radius:14px; padding:16px; margin-bottom:16px; text-align:center; box-shadow:0 0 14px var(--atlas-glow); }
        .section-title { color:var(--atlas-text); font-size:18px; font-weight:700; }
        .section-subtitle { color:var(--atlas-text); font-size:12px; opacity:0.7; }
        .cat-grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-bottom:16px; }
        .cat-card { background:var(--card-bg); border:1px solid var(--option-border); border-radius:12px; padding:16px; text-align:center; cursor:pointer; }
        .cat-card:hover { border-color:var(--atlas-border); box-shadow:0 0 12px var(--atlas-glow); }
        .cat-icon { font-size:32px; display:block; margin-bottom:8px; }
        .cat-name { font-size:13px; font-weight:600; color:var(--text-primary); }
        .list-item { background:var(--card-bg); border:1px solid var(--option-border); border-radius:10px; padding:14px; margin-bottom:8px; cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
        .list-item:hover { border-color:var(--atlas-border); background:var(--option-bg); }
        .list-item-title { font-weight:600; font-size:14px; }
        .list-item-sub { font-size:11px; color:var(--text-secondary); }
        .list-item-arrow { color:var(--atlas-text); font-size:18px; }
        .back-btn { background:none; border:1px solid var(--option-border); color:var(--text-secondary); padding:8px 16px; border-radius:8px; cursor:pointer; font-size:13px; margin-bottom:12px; }
        .start-btn { width:100%; padding:16px; background:#22C55E; color:#FFF; border:none; border-radius:12px; font-size:18px; font-weight:700; cursor:pointer; margin-top:16px; }
        .mock-options { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
        .mock-option-btn { padding:16px; background:var(--atlas-bg); color:var(--atlas-text); border:2px solid var(--atlas-border); border-radius:12px; font-size:16px; font-weight:700; cursor:pointer; text-align:center; }
        
        .exam-hero { text-align:center; padding:24px 16px; margin-bottom:16px; }
        .exam-hero-title { font-size:22px; font-weight:800; color:var(--atlas-text); text-shadow:0 0 12px var(--atlas-glow); margin-bottom:16px; }
        .exam-hero-stats { display:flex; justify-content:center; gap:12px; flex-wrap:wrap; }
        .hero-stat { background:var(--atlas-bg); border:1px solid var(--atlas-border); border-radius:12px; padding:14px 18px; text-align:center; min-width:85px; box-shadow:0 0 10px var(--atlas-glow); }
        .hero-stat-val { font-size:24px; font-weight:800; color:var(--atlas-text); }
        .hero-stat-label { font-size:11px; color:var(--atlas-text); opacity:0.7; margin-top:2px; }
        .pre-exam-card { background:var(--card-bg); border:1px solid var(--option-border); border-radius:14px; padding:20px; margin-bottom:16px; }
        .info-row { display:flex; justify-content:space-between; padding:8px 0; border-bottom:1px solid var(--divider); font-size:14px; }
        .info-label { color:var(--text-secondary); }
        .info-value { color:var(--text-primary); font-weight:600; }
        
        .exam-hall-wrap { position:relative; padding-bottom:100px; }
        .exam-info-top { background:var(--atlas-bg); border-bottom:2px solid var(--atlas-border); padding:8px 16px; display:none; justify-content:space-between; align-items:center; font-size:12px; color:var(--atlas-text); }
        .timer-sticky { position:sticky; top:56px; background:var(--atlas-bg); border-bottom:2px solid var(--atlas-border); padding:8px 16px; display:none; justify-content:center; gap:24px; z-index:98; }
        .timer-sticky .timer-text { color:var(--atlas-text); font-size:20px; font-weight:800; font-family:'Inter',monospace; }
        .timer-sticky .timer-warning { color:#EF4444 !important; animation:pulse 0.5s infinite; }
        .timer-sticky .progress-text { color:#22C55E; font-size:14px; font-weight:700; }
        @keyframes pulse { 0%,100%{opacity:1;} 50%{opacity:0.5;} }
        
        .questions-area { max-width:100%; padding:16px; }
        .mcq-card { background:var(--card-bg); border-radius:14px; padding:18px; margin-bottom:14px; box-shadow:var(--card-shadow); border:1px solid var(--option-border); position:relative; }
        .q-header { display:flex; justify-content:space-between; align-items:center; margin-bottom:12px; }
        .q-number { font-size:12px; color:var(--atlas-text); font-weight:700; }
        .q-actions { display:flex; gap:6px; align-items:center; }
        .icon-btn { background:transparent; border:1px solid transparent; font-size:18px; cursor:pointer; padding:4px 8px; border-radius:6px; opacity:0.6; }
        .icon-btn:hover { opacity:1; background:var(--option-bg); border-color:var(--option-border); }
        .icon-btn.bookmark.active { opacity:1; color:#F59E0B; filter:grayscale(0); }
        .icon-btn.bookmark:not(.active) { filter:grayscale(0.5); }
        .nav-fab-inline { width:32px; height:32px; border-radius:8px; background:var(--atlas-bg); border:2px solid var(--atlas-border); color:var(--atlas-text); font-size:14px; font-weight:700; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .q-text { font-size:15px; font-weight:600; color:var(--text-primary); margin-bottom:14px; line-height:1.6; }
        .q-text img, .option-text img, .exp-content img { max-width:100%; border-radius:8px; margin:8px 0; }
        .option-item { display:flex; align-items:center; gap:10px; padding:12px 14px; margin-bottom:8px; background:var(--option-bg); border:2px solid var(--option-border); border-radius:10px; cursor:pointer; font-size:14px; color:var(--text-primary); }
        .option-item:hover:not(.dimmed):not(.locked) { border-color:var(--atlas-border); }
        .option-item.selected { background:var(--selected-bg); border-color:var(--selected-border); opacity:1; cursor:default; }
        .option-item.dimmed { opacity:0.4; cursor:not-allowed; pointer-events:none; }
        .option-item.correct-reveal { background:var(--correct-bg); border-color:var(--correct-border); }
        .option-item.wrong-reveal { background:var(--wrong-bg); border-color:var(--wrong-border); }
        .option-radio { width:22px; height:22px; border-radius:50%; border:2px solid var(--text-secondary); display:flex; align-items:center; justify-content:center; flex-shrink:0; font-size:12px; font-weight:700; color:var(--text-secondary); }
        .option-item.selected .option-radio { border-color:var(--selected-border); background:var(--selected-border); color:#FFF; }
        .option-item.correct-reveal .option-radio { border-color:var(--correct-border); background:var(--correct-border); color:#FFF; }
        .option-item.wrong-reveal .option-radio { border-color:var(--wrong-border); background:var(--wrong-border); color:#FFF; }
        .option-text { flex:1; }
        .lock-icon { margin-left:auto; font-size:14px; color:var(--atlas-text); }
        .q-status { font-size:13px; font-weight:700; margin-bottom:6px; }
        .q-status.correct { color:#22C55E; } .q-status.wrong { color:#EF4444; }
        
        .explanation-box { margin-top:10px; border-radius:10px; overflow:hidden; }
        .csv-box { background:var(--option-bg); border-left:3px solid var(--atlas-border); padding:12px; }
        .csv-box .exp-header { color:var(--atlas-text); font-weight:700; font-size:13px; margin-bottom:6px; }
        .csv-box .exp-content { font-size:13px; line-height:1.6; }
        .ai-box { background:var(--atlas-bg); border:1px solid var(--atlas-border); }
        .ai-box .exp-header { padding:10px 14px; font-weight:700; font-size:13px; color:var(--atlas-text); cursor:pointer; display:flex; justify-content:space-between; align-items:center; }
        .ai-box .exp-content { padding:12px 14px; font-size:13px; line-height:1.6; color:var(--text-primary); border-top:1px solid var(--atlas-border); display:none; }
        .ai-box .exp-content.show { display:block; animation:fadeIn 0.3s; }
        .exp-arrow { font-size:12px; transition:transform 0.3s; }
        .exp-arrow.open { transform:rotate(180deg); }
        @keyframes fadeIn { from{opacity:0;transform:translateY(8px);} to{opacity:1;transform:translateY(0);} }
        
        .nav-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:200; display:none; align-items:center; justify-content:center; }
        .nav-overlay.active { display:flex; }
        .nav-popup { background:var(--card-bg); border-radius:16px; padding:20px; max-width:500px; width:95%; max-height:80vh; overflow-y:auto; border:1px solid var(--option-border); }
        .nav-popup-title { text-align:center; font-size:16px; font-weight:700; color:var(--atlas-text); margin-bottom:16px; }
        .nav-grid { display:grid; grid-template-columns:repeat(10,1fr); gap:6px; }
        .nav-num { aspect-ratio:1; border-radius:8px; background:var(--option-bg); border:2px solid var(--option-border); color:var(--text-secondary); font-size:13px; font-weight:600; cursor:pointer; display:flex; align-items:center; justify-content:center; }
        .nav-num.answered { background:var(--atlas-bg); border-color:var(--atlas-border); color:var(--atlas-text); }
        .nav-num.correct { background:var(--correct-bg); border-color:var(--correct-border); color:#22C55E; }
        .nav-num.wrong { background:var(--wrong-bg); border-color:var(--wrong-border); color:#EF4444; }
        .nav-close { display:block; margin:16px auto 0; padding:10px 24px; background:var(--atlas-bg); color:var(--atlas-text); border:2px solid var(--atlas-border); border-radius:10px; font-size:14px; font-weight:700; cursor:pointer; }
        
        .submit-fixed { position:fixed; bottom:80px; left:50%; transform:translateX(-50%); background:linear-gradient(135deg,#22C55E,#16A34A); color:#FFF; border:none; padding:14px 48px; border-radius:30px; font-size:18px; font-weight:700; cursor:pointer; z-index:100; box-shadow:0 6px 24px rgba(34,197,94,0.5); display:none; }
        .submit-fixed.show { display:block; }
        
        .result-wrap { padding-bottom:100px; }
        .result-card { background:var(--card-bg); border-radius:14px; padding:20px; margin-bottom:14px; border:1px solid var(--option-border); text-align:center; }
        .result-big { font-size:48px; font-weight:800; color:var(--atlas-text); }
        .result-score-format { font-size:20px; color:var(--text-secondary); }
        .result-grid { display:grid; grid-template-columns:1fr 1fr 1fr; gap:10px; margin:16px 0; }
        .result-stat { background:var(--option-bg); padding:12px; border-radius:10px; text-align:center; }
        .result-stat-val { font-size:24px; font-weight:700; }
        .result-stat-label { font-size:11px; color:var(--text-secondary); }
        .correct-val { color:#22C55E; } .wrong-val { color:#EF4444; } .skipped-val { color:#F59E0B; }
        .gpa-box { background:var(--atlas-bg); border:2px solid var(--atlas-border); border-radius:14px; padding:16px; text-align:center; box-shadow:0 0 14px var(--atlas-glow); }
        .gpa-box-title { color:var(--atlas-text); font-size:14px; font-weight:700; margin-bottom:8px; }
        .gpa-box-val { color:var(--atlas-text); font-size:36px; font-weight:800; text-shadow:0 0 12px var(--atlas-glow); }
        .deduction-note { font-size:12px; color:#EF4444; margin-top:8px; }
        .filter-bar { display:flex; gap:8px; margin-bottom:14px; flex-wrap:wrap; }
        .filter-btn { padding:8px 16px; border-radius:20px; border:1px solid var(--option-border); background:var(--card-bg); color:var(--text-secondary); cursor:pointer; font-size:12px; }
        .filter-btn.active { background:var(--atlas-border); color:#FFF; border-color:var(--atlas-border); }
        
        .result-actions-top { display:flex; justify-content:flex-end; gap:8px; margin-bottom:12px; }
        .result-action-btn { padding:8px 14px; border-radius:20px; font-size:12px; font-weight:600; cursor:pointer; border:none; transition:all 0.3s; animation:bounceIn 0.5s; }
        .btn-pdf { background:#EF4444; color:#FFF; }
        .btn-solve { background:var(--atlas-bg); color:var(--atlas-text); border:1px solid var(--atlas-border); }
        @keyframes bounceIn { 0%{transform:scale(0);} 50%{transform:scale(1.1);} 100%{transform:scale(1);} }
        
        .practice-btns { display:grid; grid-template-columns:1fr 1fr; gap:10px; margin-top:12px; }
        .btn-practice { padding:14px; border-radius:12px; font-size:14px; font-weight:700; cursor:pointer; border:none; text-align:center; }
        .btn-practice-again { background:var(--atlas-bg); color:var(--atlas-text); border:2px solid var(--atlas-border); }
        .btn-mistake-practice { background:#EF4444; color:#FFF; }
        
        .bar-chart { display:flex; gap:4px; align-items:flex-end; height:100px; justify-content:center; margin:12px 0; }
        .bar { width:40px; border-radius:6px 6px 0 0; transition:height 0.5s; }
        .bar.correct { background:#22C55E; }
        .bar.wrong { background:#EF4444; }
        .bar.skipped { background:#F59E0B; }
        
        .modal-overlay { position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); z-index:3000; display:none; align-items:center; justify-content:center; }
        .modal-overlay.active { display:flex; }
        .modal { background:var(--card-bg); border-radius:14px; padding:20px; max-width:450px; width:90%; max-height:85vh; overflow-y:auto; border:1px solid var(--option-border); }
        .modal-title { font-size:16px; font-weight:700; color:var(--text-primary); margin-bottom:16px; text-align:center; }
        .modal .input-group { margin-bottom:12px; }
        .modal .input-group label { display:block; font-size:12px; font-weight:600; color:var(--text-secondary); margin-bottom:4px; }
        .modal .input-group select, .modal .input-group textarea { width:100%; padding:10px 12px; border:2px solid var(--option-border); border-radius:8px; font-size:14px; background:var(--body-bg); color:var(--text-primary); font-family:'Noto Sans Bengali','Inter',sans-serif; }
        .modal-btns { display:flex; gap:8px; justify-content:flex-end; margin-top:16px; }
        .btn-cancel { padding:10px 20px; background:var(--btn-bg); color:var(--btn-text); border:none; border-radius:8px; cursor:pointer; }
        .btn-submit { padding:10px 20px; background:#EF4444; color:#FFF; border:none; border-radius:8px; cursor:pointer; font-weight:600; }
        
        @media (max-width:480px) { .nav-grid { grid-template-columns:repeat(8,1fr); } }
    </style>
</head>
<body class="dark-mode">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">ATLAS EXAM</div></div>
    <nav class="sidebar-menu">
        <button class="sidebar-item" onclick="navigateTo('profile');closeSidebar();"><span class="icon">👤</span> প্রোফাইল</button>
        <button class="sidebar-item" onclick="goTo('index.html');closeSidebar();"><span class="icon">🏠</span> হোম</button>
        <button class="sidebar-item" onclick="goTo('class.html');closeSidebar();"><span class="icon">📚</span> ফ্রি ক্লাস</button>
        <button class="sidebar-item" onclick="goTo('exam.html');closeSidebar();"><span class="icon">📝</span> ফ্রি এক্সাম</button>
        <button class="sidebar-item" onclick="goTo('exam.html?mock=true');closeSidebar();"><span class="icon">🎯</span> মক টেস্ট</button>
        <button class="sidebar-item" onclick="goTo('dashboard.html');closeSidebar();"><span class="icon">❌</span> মাই মিসটেকস</button>
        <button class="sidebar-item" onclick="goTo('ai.html');closeSidebar();"><span class="icon">🤖</span> ATLAS AI</button>
        <div class="sidebar-divider"></div>
        <button class="sidebar-item" onclick="toggleTheme()"><span class="icon" id="sidebarThemeIcon">🌙</span> <span id="sidebarThemeText">ডার্ক মোড</span></button>
        <button class="sidebar-item" onclick="openWhatsApp()"><span class="icon">💬</span> WhatsApp</button>
        <button class="sidebar-item" onclick="openTelegram()"><span class="icon">✈️</span> Telegram</button>
    </nav>
</aside>

<header class="header">
    <div class="header-left"><button class="hamburger" onclick="toggleSidebar()">☰</button><div class="logo">ATLAS EXAM</div></div>
    <div class="header-right"><button class="header-icon" id="themeToggle" onclick="toggleTheme()">🌙</button><button class="header-icon" onclick="goTo('auth.html')">👤</button></div>

function loadBookmarks() { var sess = localStorage.getItem('atlas-session'); if (!sess) return; try { var user = JSON.parse(sess); var saved = localStorage.getItem('bookmarks_'+user.phone); if (saved) bookmarkedQuestions = JSON.parse(saved); } catch(e) {} }
function toggleBookmark(qid) { var sess = localStorage.getItem('atlas-session'); if (!sess) { showToast('⚠️ আগে লগইন করুন'); return; } try { var user = JSON.parse(sess); if (bookmarkedQuestions[qid]) { delete bookmarkedQuestions[qid]; document.getElementById('bmBtn'+qid).classList.remove('active'); showToast('🔖 বুকমার্ক রিমুভ'); } else { bookmarkedQuestions[qid] = true; document.getElementById('bmBtn'+qid).classList.add('active'); showToast('🔖 বুকমার্ক সেভ'); } localStorage.setItem('bookmarks_'+user.phone, JSON.stringify(bookmarkedQuestions)); } catch(e) {} }
function openReportModal(qid) { reportQid = qid; document.getElementById('reportModal').classList.add('active'); }
function closeReportModal() { document.getElementById('reportModal').classList.remove('active'); document.getElementById('reportType').value = ''; document.getElementById('reportSuggestion').value = ''; reportQid = null; }
async function submitReport() { var type = document.getElementById('reportType').value; var suggestion = document.getElementById('reportSuggestion').value.trim(); if (!type) { showToast('⚠️ ভুলের ধরন নির্বাচন করুন'); return; } var sess = localStorage.getItem('atlas-session'); var phone = sess ? JSON.parse(sess).phone : 'anonymous'; try { await safeFetch(SUPABASE_URL + '/rest/v1/question_reports', 'POST', { question_id: reportQid, exam_id: currentExam.id, reporter_phone: phone, report_type: type, suggested_answer: suggestion, status: 'pending' }); showToast('✅ রিপোর্ট জমা হয়েছে'); } catch(e) { alert('রিপোর্ট এরর: ' + e.message); } closeReportModal(); }

function submitExam() {
    if (isExamSubmitted) return; if (!confirm('এক্সাম সাবমিট করবেন? ফেরত আসা যাবে না।')) return;
    isExamSubmitted = true; stopTimer();
    document.getElementById('submitBtn').classList.remove('show'); document.getElementById('timerSticky').style.display = 'none'; document.getElementById('examInfoTop').style.display = 'none';
    document.getElementById('floatingBtns').style.display = 'flex'; document.getElementById('bottomNav').style.display = 'flex';
    var correct = 0, wrong = 0, skipped = 0; examQuestions.forEach(function(q){ var ua = userAnswers[q.id]; if (!ua) skipped++; else if (ua === q.answer_index) correct++; else wrong++; });
    var totalQ = examQuestions.length, negMark = wrong * 0.25, finalScore = correct - negMark; if (finalScore < 0) finalScore = 0;
    var gpaScore = 0, withGpa = finalScore, deduction = 0, isSecondTimer = false;
    var sess = localStorage.getItem('atlas-session');
    if (sess) { try { var user = JSON.parse(sess); var ssc = parseFloat(user.ssc_gpa) || 0, hsc = parseFloat(user.hsc_gpa) || 0; gpaScore = (ssc * 8) + (hsc * 12); if (user.timer_type === 'second') { isSecondTimer = true; var examMarks = currentExam.total_marks || totalQ; if (examMarks <= 50) deduction = 1.5; else deduction = 3.0; finalScore -= deduction; if (finalScore < 0) finalScore = 0; } withGpa = finalScore + gpaScore; } catch(e) {} }
    showResult(correct, wrong, skipped, negMark, finalScore, withGpa, gpaScore, deduction, isSecondTimer, totalQ); switchMode('Result');
    saveResultToDB(correct, wrong, skipped, negMark, finalScore, gpaScore, withGpa, totalQ);
}
async function saveResultToDB(correct, wrong, skipped, negMark, finalScore, gpaScore, withGpa, totalQ) { var sess = localStorage.getItem('atlas-session'); if (!sess || isMockTest) return; try { var user = JSON.parse(sess); await safeFetch(SUPABASE_URL + '/rest/v1/exam_results', 'POST', { phone: user.phone, exam_id: currentExam.id, total_questions: totalQ, correct: correct, wrong: wrong, skipped: skipped, negative_marks: negMark, final_score: finalScore, gpa_score: gpaScore, with_gpa_total: withGpa }); } catch(e) {} }

function showResult(correct, wrong, skipped, negMark, finalScore, withGpa, gpaScore, deduction, isSecondTimer, totalQ) {
    var examName = currentExam.title || (currentExam.subject + ' - ' + currentExam.chapter);
    var html = '<div class="result-actions-top"><button class="result-action-btn btn-solve" onclick="openSolveSheet()">📋 Solve Sheet</button><button class="result-action-btn btn-pdf" onclick="downloadPDF()">📥 PDF Download</button></div>';
    html += '<div class="result-card"><div style="font-size:14px;color:var(--text-secondary);">📝 ' + examName + '</div><div class="result-big">' + finalScore.toFixed(2) + '</div><div class="result-score-format">' + finalScore.toFixed(2) + ' / ' + totalQ + '</div></div>';
    html += '<div class="result-grid"><div class="result-stat"><div class="result-stat-val correct-val">✅ ' + correct + '</div><div class="result-stat-label">সঠিক</div></div><div class="result-stat"><div class="result-stat-val wrong-val">❌ ' + wrong + '</div><div class="result-stat-label">ভুল</div></div><div class="result-stat"><div class="result-stat-val skipped-val">⏭️ ' + skipped + '</div><div class="result-stat-label">স্কিপ</div></div></div>';
    html += '<div class="result-card"><div class="info-row"><span class="info-label">নেগেটিভ মার্ক</span><span class="info-value" style="color:#EF4444;">-'+negMark.toFixed(2)+'</span></div></div>';
    
    // বার চার্ট
    var maxVal = Math.max(correct, wrong, skipped, 1);
    html += '<div class="result-card"><div style="font-size:14px;font-weight:700;margin-bottom:8px;">📊 পারফরম্যান্স</div><div class="bar-chart"><div class="bar correct" style="height:'+(correct/maxVal*80)+'px" title="সঠিক: '+correct+'"></div><div class="bar wrong" style="height:'+(wrong/maxVal*80)+'px" title="ভুল: '+wrong+'"></div><div class="bar skipped" style="height:'+(skipped/maxVal*80)+'px" title="স্কিপ: '+skipped+'"></div></div><div style="display:flex;justify-content:center;gap:16px;font-size:11px;"><span>✅ '+correct+'</span><span>❌ '+wrong+'</span><span>⏭️ '+skipped+'</span></div></div>';
    
    // GPA বক্স
    if (gpaScore > 0) {
        html += '<div style="display:grid;grid-template-columns:1fr 1fr;gap:12px;">';
        html += '<div class="gpa-box"><div class="gpa-box-title">📊 Without GPA</div><div class="gpa-box-val">'+finalScore.toFixed(2)+'</div></div>';
        html += '<div class="gpa-box"><div class="gpa-box-title">🎓 With GPA</div><div class="gpa-box-val">'+withGpa.toFixed(2)+'</div><div style="font-size:11px;color:var(--atlas-text);opacity:0.7;">GPA Score: +'+gpaScore.toFixed(2)+'</div></div></div>';
    }
    if (isSecondTimer) html += '<div class="deduction-note">⚠️ সেকেন্ড টাইমার: -' + deduction + ' মার্ক কর্তন</div>';
    
    html += '<div class="filter-bar"><button class="filter-btn active" onclick="filterResult(\'all\')">সব</button><button class="filter-btn" onclick="filterResult(\'correct\')">✅ সঠিক</button><button class="filter-btn" onclick="filterResult(\'wrong\')">❌ ভুল</button><button class="filter-btn" onclick="filterResult(\'skipped\')">⏭️ স্কিপ</button></div><div id="solveSheet">';
    examQuestions.forEach(function(q, i){ var ua = userAnswers[q.id]; var status = ua === q.answer_index ? 'correct' : (ua ? 'wrong' : 'skipped'); var statusHTML = ''; if (status === 'correct') statusHTML = '<div class="q-status correct">✅ সঠিক</div>'; else if (status === 'wrong') statusHTML = '<div class="q-status wrong">❌ ভুল' + (ua ? ' (আপনি: ' + ['ক','খ','গ','ঘ','ঙ'][ua-1] + ')' : '') + '</div>'; else statusHTML = '<div class="q-status" style="color:#F59E0B;">⏭️ স্কিপ</div>'; html += '<div class="mcq-card solve-item" data-status="'+status+'">'+statusHTML+'<div class="q-text">'+(i+1)+'. '+q.question_text+'</div>'; [q.option1, q.option2, q.option3, q.option4, q.option5].forEach(function(opt, oi){ if (opt && opt !== '—') { var cls = ''; if (oi+1 === q.answer_index) cls = ' correct-reveal'; else if (oi+1 === ua && ua !== q.answer_index) cls = ' wrong-reveal'; html += '<div class="option-item'+cls+'"><span class="option-radio">' + ['ক','খ','গ','ঘ','ঙ'][oi] + '</span> ' + opt; if (oi+1 === q.answer_index) html += ' ✅'; if (oi+1 === ua && ua !== q.answer_index) html += ' ❌'; html += '</div>'; } }); if (q.explanation) { html += '<div class="explanation-box csv-box"><div class="exp-header">📋 ব্যাখ্যা</div><div class="exp-content">'+q.explanation+'</div></div>'; } html += '<div class="explanation-box ai-box"><div class="exp-header" onclick="toggleAIBox(this,'+q.id+')">🤖 ATLAS AI ব্যাখ্যা <span class="exp-arrow">▼</span></div><div class="exp-content" id="aiExp'+q.id+'"></div></div></div>'; });
    html += '</div>';
    html += '<div class="practice-btns"><button class="btn-practice btn-practice-again" onclick="retakeExam()">🔄 Practice Again</button><button class="btn-practice btn-mistake-practice" onclick="mistakePractice()">❌ Mistake Practice</button></div>';
    html += '<button class="start-btn" onclick="backToList()" style="background:var(--btn-bg);color:var(--btn-text);margin-top:8px;">🏠 এক্সাম লিস্টে যান</button>';
    document.getElementById('resultContent').innerHTML = html;
}
function filterResult(type) { document.querySelectorAll('.filter-btn').forEach(function(b){ b.classList.remove('active'); }); event.target.classList.add('active'); document.querySelectorAll('.solve-item').forEach(function(item){ item.style.display = (type === 'all' || item.dataset.status === type) ? 'block' : 'none'; }); }
function retakeExam() { userAnswers = {}; isExamSubmitted = false; bookmarkedQuestions = {}; startExamHall(); }
function mistakePractice() { var wrongIds = []; examQuestions.forEach(function(q){ if (userAnswers[q.id] && userAnswers[q.id] !== q.answer_index) wrongIds.push(q.id); }); if (wrongIds.length === 0) { showToast('✅ কোনো ভুল নেই!'); return; } examQuestions = examQuestions.filter(function(q){ return wrongIds.includes(q.id); }); userAnswers = {}; isExamSubmitted = false; currentExam.total_marks = examQuestions.length; currentExam.duration_minutes = Math.ceil(examQuestions.length/2); startExamHall(); showToast('❌ ' + wrongIds.length + ' টি ভুল প্রশ্ন নিয়ে প্র্যাকটিস'); }

async function toggleAIBox(header, qid) { var content = header.nextElementSibling; var arrow = header.querySelector('.exp-arrow'); if (content.classList.contains('show')) { content.classList.remove('show'); arrow.classList.remove('open'); return; } var q = examQuestions.find(function(q){ return q.id === qid; }); if (!q) return; content.classList.add('show'); arrow.classList.add('open'); content.innerHTML = '⏳ AI ব্যাখ্যা আনা হচ্ছে...'; var options = [q.option1, q.option2, q.option3, q.option4, q.option5].filter(function(o){ return o && o !== '—'; }); var labels = ['ক','খ','গ','ঘ','ঙ']; var prompt = 'তুমি একজন শিক্ষক। MCQ বিশ্লেষণ করো:\n\nপ্রশ্ন: '+q.question_text+'\n\n'; options.forEach(function(opt, i){ prompt += labels[i]+') '+opt+'\n'; }); prompt += '\nসঠিক উত্তর: '+labels[q.answer_index-1]+') '+options[q.answer_index-1]+'\n\nপ্রতিটি অপশন ব্যাখ্যা করো। সঠিক ✅ কেন, ভুল ❌ কেন। বাংলায়। সংক্ষেপে।'; try { var res = await fetch('https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key='+GEMINI_KEY, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) }); var data = await res.json(); content.innerHTML = data.candidates ? data.candidates[0].content.parts[0].text.replace(/\n/g, '<br>') : '❌ ব্যাখ্যা পাওয়া যায়নি।'; } catch(e) { content.innerHTML = '❌ AI সার্ভার সমস্যা।'; } }

function openSolveSheet() { var w = window.open('', 'SolveSheet', 'width=800,height=600'); var html = '<html><head><title>Solve Sheet</title><style>body{font-family:sans-serif;padding:20px;column-count:2;column-gap:20px;}.q{margin-bottom:16px;break-inside:avoid;border:1px solid #ddd;padding:10px;border-radius:8px;}.correct{color:green;}.wrong{color:red;}</style></head><body><h2>📋 Solve Sheet</h2>'; examQuestions.forEach(function(q,i){ var ua = userAnswers[q.id]; html += '<div class="q"><b>'+(i+1)+'. '+q.question_text+'</b><br>'; [q.option1,q.option2,q.option3,q.option4,q.option5].forEach(function(opt,oi){ if (opt && opt !== '—') { var style = ''; if (oi+1===q.answer_index) style='color:green;font-weight:bold;'; else if (oi+1===ua && ua!==q.answer_index) style='color:red;'; html += '<div style="'+style+'">'+['ক','খ','গ','ঘ','ঙ'][oi]+') '+opt+'</div>'; } }); if (q.explanation) html += '<p style="font-size:12px;">💡 '+q.explanation+'</p>'; html += '</div>'; }); html += '<br><button onclick="window.print()">📥 Download PDF</button></body></html>'; w.document.write(html); w.document.close(); }
function downloadPDF() { openSolveSheet(); setTimeout(function(){ window.print(); }, 500); }

window.addEventListener('beforeunload', function(e) { if (!isExamSubmitted && examSeconds > 0) { e.preventDefault(); e.returnValue = ''; return ''; } });
window.addEventListener('popstate', function(e) { if (!isExamSubmitted && examSeconds > 0) { if (!confirm('⚠️ এক্সাম ছেড়ে যাবেন?\nসব উত্তর মুছে যাবে!')) { history.pushState(null, '', window.location.href); } } });

document.addEventListener('DOMContentLoaded', function() {
    console.log('📝 Exam Page A to Z Loaded'); loadTheme();
    var params = new URLSearchParams(window.location.search); var examId = params.get('id'); var isMock = params.get('mock');
    if (examId) { loadExamById(examId); } else if (isMock === 'true') { startMockTest(); } else { loadAllExams(); }
});
</script>
</body>
</html>
