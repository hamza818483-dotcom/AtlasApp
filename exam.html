<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP · এক্সাম</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ========== EXAM-SPECIFIC STYLES ========== */
        
        /* Mode System */
        .mode-container { display: none; }
        .mode-container.active { display: block; animation: fadeIn 0.25s ease; }
        
        /* Exam List */
        .exam-list-wrap { max-width: 600px; margin: 0 auto; padding: 12px 14px 80px; }
        
        /* Category Grid */
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        @media (min-width: 600px) { .cat-grid { grid-template-columns: 1fr 1fr 1fr; } }
        
        .cat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 18px 12px; text-align: center;
            cursor: pointer; transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            box-shadow: var(--shadow-sm);
        }
        .cat-card:hover { border-color: var(--accent); box-shadow: var(--shadow-glow), var(--shadow-sm); transform: translateY(-2px); }
        .cat-icon { font-size: 28px; }
        .cat-name { font-size: 12px; font-weight: 700; color: var(--text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        
        /* List Items */
        .list-item {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 6px;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; transition: all 0.2s ease;
        }
        .list-item:hover { border-color: var(--accent); background: var(--card-hover); }
        .list-item-title { font-weight: 600; font-size: 13px; color: var(--text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .list-item-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .list-item-arrow { color: var(--accent); font-size: 16px; }
        
        /* Back Button */
        .back-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 7px 14px; background: var(--btn-bg); border: 1px solid var(--border);
            border-radius: var(--radius-full); color: var(--text-secondary);
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; margin-bottom: 12px;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }
        
        /* Pre-Exam */
        .pre-exam-wrap { max-width: 600px; margin: 0 auto; padding: 12px 14px 80px; }
        .exam-hero { text-align: center; padding: 20px 14px; margin-bottom: 14px; }
        .exam-hero-title { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 12px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .exam-hero-stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .hero-stat {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px 16px;
            text-align: center; min-width: 75px; box-shadow: var(--shadow);
        }
        .hero-stat-val { font-size: 22px; font-weight: 800; color: var(--accent); }
        .hero-stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .pre-exam-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .info-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
        .info-label { color: var(--text-secondary); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .info-value { font-weight: 600; color: var(--text); }
        
        /* Exam Hall */
        .exam-hall-wrap { max-width: 100%; margin: 0 auto; padding: 8px 0 100px; position: relative; }
        
        /* Timer Sticky */
        .timer-sticky {
            position: sticky; top: 56px; z-index: 100;
            background: var(--atlas-bg); border: 1px solid var(--atlas-border);
            border-radius: var(--radius-sm); padding: 10px 14px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; box-shadow: 0 2px 10px var(--atlas-glow);
        }
        .timer-text { font-size: 18px; font-weight: 800; color: var(--atlas-text); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
        .timer-warning { color: var(--error) !important; animation: pulse 0.5s infinite; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .progress-text { font-size: 12px; font-weight: 600; color: var(--atlas-text); opacity: 0.75; }
        
        /* Questions Area */
        .questions-area { width: 100%; padding: 0 14px 20px; }
        
        /* MCQ Card */
        .mcq-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
            box-shadow: var(--shadow-sm); width: 100%;
        }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .q-number { font-size: 11px; color: var(--accent); font-weight: 700; background: var(--accent-light); padding: 3px 9px; border-radius: var(--radius-full); }
        .q-actions { display: flex; gap: 6px; }
        .icon-btn { background: none; border: 1px solid var(--border); font-size: 15px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.2s; opacity: 0.6; color: var(--text-secondary); }
        .icon-btn:hover { opacity: 1; border-color: var(--accent); }
        .icon-btn.bookmark.active { opacity: 1; color: var(--warning); border-color: var(--warning); }
        .q-text { font-size: 14px; font-weight: 600; margin-bottom: 12px; line-height: 1.7; color: var(--text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .q-text img { max-width: 100%; border-radius: 8px; margin: 6px 0; }
        
        /* Options */
        .option-item {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 13px; margin-bottom: 7px;
            background-color: var(--option-bg); border: 1.5px solid var(--option-border);
            border-radius: var(--radius-sm); cursor: pointer;
            transition: all 0.18s ease; font-size: 13px;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif; color: var(--text);
        }
        .option-item:hover:not(.dimmed):not(.locked) { border-color: var(--accent); background: var(--option-selected-bg); }
        .option-item.selected { background-color: var(--option-selected-bg); border-color: var(--option-selected-border); cursor: default; }
        .option-item.dimmed { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .option-item.correct-reveal { background-color: var(--success-light); border-color: var(--success); }
        .option-item.wrong-reveal { background-color: var(--error-light); border-color: var(--error); }
        
        .option-radio {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--text-tertiary); display: flex;
            align-items: center; justify-content: center; flex-shrink: 0;
            font-size: 11px; font-weight: 700; color: var(--text-tertiary);
            transition: all 0.18s ease;
        }
        .option-item.selected .option-radio { border-color: var(--option-selected-border); background: var(--option-selected-border); color: #fff; }
        .option-item.correct-reveal .option-radio { border-color: var(--success); background: var(--success); color: #fff; }
        .option-item.wrong-reveal .option-radio { border-color: var(--error); background: var(--error); color: #fff; }
        .option-text { flex: 1; line-height: 1.5; }
        .option-text img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
        .lock-icon { margin-left: auto; font-size: 13px; color: var(--text-tertiary); }
        
        /* Q Status */
        .q-status { font-size: 12px; font-weight: 700; margin-bottom: 4px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .q-status.correct { color: var(--success); }
        .q-status.wrong { color: var(--error); }
        
        /* Explanation Boxes */
        .explanation-box { margin-top: 8px; border-radius: var(--radius-sm); overflow: hidden; }
        .csv-box { background: var(--card-hover); border-left: 3px solid var(--accent); padding: 10px 12px; font-size: 12px; line-height: 1.5; }
        .csv-box img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
        .exp-header { color: var(--accent); font-weight: 700; font-size: 11px; margin-bottom: 3px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .exp-content { font-size: 12px; line-height: 1.5; color: var(--text); }
        .exp-content img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
        
        .ai-box { background: var(--card-bg); border: 1px solid var(--border); }
        .ai-box .exp-header { padding: 8px 12px; font-weight: 700; font-size: 11px; color: var(--accent); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .ai-box .exp-content { padding: 8px 12px; font-size: 12px; line-height: 1.5; color: var(--text); border-top: 1px solid var(--divider); display: none; }
        .ai-box .exp-content.show { display: block; animation: fadeIn 0.25s; }
        .exp-arrow { font-size: 10px; transition: 0.2s; }
        .exp-arrow.open { transform: rotate(180deg); }
        
        /* Nav Fab */
        .nav-fab {
            position: fixed; right: 2px; top: 50%; transform: translateY(-50%);
            width: 38px; height: 38px; background: var(--accent); border: none;
            border-radius: 10px 0 0 10px; color: #fff; font-size: 15px;
            font-weight: 700; cursor: pointer; z-index: 101;
            box-shadow: 0 4px 12px var(--accent-glow);
            display: flex; align-items: center; justify-content: center;
        }
        
        /* Nav Popup */
        .nav-overlay {
            position: fixed; inset: 0; background: var(--overlay);
            z-index: 200; display: none; align-items: flex-end;
        }
        .nav-overlay.active { display: flex; }
        .nav-popup {
            width: 100%; max-width: 520px; margin: 0 auto;
            background: var(--card-bg); border-radius: var(--radius) var(--radius) 0 0;
            padding: 16px; border: 1px solid var(--border); animation: fadeIn 0.2s ease;
            max-height: 80vh; overflow-y: auto;
        }
        .nav-popup-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 12px; text-align: center; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .nav-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
        @media (max-width: 480px) { .nav-grid { grid-template-columns: repeat(6, 1fr); } }
        .nav-num {
            aspect-ratio: 1; border-radius: 6px; background: var(--option-bg);
            border: 1px solid var(--border); color: var(--text-secondary);
            font-size: 11px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center;
            transition: all 0.2s;
        }
        .nav-num.answered { background: var(--accent); border-color: var(--accent); color: #fff; }
        .nav-num.correct { background: var(--success); border-color: var(--success); color: #fff; }
        .nav-num.wrong { background: var(--error); border-color: var(--error); color: #fff; }
        .nav-stats { text-align: center; margin-top: 8px; font-size: 10px; color: var(--text-secondary); }
        .nav-close { display: block; margin: 12px auto 0; padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        
        /* Submit Button - Fixed Bottom */
        .submit-fixed {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--success); color: #fff; border: none;
            padding: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; z-index: 100; box-shadow: 0 -2px 16px var(--success-glow);
            transition: all 0.2s ease; font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
            text-align: center;
        }
        .submit-fixed:hover { filter: brightness(0.9); }
        
        /* Result Screen */
        .result-wrap { max-width: 600px; margin: 0 auto; padding: 14px 14px 90px; animation: fadeIn 0.3s ease; }
        
        .result-score-card {
            background: linear-gradient(140deg, var(--atlas-bg) 0%, var(--atlas-card) 100%);
            border: 1.5px solid var(--atlas-border); border-radius: var(--radius);
            padding: 24px 18px; text-align: center; margin-bottom: 14px;
            box-shadow: var(--shadow-md), 0 0 24px var(--atlas-glow);
            width: 100%;
        }
        .result-exam-name { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 12px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .result-big-score { font-size: 42px; font-weight: 900; color: var(--atlas-text); text-shadow: 0 0 20px var(--atlas-glow-strong); }
        .result-total { font-size: 14px; color: var(--atlas-text); opacity: 0.75; margin-top: 4px; }
        
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
        .result-stat {
            background: var(--card-bg); border-radius: var(--radius-sm);
            padding: 12px 8px; text-align: center; border: 1px solid var(--border);
            width: 100%;
        }
        .result-stat-val { font-size: 18px; font-weight: 800; }
        .result-stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .correct-val { color: var(--success); }
        .wrong-val { color: var(--error); }
        .skipped-val { color: var(--warning); }
        
        .gpa-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .gpa-box {
            background: var(--card-bg); border: 1px solid var(--accent);
            border-radius: var(--radius); padding: 14px; text-align: center;
            box-shadow: var(--shadow-sm); width: 100%;
        }
        .gpa-box-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .gpa-box-val { font-size: 30px; font-weight: 800; color: var(--accent); }
        .gpa-box-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        
        .deduction-note { font-size: 11px; color: var(--error); margin-bottom: 14px; text-align: center; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        
        .chart-wrap { width: 160px; height: 160px; margin: 0 auto 14px; }
        .chart-wrap canvas { width: 100%; height: 100%; }
        
        .result-actions { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .result-action-btn {
            flex: 1; min-width: 120px; padding: 10px 14px;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--btn-bg); color: var(--text);
            font-size: 12px; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; text-align: center;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .result-action-btn:hover { border-color: var(--accent); color: var(--accent); }
        
        .practice-actions { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .practice-btn {
            flex: 1; min-width: 120px; padding: 12px;
            border-radius: var(--radius-sm); border: none;
            font-size: 13px; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; text-align: center;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif; color: #fff;
        }
        .btn-practice-again { background: var(--accent); }
        .btn-mistake-practice { background: var(--error); }
        
        .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-secondary);
            cursor: pointer; font-size: 11px; font-weight: 600;
            transition: all 0.2s ease; font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        
        .solve-item { margin-bottom: 12px; }
        
        /* Mock Options */
        .mock-options { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        .mock-option-btn {
            padding: 14px; background: var(--card-bg); color: var(--text);
            border: 1px solid var(--border); border-radius: var(--radius-sm);
            font-size: 14px; font-weight: 700; cursor: pointer; text-align: center;
            transition: all 0.2s ease; font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .mock-option-btn:hover { border-color: var(--accent); }
        
        /* Breadcrumb */
        .breadcrumb { font-size: 11px; color: var(--text-secondary); margin-bottom: 10px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .breadcrumb span { color: var(--accent); }
        
        /* Guest Modal */
        .guest-message { text-align: center; padding: 30px 20px; }
        .guest-message .icon { font-size: 48px; margin-bottom: 16px; }
        .guest-message .title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; }
        .guest-message .subtitle { font-size: 14px; color: var(--text-secondary); margin-bottom: 4px; }
        .guest-link-box {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: 8px; padding: 10px; margin: 12px 0;
            word-break: break-all; font-size: 12px; color: var(--accent);
        }
        
        /* No Questions */
        .no-questions { text-align: center; padding: 40px 20px; }
        .no-questions .icon { font-size: 48px; margin-bottom: 16px; }
        .no-questions .title { font-size: 15px; font-weight: 700; color: var(--text); margin-bottom: 8px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .no-questions .subtitle { font-size: 13px; color: var(--text-secondary); margin-bottom: 4px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
    </style>
</head>
<body class="dark-mode">

<!-- Sidebar -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">ATLAS APP</div></div>
    <div class="sidebar-menu">
        <button class="sidebar-item" onclick="navigateTo('profile');closeSidebar();">👤 প্রোফাইল</button>
        <button class="sidebar-item" onclick="goTo('index.html');closeSidebar();">🏠 হোম</button>
        <button class="sidebar-item" onclick="goTo('class.html');closeSidebar();">📚 ফ্রি ক্লাস</button>
        <button class="sidebar-item" onclick="goTo('exam.html');closeSidebar();">📝 ফ্রি এক্সাম</button>
        <button class="sidebar-item" onclick="goTo('mock-test.html');closeSidebar();">🎯 মক টেস্ট</button>
        <button class="sidebar-item" onclick="openModelTest();closeSidebar();">📖 Model Test</button>
        <button class="sidebar-item" onclick="openMistakes();closeSidebar();">⚠️ My Mistakes</button>
        <button class="sidebar-item" onclick="goTo('ai.html');closeSidebar();">🤖 ATLAS AI</button>
        <button class="sidebar-item" id="adminSidebarBtn" onclick="goTo('admin.html');closeSidebar();" style="display:none;">👑 Admin Control</button>
        <div class="sidebar-divider"></div>
        <button class="sidebar-item" onclick="openSocial('facebook')">📘 Facebook</button>
        <button class="sidebar-item" onclick="openSocial('youtube')">▶️ YouTube</button>
        <button class="sidebar-item" onclick="openSocial('telegram')">✈️ Telegram</button>
        <button class="sidebar-item" onclick="openSocial('whatsapp')">💬 WhatsApp</button>

    </div>
    <div class="sidebar-footer">
        <button class="sidebar-item logout-btn" onclick="logout()">🚪 লগআউট</button>
    </div>
</aside>

<!-- Header -->
<header class="header">
    <div class="header-left">
        <button class="hamburger" onclick="toggleSidebar()">☰</button>
        <div class="atlas-brand-box">
            <img src="https://cdn.phototourl.com/free/2026-05-15-b45df560-6dc8-4cb7-9040-238612c8a161.png" class="atlas-logo-img" alt="ATLAS">
            <span class="atlas-brand-text">ATLAS APP</span>
        </div>

    <div class="header-right">
        <button class="header-icon" onclick="toggleTheme()" id="themeToggle">🌙</button>
        <button class="header-icon" onclick="navigateTo('profile')">👤</button>
    </div>
</header>

<main>

<!-- MODE 1: Exam List -->
<div class="mode-container active" id="modeList"><div class="exam-list-wrap">
    <div class="section-header"><div class="section-title">📝 ফ্রি এক্সাম সেকশন</div><div class="section-subtitle">আপনার প্রস্তুতির জন্য সেরা এক্সাম</div></div>
    <div class="cat-grid">
        <div class="cat-card" onclick="showCategory('board')"><span class="cat-icon">🔵</span><span class="cat-name">বোর্ড প্রস্তুতি</span></div>
        <div class="cat-card" onclick="showCategory('medical')"><span class="cat-icon">🟢</span><span class="cat-name">মেডিকেল+ডেন্টাল</span></div>
        <div class="cat-card" onclick="showCategory('varsity')"><span class="cat-icon">🟣</span><span class="cat-name">ভার্সিটি প্রস্তুতি</span></div>
        <div class="cat-card" onclick="showCategory('onushiloni')"><span class="cat-icon">🟠</span><span class="cat-name">অনুশীলনী এক্সাম</span></div>
    </div>
    <div class="section-header"><div class="section-title">🎯 আনলিমিটেড মক টেস্ট</div></div>
    <button class="btn btn-primary" onclick="startMockTest()" style="width:100%;">🎯 মক টেস্ট শুরু করুন</button>
    <div id="savedExamsList" style="margin-top:12px;"></div>
</div></div>

<!-- MODE 2: Category -->

async function safeFetch(url, opts = {}) {
    opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, opts.headers || {});
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE') opts.headers['Content-Type'] = 'application/json';
    try { const res = await fetch(url, opts); const text = await res.text(); if (!text?.trim()) return []; const data = JSON.parse(text); if (!res.ok) throw new Error(data.message); return data; }
    catch(e) { console.error('❌', e.message); return []; }
}

function switchMode(mode) {
    document.querySelectorAll('.mode-container').forEach(m => m.classList.remove('active'));
    document.getElementById('mode' + mode.charAt(0).toUpperCase() + mode.slice(1))?.classList.add('active');
    if (mode === 'Hall') {
        document.getElementById('timerSticky').style.display = 'flex';
        document.getElementById('submitBtn').style.display = 'block';
        document.getElementById('navFab').style.display = 'flex';
        document.querySelector('.floating-buttons').style.display = 'none';
        document.querySelector('.bottom-nav').style.display = 'none';
    } else {
        stopTimer();
        document.getElementById('timerSticky').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('navFab').style.display = 'none';
        document.querySelector('.floating-buttons').style.display = 'flex';
        document.querySelector('.bottom-nav').style.display = 'flex';
    }
    window.scrollTo(0, 0);
}

function showCategory(cat) {
    currentCategory = cat;

    let html = `<div class="section-header"><div class="section-title">${titles[cat]||cat}</div></div>`;
    if (cat === 'board') {
        html += '<div class="cat-grid">'+
            ['বোর্ড প্রশ্ন','কলেজ প্রশ্ন','ক ভান্ডার','খ ভান্ডার','টাইপ CQ'].map(s => 
                `<div class="cat-card" onclick="showSubCategory('board','${s}')"><span class="cat-name">${s}</span></div>`
            ).join('')+'</div>';
    } else if (cat === 'medical') {
        html += '<div class="cat-grid">'+
            ['🏥 Medical','🦷 Dental','🎖️ AFMC'].map(s => 
                `<div class="cat-card" onclick="showSubCategory('medical','${s}')"><span class="cat-name">${s}</span></div>`
            ).join('')+'</div>';
    } else if (cat === 'varsity') {
        html += '<div class="cat-grid">'+
            ['Varsitywise','বিগত (সাল)','বিগত (চ্যাপ্টার)'].map(s => 
                `<div class="cat-card" onclick="showSubCategory('varsity','${s}')"><span class="cat-name">${s}</span></div>`
            ).join('')+'</div>';
    } else {
        html += '<p style="text-align:center;color:var(--text-secondary);padding:20px;">শীঘ্রই আসছে...</p>';
    }
    document.getElementById('categoryContent').innerHTML = html;
    switchMode('Category');
}

function showSubCategory(cat, sub) {
    if (cat === 'board') {
        if (sub === 'ক ভান্ডার' || sub === 'খ ভান্ডার' || sub === 'টাইপ CQ') {
            loadKaKhaContent(cat, sub);
        } else {
            loadExamsBySubType(cat, sub);
        }
    } else if (cat === 'medical') {
        const type = sub.includes('Medical') ? 'medical' : sub.includes('Dental') ? 'dental' : 'afmc';
        showMedicalSubTypes(type);
    } else if (cat === 'varsity') {
        loadVarsityContent(sub);
    }
}

function showMedicalSubTypes(type) {
    let html = `<div class="section-header"><div class="section-title">${type==='medical'?'🏥 Medical':type==='dental'?'🦷 Dental':'🎖️ AFMC'}</div></div>`;
    html += '<div class="cat-grid">'+
        ['Demo','Chapter','Year'].map(s => 
            `<div class="cat-card" onclick="loadExamsByType('${type}','${s.toLowerCase()}')"><span class="cat-name">${s}</span></div>`
        ).join('')+'</div>';
    document.getElementById('categoryContent').innerHTML = html;
    switchMode('Category');
}

function loadVarsityContent(sub) {
    if (sub === 'Varsitywise') {
        loadExamsBySubType('varsity', 'varsitywise');
    } else if (sub === 'বিগত (সাল)') {
        loadExamsBySubType('varsity', 'year');
    } else {
        loadExamsBySubType('varsity', 'chapter');
    }
}

function loadKaKhaContent(cat, sub) {
    const typeMap = { 'ক ভান্ডার': 'ka', 'খ ভান্ডার': 'kha', 'টাইপ CQ': 'cq' };
    const type = typeMap[sub];
    safeFetch(`${SUPABASE_URL}/rest/v1/ka_kha_cq?select=*&order=sort_order.asc&limit=50`).then(data => {
        if (!data?.length) {
            document.getElementById('categoryContent').innerHTML = `<div class="section-header"><div class="section-title">📦 ${sub}</div></div><p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো কন্টেন্ট নেই</p>`;
            switchMode('Category');
            return;
        }
        const filtered = data.filter(d => (d.subject || '').includes(type) || type === 'cq');
        const grouped = {};
        filtered.forEach(d => { const s = d.subject || 'সাধারণ'; if (!grouped[s]) grouped[s] = []; grouped[s].push(d); });
        let html = `<div class="section-header"><div class="section-title">📦 ${sub}</div></div>`;
        Object.keys(grouped).forEach(s => {
            html += `<div style="font-size:12px;color:var(--accent);font-weight:700;margin:8px 0;">📘 ${s}</div>`;
            grouped[s].forEach(d => {
                html += `<div class="list-item" onclick="window.open('${d.link_or_file||'#'}','_blank')">
                    <div><div class="list-item-title">📖 ${d.chapter||'সাধারণ'}</div>
                    <div class="list-item-sub">${d.year||''} ${d.topic||''}</div></div>
                    <span class="list-item-arrow">→</span></div>`;
            });
        });
        document.getElementById('categoryContent').innerHTML = html;
        switchMode('Category');
    }).catch(() => {
        document.getElementById('categoryContent').innerHTML = `<div class="section-header"><div class="section-title">📦 ${sub}</div></div><p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো কন্টেন্ট নেই</p>`;
        switchMode('Category');
    });
}

// ========== LOAD EXAMS ==========
async function loadExamsBySubType(cat, sub) {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/exams?exam_type=eq.${cat}&select=*&order=sort_order.asc,created_at.desc&limit=100`);
        if (!data?.length) { document.getElementById('categoryContent').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো এক্সাম নেই</p>'; switchMode('Category'); return; }
        const filtered = sub ? data.filter(e => (e.sub_type||'').includes(sub) || e.exam_type === sub) : data;
        showExamList(filtered);
    } catch(e) { document.getElementById('categoryContent').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো এক্সাম নেই</p>'; switchMode('Category'); }
}

async function loadExamsByType(type, subType) {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/exams?exam_type=eq.${type}&sub_type=eq.${subType}&select=*&order=sort_order.asc,created_at.desc&limit=50`);
        if (!data?.length) { document.getElementById('categoryContent').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো এক্সাম নেই</p>'; switchMode('Category'); return; }
        showExamList(data);
    } catch(e) { document.getElementById('categoryContent').innerHTML = '<p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো এক্সাম নেই</p>'; switchMode('Category'); }
}

function showExamList(data) {
    const grouped = {};
    data.forEach(e => { const s = e.subject||'সাধারণ'; if (!grouped[s]) grouped[s] = []; grouped[s].push(e); });
    let html = '';
    Object.keys(grouped).forEach(s => {
        html += `<div style="font-size:12px;color:var(--accent);font-weight:700;margin:8px 0;">📘 ${s}</div>`;
        grouped[s].forEach(e => {
            let info = e.chapter||e.title;
            if (e.board) info += ` | ${e.board}`;
            if (e.year) info += ` | ${e.year}`;
            if (e.writer) info += ` | ${e.writer}`;
            info += ` | ${e.total_marks||0} প্রশ্ন`;
            html += `<div class="list-item" onclick="loadExamById(${e.id})">
                <div><div class="list-item-title">📖 ${info}</div>
                <div class="list-item-sub">${e.sub_type||e.exam_type||''}</div></div>
                <span class="list-item-arrow">→</span></div>`;
        });
    });
    document.getElementById('categoryContent').innerHTML = html || '<p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো এক্সাম নেই</p>';
    switchMode('Category');
}

async function loadExamById(examId) {
    try {
        const [examData] = await safeFetch(`${SUPABASE_URL}/rest/v1/exams?id=eq.${examId}&select=*`);
        if (!examData) { showToast('❌ এক্সাম পাওয়া যায়নি'); return; }
        currentExam = examData;
        examQuestions = await safeFetch(`${SUPABASE_URL}/rest/v1/questions?exam_id=eq.${examId}&select=*`);
        if (!examQuestions?.length) {
            showNoQuestions();
            return;
        }
        showPreExamFromData(currentExam, examQuestions);
    } catch(e) { showToast('❌ এরর'); }
}

        </div></div>

            ${exam.board?`<div class="info-row"><span class="info-label">বোর্ড/কলেজ</span><span class="info-value">${exam.board}</span></div>`:''}
            ${exam.year?`<div class="info-row"><span class="info-label">সাল</span><span class="info-value">${exam.year}</span></div>`:''}
        </div>`;
    document.getElementById('preExamContent').innerHTML = html;
    switchMode('PreExam');

async function loadAllExams() {
    try {
        const data = await safeFetch(`${SUPABASE_URL}/rest/v1/exams?select=*&order=sort_order.asc,created_at.desc&limit=50`);
        if (!data?.length) return;
        const grouped = {};
        data.forEach(e => { const t = e.exam_type||'other'; if (!grouped[t]) grouped[t] = []; grouped[t].push(e); });
        let html = '';
        Object.keys(grouped).forEach(t => {
            html += `<div class="section-header" style="margin-top:10px;"><div class="section-title">${t} (${grouped[t].length})</div></div>`;
            const bySubject = {};
            grouped[t].forEach(e => { const s = e.subject||'সাধারণ'; if (!bySubject[s]) bySubject[s] = []; bySubject[s].push(e); });
            Object.keys(bySubject).forEach(s => {
                html += `<div style="font-size:11px;color:var(--accent);font-weight:700;margin:4px 0;">📘 ${s}</div>`;
                bySubject[s].forEach(e => {
                    html += `<div class="list-item" onclick="loadExamById(${e.id})"><div><div class="list-item-title">📖 ${e.chapter||e.title}</div><div class="list-item-sub">${e.total_marks} প্রশ্ন</div></div><span class="list-item-arrow">→</span></div>`;
                });
            });
        });
        document.getElementById('savedExamsList').innerHTML = html || '<p style="color:var(--text-secondary);text-align:center;">কোনো এক্সাম নেই</p>';
    } catch(e) {}
}

// ========== MOCK TEST ==========

    isMockTest = true;
    let html = '<div class="section-header"><div class="section-title">🎯 প্রশ্ন সংখ্যা ও সময়</div></div><div class="mock-options">';
    [
        {count:25, time:12},
        {count:35, time:17},
        {count:50, time:25},
        {count:75, time:37},
        {count:100, time:50}
    ].forEach(n => { html += `<button class="mock-option-btn" onclick="selectMockCount(${n.count})">${n.count} টি প্রশ্ন<br><small>⏱️ ${n.time} মিনিট</small></button>`; });
    html += '</div>';
    document.getElementById('categoryContent').innerHTML = html;
    switchMode('Category');
}

function selectMockCount(count) {
    mockQuestionCount = count;
    examQuestions = [];
    currentExam = { title:'মক টেস্ট', subject:'মক', chapter:'মক', total_marks:count, duration_minutes:Math.ceil(count/2), id:'mock_'+Date.now() };
    showNoQuestionsForMock();
}

function showNoQuestionsForMock() {
    const html = `
        <div class="no-questions">
            <div class="icon">⚠️</div>
            <div class="title">Database এ প্রশ্ন নেই</div>
            <div class="subtitle">প্রিয় শিক্ষার্থী,</div>
            <div class="subtitle">এডমিনকে ইনফর্ম করুন, দ্রুতই প্রশ্ন এড করার চেষ্টা করবো</div>
            <button class="btn btn-outline" onclick="backToList()" style="margin-top:16px;">🔙 ফিরে যান</button>
        </div>
    `;
    document.getElementById('preExamContent').innerHTML = html;
    document.getElementById('startExamBtn').style.display = 'none';

}

// ========== EXAM HALL ==========
function startExamHall() {
    userAnswers = {}; isExamSubmitted = false; bookmarkedQuestions = {};
    totalSeconds = (currentExam.duration_minutes||30) * 60; examSeconds = totalSeconds;
    loadBookmarks();
    
    let qHTML = '';
    examQuestions.forEach((q, i) => {
        const bmClass = bookmarkedQuestions[q.id] ? ' active' : '';
        qHTML += `<div class="mcq-card" id="qCard${q.id}">
            <div class="q-header">
                <span class="q-number">প্রশ্ন ${i+1}/${examQuestions.length}</span>
                <div class="q-actions">
                    <button class="icon-btn bookmark${bmClass}" id="bmBtn${q.id}" onclick="toggleBookmark(${q.id})">🔖</button>
                    <button class="icon-btn" onclick="openReportModal(${q.id})">🚩</button>
                </div>
            </div>
            <div class="q-text">${q.question_text}</div>`;
        [q.option1, q.option2, q.option3, q.option4, q.option5].forEach((opt, oi) => {
            if (opt && opt !== '—') {
                const labels = ['ক','খ','গ','ঘ','ঙ'];
                qHTML += `<div class="option-item" id="opt${q.id}_${oi+1}" onclick="selectOption(${q.id},${oi+1},this)" data-qid="${q.id}">
                    <span class="option-radio">${labels[oi]}</span>
                    <span class="option-text">${opt}</span>
                    <span class="lock-icon" id="lock${q.id}_${oi+1}" style="display:none;">🔒</span>
                </div>`;
            }
        });
        qHTML += `</div>`;
    });
    document.getElementById('questionsArea').innerHTML = qHTML;
    switchMode('Hall');
    startTimer(); updateProgress();
    history.pushState(null, '', location.href);
}

function selectOption(qid, oid, el) {
    if (isExamSubmitted || userAnswers[qid]) return;
    userAnswers[qid] = oid;
    document.querySelectorAll(`[data-qid="${qid}"]`).forEach(o => { o.classList.remove('selected'); o.classList.add('dimmed'); });
    el.classList.add('selected'); el.classList.remove('dimmed');
    const lock = document.getElementById(`lock${qid}_${oid}`); if (lock) lock.style.display = 'inline';
    updateProgress();
}

function startTimer() { stopTimer(); updateTimerDisplay(); examTimer = setInterval(() => { examSeconds--; updateTimerDisplay(); if (examSeconds <= 0) submitExam(); }, 1000); }
function stopTimer() { if (examTimer) { clearInterval(examTimer); examTimer = null; } }
function updateTimerDisplay() {
    const m = Math.floor(examSeconds/60), s = examSeconds%60;
    const t = document.getElementById('timerText');
    t.textContent = `${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`;
    if (examSeconds <= 60) t.classList.add('timer-warning'); else t.classList.remove('timer-warning');
}
function updateProgress() { const total = examQuestions.length, answered = Object.keys(userAnswers).length; document.getElementById('progressText').textContent = `📈 ${Math.round(answered/total*100)}%`; }

// ========== NAVIGATION ==========
function openNavPopup() {
    let html = '';
    examQuestions.forEach((q, i) => {
        let cls = 'nav-num';
        if (isExamSubmitted) { if (userAnswers[q.id] === q.answer_index) cls += ' correct'; else if (userAnswers[q.id]) cls += ' wrong'; }
        else if (userAnswers[q.id]) cls += ' answered';
        html += `<button class="${cls}" onclick="goToQuestion(${q.id});closeNavPopup();">${i+1}</button>`;
    });
    document.getElementById('navGrid').innerHTML = html;
    document.getElementById('navStats').textContent = `🟦 উত্তর: ${Object.keys(userAnswers).length} | ⬜ বাকি: ${examQuestions.length - Object.keys(userAnswers).length}`;
    document.getElementById('navOverlay').classList.add('active');
}
function closeNavPopup() { document.getElementById('navOverlay').classList.remove('active'); }
function goToQuestion(qid) { const card = document.getElementById(`qCard${qid}`); if (card) card.scrollIntoView({ behavior:'smooth', block:'center' }); }

// ========== BOOKMARK & REPORT ==========
function loadBookmarks() { try { const sess = JSON.parse(localStorage.getItem('atlas-session')); if (!sess) return; const saved = localStorage.getItem('bookmarks_'+sess.phone); if (saved) bookmarkedQuestions = JSON.parse(saved); } catch(e) {} }

function toggleBookmark(qid) {
    if (!checkGuestAction()) return;
    try {
        const sess = JSON.parse(localStorage.getItem('atlas-session'));
        if (!sess) { showToast('⚠️ লগইন করুন'); return; }
        if (bookmarkedQuestions[qid]) {
            delete bookmarkedQuestions[qid];
            document.getElementById('bmBtn'+qid)?.classList.remove('active');
            showToast('🔖 রিমুভ');
        } else {
            const q = examQuestions.find(q => q.id == qid);
            bookmarkedQuestions[qid] = {
                exam_name: currentExam?.title||(currentExam?.subject+' - '+currentExam?.chapter),
                subject: currentExam?.subject,
                chapter: currentExam?.chapter,
                category: currentExam?.exam_type,
                question_text: q.question_text,
                option1: q.option1, option2: q.option2, option3: q.option3, option4: q.option4, option5: q.option5,
                answer_index: q.answer_index,
                explanation: q.explanation,
                bookmarked_at: new Date().toISOString()
            };
            document.getElementById('bmBtn'+qid)?.classList.add('active');
            showToast('🔖 সেভ');
        }
        localStorage.setItem('bookmarks_'+sess.phone, JSON.stringify(bookmarkedQuestions));
    } catch(e) {}
}

function openReportModal(qid) { reportQid = qid; document.getElementById('reportModal').classList.add('active'); }
function closeReportModal() { document.getElementById('reportModal').classList.remove('active'); document.getElementById('reportType').value = ''; document.getElementById('reportSuggestion').value = ''; }

async function submitReport() {
    if (!checkGuestAction()) { closeReportModal(); return; }
    const type = document.getElementById('reportType').value;
    const suggestion = document.getElementById('reportSuggestion').value.trim();
    if (!type) { showToast('⚠️ ভুলের ধরন নির্বাচন করুন'); return; }
    const sess = JSON.parse(localStorage.getItem('atlas-session'));
    const phone = sess?.phone || 'anonymous';
    const q = examQuestions.find(q => q.id == reportQid);
    try {
        await safeFetch(`${SUPABASE_URL}/rest/v1/question_reports`, {
            method:'POST',
            body:JSON.stringify({
                question_id: reportQid,
                exam_id: currentExam?.id,
                exam_name: currentExam?.title||(currentExam?.subject+' - '+currentExam?.chapter),
                reporter_phone: phone,
                reporter_name: sess?.name||'Unknown',
                report_type: type,
                suggested_answer: suggestion,
                full_mcq: JSON.stringify(q),
                status:'pending'
            })
        });
        showToast('✅ রিপোর্ট জমা হয়েছে');
        closeReportModal();
    } catch(e) { showToast('❌ এরর'); }
}

// ========== SUBMIT & RESULT ==========
function submitExam() {
    if (isExamSubmitted) return;
    if (!confirm('এক্সাম সাবমিট করবেন? ফেরত আসা যাবে না।')) return;
    isExamSubmitted = true; stopTimer();
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('navFab').style.display = 'none';
    switchMode('Result');
    
    let correct = 0, wrong = 0, skipped = 0;
    examQuestions.forEach(q => { const ua = userAnswers[q.id]; if (!ua) skipped++; else if (ua === q.answer_index) correct++; else wrong++; });
    const totalQ = examQuestions.length, negMark = wrong * 0.25;
    let finalScore = correct - negMark; if (finalScore < 0) finalScore = 0;
    
    let gpaScore = 0, withGpa = finalScore, deduction = 0, isSecondTimer = false;
    try {
        const user = JSON.parse(localStorage.getItem('atlas-session'));
        if (user) {
            const ssc = parseFloat(user.ssc_gpa)||0, hsc = parseFloat(user.hsc_gpa)||0;
            gpaScore = (ssc*8)+(hsc*12);
            if (user.timer_type === 'second') {
                isSecondTimer = true;
                deduction = totalQ <= 50 ? 1.5 : 3;
                finalScore -= deduction;
                if (finalScore < 0) finalScore = 0;
            }
            withGpa = finalScore + gpaScore;
        }
    } catch(e) {}
    
    showResult(correct, wrong, skipped, negMark, finalScore, withGpa, gpaScore, deduction, isSecondTimer, totalQ);
    if (isLoggedIn() && !isMockTest) saveResultToDB(correct, wrong, skipped, negMark, finalScore, gpaScore, withGpa, totalQ);
}

async function saveResultToDB(c, w, s, n, f, g, wg, t) {
    try {
        const user = JSON.parse(localStorage.getItem('atlas-session'));
        if (user) {
            await safeFetch(`${SUPABASE_URL}/rest/v1/exam_results`, {
                method:'POST',
                body:JSON.stringify({
                    phone: user.phone,
                    exam_id: currentExam?.id,
                    exam_name: currentExam?.title||(currentExam?.subject+' - '+currentExam?.chapter),
                    subject: currentExam?.subject,
                    chapter: currentExam?.chapter,
                    category: currentExam?.exam_type,
                    total_questions: t,
                    correct: c, wrong: w, skipped: s,
                    negative_marks: n, final_score: f,
                    gpa_score: g, with_gpa_total: wg
                })
            });
        }
    } catch(e) {}
}

function showResult(correct, wrong, skipped, negMark, finalScore, withGpa, gpaScore, deduction, isSecondTimer, totalQ) {
    const examName = currentExam?.title || (currentExam?.subject+' - '+currentExam?.chapter) || 'এক্সাম';
    let html = '';
    
    // Result Score Card
    html += `<div class="result-score-card">
        <div class="result-exam-name">📝 ${examName}</div>
        <div class="result-big-score">${finalScore.toFixed(2)}</div>
        <div class="result-total">/ ${totalQ}</div>
    </div>`;
    
    // Correct/Wrong/Skipped Grid
    html += `<div class="result-grid">
        <div class="result-stat"><div class="result-stat-val correct-val">✅ ${correct}</div><div class="result-stat-label">সঠিক</div></div>
        <div class="result-stat"><div class="result-stat-val wrong-val">❌ ${wrong}</div><div class="result-stat-label">ভুল</div></div>
        <div class="result-stat"><div class="result-stat-val skipped-val">⏭️ ${skipped}</div><div class="result-stat-label">স্কিপ</div></div>
    </div>`;
    
    // Negative Mark
    html += `<div class="result-score-card" style="padding:12px;">
        <div class="info-row"><span class="info-label">নেগেটিভ মার্ক</span><span class="info-value" style="color:var(--error);">-${negMark.toFixed(2)}</span></div>
    </div>`;
    
    // GPA Boxes
    if (gpaScore > 0) {
        html += `<div class="gpa-row">
            <div class="gpa-box"><div class="gpa-box-title">📊 Without GPA</div><div class="gpa-box-val">${finalScore.toFixed(2)}</div></div>
            <div class="gpa-box"><div class="gpa-box-title">🎓 With GPA</div><div class="gpa-box-val">${withGpa.toFixed(2)}</div><div class="gpa-box-sub">+${gpaScore.toFixed(2)}</div></div>
        </div>`;
    }
    
    // Second Timer Deduction
    if (isSecondTimer) {
        html += `<div class="deduction-note">⚠️ সেকেন্ড টাইমার: -${deduction} মার্ক কর্তন</div>`;
    }
    
    // Pie Chart
    html += `<div class="result-score-card" style="padding:16px;">
        <div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#fff;">📊 পারফরম্যান্স</div>
        <div class="chart-wrap"><canvas id="resultChart"></canvas></div>
    </div>`;
    
    // Solve Sheet + PDF Buttons
    html += `<div class="result-actions">
        <button class="result-action-btn" onclick="openSolveSheet()">📋 Solve Sheet</button>
        <button class="result-action-btn" onclick="downloadPDF()">📥 PDF</button>
    </div>`;
    
    // Practice Again + Mistake Practice
    html += `<div class="practice-actions">
        <button class="practice-btn btn-practice-again" onclick="retakeExam()">🔄 Practice Again</button>
        <button class="practice-btn btn-mistake-practice" onclick="mistakePractice()">❌ Mistake Practice</button>
    </div>`;
    
    // Filter Buttons
    html += `<div class="filter-bar">
        <button class="filter-btn active" onclick="filterResult('all')">সব</button>
        <button class="filter-btn" onclick="filterResult('correct')">✅ সঠিক</button>
        <button class="filter-btn" onclick="filterResult('wrong')">❌ ভুল</button>
        <button class="filter-btn" onclick="filterResult('skipped')">⏭️ স্কিপ</button>
    </div>`;
    
    // Solve Sheet
    html += `<div id="solveSheet">`;
    examQuestions.forEach((q, i) => {
        const ua = userAnswers[q.id];
        const status = ua === q.answer_index ? 'correct' : (ua ? 'wrong' : 'skipped');
        const statusHTML = status === 'correct' ? '<div class="q-status correct">✅ সঠিক</div>' :
            status === 'wrong' ? `<div class="q-status wrong">❌ ভুল${ua ? ' (আপনি: '+['ক','খ','গ','ঘ','ঙ'][ua-1]+')' : ''}</div>` :
            '<div class="q-status" style="color:var(--warning);">⏭️ স্কিপ</div>';
        html += `<div class="mcq-card solve-item" data-status="${status}">
            ${statusHTML}
            <div class="q-text">${i+1}. ${q.question_text}</div>`;
        [q.option1, q.option2, q.option3, q.option4, q.option5].forEach((opt, oi) => {
            if (opt && opt !== '—') {
                let cls = '';
                if (oi+1 === q.answer_index) cls = ' correct-reveal';
                else if (oi+1 === ua && ua !== q.answer_index) cls = ' wrong-reveal';
                html += `<div class="option-item${cls}">
                    <span class="option-radio">${['ক','খ','গ','ঘ','ঙ'][oi]}</span>
                    <span class="option-text">${opt}</span>
                    ${oi+1===q.answer_index?' <span style="color:var(--success);">✅</span>':''}
                    ${oi+1===ua&&ua!==q.answer_index?' <span style="color:var(--error);">❌</span>':''}
                </div>`;
            }
        });
        if (q.explanation) {
            html += `<div class="explanation-box csv-box">
                <div class="exp-header">📋 ব্যাখ্যা</div>
                <div class="exp-content">${q.explanation}</div>
            </div>`;
        }
        html += `<div class="explanation-box ai-box">
            <div class="exp-header" onclick="toggleAIBox(this,${q.id})">🤖 ATLAS AI ব্যাখ্যা <span class="exp-arrow">▼</span></div>
            <div class="exp-content" id="aiExp${q.id}"></div>
        </div></div>`;
    });
    html += `</div>`;
    
    // Back Button
    html += `<button class="btn btn-outline" onclick="backToList()" style="width:100%;margin-top:8px;">🏠 এক্সাম লিস্টে যান</button>`;
    
    document.getElementById('resultContent').innerHTML = html;
    
    // Draw Pie Chart
    setTimeout(() => {
        const canvas = document.getElementById('resultChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const total = correct + wrong + skipped || 1;
        const data = [correct/total, wrong/total, skipped/total];
        const colors = ['#22D47A', '#F87171', '#FBBF24'];
        let startAngle = -Math.PI/2;
        const cx = 80, cy = 80, r = 65;
        data.forEach((slice, i) => {
            const angle = slice * Math.PI * 2;
            ctx.beginPath();
            ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, startAngle, startAngle+angle);
            ctx.fillStyle = colors[i];
            ctx.fill();
            startAngle += angle;
        });
        ctx.beginPath();
        ctx.arc(cx, cy, 30, 0, Math.PI*2);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--atlas-bg') || '#0A0D1E';
        ctx.fill();
    }, 300);
}

function filterResult(type) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.solve-item').forEach(item => {
        item.style.display = (type === 'all' || item.dataset.status === type) ? 'block' : 'none';
    });
}

function retakeExam() {
    if (!checkGuestAction()) return;
    userAnswers = {}; isExamSubmitted = false; bookmarkedQuestions = {};
    startExamHall();
}

function mistakePractice() {
    if (!checkGuestAction()) return;
    const wrongIds = examQuestions.filter(q => userAnswers[q.id] && userAnswers[q.id] !== q.answer_index);
    if (!wrongIds.length) { showToast('✅ কোনো ভুল নেই!'); return; }
    examQuestions = wrongIds; userAnswers = {}; isExamSubmitted = false;
    currentExam.total_marks = examQuestions.length;
    currentExam.duration_minutes = Math.ceil(examQuestions.length/2);
    startExamHall();
    showToast('❌ ' + wrongIds.length + ' টি ভুল প্রশ্ন নিয়ে প্র্যাকটিস');
}

// ========== AI ==========
async function toggleAIBox(header, qid) {
    if (!checkGuestAction()) return;
    const content = header.nextElementSibling, arrow = header.querySelector('.exp-arrow');
    if (content.classList.contains('show')) { content.classList.remove('show'); arrow.classList.remove('open'); return; }
    const q = examQuestions.find(q => q.id === qid); if (!q) return;
    content.classList.add('show'); arrow.classList.add('open');
    content.innerHTML = '⏳ AI ব্যাখ্যা আনা হচ্ছে...';
    const options = [q.option1,q.option2,q.option3,q.option4,q.option5].filter(o => o && o !== '—');
    const labels = ['ক','খ','গ','ঘ','ঙ'];
    let prompt = `তুমি একজন শিক্ষক। MCQ বিশ্লেষণ করো:\n\nপ্রশ্ন: ${q.question_text}\n\n`;
    options.forEach((opt,i) => { prompt += `${labels[i]}) ${opt}\n`; });
    prompt += `\nসঠিক উত্তর: ${labels[q.answer_index-1]}) ${options[q.answer_index-1]}\n\nপ্রতিটি অপশন ব্যাখ্যা করো। ✅ কেন সঠিক, ❌ কেন ভুল। বাংলায়। সংক্ষেপে।`;
    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, {
            method:'POST', headers:{'Content-Type':'application/json'},
            body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})
        });
        const data = await res.json();
        content.innerHTML = data.candidates ? data.candidates[0].content.parts[0].text.replace(/\n/g,'<br>') : '❌ ব্যাখ্যা পাওয়া যায়নি।';
    } catch(e) { content.innerHTML = '❌ AI সার্ভার সমস্যা।'; }
}

    const w = window.open('', 'SolveSheet', 'width=800,height=600');
    let html = `<html><head><meta charset="UTF-8"><title>Solve Sheet</title>
        <style>
            @page { size: A4; margin: 15mm; }
            body { font-family: 'Noto Sans Bengali', sans-serif; font-size: 11px; line-height: 1.6; }
            .page { column-count: 2; column-gap: 16px; page-break-after: always; }
            .q { break-inside: avoid; border: 1px solid #ddd; padding: 8px; margin-bottom: 8px; border-radius: 6px; }
            .q h4 { margin: 0 0 4px; font-size: 12px; }
            .opt { padding: 2px 0; }
            .correct { color: green; font-weight: bold; }
            .wrong { color: red; }
            .exp { font-size: 10px; color: #555; margin-top: 4px; border-left: 2px solid #7B82FF; padding-left: 6px; }
            img { max-width: 100%; height: auto; }
            @media print { .page { page-break-after: always; } }
        </style></head><body><h2>📋 Solve Sheet - ${currentExam?.title||'Exam'}</h2>`;
    
    for (let i = 0; i < examQuestions.length; i++) {
        if (i % 10 === 0) {
            if (i > 0) html += '</div>';
            html += `<div class="page">`;
        }
        const q = examQuestions[i];
        const ua = userAnswers[q.id];
        html += `<div class="q"><h4>${i+1}. ${q.question_text}</h4>`;
        [q.option1,q.option2,q.option3,q.option4,q.option5].forEach((opt,oi) => {
            if (opt && opt !== '—') {
                const style = oi+1===q.answer_index?'correct':oi+1===ua&&ua!==q.answer_index?'wrong':'';
                html += `<div class="opt ${style}">${['ক','খ','গ','ঘ','ঙ'][oi]}) ${opt}</div>`;
            }
        });
        if (q.explanation) html += `<div class="exp">💡 ${q.explanation}</div>`;
        html += `</div>`;
    }
    html += `</div><br><button onclick="window.print()" style="padding:10px 20px;background:#7B82FF;color:#fff;border:none;border-radius:8px;cursor:pointer;">📥 Download PDF</button></body></html>`;
    w.document.write(html); w.document.close();
}

}

/**
 * Show Error Popup
 * @param {string} title - Error title
 * @param {string} message - Error message
 * @param {string} details - Technical details (optional)
 * @param {function} retryFn - Retry function (optional)
 */
function showError(title, message, details, retryFn) {
    // Remove existing error popup
    const existing = document.querySelector('.error-popup-overlay');
    if (existing) existing.remove();

    const overlay = document.createElement('div');
    overlay.className = 'error-popup-overlay';
    
    let retryHTML = '';
    if (retryFn) {
        retryHTML = `<button class="error-popup-retry" onclick="this.closest('.error-popup-overlay').remove(); (${retryFn.toString()})();">🔄 আবার চেষ্টা</button>`;
    }
    
    overlay.innerHTML = `
        <div class="error-popup" onclick="event.stopPropagation()">
            <div class="error-popup-icon">⚠️</div>
            <div class="error-popup-title">${title || 'কিছু সমস্যা হয়েছে'}</div>
            <div class="error-popup-message">${message || 'পরে আবার চেষ্টা করুন'}</div>
            ${details ? `<div class="error-popup-details">${details}</div>` : ''}
            <div style="display:flex;justify-content:center;gap:8px;">
                ${retryHTML}
                <button class="error-popup-btn" onclick="this.closest('.error-popup-overlay').remove()">✕ বন্ধ</button>
            </div>
        </div>
    `;
    
    overlay.addEventListener('click', function(e) {
        if (e.target === overlay) overlay.remove();
    });
    
    document.body.appendChild(overlay);
}

/**
 * Safe Fetch with Error Handling
 */
async function safeFetch(url, opts = {}) {
    opts.headers = Object.assign({ 
        apikey: SUPABASE_KEY, 
        Authorization: 'Bearer ' + SUPABASE_KEY 
    }, opts.headers || {});
    
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE') {
        opts.headers['Content-Type'] = 'application/json';
    }
    
    try {
        const res = await fetch(url, opts);
        const text = await res.text();
        
        if (!res.ok) {
            let errorMsg = '';
            try {
                const errData = JSON.parse(text);
                errorMsg = errData.message || errData.error || '';
            } catch(e) {
                errorMsg = text.substring(0, 200);
            }
            
            showError(
                '⚠️ ডাটাবেজ সমস্যা',
                'ডাটা save/load করতে সমস্যা হয়েছে। আবার চেষ্টা করুন।',
                `Status: ${res.status} | ${errorMsg}`,
                () => safeFetch(url, opts)
            );
            
            throw new Error(errorMsg || `HTTP ${res.status}`);
        }
        
        if (!text?.trim()) return [];
        return JSON.parse(text);
        
    } catch(e) {
        if (e.message.includes('Failed to fetch') || e.message.includes('NetworkError')) {
            showError(
                '🌐 নেটওয়ার্ক সমস্যা',
                'ইন্টারনেট সংযোগ চেক করুন।',
                e.message,
                () => safeFetch(url, opts)
            );
        }
        
        console.error('❌ SafeFetch Error:', e.message);
        return [];
    }
}

/**
 * Global JavaScript Error Handler
 */
window.addEventListener('error', function(e) {
    console.error('Global Error:', e.error);
    showError(
        '💥 অপ্রত্যাশিত সমস্যা',
        'কিছু একটা ভুল হয়েছে। পৃষ্ঠাটি রিলোড করুন।',
        e.error?.message || e.message,
        () => location.reload()
    );
});

/**
 * Unhandled Promise Rejection
 */
window.addEventListener('unhandledrejection', function(e) {
    console.error('Unhandled Rejection:', e.reason);
    showError(
        '⚠️ প্রসেসিং সমস্যা',
        'অনুরোধ সম্পূর্ণ করা যায়নি।',
        e.reason?.message || '',
        null
    );
});
