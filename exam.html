<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP · এক্সাম</title>
    <script src="api.js"></script>
    <script src="storage.js"></script>
    <link rel="stylesheet" href="style.css">
    <style>
        /* F1: Mode System */
        .mode-container{display:none;animation:fadeIn 0.25s ease;}
        .mode-container.active{display:block;}
        
        /* F2: Exam List */
        .exam-list-wrap{max-width:600px;margin:0 auto;padding:12px 14px 80px;}
        
        /* F3: Category Grid */
        .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
        @media(min-width:600px){.cat-grid{grid-template-columns:1fr 1fr 1fr;}}
        .cat-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:18px 12px;text-align:center;cursor:pointer;transition:all 0.2s;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:var(--shadow-sm);}
        .cat-card:hover{border-color:var(--accent);box-shadow:var(--shadow-glow);transform:translateY(-2px);}
        .cat-icon{font-size:28px;}.cat-name{font-size:12px;font-weight:700;color:var(--text);}
        .cat-count{font-size:10px;color:var(--accent);font-weight:600;background:var(--accent-light);padding:2px 8px;border-radius:10px;}
        
        /* F4: List Items */
        .list-item{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 14px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:0.2s;}
        .list-item:hover{border-color:var(--accent);background:var(--card-hover);}
        .list-item-title{font-weight:600;font-size:13px;color:var(--text);}
        .list-item-sub{font-size:10px;color:var(--text-secondary);margin-top:2px;}
        .list-item-arrow{color:var(--accent);font-size:16px;}
        
        /* F5: Back Button */
        .back-btn{display:inline-flex;align-items:center;gap:4px;padding:7px 14px;background:var(--btn-bg);border:1px solid var(--border);border-radius:var(--radius-full);color:var(--text-secondary);font-size:12px;font-weight:600;cursor:pointer;transition:0.2s;margin-bottom:12px;}
        .back-btn:hover{border-color:var(--accent);color:var(--accent);}
        
        /* F6: Pre-Exam */
        .pre-exam-wrap{max-width:600px;margin:0 auto;padding:12px 14px 80px;}
        .exam-hero{text-align:center;padding:20px 14px;margin-bottom:14px;}
        .exam-hero-title{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:12px;}
        .exam-hero-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
        .hero-stat{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;min-width:75px;box-shadow:var(--shadow);}
        .hero-stat-val{font-size:22px;font-weight:800;color:var(--accent);}
        .hero-stat-label{font-size:10px;color:var(--text-secondary);margin-top:2px;}
        .pre-exam-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
        .info-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--divider);font-size:13px;}
        .info-label{color:var(--text-secondary);}.info-value{font-weight:600;}
        
        /* F7: Exam Hall */
        .exam-hall-wrap{max-width:100%;margin:0 auto;padding:8px 0 100px;position:relative;}
        .timer-sticky{position:sticky;top:56px;z-index:100;background:var(--atlas-bg);border:1px solid var(--atlas-border);border-radius:var(--radius-sm);padding:10px 14px;display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;box-shadow:0 2px 10px var(--atlas-glow);}
        .timer-text{font-size:18px;font-weight:800;color:var(--atlas-text);letter-spacing:2px;font-variant-numeric:tabular-nums;}
        .timer-warning{color:var(--error)!important;animation:pulse 0.5s infinite;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .progress-text{font-size:12px;font-weight:600;color:var(--atlas-text);opacity:0.75;}
        .questions-area{width:100%;padding:0 14px 20px;}
        
        /* F8: MCQ Cards */
        .mcq-card{background:var(--card-bg);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow-sm);width:100%;}
        .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .q-number{font-size:11px;color:var(--accent);font-weight:700;background:var(--accent-light);padding:3px 9px;border-radius:var(--radius-full);}
        .q-actions{display:flex;gap:6px;}
        .icon-btn{background:none;border:1px solid var(--border);font-size:15px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:0.2s;opacity:0.6;color:var(--text-secondary);}
        .icon-btn:hover{opacity:1;border-color:var(--accent);}
        .icon-btn.bookmark.active{opacity:1;color:var(--warning);border-color:var(--warning);}
        .q-text{font-size:14px;font-weight:600;margin-bottom:12px;line-height:1.7;color:var(--text);}
        .q-text img{max-width:100%;border-radius:8px;margin:6px 0;}
        
        /* F9: Options */
        .option-item{display:flex;align-items:center;gap:10px;padding:11px 13px;margin-bottom:7px;background-color:var(--option-bg);border:1.5px solid var(--option-border);border-radius:var(--radius-sm);cursor:pointer;transition:0.18s;font-size:13px;color:var(--text);}
        .option-item:hover:not(.dimmed):not(.locked){border-color:var(--accent);background:var(--option-selected-bg);}
        .option-item.selected{background-color:var(--option-selected-bg);border-color:var(--option-selected-border);cursor:default;}
        .option-item.dimmed{opacity:0.35;cursor:not-allowed;pointer-events:none;}
        .option-item.correct-reveal{background-color:var(--success-light);border-color:var(--success);}
        .option-item.wrong-reveal{background-color:var(--error-light);border-color:var(--error);}
        .option-radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--text-tertiary);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:var(--text-tertiary);transition:0.18s;}
        .option-item.selected .option-radio{border-color:var(--option-selected-border);background:var(--option-selected-border);color:#fff;}
        .option-item.correct-reveal .option-radio{border-color:var(--success);background:var(--success);color:#fff;}
        .option-item.wrong-reveal .option-radio{border-color:var(--error);background:var(--error);color:#fff;}
        .option-text{flex:1;line-height:1.5;}.option-text img{max-width:100%;border-radius:8px;margin:4px 0;}
        .lock-icon{margin-left:auto;font-size:13px;color:var(--text-tertiary);}
        
        /* F10: Nav Popup */
        .nav-fab{position:fixed;right:2px;top:50%;transform:translateY(-50%);width:38px;height:38px;background:var(--accent);border:none;border-radius:10px 0 0 10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;z-index:101;box-shadow:0 4px 12px var(--accent-glow);display:flex;align-items:center;justify-content:center;}
        .nav-overlay{position:fixed;inset:0;background:var(--overlay);z-index:200;display:none;align-items:flex-end;}
        .nav-overlay.active{display:flex;}
        .nav-popup{width:100%;max-width:520px;margin:0 auto;background:var(--card-bg);border-radius:var(--radius) var(--radius) 0 0;padding:16px;border:1px solid var(--border);animation:fadeIn 0.2s;max-height:80vh;overflow-y:auto;}
        .nav-popup-title{font-size:14px;font-weight:700;color:var(--accent);margin-bottom:12px;text-align:center;}
        .nav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
        @media(max-width:480px){.nav-grid{grid-template-columns:repeat(6,1fr);}}
        .nav-num{aspect-ratio:1;border-radius:6px;background:var(--option-bg);border:1px solid var(--border);color:var(--text-secondary);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;}
        .nav-num.answered{background:var(--accent);border-color:var(--accent);color:#fff;}
        .nav-num.correct{background:var(--success);border-color:var(--success);color:#fff;}
        .nav-num.wrong{background:var(--error);border-color:var(--error);color:#fff;}
        .nav-stats{text-align:center;margin-top:8px;font-size:10px;color:var(--text-secondary);}
        .nav-close{display:block;margin:12px auto 0;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;}
        
        /* F11: Submit Fixed */
        .submit-fixed{position:fixed;bottom:0;left:0;right:0;background:var(--success);color:#fff;border:none;padding:14px;font-size:16px;font-weight:700;cursor:pointer;z-index:100;box-shadow:0 -2px 16px var(--success-glow);transition:0.2s;text-align:center;}
        .submit-fixed:hover{filter:brightness(0.9);}
        
        /* F12: Result */
        .result-wrap{max-width:600px;margin:0 auto;padding:14px 14px 90px;animation:fadeIn 0.3s;}
        .result-score-card{background:linear-gradient(140deg,var(--atlas-bg)0%,var(--atlas-card)100%);border:1.5px solid var(--atlas-border);border-radius:var(--radius);padding:24px 18px;text-align:center;margin-bottom:14px;box-shadow:var(--shadow-md),0 0 24px var(--atlas-glow);width:100%;}
        .result-exam-name{font-size:18px;font-weight:800;color:#fff;margin-bottom:12px;}
        .result-big-score{font-size:42px;font-weight:900;color:var(--atlas-text);text-shadow:0 0 20px var(--atlas-glow-strong);}
        .result-total{font-size:14px;color:var(--atlas-text);opacity:0.75;margin-top:4px;}
        .result-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:14px 0;}
        .result-stat{background:var(--card-bg);border-radius:var(--radius-sm);padding:12px 8px;text-align:center;border:1px solid var(--border);width:100%;}
        .result-stat-val{font-size:18px;font-weight:800;}.result-stat-label{font-size:10px;color:var(--text-secondary);margin-top:2px;}
        .correct-val{color:var(--success);}.wrong-val{color:var(--error);}.skipped-val{color:var(--warning);}
        
        /* F13: GPA & Actions */
        .gpa-row{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
        .gpa-box{background:var(--card-bg);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow-sm);width:100%;}
        .gpa-box-title{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;}
        .gpa-box-val{font-size:30px;font-weight:800;color:var(--accent);}
        .deduction-note{font-size:11px;color:var(--error);margin-bottom:14px;text-align:center;}
        .chart-wrap{width:160px;height:160px;margin:0 auto 14px;}
        .result-actions{display:flex;gap:8px;margin-bottom:10px;justify-content:center;flex-wrap:wrap;}
        .result-action-btn{flex:1;min-width:120px;padding:10px 14px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--btn-bg);color:var(--text);font-size:12px;font-weight:700;cursor:pointer;transition:0.2s;text-align:center;}
        .result-action-btn:hover{border-color:var(--accent);color:var(--accent);}
        .practice-actions{display:flex;gap:8px;margin-bottom:10px;justify-content:center;flex-wrap:wrap;}
        .practice-btn{flex:1;min-width:120px;padding:12px;border-radius:var(--radius-sm);border:none;font-size:13px;font-weight:700;cursor:pointer;transition:0.2s;text-align:center;color:#fff;}
        .btn-practice-again{background:var(--accent);}.btn-mistake-practice{background:var(--error);}
        .filter-bar{display:flex;gap:6px;margin-bottom:10px;justify-content:center;flex-wrap:wrap;}
        .filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card-bg);color:var(--text-secondary);cursor:pointer;font-size:11px;font-weight:600;transition:0.2s;}
        .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
        
        /* F14: Explanation */
        .explanation-box{margin-top:8px;border-radius:var(--radius-sm);overflow:hidden;}
        .csv-box{background:var(--card-hover);border-left:3px solid var(--accent);padding:10px 12px;font-size:12px;line-height:1.5;}
        .csv-box img{max-width:100%;border-radius:8px;margin:4px 0;}
        .exp-header{color:var(--accent);font-weight:700;font-size:11px;margin-bottom:3px;}
        .exp-content{font-size:12px;line-height:1.5;color:var(--text);}
        .ai-box{background:var(--card-bg);border:1px solid var(--border);}
        .ai-box .exp-header{padding:8px 12px;font-weight:700;font-size:11px;color:var(--accent);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
        .ai-box .exp-content{padding:8px 12px;font-size:12px;line-height:1.5;color:var(--text);border-top:1px solid var(--divider);display:none;}
        .ai-box .exp-content.show{display:block;animation:fadeIn 0.25s;}
        .exp-arrow{font-size:10px;transition:0.2s;}.exp-arrow.open{transform:rotate(180deg);}
        
        /* F15: Mock Options */
        .mock-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .mock-option-btn{padding:14px;background:var(--card-bg);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:0.2s;}
        .mock-option-btn:hover{border-color:var(--accent);}
        
        /* F16: No Questions */
        .no-questions{text-align:center;padding:40px 20px;}
        .no-questions .icon{font-size:48px;margin-bottom:16px;}
        .no-questions .title{font-size:15px;font-weight:700;color:var(--text);margin-bottom:8px;}
        .no-questions .subtitle{font-size:13px;color:var(--text-secondary);margin-bottom:4px;}
        
        /* F17: Guest Modal */
        .guest-message{text-align:center;padding:30px 20px;}
        .guest-message .icon{font-size:48px;margin-bottom:16px;}
        .guest-link-box{background:var(--card-bg);border:1px solid var(--border);border-radius:8px;padding:10px;margin:12px 0;word-break:break-all;font-size:12px;color:var(--accent);}
    </style>
</head>
<body class="dark-mode">

<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">

<!-- F19: Header -->

        <div class="atlas-brand-box"><img src="https://cdn.phototourl.com/free/2026-05-15-b45df560-6dc8-4cb7-9040-238612c8a161.png" class="atlas-logo-img" alt="ATLAS"><span class="atlas-brand-text">ATLAS APP</span></div>

<main>
<!-- F20: MODE 1 - Exam List -->
<div class="mode-container active" id="modeList"><div class="exam-list-wrap">
    <div class="section-header"><div class="section-title">📝 ফ্রি এক্সাম সেকশন</div><div class="section-subtitle">আপনার প্রস্তুতির জন্য সেরা এক্সাম</div></div>
    <div class="cat-grid" id="catGrid"></div>
    <div class="section-header"><div class="section-title">🎯 আনলিমিটেড মক টেস্ট</div></div>

</div></div>

<!-- F21: MODE 2 - Category -->
<div class="mode-container" id="modeCategory"><div class="exam-list-wrap"><button class="back-btn" onclick="backToList()">← ফিরে যান</button><div id="categoryContent"></div></div></div>

<!-- F22: MODE 3 - Pre-Exam -->

<!-- F23: MODE 4 - Exam Hall -->
<div class="mode-container" id="modeHall"><div class="exam-hall-wrap">
    <div class="timer-sticky"><span class="timer-text" id="timerText">৬০:০০</span><span class="progress-text" id="progressText">📈 ০%</span></div>
    <div class="questions-area" id="questionsArea"></div>
    <button class="submit-fixed" id="submitBtn" onclick="submitExam()">📤 Submit</button>
    <button class="nav-fab" id="navFab" onclick="openNavPopup()">📋</button>
</div></div>

<!-- F24: MODE 5 - Result -->
<div class="mode-container" id="modeResult"><div class="result-wrap" id="resultContent"></div></div>
</main>

<!-- F25: Nav Popup -->
<div class="nav-overlay" id="navOverlay" onclick="closeNavPopup()"><div class="nav-popup" onclick="event.stopPropagation()"><div class="nav-popup-title">📋 প্রশ্ন নেভিগেশন</div><div class="nav-grid" id="navGrid"></div><div class="nav-stats" id="navStats"></div><button class="nav-close" onclick="closeNavPopup()">✕ বন্ধ</button></div></div>

<!-- F27: Guest Modal -->

<!-- F28: Bottom Nav -->

// F41: SUBMIT EXAM
function submitExam(){
    if(isExamSubmitted)return;
    if(!confirm('এক্সাম সাবমিট করবেন? ফেরত আসা যাবে না।'))return;
    isExamSubmitted=true;stopTimer();switchMode('Result');
    let correct=0,wrong=0,skipped=0;
    examQuestions.forEach(q=>{const ua=userAnswers[q.id];if(!ua)skipped++;else if(ua===q.answer_index)correct++;else wrong++;});
    const totalQ=examQuestions.length,negMark=wrong*0.25;
    let finalScore=correct-negMark;if(finalScore<0)finalScore=0;
    let gpaScore=0,withGpa=finalScore,deduction=0,isSecondTimer=false;
    try{
        const user=Storage.getSession();
        if(user){const ssc=parseFloat(user.ssc_gpa)||0,hsc=parseFloat(user.hsc_gpa)||0;gpaScore=(ssc*8)+(hsc*12);
            if(user.timer_type==='second'){isSecondTimer=true;deduction=totalQ<=50?1.5:3;finalScore-=deduction;if(finalScore<0)finalScore=0;}
            withGpa=finalScore+gpaScore;}
    }catch(e){}
    showResult(correct,wrong,skipped,negMark,finalScore,withGpa,gpaScore,deduction,isSecondTimer,totalQ);
    if(isLoggedIn()&&!isMockTest)saveResultToDB(correct,wrong,skipped,negMark,finalScore,gpaScore,withGpa,totalQ);
}

// F42: SAVE RESULT
async function saveResultToDB(c,w,s,n,f,g,wg,t){
    try{
        const user=Storage.getSession();if(!user)return;
        await API.results.create({phone:user.phone,exam_id:currentExam?.id,
            exam_name:currentExam?.title||(currentExam?.subject+' - '+currentExam?.chapter),
            subject:currentExam?.subject,chapter:currentExam?.chapter,category:currentExam?.exam_type,
            total_questions:t,correct:c,wrong:w,skipped:s,negative_marks:n,final_score:f,gpa_score:g,with_gpa_total:wg});
    }catch(e){}
}

// F43: SHOW RESULT
function showResult(correct,wrong,skipped,negMark,finalScore,withGpa,gpaScore,deduction,isSecondTimer,totalQ){
    const examName=currentExam?.title||(currentExam?.subject+' - '+currentExam?.chapter)||'এক্সাম';
    let html=`<div class="result-score-card"><div class="result-exam-name">📝 ${examName}</div><div class="result-big-score">${finalScore.toFixed(2)}</div><div class="result-total">/ ${totalQ}</div></div>`;
    html+=`<div class="result-grid"><div class="result-stat"><div class="result-stat-val correct-val">✅ ${correct}</div><div class="result-stat-label">সঠিক</div></div><div class="result-stat"><div class="result-stat-val wrong-val">❌ ${wrong}</div><div class="result-stat-label">ভুল</div></div><div class="result-stat"><div class="result-stat-val skipped-val">⏭️ ${skipped}</div><div class="result-stat-label">স্কিপ</div></div></div>`;
    html+=`<div class="result-score-card" style="padding:12px;"><div class="info-row"><span class="info-label">নেগেটিভ মার্ক</span><span class="info-value" style="color:var(--error);">-${negMark.toFixed(2)}</span></div></div>`;
    if(gpaScore>0){html+=`<div class="gpa-row"><div class="gpa-box"><div class="gpa-box-title">📊 Without GPA</div><div class="gpa-box-val">${finalScore.toFixed(2)}</div></div><div class="gpa-box"><div class="gpa-box-title">🎓 With GPA</div><div class="gpa-box-val">${withGpa.toFixed(2)}</div></div></div>`;}
    if(isSecondTimer){html+=`<div class="deduction-note">⚠️ সেকেন্ড টাইমার: -${deduction} মার্ক কর্তন</div>`;}
    html+=`<div class="result-score-card" style="padding:16px;"><div style="font-size:13px;font-weight:700;margin-bottom:8px;color:#fff;">📊 পারফরম্যান্স</div><div class="chart-wrap"><canvas id="resultChart"></canvas></div></div>`;
    html+=`<div class="result-actions"><button class="result-action-btn" onclick="openSolveSheet()">📋 Solve Sheet</button><button class="result-action-btn" onclick="downloadPDF()">📥 PDF</button></div>`;
    html+=`<div class="practice-actions"><button class="practice-btn btn-practice-again" onclick="retakeExam()">🔄 Practice Again</button><button class="practice-btn btn-mistake-practice" onclick="mistakePractice()">❌ Mistake Practice</button></div>`;
    html+=`<div class="filter-bar"><button class="filter-btn active" onclick="filterResult('all')">সব</button><button class="filter-btn" onclick="filterResult('correct')">✅ সঠিক</button><button class="filter-btn" onclick="filterResult('wrong')">❌ ভুল</button><button class="filter-btn" onclick="filterResult('skipped')">⏭️ স্কিপ</button></div><div id="solveSheet">`;
    examQuestions.forEach((q,i)=>{
        const ua=userAnswers[q.id];
        const status=ua===q.answer_index?'correct':(ua?'wrong':'skipped');
        const statusHTML=status==='correct'?'<div class="q-status correct">✅ সঠিক</div>':status==='wrong'?`<div class="q-status wrong">❌ ভুল${ua?' (আপনি: '+['ক','খ','গ','ঘ','ঙ'][ua-1]+')':''}</div>`:'<div class="q-status" style="color:var(--warning);">⏭️ স্কিপ</div>';
        html+=`<div class="mcq-card solve-item" data-status="${status}">${statusHTML}<div class="q-text">${i+1}. ${q.question_text}</div>`;
        [q.option1,q.option2,q.option3,q.option4,q.option5].forEach((opt,oi)=>{
            if(opt&&opt!=='—'){let cls='';if(oi+1===q.answer_index)cls=' correct-reveal';else if(oi+1===ua&&ua!==q.answer_index)cls=' wrong-reveal';
                html+=`<div class="option-item${cls}"><span class="option-radio">${['ক','খ','গ','ঘ','ঙ'][oi]}</span><span class="option-text">${opt}</span>${oi+1===q.answer_index?' ✅':oi+1===ua&&ua!==q.answer_index?' ❌':''}</div>`;}
        });
        if(q.explanation){html+=`<div class="explanation-box csv-box"><div class="exp-header">📋 ব্যাখ্যা</div><div class="exp-content">${q.explanation}</div></div>`;}
        html+=`<div class="explanation-box ai-box"><div class="exp-header" onclick="toggleAIBox(this,${q.id})">🤖 ATLAS AI ব্যাখ্যা <span class="exp-arrow">▼</span></div><div class="exp-content" id="aiExp${q.id}"></div></div></div>`;
    });
    html+=`</div><button class="btn btn-outline" onclick="backToList()" style="width:100%;margin-top:8px;">🏠 এক্সাম লিস্টে যান</button>`;
    document.getElementById('resultContent').innerHTML=html;
    setTimeout(()=>{
        const canvas=document.getElementById('resultChart');if(!canvas)return;
        const ctx=canvas.getContext('2d');const total=correct+wrong+skipped||1;
        const data=[correct/total,wrong/total,skipped/total];
        const colors=['#22D47A','#F87171','#FBBF24'];let startAngle=-Math.PI/2;
        data.forEach((slice,i)=>{const angle=slice*Math.PI*2;ctx.beginPath();ctx.moveTo(80,80);ctx.arc(80,80,65,startAngle,startAngle+angle);ctx.fillStyle=colors[i];ctx.fill();startAngle+=angle;});
        ctx.beginPath();ctx.arc(80,80,30,0,Math.PI*2);ctx.fillStyle=getComputedStyle(document.body).getPropertyValue('--atlas-bg')||'#0A0D1E';ctx.fill();
    },300);
}

// F44: FILTER RESULT
function filterResult(type){
    document.querySelectorAll('.filter-btn').forEach(b=>b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.solve-item').forEach(item=>{item.style.display=(type==='all'||item.dataset.status===type)?'block':'none';});
}

// F45: RETAKE & PRACTICE
function retakeExam(){if(!checkGuestAction())return;userAnswers={};isExamSubmitted=false;bookmarkedQuestions={};startExamHall();}
function mistakePractice(){
    if(!checkGuestAction())return;
    const wrongIds=examQuestions.filter(q=>userAnswers[q.id]&&userAnswers[q.id]!==q.answer_index);
    if(!wrongIds.length){showToast('✅ কোনো ভুল নেই!');return;}
    examQuestions=wrongIds;userAnswers={};isExamSubmitted=false;
    currentExam.total_marks=examQuestions.length;currentExam.duration_minutes=Math.ceil(examQuestions.length/2);
    startExamHall();showToast('❌ '+wrongIds.length+' টি ভুল প্রশ্ন নিয়ে প্র্যাকটিস');
}

// F46: AI EXPLANATION (Multiple Models)
const AI_MODELS_EXAM=[{name:'Llama 3.3 70B',provider:'groq',model:'llama-3.3-70b-versatile',key:GROQ_KEY},{name:'Llama 3.1 8B',provider:'groq',model:'llama-3.1-8b-instant',key:GROQ_KEY},{name:'Mixtral 8x7B',provider:'groq',model:'mixtral-8x7b-32768',key:GROQ_KEY},{name:'Gemini 2.0 Flash',provider:'google',model:'gemini-2.0-flash',key:GEMINI_KEY}];
async function callAIForMCQ(prompt){for(const model of AI_MODELS_EXAM){try{let answer;if(model.provider==='groq'){const res=await fetch('https://api.groq.com/openai/v1/chat/completions',{method:'POST',headers:{'Authorization':'Bearer '+model.key,'Content-Type':'application/json'},body:JSON.stringify({model:model.model,messages:[{role:'system',content:'তুমি শিক্ষক। বাংলায় উত্তর দিবে। সংক্ষেপে।'},{role:'user',content:prompt}],temperature:0.7,max_tokens:1024})});const data=await res.json();answer=data.choices?.[0]?.message?.content;}else{const res=await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model.model}:generateContent?key=${model.key}`,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({contents:[{parts:[{text:prompt}]}]})});const data=await res.json();answer=data.candidates?.[0]?.content?.parts?.[0]?.text;}if(answer&&!answer.includes('error')&&!answer.includes('rate_limit'))return answer.replace(/\n/g,'<br>');}catch(e){continue;}}return '❌ AI ব্যাখ্যা পাওয়া যায়নি। পরে চেষ্টা করুন।';}
async function toggleAIBox(header,qid){if(!checkGuestAction())return;const content=header.nextElementSibling,arrow=header.querySelector('.exp-arrow');if(content.classList.contains('show')){content.classList.remove('show');arrow.classList.remove('open');return;}const q=examQuestions.find(q=>q.id===qid);if(!q)return;content.classList.add('show');arrow.classList.add('open');content.innerHTML='⏳ AI ব্যাখ্যা আনা হচ্ছে...';const options=[q.option1,q.option2,q.option3,q.option4,q.option5].filter(o=>o&&o!=='—');const labels=['ক','খ','গ','ঘ','ঙ'];let prompt=`তুমি একজন শিক্ষক। MCQ বিশ্লেষণ করো:\n\nপ্রশ্ন: ${q.question_text}\n\n`;options.forEach((opt,i)=>{prompt+=`${labels[i]}) ${opt}\n`;});prompt+=`\nসঠিক উত্তর: ${labels[q.answer_index-1]}) ${options[q.answer_index-1]}\n\nপ্রতিটি অপশন ব্যাখ্যা করো। ✅ কেন সঠিক, ❌ কেন ভুল। বাংলায়। সংক্ষেপে।`;content.innerHTML=await callAIForMCQ(prompt);}

>';switchMode('Category');}catch(e){document.getElementById('categoryContent').innerHTML='<p>কোনো Model Test নেই</p>';switchMode('Category');}}

// F63: START MODEL EXAM
async function startModelExam(modelId){try{const data=await API.modelTests.list();const modelTest=data.find(d=>d.id==modelId);if(!modelTest){showToast('❌ Model Test পাওয়া যায়নি');return;}if(modelTest.link){window.open(modelTest.link,'_blank');return;}if(modelTest.questions_json){examQuestions=JSON.parse(modelTest.questions_json);examQuestions=examQuestions.map((q,i)=>({id:i+1,question_text:q.questions||q.question_text||'',option1:q.option1||'',option2:q.option2||'',option3:q.option3||'',option4:q.option4||'',option5:q.option5||null,answer_index:parseInt(q.answer)||1,explanation:q.explanation||''}));currentExam={title:modelTest.subject_name||modelTest.paper_name||'Model Test',subject:modelTest.subject_name||'',chapter:modelTest.paper_name||'',exam_type:'model',sub_type:modelTest.sub_type,total_marks:examQuestions.length,duration_minutes:Math.ceil(examQuestions.length/2),id:'model_'+modelId};if(!examQuestions.length){showNoQuestions();return;}showPreExamFromData(currentExam,examQuestions);}else{showNoQuestions();}}catch(e){showNoQuestions();}}

// F64: SIDEBAR MODEL TEST & MISTAKES
function openModelTest(){const html=`<div class="modal-title">📖 Model Test</div><button class="btn btn-outline" onclick="closeModelTest();loadModelExams('medical','subject')" style="width:100%;margin-bottom:6px;">🏥 Medical (Subject Final)</button><button class="btn btn-outline" onclick="closeModelTest();loadModelExams('medical','paper')" style="width:100%;margin-bottom:6px;">🏥 Medical (Paper Final)</button><button class="btn btn-primary" onclick="closeModelTest();loadModelExams('medical','full')" style="width:100%;margin-bottom:6px;">📖 Full Model Test</button><p style="font-size:10px;color:var(--text-secondary);text-align:center;">Bio=30, Chem=25, Phy=15, GK=15, Eng=15</p><button class="btn btn-outline" onclick="closeModelTest();loadModelExams('afmc','')" style="width:100%;margin-bottom:6px;">🎖️ AFMC</button><button class="btn btn-outline" onclick="closeModelTest();loadModelExams('varsity','')" style="width:100%;margin-bottom:6px;">🟣 Varsity</button><button class="btn btn-outline" onclick="closeModelTest()" style="width:100%;">✕ বন্ধ</button>`;document.getElementById('guestModalContent').innerHTML=html;document.getElementById('guestModal').classList.add('active');}
function closeModelTest(){document.getElementById('guestModal').classList.remove('active');}
function openMistakes(){if(!Storage.isLoggedIn()){showToast('⚠️ লগইন করুন');return;}goTo('dashboard.html');}

// F65: PDF / SOLVE SHEET
function openSolveSheet(){if(!checkGuestAction())return;const w=window.open('','SolveSheet','width=900,height=700');const examName=currentExam?.title||'Exam';const totalPages=Math.ceil(examQuestions.length/10);let html=`<!DOCTYPE html><html><head><meta charset="UTF-8"><title>Solve Sheet - ${examName}</title><style>@page{size:A4;margin:15mm}body{font-family:'Noto Sans Bengali',sans-serif;background:white;color:#1A1D2E;font-size:11px;line-height:1.5}.page{page-break-after:always;padding:0}.page:last-child{page-break-after:auto}.pdf-header{text-align:center;padding:12px 0;border-bottom:2px solid #5A5FE0;margin-bottom:14px}.pdf-header h2{color:#5A5FE0;margin:0;font-size:18px}.pdf-columns{column-count:2;column-gap:14px}.mcq-card{border:1px solid #D4D8EE;border-radius:10px;padding:10px;margin-bottom:10px;break-inside:avoid;background:#FAFBFF}.mcq-status{display:inline-block;padding:2px 8px;border-radius:4px;font-size:10px;font-weight:700;margin-bottom:6px}.status-correct{background:#DCFBEE;color:#0EA867}.status-wrong{background:#FEE8E8;color:#E53E3E}.status-skipped{background:#FEF5DC;color:#D97706}.q-text{font-size:12px;font-weight:700;margin-bottom:6px}.opt{padding:2px 0;font-size:11px}.opt-correct{color:#0EA867;font-weight:700}.opt-wrong{color:#E53E3E;text-decoration:line-through}.exp-box{background:#F4F6FF;border-left:2px solid #5A5FE0;padding:6px 8px;margin-top:5px;font-size:10px;border-radius:4px}.pdf-footer{text-align:center;font-size:10px;color:#7A82A8;padding:10px 0;border-top:1px solid #D4D8EE;margin-top:10px}img{max-width:100%;height:auto}</style></head><body>`;for(let page=0;page<totalPages;page++){const start=page*10;const end=Math.min(start+10,examQuestions.length);const pageQuestions=examQuestions.slice(start,end);html+=`<div class="page"><div class="pdf-header"><h2>📋 ATLAS APP · Solve Sheet</h2><p>📝 ${examName} | 📅 ${new Date().toLocaleDateString('bn-BD')}</p></div><div class="pdf-columns">`;pageQuestions.forEach((q,idx)=>{const qNum=start+idx+1;const ua=userAnswers[q.id];const status=ua===q.answer_index?'correct':(ua?'wrong':'skipped');const statusText=status==='correct'?'✅ সঠিক':status==='wrong'?'❌ ভুল':'⏭️ স্কিপ';const statusClass=status==='correct'?'status-correct':status==='wrong'?'status-wrong':'status-skipped';html+=`<div class="mcq-card"><span class="mcq-status ${statusClass}">${statusText}</span><div class="q-text">${qNum}. ${q.question_text}</div>`;[q.option1,q.option2,q.option3,q.option4,q.option5].forEach((opt,oi)=>{if(opt&&opt!=='—'){let optClass='';if(oi+1===q.answer_index)optClass='opt-correct';else if(oi+1===ua&&ua!==q.answer_index)optClass='opt-wrong';html+=`<div class="opt ${optClass}">${['ক','খ','গ','ঘ','ঙ'][oi]}) ${opt} ${oi+1===q.answer_index?'✅':ua===oi+1&&ua!==q.answer_index?'❌':''}</div>`;}});if(q.explanation){html+=`<div class="exp-box"><strong>💡 ব্যাখ্যা:</strong> ${q.explanation}</div>`;}html+=`</div>`;});html+=`</div><div class="pdf-footer">Page ${page+1}/${totalPages} | ATLAS APP © 2026 | atlasprep.pages.dev</div></div>`;}html+=`<div style="text-align:center;padding:20px"><button onclick="window.print()" style="padding:12px 30px;background:#5A5FE0;color:white;border:none;border-radius:8px;font-size:14px;font-weight:700;cursor:pointer">📥 Download PDF / Print</button></div></body></html>`;w.document.write(html);w.document.close();}
function downloadPDF(){if(!checkGuestAction())return;openSolveSheet();setTimeout(()=>window.print(),500);}

// F66: SAFETY
window.addEventListener('beforeunload',e=>{if(!isExamSubmitted&&examSeconds>0){e.preventDefault();e.returnValue='';}});
window.addEventListener('popstate',e=>{if(!isExamSubmitted&&examSeconds>0){if(!confirm('⚠️ এক্সাম ছেড়ে যাবেন?')){history.pushState(null,'',location.href);}}});

// F67: GLOBAL ERROR HANDLER
function showError(title,message,details,retryFn){const existing=document.querySelector('.error-popup-overlay');if(existing)existing.remove();const overlay=document.createElement('div');overlay.className='error-popup-overlay';let retryHTML='';if(retryFn)retryHTML=`<button class="error-popup-retry" onclick="this.closest('.error-popup-overlay').remove();(${retryFn.toString()})();">🔄 আবার চেষ্টা</button>`;overlay.innerHTML=`<div class="error-popup" onclick="event.stopPropagation()"><div class="error-popup-icon">⚠️</div><div class="error-popup-title">${title||'কিছু সমস্যা হয়েছে'}</div><div class="error-popup-message">${message||'পরে আবার চেষ্টা করুন'}</div>${details?`<div class="error-popup-details">${details}</div>`:''}<div style="display:flex;justify-content:center;gap:8px;">${retryHTML}<button class="error-popup-btn" onclick="this.closest('.error-popup-overlay').remove()">✕ বন্ধ</button></div></div>`;overlay.addEventListener('click',function(e){if(e.target===overlay)overlay.remove();});document.body.appendChild(overlay);}
window.addEventListener('error',function(e){showError('💥 সমস্যা','পৃষ্ঠাটি রিলোড করুন',e.error?.message,()=>location.reload());});
window.addEventListener('unhandledrejection',function(e){showError('⚠️ প্রসেসিং সমস্যা','অনুরোধ সম্পূর্ণ করা যায়নি',e.reason?.message,null);});

// F68: INITIALIZATION
document.addEventListener('DOMContentLoaded',()=>{
    if(Storage.isAdmin()||Storage.isSubAdmin()){document.getElementById('adminSidebarBtn').style.display='flex';}
    const params=new URLSearchParams(location.search);const examId=params.get('id');const cat=params.get('cat');const mock=params.get('mock');const model=params.get('model');
    if(examId){loadExamById(examId);}else if(mock==='true'){startMockTest();}else if(model){startModelExam(model);}else if(cat){if(cat==='model'){const sub=params.get('sub')||'';loadModelExams('medical',sub);}else{showCategory(cat);}}else{loadCategoryCounts();loadAllExams();}
});
