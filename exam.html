<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS APP · এক্সাম</title>
    <link rel="stylesheet" href="style.css">
    <style>
        /* ========== EXAM-SPECIFIC STYLES ========== */
        .mode-container { display: none; }
        .mode-container.active { display: block; animation: fadeIn 0.25s ease; }
        @keyframes fadeIn { from { opacity:0; transform:translateY(6px); } to { opacity:1; transform:translateY(0); } }

        .exam-list-wrap { max-width: 600px; margin: 0 auto; padding: 12px 14px 80px; }

        /* Category Grid */
        .cat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 14px; }
        @media (min-width: 600px) { .cat-grid { grid-template-columns: 1fr 1fr 1fr; } }
        .cat-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 18px 12px; text-align: center;
            cursor: pointer; transition: all 0.2s ease;
            display: flex; flex-direction: column; align-items: center; gap: 6px;
            box-shadow: var(--shadow-sm);
        }
        .cat-card:hover { border-color: var(--accent); box-shadow: var(--shadow-glow), var(--shadow-sm); transform: translateY(-2px); }
        .cat-card.locked { opacity: 0.7; position: relative; }
        .cat-card.locked::after { content: '🔒'; position: absolute; top: 6px; right: 8px; font-size: 12px; }
        .cat-icon { font-size: 28px; }
        .cat-name { font-size: 12px; font-weight: 700; color: var(--text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .cat-count { font-size: 10px; color: var(--accent); font-weight: 600; background: var(--accent-light); padding: 2px 8px; border-radius: 10px; }

        /* List Items */
        .list-item {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-md); padding: 12px 14px; margin-bottom: 6px;
            cursor: pointer; display: flex; justify-content: space-between;
            align-items: center; transition: all 0.2s ease;
        }
        .list-item:hover { border-color: var(--accent); background: var(--card-hover); }
        .list-item.locked-exam { border-color: var(--warning); }
        .list-item.locked-exam .lock-badge {
            background: linear-gradient(135deg, #f59e0b, #d97706);
            color: #fff; font-size: 10px; font-weight: 700;
            padding: 3px 8px; border-radius: 20px; display: flex; align-items: center; gap: 3px;
        }
        .list-item-title { font-weight: 600; font-size: 13px; color: var(--text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .list-item-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .list-item-arrow { color: var(--accent); font-size: 16px; }

        /* Back Button */
        .back-btn {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 7px 14px; background: var(--btn-bg); border: 1px solid var(--border);
            border-radius: var(--radius-full); color: var(--text-secondary);
            font-size: 12px; font-weight: 600; cursor: pointer;
            transition: all 0.2s ease; margin-bottom: 12px;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .back-btn:hover { border-color: var(--accent); color: var(--accent); }

        /* Pre-Exam */
        .pre-exam-wrap { max-width: 600px; margin: 0 auto; padding: 12px 14px 80px; }
        .exam-hero { text-align: center; padding: 20px 14px; margin-bottom: 14px; }
        .exam-hero-title { font-size: 20px; font-weight: 800; color: var(--accent); margin-bottom: 12px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .exam-hero-stats { display: flex; justify-content: center; gap: 10px; flex-wrap: wrap; }
        .hero-stat {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius-sm); padding: 12px 16px;
            text-align: center; min-width: 75px; box-shadow: var(--shadow);
        }
        .hero-stat-val { font-size: 22px; font-weight: 800; color: var(--accent); }
        .hero-stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .pre-exam-card { background: var(--card-bg); border: 1px solid var(--border); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow-sm); }
        .info-row { display: flex; justify-content: space-between; padding: 7px 0; border-bottom: 1px solid var(--divider); font-size: 13px; }
        .info-row:last-child { border-bottom: none; }
        .info-label { color: var(--text-secondary); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .info-value { font-weight: 600; color: var(--text); }

        /* Pre-Exam Action Buttons */
        .pre-exam-actions { display: flex; gap: 8px; margin-bottom: 10px; }
        .btn-see-questions {
            flex: 1; padding: 12px; background: var(--card-bg); border: 1.5px solid var(--accent);
            border-radius: var(--radius-sm); color: var(--accent); font-size: 13px; font-weight: 700;
            cursor: pointer; text-align: center; transition: all 0.2s;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .btn-see-questions:hover { background: var(--accent); color: #fff; }

        /* Preview Mode */
        .preview-wrap { max-width: 600px; margin: 0 auto; padding: 12px 14px 80px; }
        .preview-exam-info {
            background: linear-gradient(135deg, var(--atlas-bg), var(--atlas-card));
            border: 1px solid var(--atlas-border); border-radius: var(--radius);
            padding: 12px 16px; margin-bottom: 14px; text-align: center;
        }
        .preview-exam-name { font-size: 15px; font-weight: 800; color: var(--atlas-text); margin-bottom: 4px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .preview-exam-meta { font-size: 11px; color: var(--atlas-text); opacity: 0.75; }

        /* Reveal Answers Floating Button */
        .reveal-fab {
            position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%);
            background: linear-gradient(135deg, var(--accent), #7c3aed);
            color: #fff; border: none; border-radius: 30px;
            padding: 12px 24px; font-size: 13px; font-weight: 700;
            cursor: pointer; z-index: 200; box-shadow: 0 4px 20px rgba(90,95,224,0.5);
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
            animation: revealPulse 2s infinite;
        }
        @keyframes revealPulse {
            0%,100% { box-shadow: 0 4px 20px rgba(90,95,224,0.5); transform: translateX(-50%) scale(1); }
            50% { box-shadow: 0 4px 30px rgba(90,95,224,0.8); transform: translateX(-50%) scale(1.03); }
        }
        .reveal-fab.revealed { background: linear-gradient(135deg, var(--success), #059669); animation: none; }

        /* Exam Hall */
        .exam-hall-wrap { max-width: 100%; margin: 0 auto; padding: 8px 0 100px; position: relative; }

        /* Exam Top Info Bar (req #14) */
        .exam-info-bar {
            background: var(--card-bg); border-bottom: 1px solid var(--border);
            padding: 8px 14px; text-align: center; font-size: 11px;
            color: var(--text-secondary); font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .exam-info-bar strong { color: var(--accent); font-size: 12px; }

        .timer-sticky {
            position: sticky; top: 56px; z-index: 100;
            background: var(--atlas-bg); border: 1px solid var(--atlas-border);
            border-radius: var(--radius-sm); padding: 10px 14px;
            display: flex; align-items: center; justify-content: space-between;
            margin-bottom: 12px; box-shadow: 0 2px 10px var(--atlas-glow);
        }
        .timer-text { font-size: 18px; font-weight: 800; color: var(--atlas-text); letter-spacing: 2px; font-variant-numeric: tabular-nums; }
        .timer-warning { color: var(--error) !important; animation: timerPulse 0.5s infinite; }
        @keyframes timerPulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }
        .progress-text { font-size: 12px; font-weight: 600; color: var(--atlas-text); opacity: 0.75; }

        /* Progress Bar (req #15) */
        .progress-bar-wrap { height: 4px; background: var(--border); margin: 0 14px 8px; border-radius: 2px; overflow: hidden; }
        .progress-bar-fill { height: 100%; background: linear-gradient(90deg, var(--accent), #7c3aed); transition: width 0.4s ease; border-radius: 2px; }

        .questions-area { width: 100%; padding: 0 14px 20px; }

        /* MCQ Card */
        .mcq-card {
            background: var(--card-bg); border: 1px solid var(--border);
            border-radius: var(--radius); padding: 16px; margin-bottom: 12px;
            box-shadow: var(--shadow-sm); width: 100%;
        }
        .q-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .q-number { font-size: 11px; color: var(--accent); font-weight: 700; background: var(--accent-light); padding: 3px 9px; border-radius: var(--radius-full); }
        .q-actions { display: flex; gap: 6px; }
        .icon-btn { background: none; border: 1px solid var(--border); font-size: 15px; cursor: pointer; padding: 4px 8px; border-radius: 6px; transition: 0.2s; opacity: 0.6; color: var(--text-secondary); }
        .icon-btn:hover { opacity: 1; border-color: var(--accent); }
        .icon-btn.bookmark.active { opacity: 1; color: var(--warning); border-color: var(--warning); }
        .icon-btn.ai-chat-btn { font-size: 13px; }
        .icon-btn.ai-chat-btn:hover { background: var(--accent); color: #fff; border-color: var(--accent); opacity: 1; }
        .q-text { font-size: 14px; font-weight: 600; margin-bottom: 12px; line-height: 1.7; color: var(--text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .q-text img { max-width: 100%; border-radius: 8px; margin: 6px 0; }

        /* Options */
        .option-item {
            display: flex; align-items: center; gap: 10px;
            padding: 11px 13px; margin-bottom: 7px;
            background-color: var(--option-bg); border: 1.5px solid var(--option-border);
            border-radius: var(--radius-sm); cursor: pointer;
            transition: all 0.18s ease; font-size: 13px;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif; color: var(--text);
        }
        .option-item:hover:not(.dimmed):not(.locked) { border-color: var(--accent); background: var(--option-selected-bg); }
        .option-item.selected { background-color: var(--option-selected-bg); border-color: var(--option-selected-border); cursor: default; }
        .option-item.dimmed { opacity: 0.35; cursor: not-allowed; pointer-events: none; }
        .option-item.correct-reveal { background-color: var(--success-light); border-color: var(--success); }
        .option-item.wrong-reveal { background-color: var(--error-light); border-color: var(--error); }
        .option-radio {
            width: 20px; height: 20px; border-radius: 50%;
            border: 2px solid var(--text-tertiary); display: flex;
            align-items: center; justify-content: center; flex-shrink: 0;
            font-size: 11px; font-weight: 700; color: var(--text-tertiary); transition: all 0.18s;
        }
        .option-item.selected .option-radio { border-color: var(--option-selected-border); background: var(--option-selected-border); color: #fff; }
        .option-item.correct-reveal .option-radio { border-color: var(--success); background: var(--success); color: #fff; }
        .option-item.wrong-reveal .option-radio { border-color: var(--error); background: var(--error); color: #fff; }
        .option-text { flex: 1; line-height: 1.5; }
        .option-text img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
        .lock-icon { margin-left: auto; font-size: 13px; color: var(--text-tertiary); }

        /* Q Status */
        .q-status { font-size: 12px; font-weight: 700; margin-bottom: 4px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .q-status.correct { color: var(--success); }
        .q-status.wrong { color: var(--error); }

        /* Explanation */
        .explanation-box { margin-top: 8px; border-radius: var(--radius-sm); overflow: hidden; }
        .csv-box { background: var(--card-hover); border-left: 3px solid var(--accent); padding: 10px 12px; font-size: 12px; line-height: 1.5; }
        .csv-box img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
        .exp-header { color: var(--accent); font-weight: 700; font-size: 11px; margin-bottom: 3px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .exp-content { font-size: 12px; line-height: 1.5; color: var(--text); }
        .exp-content img { max-width: 100%; border-radius: 8px; margin: 4px 0; }
        .ai-box { background: var(--card-bg); border: 1px solid var(--border); }
        .ai-box .exp-header { padding: 8px 12px; font-weight: 700; font-size: 11px; color: var(--accent); cursor: pointer; display: flex; justify-content: space-between; align-items: center; }
        .ai-box .exp-content { padding: 8px 12px; font-size: 12px; line-height: 1.5; color: var(--text); border-top: 1px solid var(--divider); display: none; }
        .ai-box .exp-content.show { display: block; animation: fadeIn 0.25s; }
        .exp-arrow { font-size: 10px; transition: 0.2s; }
        .exp-arrow.open { transform: rotate(180deg); }

        /* AI Chat Modal (req #1) */
        .ai-chat-overlay {
            position: fixed; inset: 0; background: var(--overlay); z-index: 500;
            display: none; align-items: flex-end; justify-content: center;
        }
        .ai-chat-overlay.active { display: flex; }
        .ai-chat-modal {
            width: 100%; max-width: 560px; max-height: 85vh;
            background: var(--card-bg); border-radius: var(--radius) var(--radius) 0 0;
            border: 1px solid var(--border); display: flex; flex-direction: column;
            animation: slideUp 0.3s ease;
        }
        @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }
        .ai-chat-header {
            padding: 14px 16px; border-bottom: 1px solid var(--border);
            display: flex; justify-content: space-between; align-items: center;
            background: linear-gradient(135deg, var(--atlas-bg), var(--atlas-card));
        }
        .ai-chat-title { font-size: 14px; font-weight: 700; color: var(--atlas-text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .ai-chat-close { background: none; border: none; color: var(--text-secondary); font-size: 18px; cursor: pointer; }
        .ai-chat-body { flex: 1; overflow-y: auto; padding: 14px; min-height: 200px; }
        .ai-chat-q { background: var(--card-hover); border-left: 3px solid var(--accent); padding: 10px 12px; border-radius: 6px; margin-bottom: 12px; font-size: 13px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; color: var(--text); }
        .ai-chat-response { font-size: 13px; line-height: 1.8; color: var(--text); font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .ai-loading { display: flex; gap: 6px; align-items: center; color: var(--accent); font-size: 12px; }
        .ai-loading span { display: inline-block; width: 8px; height: 8px; border-radius: 50%; background: var(--accent); animation: bounce 0.8s infinite; }
        .ai-loading span:nth-child(2) { animation-delay: 0.15s; }
        .ai-loading span:nth-child(3) { animation-delay: 0.3s; }
        @keyframes bounce { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-5px); } }
        .ai-chat-input-row { padding: 10px 14px; border-top: 1px solid var(--border); display: flex; gap: 8px; }
        .ai-chat-input { flex: 1; padding: 8px 12px; background: var(--option-bg); border: 1px solid var(--border); border-radius: 20px; color: var(--text); font-size: 12px; outline: none; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .ai-chat-send { padding: 8px 16px; background: var(--accent); color: #fff; border: none; border-radius: 20px; font-size: 12px; font-weight: 700; cursor: pointer; }

        /* Nav Fab */
        .nav-fab {
            position: fixed; right: 2px; top: 50%; transform: translateY(-50%);
            width: 38px; height: 38px; background: var(--accent); border: none;
            border-radius: 10px 0 0 10px; color: #fff; font-size: 15px;
            font-weight: 700; cursor: pointer; z-index: 101;
            box-shadow: 0 4px 12px var(--accent-glow);
            display: flex; align-items: center; justify-content: center;
        }

        /* Nav Popup */
        .nav-overlay { position: fixed; inset: 0; background: var(--overlay); z-index: 200; display: none; align-items: flex-end; }
        .nav-overlay.active { display: flex; }
        .nav-popup {
            width: 100%; max-width: 520px; margin: 0 auto;
            background: var(--card-bg); border-radius: var(--radius) var(--radius) 0 0;
            padding: 16px; border: 1px solid var(--border); animation: slideUp 0.2s ease;
            max-height: 80vh; overflow-y: auto;
        }
        .nav-popup-title { font-size: 14px; font-weight: 700; color: var(--accent); margin-bottom: 12px; text-align: center; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .nav-grid { display: grid; grid-template-columns: repeat(8, 1fr); gap: 5px; }
        @media (max-width: 480px) { .nav-grid { grid-template-columns: repeat(6, 1fr); } }
        .nav-num {
            aspect-ratio: 1; border-radius: 6px; background: var(--option-bg);
            border: 1px solid var(--border); color: var(--text-secondary);
            font-size: 11px; font-weight: 600; cursor: pointer;
            display: flex; align-items: center; justify-content: center; transition: all 0.2s;
        }
        .nav-num.answered { background: var(--accent); border-color: var(--accent); color: #fff; }
        .nav-num.correct { background: var(--success); border-color: var(--success); color: #fff; }
        .nav-num.wrong { background: var(--error); border-color: var(--error); color: #fff; }
        .nav-stats { text-align: center; margin-top: 8px; font-size: 10px; color: var(--text-secondary); }
        .nav-close { display: block; margin: 12px auto 0; padding: 8px 20px; background: var(--accent); color: #fff; border: none; border-radius: 8px; font-size: 12px; font-weight: 600; cursor: pointer; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }

        /* Submit Fixed */
        .submit-fixed {
            position: fixed; bottom: 0; left: 0; right: 0;
            background: var(--success); color: #fff; border: none;
            padding: 14px; font-size: 16px; font-weight: 700;
            cursor: pointer; z-index: 100; box-shadow: 0 -2px 16px var(--success-glow);
            transition: all 0.2s ease; font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
            text-align: center;
        }
        .submit-fixed:hover { filter: brightness(0.9); }

        /* Result Screen */
        .result-wrap { max-width: 600px; margin: 0 auto; padding: 14px 14px 90px; animation: fadeIn 0.3s ease; }
        .result-score-card {
            background: linear-gradient(140deg, var(--atlas-bg) 0%, var(--atlas-card) 100%);
            border: 1.5px solid var(--atlas-border); border-radius: var(--radius);
            padding: 24px 18px; text-align: center; margin-bottom: 14px;
            box-shadow: var(--shadow-md), 0 0 24px var(--atlas-glow); width: 100%;
        }
        .result-exam-name { font-size: 18px; font-weight: 800; color: #fff; margin-bottom: 12px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .result-big-score { font-size: 42px; font-weight: 900; color: var(--atlas-text); text-shadow: 0 0 20px var(--atlas-glow-strong); }
        .result-total { font-size: 14px; color: var(--atlas-text); opacity: 0.75; margin-top: 4px; }
        .result-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 14px 0; }
        .result-stat { background: var(--card-bg); border-radius: var(--radius-sm); padding: 12px 8px; text-align: center; border: 1px solid var(--border); width: 100%; }
        .result-stat-val { font-size: 18px; font-weight: 800; }
        .result-stat-label { font-size: 10px; color: var(--text-secondary); margin-top: 2px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .correct-val { color: var(--success); }
        .wrong-val { color: var(--error); }
        .skipped-val { color: var(--warning); }
        .gpa-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 14px; }
        .gpa-box { background: var(--card-bg); border: 1px solid var(--accent); border-radius: var(--radius); padding: 14px; text-align: center; box-shadow: var(--shadow-sm); width: 100%; }
        .gpa-box-title { font-size: 12px; font-weight: 700; color: var(--accent); margin-bottom: 6px; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .gpa-box-val { font-size: 30px; font-weight: 800; color: var(--accent); }
        .gpa-box-sub { font-size: 10px; color: var(--text-secondary); margin-top: 2px; }
        .deduction-note { font-size: 11px; color: var(--error); margin-bottom: 14px; text-align: center; font-family: 'Noto Sans Bengali', 'Inter', sans-serif; }
        .chart-wrap { width: 160px; height: 160px; margin: 0 auto 14px; }
        .chart-wrap canvas { width: 100%; height: 100%; }

        /* Result Action Buttons (req #2) */
        .result-actions { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .result-action-btn {
            flex: 1; min-width: 100px; padding: 10px 14px;
            border-radius: var(--radius-sm); border: 1px solid var(--border);
            background: var(--btn-bg); color: var(--text);
            font-size: 12px; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; text-align: center;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .result-action-btn:hover { border-color: var(--accent); color: var(--accent); }
        .result-action-btn.leaderboard-btn { border-color: var(--warning); color: var(--warning); }
        .result-action-btn.leaderboard-btn:hover { background: var(--warning); color: #fff; }

        .practice-actions { display: flex; gap: 8px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .practice-btn {
            flex: 1; min-width: 120px; padding: 12px; border-radius: var(--radius-sm);
            border: none; font-size: 13px; font-weight: 700; cursor: pointer;
            transition: all 0.2s ease; text-align: center;
            font-family: 'Noto Sans Bengali', 'Inter', sans-serif; color: #fff;
        }
        .btn-practice-again { background: var(--accent); }
        .btn-mistake-practice { background: var(--error); }
        .filter-bar { display: flex; gap: 6px; margin-bottom: 10px; justify-content: center; flex-wrap: wrap; }
        .filter-btn {
            padding: 6px 14px; border-radius: 20px; border: 1px solid var(--border);
            background: var(--card-bg); color: var(--text-secondary);
            cursor: pointer; font-size: 11px; font-weight: 600;
            transition: all 0.2s ease; font-family: 'Noto Sans Bengali', 'Inter', sans-serif;
        }
        .filter-btn.active { background: var(--accent); color: #fff; border-color: var(--accent); }
        .solve-item { margin-bottom: 12px; }

        /* Leaderboard Modal (req #2, #9) */
        .leaderboard-overlay {
            position: fixed; inset: 0; background: var(--overlay);
            z-index: 500; display: none; align-items: center; justify-content: center;
        }
        .leaderboard-overlay.active { display: flex; }
        .leaderboard-modal {

async function safeFetch(url, opts = {}) {
    opts.headers = Object.assign({ apikey: SUPABASE_KEY, Authorization: 'Bearer ' + SUPABASE_KEY }, opts.headers || {});
    if (!opts.headers['Content-Type'] && opts.method !== 'DELETE') opts.headers['Content-Type'] = 'application/json';
    try {
        const res = await fetch(url, opts);
        const text = await res.text();
        if (!res.ok) {
            let errMsg = '';
            try { errMsg = JSON.parse(text).message || ''; } catch(e) { errMsg = text.substring(0,100); }
            showError('⚠️ ডাটাবেজ সমস্যা', 'ডাটা লোড করতে সমস্যা হয়েছে।', `Status: ${res.status} | ${errMsg}`, () => safeFetch(url, opts));
            throw new Error(errMsg || `HTTP ${res.status}`);
        }
        if (!text?.trim()) return [];
        return JSON.parse(text);
    } catch(e) {
        if (e.message?.includes('Failed to fetch') || e.message?.includes('NetworkError')) {
            showError('🌐 নেটওয়ার্ক সমস্যা', 'ইন্টারনেট সংযোগ চেক করুন।', e.message, () => safeFetch(url, opts));
        }
        console.error('❌', e.message);
        return [];
    }
}

function switchMode(mode) {
    document.querySelectorAll('.mode-container').forEach(m => m.classList.remove('active'));
    const modeId = 'mode' + mode.charAt(0).toUpperCase() + mode.slice(1);
    document.getElementById(modeId)?.classList.add('active');
    const isHall = mode === 'Hall';
    const isPreview = mode === 'Preview';

    if (isHall) {
        document.getElementById('timerSticky').style.display = 'flex';
        document.getElementById('submitBtn').style.display = 'block';
        document.getElementById('navFab').style.display = 'flex';
        document.querySelector('.floating-buttons').style.display = 'none';
        document.querySelector('.bottom-nav').style.display = 'none';
    } else {
        stopTimer();
        document.getElementById('timerSticky').style.display = 'none';
        document.getElementById('submitBtn').style.display = 'none';
        document.getElementById('navFab').style.display = 'none';
        document.querySelector('.floating-buttons').style.display = isPreview ? 'none' : 'flex';
        document.querySelector('.bottom-nav').style.display = isPreview ? 'none' : 'flex';
    }
    window.scrollTo(0, 0);
}

function showExamList(data) {
    const grouped = {};
    data.forEach(e => { const s = e.subject || 'সাধারণ'; if (!grouped[s]) grouped[s] = []; grouped[s].push(e); });
    let html = '';
    Object.keys(grouped).forEach(s => {
        html += `<div style="font-size:12px;color:var(--accent);font-weight:700;margin:8px 0;">📘 ${s}</div>`;
        grouped[s].forEach(e => {
            let info = e.chapter || e.title || '—';
            const meta = [e.board, e.year, e.writer, e.unit].filter(Boolean).join(' | ');
            const isLocked = e.is_locked;
            if (isLocked) {
                html += `<div class="list-item locked-exam" onclick="showLockedExamBanner('${(e.title||info).replace(/'/g,'')}')">
                    <div>
                        <div class="list-item-title">🔒 ${info}</div>
                        <div class="list-item-sub">${meta ? meta + ' | ' : ''}${e.total_marks||0} প্রশ্ন</div>
                    </div>
                    <span class="lock-badge">🔒 Locked</span>
                </div>`;
            } else {
                html += `<div class="list-item" onclick="loadExamById(${e.id})">
                    <div>
                        <div class="list-item-title">📖 ${info}</div>
                        <div class="list-item-sub">${meta ? meta + ' | ' : ''}${e.total_marks||0} প্রশ্ন</div>
                    </div>
                    <span class="list-item-arrow">→</span>
                </div>`;
            }

    });
    document.getElementById('categoryContent').innerHTML = html || '<p style="text-align:center;color:var(--text-secondary);padding:20px;">কোনো এক্সাম নেই</p>';
    switchMode('Category');

// Load Exam by ID
async function loadExamById(examId) {
    try {
        const [examData] = await safeFetch(`${SUPABASE_URL}/rest/v1/exams?id=eq.${examId}&select=*`);
        if (!examData) { showToast('❌ এক্সাম পাওয়া যায়নি'); return; }
        if (examData.is_locked && !checkUserHasAccess()) { showLockedExamBanner(examData.title||examData.chapter); return; }
        currentExam = examData;
        examQuestions = await safeFetch(`${SUPABASE_URL}/rest/v1/questions?exam_id=eq.${examId}&select=*&order=id.asc`);
        if (!examQuestions?.length) { showNoQuestions(); return; }
        showPreExamFromData(currentExam, examQuestions);
    } catch(e) { showToast('❌ লোড করতে সমস্যা'); }
}

function toggleRevealAnswers() {
    previewRevealed = !previewRevealed;
    const fab = document.getElementById('revealFab');
    if (previewRevealed) {
        fab.textContent = '✅ উত্তর দেখানো হচ্ছে — ফিরে যান';
        fab.classList.add('revealed');
        // Reveal answers
        examQuestions.forEach(q => {
            [q.option1,q.option2,q.option3,q.option4,q.option5].forEach((_,oi) => {
                const el = document.getElementById(`preOpt${q.id}_${oi+1}`);
                if (!el) return;
                if (oi+1 === q.answer_index) el.classList.add('correct-reveal');
            });
            if (q.explanation) { const el = document.getElementById(`preExp${q.id}`); if (el) el.style.display = 'block'; }
            const aiBox = document.getElementById(`preAiBox${q.id}`); if (aiBox) aiBox.style.display = 'block';
        });
    } else {
        fab.textContent = '✨ উত্তর দেখো';
        fab.classList.remove('revealed');
        examQuestions.forEach(q => {
            [q.option1,q.option2,q.option3,q.option4,q.option5].forEach((_,oi) => {
                const el = document.getElementById(`preOpt${q.id}_${oi+1}`);
                if (!el) return;
                el.classList.remove('correct-reveal');
            });
            if (q.explanation) { const el = document.getElementById(`preExp${q.id}`); if (el) el.style.display = 'none'; }
            const aiBox = document.getElementById(`preAiBox${q.id}`); if (aiBox) aiBox.style.display = 'none';
        });
    }
}

            option1:q.option1||'', option2:q.option2||'', option3:q.option3||'',
            option4:q.option4||'', option5:q.option5||null,
            answer_index: parseInt(q.answer)||1, explanation:q.explanation||''
        }));
        currentExam = { title:m.subject_name||m.paper_name||'Model Test', subject:m.subject_name||'', chapter:m.paper_name||'', exam_type:'model', sub_type:m.sub_type, total_marks:examQuestions.length, duration_minutes:Math.ceil(examQuestions.length/1.5), id:'model_'+modelId, allow_preview:true };

async function openAIChat(qid) {
    if (!checkGuestAction()) return;
    aiChatQid = qid;
    aiChatHistory = [];
    const q = examQuestions.find(q => q.id === qid);
    if (!q) return;
    document.getElementById('aiChatOverlay').classList.add('active');
    const body = document.getElementById('aiChatBody');
    const opts = [q.option1,q.option2,q.option3,q.option4,q.option5].filter(o=>o&&o!=='—');
    const labels = ['ক','খ','গ','ঘ','ঙ'];
    let optHTML = opts.map((o,i) => `${labels[i]}) ${o}`).join('<br>');
    body.innerHTML = `<div class="ai-chat-q"><strong>📋 MCQ:</strong><br>${q.question_text}<br><br>${optHTML}</div>
        <div class="ai-loading"><span></span><span></span><span></span> &nbsp;AI বিশ্লেষণ করছে...</div>`;

    let prompt = `তুমি ATLAS APP এর একজন বিশেষজ্ঞ শিক্ষক। নিচের MCQ টি বিস্তারিতভাবে বাংলায় ব্যাখ্যা করো:\n\nপ্রশ্ন: ${q.question_text}\n\n`;
    opts.forEach((opt,i) => { prompt += `${labels[i]}) ${opt}\n`; });
    prompt += `\nসঠিক উত্তর: ${labels[q.answer_index-1]}) ${opts[q.answer_index-1]}\n\nবিষয়বস্তু:\n১. কেন ${labels[q.answer_index-1]} সঠিক (বিস্তারিত)\n২. প্রতিটি ভুল অপশন কেন ভুল\n৩. সম্পূর্ণ টপিক সারাংশ\n৪. মনে রাখার টিপস\n\nChatGPT এর মতো বিস্তারিত, সহজ বাংলায় উত্তর দাও।`;

    const answer = await callAIForMCQ(prompt);
    aiChatHistory.push({ role:'assistant', content:answer });
    body.innerHTML = `<div class="ai-chat-q"><strong>📋 MCQ:</strong><br>${q.question_text}<br><br>${optHTML}</div>
        <div class="ai-chat-response">${answer}</div>`;
}

async function sendAIChatMessage() {
    const input = document.getElementById('aiChatInput');
    const msg = input.value.trim();
    if (!msg) return;
    input.value = '';
    const q = examQuestions.find(q => q.id === aiChatQid);
    const body = document.getElementById('aiChatBody');
    body.innerHTML += `<div style="background:var(--accent-light);padding:8px 12px;border-radius:6px;margin:8px 0;font-size:12px;color:var(--accent);font-family:'Noto Sans Bengali','Inter',sans-serif;">👤 ${msg}</div>
        <div class="ai-loading"><span></span><span></span><span></span> &nbsp;উত্তর আসছে...</div>`;
    body.scrollTop = body.scrollHeight;
    aiChatHistory.push({ role:'user', content: msg });
    const opts = [q?.option1,q?.option2,q?.option3,q?.option4,q?.option5].filter(o=>o&&o!=='—');
    const context = `MCQ: ${q?.question_text||''}\nঅপশনস: ${opts.join(', ')}\n\nপ্রশ্ন: ${msg}`;
    const answer = await callAIForMCQ(context);
    aiChatHistory.push({ role:'assistant', content: answer });
    const loaders = body.querySelectorAll('.ai-loading');
    loaders.forEach(l => l.remove());
    body.innerHTML += `<div class="ai-chat-response" style="margin-top:6px;">${answer}</div>`;
    body.scrollTop = body.scrollHeight;
}

function loadBookmarks() {

function toggleBookmark(qid) {
    if (!checkGuestAction()) return;
    try {
        const sess = getSession(); if (!sess) return;
        if (bookmarkedQuestions[qid]) {
            delete bookmarkedQuestions[qid];
            document.getElementById('bmBtn'+qid)?.classList.remove('active');
            showToast('🔖 রিমুভ');
        } else {
            const q = examQuestions.find(q => q.id == qid);
            bookmarkedQuestions[qid] = {
                exam_name: currentExam?.title||(currentExam?.subject+' - '+currentExam?.chapter),
                subject: currentExam?.subject, chapter: currentExam?.chapter, category: currentExam?.exam_type,
                question_text: q.question_text, option1:q.option1, option2:q.option2, option3:q.option3,
                option4:q.option4, option5:q.option5, answer_index:q.answer_index, explanation:q.explanation,
                bookmarked_at: new Date().toISOString()
            };
            document.getElementById('bmBtn'+qid)?.classList.add('active');
            showToast('🔖 সেভ');
        }
        localStorage.setItem('bookmarks_' + sess.phone, JSON.stringify(bookmarkedQuestions));
    } catch(e) {}
}

function openReportModal(qid) { reportQid = qid; document.getElementById('reportModal').classList.add('active'); }
function closeReportModal() { document.getElementById('reportModal').classList.remove('active'); document.getElementById('reportType').value = ''; document.getElementById('reportSuggestion').value = ''; }
async function submitReport() {
    if (!checkGuestAction()) { closeReportModal(); return; }
    const type = document.getElementById('reportType').value;
    const suggestion = document.getElementById('reportSuggestion').value.trim();
    if (!type) { showToast('⚠️ ভুলের ধরন নির্বাচন করুন'); return; }
    const sess = getSession();
    const q = examQuestions.find(q => q.id == reportQid);
    try {
        await safeFetch(`${SUPABASE_URL}/rest/v1/question_reports`, {
            method: 'POST',
            body: JSON.stringify({
                question_id: reportQid, exam_id: currentExam?.id,
                exam_name: currentExam?.title||(currentExam?.subject+' - '+currentExam?.chapter),
                reporter_phone: sess?.phone||'anonymous', reporter_name: sess?.name||'Unknown',
                report_type: type, suggested_answer: suggestion,
                full_mcq: JSON.stringify(q), status: 'pending'
            })
        });

function submitExam(isAutoSubmit = false) {
    if (isExamSubmitted) return;
    if (!isAutoSubmit && !confirm('এক্সাম সাবমিট করবেন? ফেরত আসা যাবে না।')) return;
    isExamSubmitted = true; stopTimer();
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('navFab').style.display = 'none';
    switchMode('Result');

    let correct = 0, wrong = 0, skipped = 0;
    examQuestions.forEach(q => { const ua = userAnswers[q.id]; if (!ua) skipped++; else if (ua === q.answer_index) correct++; else wrong++; });
    const totalQ = examQuestions.length, negMark = wrong * 0.25;
    let finalScore = Math.max(0, correct - negMark);

    let gpaScore = 0, withGpa = finalScore, deduction = 0, isSecondTimer = false;
    try {
        const user = getSession();
        if (user) {
            const ssc = parseFloat(user.ssc_gpa)||0, hsc = parseFloat(user.hsc_gpa)||0;
            gpaScore = (ssc*8) + (hsc*12);
            if (user.timer_type === 'second') {
                isSecondTimer = true;
                deduction = totalQ <= 50 ? 1.5 : 3;
                finalScore = Math.max(0, finalScore - deduction);
            }
            withGpa = finalScore + gpaScore;
        }
    } catch(e) {}

    showResult(correct, wrong, skipped, negMark, finalScore, withGpa, gpaScore, deduction, isSecondTimer, totalQ);
    if (isLoggedIn() && !isMockTest) {
        saveResultToDB(correct, wrong, skipped, negMark, finalScore, gpaScore, withGpa, totalQ);
        saveLeaderboardEntry(correct, wrong, skipped, finalScore, totalQ);
    }
}

        </div>`;

        <button class="practice-btn btn-practice-again" onclick="retakeExam()">🔄 Practice Again</button>
        <button class="practice-btn btn-mistake-practice" onclick="mistakePractice()">❌ Mistake Practice</button>
    </div>`;

        <button class="filter-btn active" onclick="filterResult(event,'all')">সব</button>
        <button class="filter-btn" onclick="filterResult(event,'correct')">✅ সঠিক</button>
        <button class="filter-btn" onclick="filterResult(event,'wrong')">❌ ভুল</button>

    </div>`;

        const status = ua === q.answer_index ? 'correct' : (ua ? 'wrong' : 'skipped');

    // Draw pie chart
    setTimeout(() => {
        const canvas = document.getElementById('resultChart'); if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const total = correct + wrong + skipped || 1;
        const data = [correct/total, wrong/total, skipped/total];
        const colors = ['#22D47A', '#F87171', '#FBBF24'];
        let startAngle = -Math.PI/2;
        const cx = 80, cy = 80, r = 65;
        data.forEach((slice, i) => {
            const angle = slice * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(cx, cy);
            ctx.arc(cx, cy, r, startAngle, startAngle + angle);
            ctx.fillStyle = colors[i]; ctx.fill();
            startAngle += angle;
        });
        ctx.beginPath(); ctx.arc(cx, cy, 30, 0, Math.PI*2);
        ctx.fillStyle = getComputedStyle(document.body).getPropertyValue('--atlas-bg') || '#0A0D1E';
        ctx.fill();
    }, 300);
}

async function toggleAIBox(header, qid) {
    if (!checkGuestAction()) return;
    const content = header.nextElementSibling, arrow = header.querySelector('.exp-arrow');
    if (content.classList.contains('show')) { content.classList.remove('show'); arrow.classList.remove('open'); return; }
    const q = examQuestions.find(q => q.id === qid); if (!q) return;
    content.classList.add('show'); arrow.classList.add('open');
    if (content.innerHTML.trim()) return; // already loaded
    content.innerHTML = '<div class="ai-loading"><span></span><span></span><span></span> &nbsp;AI ব্যাখ্যা আনা হচ্ছে...</div>';
    const options = [q.option1,q.option2,q.option3,q.option4,q.option5].filter(o => o && o !== '—');
    const labels = ['ক','খ','গ','ঘ','ঙ'];
    let prompt = `তুমি শিক্ষক। MCQ বিশ্লেষণ করো:\n\nপ্রশ্ন: ${q.question_text}\n\n`;
    options.forEach((opt,i) => { prompt += `${labels[i]}) ${opt}\n`; });
    prompt += `\nসঠিক উত্তর: ${labels[q.answer_index-1]}) ${options[q.answer_index-1]}\n\nপ্রতিটি অপশন ব্যাখ্যা করো। ✅ কেন সঠিক, ❌ কেন ভুল। বাংলায়। সংক্ষেপে।`;
    content.innerHTML = await callAIForMCQ(prompt);
}

// ============================================================
// AI CALL — Multiple Models Fallback
// ============================================================
async function callAIForMCQ(prompt) {
    for (const model of AI_MODELS) {
        try {
            let answer;
            if (model.provider === 'groq') {
                const res = await fetch('https://api.groq.com/openai/v1/chat/completions', {
                    method: 'POST',
                    headers: { 'Authorization': 'Bearer ' + model.key, 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        model: model.model,
                        messages: [
                            { role:'system', content:'তুমি ATLAS APP এর বিশেষজ্ঞ শিক্ষক। বাংলায় উত্তর দিবে। বিস্তারিত ও সহজ ভাষায়।' },
                            { role:'user', content:prompt }
                        ],
                        temperature: 0.7, max_tokens: 1024
                    })
                });
                const data = await res.json();
                answer = data.choices?.[0]?.message?.content;
            } else {
                const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/${model.model}:generateContent?key=${model.key}`, {
                    method: 'POST', headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });
                const data = await res.json();
                answer = data.candidates?.[0]?.content?.parts?.[0]?.text;
            }
            if (answer && !answer.includes('error') && !answer.includes('rate_limit')) {
                return answer.replace(/\n/g, '<br>');
            }
        } catch(e) { continue; }
    }
    return '❌ AI ব্যাখ্যা পাওয়া যায়নি। পরে চেষ্টা করুন।';
}

    for (let page = 0; page < totalPages; page++) {
        const start = page * 8;
        const pageQs = examQuestions.slice(start, Math.min(start+8, examQuestions.length));
        html += `<div class="page">`;

        if (page === 0) {
            html += `<div class="pdf-header">
                <div class="pdf-header-left">
                    <h1>📚 ATLAS APP</h1>
                    <p>Solve Sheet — ${examName}</p>
                    <p style="margin-top:2px;">${sess?.name||'শিক্ষার্থী'} &nbsp;|&nbsp; ${new Date().toLocaleDateString('bn-BD')}</p>
                </div>
                <div class="pdf-header-right">
                    <div class="score-big">${score}</div>
                    <div class="score-label">/ ${examQuestions.length} নম্বর</div>
                </div>
            </div>
            <div class="summary-bar">
                <div class="summary-item"><div class="summary-val s-correct">✅ ${correct}</div><div class="summary-lbl">সঠিক</div></div>
                <div class="summary-item"><div class="summary-val s-wrong">❌ ${wrong}</div><div class="summary-lbl">ভুল</div></div>
                <div class="summary-item"><div class="summary-val s-skip">⏭️ ${skipped}</div><div class="summary-lbl">স্কিপ</div></div>
                <div class="summary-item"><div class="summary-val s-neg">-${(wrong*0.25).toFixed(2)}</div><div class="summary-lbl">নেগেটিভ</div></div>
            </div>`;
        }

        html += `<div class="page-banner"><span>📖 ${examName}</span><span>পৃষ্ঠা ${page+1}/${totalPages} &nbsp;|&nbsp; প্রশ্ন ${start+1}–${Math.min(start+8,examQuestions.length)}</span></div>`;
        html += `<div class="mcq-grid">`;

        pageQs.forEach((q, idx) => {
            const qNum = start + idx + 1;
            const ua = userAnswers[q.id];
            const status = ua === q.answer_index ? 'correct' : (ua ? 'wrong' : 'skip');
            const badgeText = status==='correct'?'✅ সঠিক':status==='wrong'?'❌ ভুল':'⏭️ স্কিপ';
            html += `<div class="mcq-card card-${status}">
                <span class="mcq-status-badge badge-${status}">${badgeText}</span>
                <span class="q-num">Q${qNum}</span>
                <div class="q-text">${q.question_text}</div>`;
            [q.option1,q.option2,q.option3,q.option4,q.option5].forEach((opt,oi) => {
                if (opt && opt !== '—') {
                    let cls = oi+1===q.answer_index?'opt-correct':oi+1===ua&&ua!==q.answer_index?'opt-wrong':'';
                    html += `<div class="opt ${cls}"><span class="opt-label">${['ক','খ','গ','ঘ','ঙ'][oi]})</span><span>${opt}</span>${oi+1===q.answer_index?' ✅':oi+1===ua&&ua!==q.answer_index?' ❌':''}</div>`;
                }
            });
            if (q.explanation) html += `<div class="exp-box"><strong>💡 ব্যাখ্যা</strong>${q.explanation}</div>`;
            html += `</div>`;
        });

        html += `</div>`;
        html += `<div class="pdf-footer">ATLAS APP © 2026 | atlasprep.pages.dev | পৃষ্ঠা ${page+1}/${totalPages}</div>`;
        html += `</div>`;
    }
    html += `<button class="print-btn" onclick="window.print()">📥 PDF হিসেবে ডাউনলোড / প্রিন্ট</button></body></html>`;
    w.document.write(html); w.document.close();
}

// ============================================================
// ERROR HANDLER
// ============================================================
function showError(title, message, details, retryFn) {
    const existing = document.querySelector('.error-popup-overlay');
    if (existing) existing.remove();
    const overlay = document.createElement('div');
    overlay.className = 'error-popup-overlay';
    let retryHTML = '';
    if (retryFn) retryHTML = `<button class="error-popup-retry" onclick="this.closest('.error-popup-overlay').remove();(${retryFn.toString()})();">🔄 আবার চেষ্টা</button>`;
    overlay.innerHTML = `<div class="error-popup" onclick="event.stopPropagation()">
        <div class="error-popup-icon">⚠️</div>
        <div class="error-popup-title">${title||'কিছু সমস্যা হয়েছে'}</div>
        <div class="error-popup-message">${message||'পরে আবার চেষ্টা করুন'}</div>
        ${details?`<div class="error-popup-details">${details}</div>`:''}
        <div style="display:flex;justify-content:center;gap:8px;">
            ${retryHTML}
            <button class="error-popup-btn" onclick="this.closest('.error-popup-overlay').remove()">✕ বন্ধ</button>
        </div>
    </div>`;
    overlay.addEventListener('click', e => { if (e.target === overlay) overlay.remove(); });
    document.body.appendChild(overlay);
}

window.addEventListener('error', e => { showError('💥 অপ্রত্যাশিত সমস্যা', 'পৃষ্ঠাটি রিলোড করুন।', e.error?.message, () => location.reload()); });
window.addEventListener('unhandledrejection', e => { showError('⚠️ প্রসেসিং সমস্যা', 'অনুরোধ সম্পূর্ণ করা যায়নি।', e.reason?.message, null); });

// ============================================================
// SAFETY (req #16: auto submit)
// ============================================================
window.addEventListener('beforeunload', e => { if (!isExamSubmitted && examSeconds > 0 && examSeconds < totalSeconds) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('popstate', e => { if (!isExamSubmitted && examSeconds > 0 && examSeconds < totalSeconds) { if (!confirm('⚠️ এক্সাম ছেড়ে যাবেন?')) { history.pushState(null,'',location.href); } } });

// ============================================================
// INIT
// ============================================================
document.addEventListener('DOMContentLoaded', () => {
    if (isAdmin() || isSubAdmin()) {
        document.getElementById('adminSidebarBtn').style.display = 'flex';
    }
    if (localStorage.getItem('atlas-theme') === 'light') {
        isDarkMode = false;
        document.body.classList.remove('dark-mode');
        document.body.classList.add('light-mode');
        document.getElementById('themeToggle').textContent = '🌙';
    }

    const params = new URLSearchParams(location.search);
    const examId = params.get('id');
    const cat    = params.get('cat');
    const mock   = params.get('mock');
    const model  = params.get('model');

    if (examId)           { loadExamById(examId); }
    else if (mock==='true') { startMockTest(); }
    else if (model)       { startModelExam(model); }
    else if (cat==='model') { const sub = params.get('sub') || ''; loadModelExams('medical', sub); }
    else if (cat)         { showCategory(cat); }
    else                  { loadCategoryCounts();}
});
history.pushState(null, '', location.href);
window.addEventListener('popstate', () => history.back());
</script>
