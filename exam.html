<!DOCTYPE html>
<html lang="bn">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ATLAS EXAM · এক্সাম</title>
    <style>
        :root {
            --bg: #0D1117; --card: #161B22; --hover: #1C2129;
            --text: #E6EDF3; --text2: #8B949E;
            --accent: #7C83FF; --accent-hover: #9499FF;
            --border: #30363D; --shadow: 0 2px 8px rgba(0,0,0,0.3);
            --glow: 0 0 0 2px rgba(124,131,255,0.12);
            --radius: 14px; --radius-sm: 10px;
            --red: #F85149; --green: #3FB950; --yellow: #D29922;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Inter', 'Noto Sans Bengali', system-ui, sans-serif;
            background: var(--bg); color: var(--text);
            min-height: 100vh; padding: 56px 0 70px;
            -webkit-font-smoothing: antialiased;
        }
        .header { position:fixed;top:0;left:0;right:0;height:56px;background:var(--card);border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;padding:0 14px;z-index:100; }
        .hamburger{background:none;border:none;color:var(--text);font-size:22px;cursor:pointer;padding:6px;}
        .logo{font-size:20px;font-weight:800;color:var(--accent);letter-spacing:-1px;}
        .header-icon{background:var(--card);border:1px solid var(--border);color:var(--text);width:36px;height:36px;border-radius:50%;font-size:16px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;}
        .header-icon:hover{border-color:var(--accent);box-shadow:var(--glow);}
        
        .sidebar-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:200;opacity:0;visibility:hidden;transition:0.2s;}
        .sidebar-overlay.active{opacity:1;visibility:visible;}
        .sidebar{position:fixed;top:0;left:-280px;width:280px;height:100%;background:var(--card);z-index:201;overflow-y:auto;transition:0.2s;border-right:1px solid var(--border);}
        .sidebar.active{left:0;}
        .sidebar-header{background:var(--card);padding:20px 16px;text-align:center;border-bottom:1px solid var(--border);}
        .sidebar-logo{font-size:20px;font-weight:800;color:var(--accent);}
        .sidebar-item{display:flex;align-items:center;gap:10px;padding:12px 18px;color:var(--text2);border:none;background:none;width:100%;text-align:left;font-size:14px;cursor:pointer;transition:0.2s;font-family:inherit;}
        .sidebar-item:hover{background:var(--hover);color:var(--text);}
        .sidebar-divider{height:1px;background:var(--border);margin:8px 0;}
        
        .bottom-nav{position:fixed;bottom:0;left:0;right:0;height:60px;background:var(--card);border-top:1px solid var(--border);display:flex;align-items:center;justify-content:space-around;z-index:100;}
        .nav-item{display:flex;flex-direction:column;align-items:center;gap:2px;background:none;border:none;color:var(--text2);font-size:10px;cursor:pointer;padding:6px 10px;border-radius:8px;transition:0.2s;font-family:inherit;}
        .nav-item.active{color:var(--accent);}
        .nav-item .nav-icon{font-size:20px;}
        
        .floating-buttons{position:fixed;bottom:80px;right:16px;display:flex;flex-direction:column;gap:8px;z-index:99;}
        .fab{width:42px;height:42px;border-radius:50%;border:none;font-size:18px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;transition:0.2s;box-shadow:var(--shadow);}
        .fab-wa{background:#25D366;}.fab-wa:hover{transform:scale(1.08);}
        .fab-tg{background:#0088CC;}.fab-tg:hover{transform:scale(1.08);}
        .toast{position:fixed;top:70px;left:50%;transform:translateX(-50%);background:var(--card);color:var(--text);border:1px solid var(--accent);padding:10px 20px;border-radius:20px;font-size:13px;font-weight:600;z-index:999;opacity:0;transition:0.2s;pointer-events:none;}
        .toast.show{opacity:1;}
        
        .mode-container{display:none;}
        .mode-container.active{display:block;animation:fadeIn 0.25s;}
        @keyframes fadeIn{from{opacity:0;transform:translateY(4px);}to{opacity:1;transform:translateY(0);}}
        
        .section-header{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px;margin-bottom:12px;text-align:center;box-shadow:var(--shadow);}
        .section-title{color:var(--accent);font-size:17px;font-weight:700;}
        .section-subtitle{font-size:11px;color:var(--text2);margin-top:2px;}
        
        .exam-list-wrap{max-width:600px;margin:0 auto;padding:12px 14px 80px;}
        .cat-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px;}
        .cat-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:16px;text-align:center;cursor:pointer;transition:0.2s;}
        .cat-card:hover{border-color:var(--accent);box-shadow:var(--glow);transform:translateY(-2px);}
        .cat-icon{font-size:28px;display:block;margin-bottom:6px;}
        .cat-name{font-size:12px;font-weight:600;color:var(--text);}
        
        .list-item{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 14px;margin-bottom:6px;cursor:pointer;display:flex;justify-content:space-between;align-items:center;transition:0.2s;}
        .list-item:hover{border-color:var(--accent);background:var(--hover);}
        .list-item-title{font-weight:600;font-size:13px;}
        .list-item-sub{font-size:10px;color:var(--text2);}
        .list-item-arrow{color:var(--accent);font-size:16px;}
        
        .back-btn{background:none;border:1px solid var(--border);color:var(--text2);padding:7px 14px;border-radius:6px;cursor:pointer;font-size:12px;margin-bottom:10px;font-family:inherit;transition:0.2s;}
        .back-btn:hover{border-color:var(--accent);color:var(--text);}
        
        .btn{display:inline-block;padding:10px 18px;border-radius:var(--radius-sm);font-weight:600;cursor:pointer;border:none;font-size:13px;transition:0.2s;font-family:inherit;text-align:center;}
        .btn-primary{background:var(--accent);color:#fff;width:100%;}
        .btn-primary:hover{background:var(--accent-hover);}
        .btn-success{background:var(--green);color:#fff;width:100%;}
        .btn-outline{background:transparent;border:1px solid var(--border);color:var(--text2);}
        .btn-outline:hover{border-color:var(--accent);color:var(--text);}
        
        .pre-exam-wrap{max-width:600px;margin:0 auto;padding:12px 14px 80px;}
        .exam-hero{text-align:center;padding:20px 14px;margin-bottom:14px;}
        .exam-hero-title{font-size:20px;font-weight:800;color:var(--accent);margin-bottom:12px;}
        .exam-hero-stats{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;}
        .hero-stat{background:var(--card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:12px 16px;text-align:center;min-width:75px;box-shadow:var(--shadow);}
        .hero-stat-val{font-size:22px;font-weight:800;color:var(--accent);}
        .hero-stat-label{font-size:10px;color:var(--text2);margin-top:2px;}
        .pre-exam-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:14px;}
        .info-row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border);font-size:13px;}
        .info-label{color:var(--text2);}.info-value{font-weight:600;}
        
        /* Exam Hall */
        .exam-hall-wrap{position:relative;padding-bottom:100px;}
        .timer-sticky{position:sticky;top:56px;background:var(--card);border-bottom:1px solid var(--border);padding:10px 14px;display:flex;justify-content:center;gap:20px;z-index:50;font-weight:700;}
        .timer-text{color:var(--accent);font-size:20px;font-family:monospace;}
        .timer-warning{color:var(--red)!important;animation:pulse 0.5s infinite;}
        @keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
        .progress-text{color:var(--green);font-size:13px;}
        
        .questions-area{width:100%;padding:14px;}
        .mcq-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;margin-bottom:12px;box-shadow:var(--shadow);}
        .q-header{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;}
        .q-number{font-size:11px;color:var(--accent);font-weight:700;}
        .q-actions{display:flex;gap:6px;}
        .icon-btn{background:none;border:1px solid var(--border);font-size:15px;cursor:pointer;padding:4px 8px;border-radius:6px;transition:0.2s;opacity:0.6;}
        .icon-btn:hover{opacity:1;border-color:var(--accent);}
        .icon-btn.bookmark.active{opacity:1;color:var(--yellow);}
        .q-text{font-size:14px;font-weight:600;margin-bottom:12px;line-height:1.5;}
        .q-text img,.option-text img,.exp-content img{max-width:100%;border-radius:8px;margin:6px 0;}
        .option-item{display:flex;align-items:center;gap:8px;padding:10px 12px;margin-bottom:6px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-sm);cursor:pointer;font-size:13px;transition:0.2s;}
        .option-item:hover:not(.dimmed):not(.locked){border-color:var(--accent);}
        .option-item.selected{background:rgba(124,131,255,0.1);border-color:var(--accent);opacity:1;cursor:default;}
        .option-item.dimmed{opacity:0.35;cursor:not-allowed;pointer-events:none;}
        .option-item.correct-reveal{background:rgba(63,185,80,0.1);border-color:var(--green);}
        .option-item.wrong-reveal{background:rgba(248,81,73,0.1);border-color:var(--red);}
        .option-radio{width:22px;height:22px;border-radius:50%;border:2px solid var(--text2);display:flex;align-items:center;justify-content:center;flex-shrink:0;font-size:11px;font-weight:700;color:var(--text2);}
        .option-item.selected .option-radio{border-color:var(--accent);background:var(--accent);color:#fff;}
        .option-item.correct-reveal .option-radio{border-color:var(--green);background:var(--green);color:#fff;}
        .option-item.wrong-reveal .option-radio{border-color:var(--red);background:var(--red);color:#fff;}
        .option-text{flex:1;}
        .lock-icon{margin-left:auto;font-size:13px;color:var(--accent);}
        .q-status{font-size:12px;font-weight:700;margin-bottom:4px;}
        .q-status.correct{color:var(--green);}.q-status.wrong{color:var(--red);}
        
        .explanation-box{margin-top:8px;border-radius:var(--radius-sm);overflow:hidden;}
        .csv-box{background:var(--hover);border-left:3px solid var(--accent);padding:10px 12px;font-size:12px;line-height:1.5;}
        .csv-box .exp-header{color:var(--accent);font-weight:700;font-size:11px;margin-bottom:3px;}
        .ai-box{background:var(--card);border:1px solid var(--border);}
        .ai-box .exp-header{padding:8px 12px;font-weight:700;font-size:11px;color:var(--accent);cursor:pointer;display:flex;justify-content:space-between;align-items:center;}
        .ai-box .exp-content{padding:8px 12px;font-size:12px;line-height:1.5;color:var(--text);border-top:1px solid var(--border);display:none;}
        .ai-box .exp-content.show{display:block;animation:fadeIn 0.25s;}
        .exp-arrow{font-size:10px;transition:0.2s;}
        .exp-arrow.open{transform:rotate(180deg);}
        
        .nav-fab{position:fixed;right:2px;top:50%;transform:translateY(-50%);width:38px;height:38px;background:var(--accent);border:none;border-radius:10px 0 0 10px;color:#fff;font-size:15px;font-weight:700;cursor:pointer;z-index:101;box-shadow:0 4px 12px rgba(124,131,255,0.3);display:flex;align-items:center;justify-content:center;}
        .nav-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:200;display:none;align-items:center;justify-content:center;}
        .nav-overlay.active{display:flex;}
        .nav-popup{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-width:420px;width:94%;max-height:80vh;overflow-y:auto;}
        .nav-popup-title{text-align:center;font-size:15px;font-weight:700;color:var(--accent);margin-bottom:12px;}
        .nav-grid{display:grid;grid-template-columns:repeat(8,1fr);gap:5px;}
        .nav-num{aspect-ratio:1;border-radius:6px;background:var(--bg);border:1px solid var(--border);color:var(--text2);font-size:11px;font-weight:600;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:0.2s;}
        .nav-num.answered{background:var(--accent);border-color:var(--accent);color:#fff;}
        .nav-num.correct{background:var(--green);border-color:var(--green);color:#fff;}
        .nav-num.wrong{background:var(--red);border-color:var(--red);color:#fff;}
        .nav-close{display:block;margin:12px auto 0;padding:8px 20px;background:var(--accent);color:#fff;border:none;border-radius:8px;font-size:12px;font-weight:600;cursor:pointer;font-family:inherit;}
        
        .submit-fixed{position:fixed;bottom:70px;left:50%;transform:translateX(-50%);background:var(--green);color:#fff;border:none;padding:12px 36px;border-radius:30px;font-size:15px;font-weight:700;cursor:pointer;z-index:100;box-shadow:0 4px 16px rgba(63,185,80,0.4);transition:0.2s;}
        .submit-fixed:hover{box-shadow:0 6px 20px rgba(63,185,80,0.6);transform:translateX(-50%) translateY(-2px);}
        
        /* Result */
        .result-wrap{max-width:600px;margin:0 auto;padding:14px 14px 90px;}
        .result-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:18px;margin-bottom:12px;text-align:center;box-shadow:var(--shadow);}
        .result-big{font-size:42px;font-weight:800;color:var(--accent);}
        .result-score-format{font-size:16px;color:var(--text2);}
        .result-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin:12px 0;}
        .result-stat{background:var(--bg);padding:10px;border-radius:var(--radius-sm);text-align:center;border:1px solid var(--border);}
        .result-stat-val{font-size:22px;font-weight:700;}
        .result-stat-label{font-size:10px;color:var(--text2);}
        .correct-val{color:var(--green);}.wrong-val{color:var(--red);}.skipped-val{color:var(--yellow);}
        .gpa-box{background:var(--card);border:1px solid var(--accent);border-radius:var(--radius);padding:14px;text-align:center;box-shadow:var(--shadow);}
        .gpa-box-title{font-size:12px;font-weight:700;color:var(--accent);margin-bottom:6px;}
        .gpa-box-val{font-size:30px;font-weight:800;color:var(--accent);}
        .deduction-note{font-size:11px;color:var(--red);margin-top:6px;text-align:center;}
        
        .filter-bar{display:flex;gap:6px;margin-bottom:10px;flex-wrap:wrap;}
        .filter-btn{padding:6px 14px;border-radius:20px;border:1px solid var(--border);background:var(--card);color:var(--text2);cursor:pointer;font-size:11px;font-weight:600;transition:0.2s;font-family:inherit;}
        .filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent);}
        
        .chart-wrap{width:140px;height:140px;margin:0 auto 10px;position:relative;}
        .chart-wrap canvas{width:100%;height:100%;}
        
        .result-actions-top{display:flex;justify-content:flex-end;gap:6px;margin-bottom:8px;}
        .result-action-btn{padding:7px 14px;border-radius:20px;font-size:11px;font-weight:700;cursor:pointer;border:none;transition:0.2s;font-family:inherit;animation:bounceIn 0.4s;}
        @keyframes bounceIn{0%{transform:scale(0)}50%{transform:scale(1.1)}100%{transform:scale(1)}}
        .btn-pdf{background:var(--red);color:#fff;}
        .btn-solve{background:var(--accent);color:#fff;}
        .practice-btns{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px;}
        .btn-practice{padding:12px;border-radius:var(--radius-sm);font-size:13px;font-weight:700;cursor:pointer;border:none;transition:0.2s;font-family:inherit;text-align:center;}
        .btn-practice-again{background:var(--accent);color:#fff;}
        .btn-mistake-practice{background:var(--red);color:#fff;}
        
        .modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.7);z-index:300;display:none;align-items:center;justify-content:center;}
        .modal-overlay.active{display:flex;}
        .modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;max-width:420px;width:94%;max-height:80vh;overflow-y:auto;}
        .modal-title{font-size:16px;font-weight:700;color:var(--accent);margin-bottom:12px;text-align:center;}
        .modal .input-group{margin-bottom:8px;}
        .modal .input-group label{display:block;font-size:10px;font-weight:600;color:var(--text2);margin-bottom:2px;}
        .modal .input-group select,.modal .input-group textarea{width:100%;padding:8px 10px;border:1px solid var(--border);border-radius:6px;background:var(--bg);color:var(--text);font-size:12px;font-family:inherit;}
        .modal-btns{display:flex;gap:6px;justify-content:flex-end;margin-top:10px;}
        .btn-cancel{background:var(--bg);color:var(--text2);border:1px solid var(--border);padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;}
        .btn-submit-modal{background:var(--red);color:#fff;border:none;padding:8px 16px;border-radius:6px;cursor:pointer;font-size:12px;font-family:inherit;}
        
        .mock-options{display:grid;grid-template-columns:1fr 1fr;gap:8px;}
        .mock-option-btn{padding:14px;background:var(--card);color:var(--text);border:1px solid var(--border);border-radius:var(--radius-sm);font-size:14px;font-weight:700;cursor:pointer;text-align:center;transition:0.2s;}
        .mock-option-btn:hover{border-color:var(--accent);}
        
        @media(max-width:480px){.nav-grid{grid-template-columns:repeat(6,1fr);}}
    </style>
</head>
<body>

<!-- Sidebar + Header + Bottom Nav same as index.html -->
<div class="sidebar-overlay" id="sidebarOverlay" onclick="closeSidebar()"></div>
<aside class="sidebar" id="sidebar">
    <div class="sidebar-header"><div class="sidebar-logo">ATLAS EXAM</div></div>
    <button class="sidebar-item" onclick="navigateTo('profile');closeSidebar();">👤 প্রোফাইল</button>
    <button class="sidebar-item" onclick="goTo('index.html');closeSidebar();">🏠 হোম</button>
    <button class="sidebar-item" onclick="goTo('class.html');closeSidebar();">📚 ফ্রি ক্লাস</button>
    <button class="sidebar-item" onclick="goTo('exam.html');closeSidebar();">📝 ফ্রি এক্সাম</button>
    <button class="sidebar-item" onclick="goTo('mock-test.html');closeSidebar();">🎯 মক টেস্ট</button>
    <button class="sidebar-item" onclick="goTo('dashboard.html');closeSidebar();">⚠️ My Mistakes</button>
    <button class="sidebar-item" onclick="goTo('ai.html');closeSidebar();">🤖 ATLAS AI</button>
    <div class="sidebar-divider"></div>
    <button class="sidebar-item" onclick="toggleTheme()">🌙 ডার্ক মোড</button>
    <button class="sidebar-item" onclick="openWA()">💬 WhatsApp</button>
    <button class="sidebar-item" onclick="openTG()">✈️ Telegram</button>
</aside>

<header class="header">
    <div style="display:flex;align-items:center;gap:10px;"><button class="hamburger" onclick="toggleSidebar()">☰</button><span class="logo">ATLAS EXAM</span></div>
    <div style="display:flex;gap:6px;"><button class="header-icon" onclick="toggleTheme()">🌙</button><button class="header-icon" onclick="goTo('auth.html')">👤</button></div>
</header>

<main>

<!-- MODE 1: Exam List -->
<div class="mode-container active" id="modeList"><div class="exam-list-wrap">
    <div class="section-header"><div class="section-title">📝 ফ্রি এক্সাম সেকশন</div><div class="section-subtitle">আপনার প্রস্তুতির জন্য সেরা এক্সাম</div></div>
    <div class="cat-grid">
        <div class="cat-card" onclick="showCategory('board')"><span class="cat-icon">🔵</span><span class="cat-name">বোর্ড প্রস্তুতি</span></div>
        <div class="cat-card" onclick="showCategory('medical')"><span class="cat-icon">🟢</span><span class="cat-name">মেডিকেল+ডেন্টাল</span></div>
        <div class="cat-card" onclick="showCategory('varsity')"><span class="cat-icon">🟣</span><span class="cat-name">ভার্সিটি প্রস্তুতি</span></div>
        <div class="cat-card" onclick="showCategory('onushiloni')"><span class="cat-icon">🟠</span><span class="cat-name">অনুশীলনী এক্সাম</span></div>
    </div>
    <div class="section-header"><div class="section-title">🎯 আনলিমিটেড মক টেস্ট</div></div>
    <button class="btn btn-primary" onclick="startMockTest()" style="background:var(--card);color:var(--accent);border:1px solid var(--border);">🎯 মক টেস্ট শুরু করুন</button>
    <div id="savedExamsList" style="margin-top:12px;"></div>
</div></div>

<!-- MODE 2: Category -->
<div class="mode-container" id="modeCategory"><div class="exam-list-wrap"><button class="back-btn" onclick="backToList()">← ফিরে যান</button><div id="categoryContent"></div></div></div>

<!-- MODE 3: Pre-Exam -->
<div class="mode-container" id="modePreExam"><div class="pre-exam-wrap"><button class="back-btn" onclick="backToCategory()">← ফিরে যান</button><div id="preExamContent"></div><button class="btn btn-success" id="startExamBtn" onclick="startExamHall()">▶️ এক্সাম শুরু করুন</button></div></div>

<!-- MODE 4: Exam Hall -->
<div class="mode-container" id="modeHall"><div class="exam-hall-wrap">
    <div class="timer-sticky" id="timerSticky"><span class="timer-text" id="timerText">৬০:০০</span><span class="progress-text" id="progressText">📈 ০%</span></div>

// ========== SUBMIT & RESULT ==========
function submitExam() {
    if (isExamSubmitted) return;
    if (!confirm('এক্সাম সাবমিট করবেন? ফেরত আসা যাবে না।')) return;
    isExamSubmitted = true; stopTimer();
    document.getElementById('submitBtn').style.display = 'none';
    document.getElementById('navFab').style.display = 'none';
    switchMode('Result');
    
    let correct = 0, wrong = 0, skipped = 0;
    examQuestions.forEach(q => { const ua = userAnswers[q.id]; if (!ua) skipped++; else if (ua === q.answer_index) correct++; else wrong++; });
    const totalQ = examQuestions.length, negMark = wrong * 0.25;
    let finalScore = correct - negMark; if (finalScore < 0) finalScore = 0;
    
    let gpaScore = 0, withGpa = finalScore, deduction = 0, isSecondTimer = false;
    try { const user = JSON.parse(localStorage.getItem('atlas-session')); if (user) { const ssc = parseFloat(user.ssc_gpa)||0, hsc = parseFloat(user.hsc_gpa)||0; gpaScore = (ssc*8)+(hsc*12); if (user.timer_type === 'second') { isSecondTimer = true; deduction = (currentExam?.total_marks||totalQ) <= 50 ? 1.5 : 3; finalScore -= deduction; if (finalScore < 0) finalScore = 0; } withGpa = finalScore + gpaScore; } } catch(e) {}
    
    showResult(correct, wrong, skipped, negMark, finalScore, withGpa, gpaScore, deduction, isSecondTimer, totalQ);
    saveResultToDB(correct, wrong, skipped, negMark, finalScore, gpaScore, withGpa, totalQ);
}

async function saveResultToDB(c, w, s, n, f, g, wg, t) {
    try { const user = JSON.parse(localStorage.getItem('atlas-session')); if (user && !isMockTest) { await safeFetch(`${SUPABASE_URL}/rest/v1/exam_results`, { method:'POST', body:JSON.stringify({ phone:user.phone, exam_id:currentExam?.id, total_questions:t, correct:c, wrong:w, skipped:s, negative_marks:n, final_score:f, gpa_score:g, with_gpa_total:wg }) }); } } catch(e) {}
}

function showResult(correct, wrong, skipped, negMark, finalScore, withGpa, gpaScore, deduction, isSecondTimer, totalQ) {
    const examName = currentExam?.title || (currentExam?.subject+' - '+currentExam?.chapter) || 'এক্সাম';
    let html = `<div class="result-actions-top"><button class="result-action-btn btn-solve" onclick="openSolveSheet()">📋 Solve Sheet</button><button class="result-action-btn btn-pdf" onclick="downloadPDF()">📥 PDF</button></div>`;
    html += `<div class="result-card"><div style="font-size:13px;color:var(--text2);">📝 ${examName}</div><div class="result-big">${finalScore.toFixed(2)}</div><div class="result-score-format">${finalScore.toFixed(2)} / ${totalQ}</div></div>`;
    html += `<div class="result-grid"><div class="result-stat"><div class="result-stat-val correct-val">✅ ${correct}</div><div class="result-stat-label">সঠিক</div></div><div class="result-stat"><div class="result-stat-val wrong-val">❌ ${wrong}</div><div class="result-stat-label">ভুল</div></div><div class="result-stat"><div class="result-stat-val skipped-val">⏭️ ${skipped}</div><div class="result-stat-label">স্কিপ</div></div></div>`;
    html += `<div class="result-card"><div class="info-row"><span class="info-label">নেগেটিভ মার্ক</span><span class="info-value" style="color:var(--red);">-${negMark.toFixed(2)}</span></div></div>`;
    
    // Chart
    html += `<div class="result-card"><div style="font-size:13px;font-weight:700;margin-bottom:6px;">📊 পারফরম্যান্স</div><div class="chart-wrap"><canvas id="resultChart"></canvas></div></div>`;
    
    if (gpaScore > 0) {
        html += `<div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;"><div class="gpa-box"><div class="gpa-box-title">📊 Without GPA</div><div class="gpa-box-val">${finalScore.toFixed(2)}</div></div><div class="gpa-box"><div class="gpa-box-title">🎓 With GPA</div><div class="gpa-box-val">${withGpa.toFixed(2)}</div><div style="font-size:10px;color:var(--text2);">+${gpaScore.toFixed(2)}</div></div></div>`;
    }
    if (isSecondTimer) html += `<div class="deduction-note">⚠️ সেকেন্ড টাইমার: -${deduction} মার্ক কর্তন</div>`;
    
    html += `<div class="filter-bar"><button class="filter-btn active" onclick="filterResult('all')">সব</button><button class="filter-btn" onclick="filterResult('correct')">✅ সঠিক</button><button class="filter-btn" onclick="filterResult('wrong')">❌ ভুল</button><button class="filter-btn" onclick="filterResult('skipped')">⏭️ স্কিপ</button></div><div id="solveSheet">`;
    
    examQuestions.forEach((q, i) => {
        const ua = userAnswers[q.id];
        const status = ua === q.answer_index ? 'correct' : (ua ? 'wrong' : 'skipped');
        const statusHTML = status === 'correct' ? '<div class="q-status correct">✅ সঠিক</div>' : status === 'wrong' ? `<div class="q-status wrong">❌ ভুল${ua ? ' (আপনি: '+['ক','খ','গ','ঘ','ঙ'][ua-1]+')' : ''}</div>` : '<div class="q-status" style="color:var(--yellow);">⏭️ স্কিপ</div>';
        html += `<div class="mcq-card solve-item" data-status="${status}">${statusHTML}<div class="q-text">${i+1}. ${q.question_text}</div>`;
        [q.option1, q.option2, q.option3, q.option4, q.option5].forEach((opt, oi) => {
            if (opt && opt !== '—') { let cls = ''; if (oi+1 === q.answer_index) cls = ' correct-reveal'; else if (oi+1 === ua && ua !== q.answer_index) cls = ' wrong-reveal'; html += `<div class="option-item${cls}"><span class="option-radio">${['ক','খ','গ','ঘ','ঙ'][oi]}</span> ${opt}${oi+1===q.answer_index?' ✅':oi+1===ua&&ua!==q.answer_index?' ❌':''}</div>`; }
        });
        if (q.explanation) html += `<div class="explanation-box csv-box"><div class="exp-header">📋 ব্যাখ্যা</div><div class="exp-content">${q.explanation}</div></div>`;
        html += `<div class="explanation-box ai-box"><div class="exp-header" onclick="toggleAIBox(this,${q.id})">🤖 ATLAS AI ব্যাখ্যা <span class="exp-arrow">▼</span></div><div class="exp-content" id="aiExp${q.id}"></div></div></div>`;
    });
    html += `</div>`;
    html += `<div class="practice-btns"><button class="btn-practice btn-practice-again" onclick="retakeExam()">🔄 Practice Again</button><button class="btn-practice btn-mistake-practice" onclick="mistakePractice()">❌ Mistake Practice</button></div>`;
    html += `<button class="btn btn-outline" onclick="backToList()" style="margin-top:8px;width:100%;">🏠 এক্সাম লিস্টে যান</button>`;
    document.getElementById('resultContent').innerHTML = html;
    
    // Draw chart
    setTimeout(() => {
        const canvas = document.getElementById('resultChart');
        if (!canvas) return;
        const ctx = canvas.getContext('2d');
        const total = correct + wrong + skipped || 1;
        const data = [correct/total, wrong/total, skipped/total];
        const colors = ['#3FB950','#F85149','#D29922'];
        let startAngle = -Math.PI/2;
        data.forEach((slice, i) => {
            const angle = slice * Math.PI * 2;
            ctx.beginPath(); ctx.moveTo(70,70);
            ctx.arc(70,70,60,startAngle,startAngle+angle);
            ctx.fillStyle = colors[i]; ctx.fill();
            startAngle += angle;
        });
        ctx.beginPath(); ctx.arc(70,70,35,0,Math.PI*2); ctx.fillStyle = 'var(--card)'; ctx.fill();
    }, 300);
}

function filterResult(type) {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    event.target.classList.add('active');
    document.querySelectorAll('.solve-item').forEach(item => { item.style.display = (type === 'all' || item.dataset.status === type) ? 'block' : 'none'; });
}
function retakeExam() { userAnswers = {}; isExamSubmitted = false; bookmarkedQuestions = {}; startExamHall(); }
function mistakePractice() {
    const wrongIds = examQuestions.filter(q => userAnswers[q.id] && userAnswers[q.id] !== q.answer_index);
    if (!wrongIds.length) { showToast('✅ কোনো ভুল নেই!'); return; }
    examQuestions = wrongIds; userAnswers = {}; isExamSubmitted = false;
    currentExam.total_marks = examQuestions.length; currentExam.duration_minutes = Math.ceil(examQuestions.length/2);
    startExamHall(); showToast('❌ ' + wrongIds.length + ' টি ভুল প্রশ্ন নিয়ে প্র্যাকটিস');
}

// ========== AI ==========
async function toggleAIBox(header, qid) {
    const content = header.nextElementSibling, arrow = header.querySelector('.exp-arrow');
    if (content.classList.contains('show')) { content.classList.remove('show'); arrow.classList.remove('open'); return; }
    const q = examQuestions.find(q => q.id === qid); if (!q) return;
    content.classList.add('show'); arrow.classList.add('open'); content.innerHTML = '⏳ AI ব্যাখ্যা আনা হচ্ছে...';
    const options = [q.option1,q.option2,q.option3,q.option4,q.option5].filter(o => o && o !== '—');
    const labels = ['ক','খ','গ','ঘ','ঙ'];
    let prompt = `তুমি একজন শিক্ষক। MCQ বিশ্লেষণ করো:\n\nপ্রশ্ন: ${q.question_text}\n\n`;
    options.forEach((opt,i) => { prompt += `${labels[i]}) ${opt}\n`; });
    prompt += `\nসঠিক উত্তর: ${labels[q.answer_index-1]}) ${options[q.answer_index-1]}\n\nপ্রতিটি অপশন ব্যাখ্যা করো। ✅ কেন সঠিক, ❌ কেন ভুল। বাংলায়। সংক্ষেপে।`;
    try {
        const res = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key=${GEMINI_KEY}`, { method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({contents:[{parts:[{text:prompt}]}]}) });
        const data = await res.json();
        content.innerHTML = data.candidates ? data.candidates[0].content.parts[0].text.replace(/\n/g,'<br>') : '❌ ব্যাখ্যা পাওয়া যায়নি।';
    } catch(e) { content.innerHTML = '❌ AI সার্ভার সমস্যা।'; }
}

// ========== PDF ==========
function openSolveSheet() {
    const w = window.open('', 'SolveSheet', 'width=800,height=600');
    let html = `<html><head><meta charset="UTF-8"><title>Solve Sheet</title><style>body{font-family:sans-serif;padding:16px;column-count:2;column-gap:16px;}.q{break-inside:avoid;border:1px solid #ddd;padding:10px;border-radius:8px;margin-bottom:10px;}.correct{color:green;}.wrong{color:red;}</style></head><body><h2>📋 Solve Sheet</h2>`;
    examQuestions.forEach((q,i) => {
        const ua = userAnswers[q.id];
        html += `<div class="q"><b>${i+1}. ${q.question_text}</b><br>`;
        [q.option1,q.option2,q.option3,q.option4,q.option5].forEach((opt,oi) => { if (opt && opt !== '—') { const style = oi+1===q.answer_index?'color:green;font-weight:bold;':oi+1===ua&&ua!==q.answer_index?'color:red;':''; html += `<div style="${style}">${['ক','খ','গ','ঘ','ঙ'][oi]}) ${opt}</div>`; } });
        if (q.explanation) html += `<p style="font-size:11px;">💡 ${q.explanation}</p>`;
        html += `</div>`;
    });
    html += `<br><button onclick="window.print()">📥 Download PDF</button></body></html>`;
    w.document.write(html); w.document.close();
}
function downloadPDF() { openSolveSheet(); setTimeout(() => window.print(), 500); }

// ========== SAFETY ==========
window.addEventListener('beforeunload', e => { if (!isExamSubmitted && examSeconds > 0) { e.preventDefault(); e.returnValue = ''; } });
window.addEventListener('popstate', e => { if (!isExamSubmitted && examSeconds > 0) { if (!confirm('⚠️ এক্সাম ছেড়ে যাবেন?')) { history.pushState(null,'',location.href); } } });

// ========== INIT ==========
document.addEventListener('DOMContentLoaded', () => {
    const params = new URLSearchParams(location.search);
    const examId = params.get('id');
    const cat = params.get('cat');
    const mock = params.get('mock');
    if (examId) loadExamById(examId);
    else if (mock === 'true') startMockTest();
    else if (cat) loadExamsByType(cat);
    else loadAllExams();
});
</script>
